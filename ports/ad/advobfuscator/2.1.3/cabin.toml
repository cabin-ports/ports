[package.upstream]
url = "https://github.com/andrivet/ADVobfuscator/archive/refs/tags/v2.1.3.tar.gz"
checksum = "sha256:34b719d1f6d19ace3684945246d05d7e864f4b1da36876168c68884d3316522b"
format = "tar.gz"
strip-prefix = "ADVobfuscator-2.1.3"

[package]
name = "cabin-ports/advobfuscator"
version = "2.1.3"
# aes.h:35 credits a Stack Overflow post for the S-box; its copyright significance is uncertain.
license = "BSD-3-Clause AND BSD-3-Clause-Clear"
include = ["LICENSE", "README.md", "include"]

[target.advobfuscator]
type = "header-only"
# AesString::raw() does not compile when instantiated (measured on clang:
# "cannot initialize return object of type 'const char *' with an rvalue of
# type 'const value_type *'"); the rest of the library is unaffected.
# Consumers include <advobfuscator/string.h>; include/advobfuscator itself
# is not an include dir because its string.h would shadow <string.h>.
include-dirs = ["include"]
# README.md:20, "A C++20 compatible compiler".
interface-cxx-standard = "c++20"
