[package.upstream]
url = "https://github.com/morganstanley/binlog/archive/refs/tags/2021-04-16.tar.gz"
checksum = "sha256:f72b0c93c01ebf0834779c347bd76c2fe93064901e8e577a04152fd3596ae20f"
format = "tar.gz"
strip-prefix = "binlog-2021-04-16"

# Upstream names releases by date (tag 2021-04-16); its CMake VERSION 0.1.0 never changed.
# include/mserialize/string_view.hpp is based on Boost's string_view and carries the Boost
# Software License text in its header.
[package]
name = "cabin-ports/binlog"
version = "2021.4.16"
license = "Apache-2.0 AND BSL-1.0"
include = ["LICENSE", "NOTICE", "include"]

# The static library upstream's CMake builds (CMakeLists.txt add_library).  Not ported: the
# bread and brecovery tools (bin/).
[target.binlog]
type = "library"
sources = [
  "include/binlog/EntryStream.cpp",
  "include/binlog/EventStream.cpp",
  "include/binlog/PrettyPrinter.cpp",
  "include/binlog/TextOutputStream.cpp",
  "include/binlog/Time.cpp",
  "include/binlog/ToStringVisitor.cpp",
  "include/binlog/detail/OstreamBuffer.cpp",
]
include-dirs = ["include"]
# README.md: "Binlog requires a C++14 conforming platform".
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "binlog"
