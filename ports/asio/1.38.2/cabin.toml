[package.upstream]
url = "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-38-2.tar.gz"
checksum = "sha256:9f2648fa483e58a6bf848d970ee0ea650ca19ed7769dfa520ed4f7b8d27af1db"
format = "tar.gz"
strip-prefix = "asio-asio-1-38-2"

[package]
name = "cabin-ports/asio"
version = "1.38.2"
include = ["COPYING", "LICENSE_1_0.txt", "include"]

# Standalone Asio, header-only as upstream ships it: config.hpp selects
# ASIO_STANDALONE itself under C++11 unless ASIO_ENABLE_BOOST is defined.
# Optional parts need libraries consumers supply, which nothing here
# links: the SSL layer (asio/ssl.hpp) needs OpenSSL, stackful
# coroutines (asio/spawn.hpp) need Boost.Context (cabin-ports/boost-context),
# the read_until overloads taking boost::regex need Boost.Regex, and the
# opt-in io_uring backend (ASIO_HAS_IO_URING), which Linux file I/O
# (stream_file, random_access_file) requires, needs liburing.
[target.asio]
type = "header-only"
include-dirs = ["include"]
# Upstream's minimum is C++11.
interface-cxx-standard = "c++11"

# upstream's configure.ac links -pthread -lrt on Linux.
[target.'cfg(os = "linux")'.profile]
link-libs = ["pthread", "rt"]

# Winsock, plus bcrypt for connect_pipe's BCryptGenRandom.  MSVC links
# these through #pragma comment (socket_types.hpp, connect_pipe.ipp);
# MinGW does not honor it, and upstream's configure.ac links them there.
[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32", "mswsock", "bcrypt"]
