[package.upstream]
# The tag's CMakeLists.txt still declares VERSION 3.9.0; the registry
# version follows the tag, as Conan Center's and vcpkg's recipes do.
url = "https://github.com/hanickadot/compile-time-regular-expressions/archive/refs/tags/v3.11.0.tar.gz"
checksum = "sha256:7d4b30d0bdd8864a47cceb2ab8e7c4d1846f0ec62383f8c45122435d32f19530"
format = "tar.gz"
strip-prefix = "compile-time-regular-expressions-3.11.0"

[package]
name = "cabin-ports/ctre"
version = "3.11.0"
include = ["LICENSE", "include"]

# C++20 is upstream's default interface standard, which the documented
# `ctre::match<"REGEX">` patterns need and the only one upstream supports on
# MSVC.  Not ported: the C++ module (CTRE_MODULE), the C++17 fallback for a
# lower CTRE_CXX_STANDARD, and the single-header amalgamation.
[target.ctre]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++20"
