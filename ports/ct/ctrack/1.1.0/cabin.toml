[package.upstream]
url = "https://github.com/Compaile/ctrack/archive/refs/tags/v1.1.0.tar.gz"
checksum = "sha256:cbcfb44386cbae24b69c6fd7ad8be9e1416676aa39c024c1b3161205bf0269c2"
format = "tar.gz"
strip-prefix = "ctrack-1.1.0"

# ctrack.hpp:31-33 is 1.1.0; CMakeLists.txt:2 still says 1.0.2.
[package]
name = "cabin-ports/ctrack"
version = "1.1.0"
license = "MIT"
include = ["LICENSE", "README.md", "include"]

# C++17 is upstream's floor (README.md:14).
[target.ctrack]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
# Upstream's fallback (README.md:202-203), as Apple libc++ has no par_unseq
# and GCC needs -ltbb when TBB's headers are visible (measured).
interface-defines = ["CTRACK_DISABLE_EXECUTION_POLICY"]
