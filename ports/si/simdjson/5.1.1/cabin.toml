[package.upstream]
url = "https://github.com/simdjson/simdjson/archive/refs/tags/v5.1.1.tar.gz"
checksum = "sha256:d669fa399613c20bbf7705f057a72984331b223cd5e8d20666ef063dbf97f3e6"
format = "tar.gz"
strip-prefix = "simdjson-5.1.1"
# The archive ships only simdjson's own LICENSE (Apache-2.0) and
# LICENSE-MIT.  0001 adds the Boost Software License 1.0 (from
# https://www.boost.org/LICENSE_1_0.txt, as LICENSE_1_0.txt), whose
# terms must accompany every source copy, for the code the files state
# is under it: string-view-lite
# (include/simdjson/nonstd/string_view.hpp:1-7) and the Dragonbox port
# in src/to_chars.cpp (:22-26).  0002 adds the notices of code that the
# release adapts from other projects without carrying their terms:
# - LICENSE-MIT.nlohmann-json, for src/to_chars.cpp's append_exponent,
#   format_buffer and to_chars (:1047-1189).  They are the number
#   formatter and entry point of the Grisu2 code that simdjson adapted
#   from JSON for Modern C++
#   (nlohmann/json, MIT, Copyright (c) 2013-2020 Niels Lohmann) in
#   simdjson #1168 (2020); the file still cites that project's issues
#   #362 and #378 (:1098, :1171).  The notice file holds the notice that
#   src/to_chars.cpp carried through simdjson v4.6.11 (:14-27, naming
#   the MIT license and Copyright (c) 2009 Florian Loitsch), which
#   simdjson #2777 dropped with the Grisu2 core, then nlohmann/json
#   v3.9.1's LICENSE.MIT, the release current at that adoption.
# - LICENSE-MIT.jeaiii-itoa, for include/simdjson/internal/jeaiii.h,
#   which credits "James Edward Anhalt III's algorithm" (:11) and follows
#   jeaiii/itoa's include/itoa/jeaiii_to_text.h: that file's notice (MIT,
#   Copyright (c) 2022 James Edward Anhalt III), as of jeaiii/itoa
#   69308f65e8.
# - LICENSE-BSD-3-Clause.fuchsia, for src/fallback.cpp's UTF-8 validator
#   (:450-511), credited as Apache-licensed Google Fuchsia code (:450),
#   and its uncredited copy in include/simdjson/compile_time_json-inl.h
#   (:417-507).  Both follow Fuchsia's
#   zircon/system/ulib/fidl/validate_string.cc (Copyright 2020 The
#   Fuchsia Authors), which simdjson took in 2020 and which is under
#   Fuchsia's BSD-3-Clause LICENSE: that LICENSE, as of Fuchsia
#   11537de04854 (2020).
# tools/vendor_fast_float.sh:45 renames the holder in the vendored
# include/simdjson/internal/fast_float.h's notices (:46, :74); fast_float
# v8.2.10's own fast_float.h reads "Copyright (c) 2021 The fast_float
# authors" (MIT, :26) and "Copyright 2021 The fast_float authors"
# (Apache-2.0, :54).  Those notices also cover the routines that
# include/simdjson/generic/numberparsing.h adapts from fast_float
# (:319-320, :581).  Credited without terms, and shipped as is:
# parse_eight_digits_unrolled's three-line SWAR digit sum, credited to
# johnnylee-sde.github.io in the arm64, fallback, ppc64, rvv-vls, lsx and
# lasx numberparsing_defs.h, a common idiom too slight to carry
# copyright; and the bit-count table of
# src/internal/simdprune_tables.cpp:10-11, from Sean Eron Anderson's Bit
# Twiddling Hacks, whose snippets that page places in the public domain.
# include/simdjson/dom/fractured_json.h implements the layout of
# j-brooke/FracturedJson (MIT) on simdjson's DOM without porting its
# code, sharing short option descriptions (:9, :19, :62, :132).
patches = [
  "patches/0001-add-boost-software-license-for-string-view-and-dragonbox-code.patch",
  "patches/0002-add-licenses-for-nlohmann-json-jeaiii-itoa-and-fuchsia-code.patch",
]

[package]
name = "cabin-ports/simdjson"
version = "5.1.1"
# simdjson is Apache-2.0 or MIT, at the user's option;
# LICENSE_1_0.txt and the LICENSE-*.* notices come from the patches
# above.  fast_float (include/simdjson/internal/fast_float.h) and the
# PyTorch-derived CPU detection (src/internal/isadetection.h,
# include/simdjson/internal/instruction_set.h) carry their license
# texts inline.
include = [
  "LICENSE",
  "LICENSE-BSD-3-Clause.fuchsia",
  "LICENSE-MIT",
  "LICENSE-MIT.jeaiii-itoa",
  "LICENSE-MIT.nlohmann-json",
  "LICENSE_1_0.txt",
  "include",
  "patches",
  "src",
]

# src/simdjson.cpp includes the rest of src/ and compiles every kernel the
# target allows, picking one at run time.  On x86-64 and LoongArch, GCC and
# Clang compile each kernel for its instruction set per function and MSVC
# emits the intrinsics without architecture flags, so, as in upstream's
# CMake build, no instruction-set flags are needed; the ppc64 and rvv-vls
# kernels build only when the compile flags already enable VMX or RVV.
# Not ported: the shared library, the non-default option settings, and the
# Debug configuration's -Og and public SIMDJSON_DEVELOPMENT_CHECKS, since
# Cabin drops a registry package's raw compiler flags and interface-defines
# cannot depend on the profile.
[target.simdjson]
type = "library"
sources = ["src/simdjson.cpp"]
include-dirs = ["include"]
# SIMDJSON_ENABLE_THREADS is on by default and makes SIMDJSON_THREADS_ENABLED
# public: it changes the layout of both document_stream classes, so every
# translation unit, the library's included, must agree on it.  Unoptimized
# Apple builds drop it again everywhere.
defines = ["SIMDJSON_THREADS_ENABLED=1"]
interface-defines = ["SIMDJSON_THREADS_ENABLED=1"]
# Upstream asks consumers only for C++11, but below C++17 a consumer on
# libstdc++ gets simdjson's nonstd::string_view backfill, which is laid out
# differently from the std::string_view the library was built with.
cxx-standard = "c++17"
links = "simdjson"

# The sources include one another from src/ by bare name, as in upstream's
# CMake build.
[profile]
include-dirs = ["src"]

# Upstream links Threads::Threads publicly for parse_many's worker thread.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
