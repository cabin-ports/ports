[package.upstream]
# The tag archive: the release assets hold only the generated single-file
# amalgamation, not the sources CMake builds.
url = "https://github.com/simdutf/simdutf/archive/refs/tags/v9.3.3.tar.gz"
checksum = "sha256:441e374e8629bd8469f6d5cde9f0fa17ef3ad158aeb077791606d8aa73b565ef"
format = "tar.gz"
strip-prefix = "simdutf-9.3.3"

# "(Apache-2.0 OR MIT) AND BSD-3-Clause": the library is under either of
# LICENSE-APACHE and LICENSE-MIT, at the user's choice (README.md:3243);
# include/simdutf/internal/isadetection.h, derived from PyTorch, carries
# its BSD-3-Clause terms in the file itself (:1-43).  The UTF-8 validators
# of include/simdutf/scalar/utf8.h credit Google Fuchsia code, "Apache
# Licensed" (:11, :254).
[package]
name = "cabin-ports/simdutf"
version = "9.3.3"
include = ["LICENSE-APACHE", "LICENSE-MIT", "include", "src"]

# The sources src/simdutf.cpp includes reach their private headers by paths
# relative to src/.
[profile]
include-dirs = ["src"]

# The static library upstream's CMake builds by default: src/simdutf.cpp, a
# single translation unit that compiles every kernel and the C API.  Each
# kernel enables its instruction set in the source and the best one the CPU
# supports is chosen at run time, so no source needs its own flags.  Not
# ported: the shared library, the command-line tools and their libraries,
# and simdutf-nostdlibcxx.  Not reproduced: position-independent code
# (Cabin drops a dependency's raw compiler flags), so the archive is not
# built for linking into a shared object.
[target.simdutf]
type = "library"
sources = ["src/simdutf.cpp"]
include-dirs = ["include"]
# C++17, upstream's default SIMDUTF_CXX_STANDARD, which simdutf.h requires.
# Built so, the library lacks atomic_binary_to_base64 and
# atomic_base64_to_binary_safe, which simdutf.h declares to C++20
# consumers: a consumer calling them fails to link.
cxx-standard = "c++17"
interface-cxx-standard = "c++17"
# include/simdutf_c.h, the C API, is plain C99.
interface-c-standard = "c99"
links = "simdutf"
