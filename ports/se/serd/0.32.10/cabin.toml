[package.upstream]
# GitLab generates this tag archive on request, so its bytes could change;
# the checksum, whose archive vcpkg pins by SHA-512 too, would catch that.
url = "https://gitlab.com/drobilla/serd/-/archive/v0.32.10/serd-v0.32.10.tar.gz"
checksum = "sha256:d17b99ef250e4dffcdd08c8eaad2459a1519c1ff2553fa91176ce71ac0dd0739"
format = "tar.gz"
strip-prefix = "serd-v0.32.10"

[package]
name = "cabin-ports/serd"
version = "0.32.10"
# Licence: ISC (COPYING), under which every published file is available;
# LICENSES/ also holds the other texts REUSE cites.
include = ["COPYING", "LICENSES", "include", "src"]
# Upstream builds C99; C11 is the oldest standard Cabin can request from
# MSVC.
c-standard = "c11"
interface-c-standard = "c99"
# serd.h's enums end in trailing commas, which C++ allows from C++11.
interface-cxx-standard = "c++11"

# Meson's default checks find fileno and posix_memalign through POSIX (and
# fileno on Windows), and posix_fadvise where it links.  src/serd_config.h
# detects the same at compile time, except posix_fadvise, whose test
# misspells SERD__POSIX_VERSION and so never fires: Linux sets it here, and
# elsewhere, such as FreeBSD and Android, that read-ahead hint stays off.
[profile]
defines = ["SERD_INTERNAL", "SERD_STATIC"]

[target.'cfg(os = "linux")'.profile]
defines = ["_POSIX_C_SOURCE=200809L", "HAVE_POSIX_FADVISE=1"]

[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]

# Meson's default_library=static build; SERD_STATIC keeps serd.h from
# declaring the API dllimport on Windows.  Not ported: the shared library and
# serdi, the command-line tool.  Not reproduced: hidden symbol visibility
# (meson.build:225), since Cabin drops a dependency's raw compiler flags.
[target.serd]
type = "library"
sources = [
  "src/base64.c",
  "src/byte_source.c",
  "src/env.c",
  "src/n3.c",
  "src/node.c",
  "src/read_utf8.c",
  "src/reader.c",
  "src/string.c",
  "src/system.c",
  "src/uri.c",
  "src/writer.c",
]
include-dirs = ["include"]
interface-defines = ["SERD_STATIC"]
links = "serd"
