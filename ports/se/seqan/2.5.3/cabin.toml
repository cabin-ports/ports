[package.upstream]
url = "https://github.com/seqan/seqan/releases/download/seqan-v2.5.3/seqan-library-2.5.3.zip"
checksum = "sha256:7da029319f0d0674f5aa1a3939b4e7b89d2a9a8e7a288a182492347ce3b5db3d"
format = "zip"
strip-prefix = "seqan-library-2.5.3"

[package]
name = "cabin-ports/seqan"
version = "2.5.3"
# MIT: bam_io/bam_index_bai.h's samtools notice.  Zlib: the stream headers from
# Jonathan de Halleux and the zlib copy.  LicenseRef-qsufsort: Larsson's terms
# in index/index_sa_lss.h:43-54.  BSL-1.0: the Boost 1.47 code in
# basic/boost_preprocessor_subset.h, basic/concept_checking.h,
# basic/fundamental_concepts.h and math/math_operators.h.
# LicenseRef-Boost-pre-BSL: math/math_rational.h and math/math_common_factor.h,
# from Boost's rational.hpp and common_factor_rt.hpp.  CC-BY-SA-3.0:
# random/random_beta.h's BetaDistribution, after Joseph Mansfield's Stack
# Overflow answer 15166623.
license = "BSD-3-Clause AND BSL-1.0 AND CC-BY-SA-3.0 AND LicenseRef-Boost-pre-BSL AND LicenseRef-qsufsort AND MIT AND Zlib"
include = [
  "include",
  "share/doc/seqan/CHANGELOG.md",
  "share/doc/seqan/LICENSE",
  "share/doc/seqan/README.md",
]

# SeqAn 2 (namespace seqan2), header-only as upstream's seqan-config.cmake
# exports it; consumers include <seqan/sequence.h> and the other modules.
# From that config: NOMINMAX for its <windows.h> includes (only Windows reads
# it), pthread, and rt for POSIX aio.
# Not ported: the optional zlib, bzip2 and OpenMP support (SEQAN_HAS_ZLIB,
# SEQAN_HAS_BZIP2, SEQAN_HAS_OPENMP).
# ArgumentParser checks for updates online through system() unless
# SEQAN_DISABLE_VERSION_CHECK is defined.
[target.seqan]
type = "header-only"
include-dirs = ["include"]
# platform.h:158-162 states C++14, but the bam_io, bed_io, rna_io, roi_io and
# vcf_io record headers declare C++17 inline variables, which cl at /std:c++14
# rejects (C7525; check-windows job 134598346624, windows-2025-vs2026).
interface-cxx-standard = "c++17"
interface-defines = ["NOMINMAX"]

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

[target.'cfg(os = "linux")'.profile]
link-libs = ["rt"]
