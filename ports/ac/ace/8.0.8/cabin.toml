include-dirs = ["."]
cxx-standard = "c++17"
interface-cxx-standard = "c++17"
defines = ["ACE_AS_STATIC_LIBS", "ACE_HAS_CUSTOM_EXPORT_MACROS=0"]
interface-defines = ["ACE_AS_STATIC_LIBS", "ACE_HAS_CUSTOM_EXPORT_MACROS=0"]
links = "ACE"

# Upstream's GNU make build adds -fno-strict-aliasing for g++ only
# (include/makeinclude/platform_g++_common.GNU:108-117), and this port cannot
# carry raw compiler flags, so it builds as upstream's clang and CMake builds do.
[target.'cfg(os = "linux")'.profile]
link-libs = ["pthread", "dl", "rt"]

# The system libraries upstream's Windows builds link for ACE
# (bin/MakeProjectCreator/config/acedefaults.mpb:12-14 and :30-31,
# MPC/templates/nmakedll.mpt:10).
[target.'cfg(os = "windows")'.profile]
link-libs = ["advapi32", "iphlpapi", "mswsock", "netapi32", "user32", "ws2_32"]
