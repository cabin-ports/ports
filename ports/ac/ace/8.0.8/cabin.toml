[package.upstream]
# The ACE-only source asset of upstream's ACE+TAO-8_0_8 release.
url = "https://github.com/DOCGroup/ACE_TAO/releases/download/ACE%2BTAO-8_0_8/ACE-src-8.0.8.tar.gz"
checksum = "sha256:229bd5992210f6cf0b5a74a7f3bd70b126cb553f6fb675ed88d17a088ff0a3c5"
format = "tar.gz"
strip-prefix = "ACE_wrappers"
# ACE builds against an ace/config.h that its user writes
# (ACE-INSTALL.html:348-353).  Patch 0001 adds one that includes upstream's
# config-win32.h, config-macosx.h or config-linux.h by predefined macro, and
# defines WIN32 for cl as upstream's Visual Studio projects do
# (MPC/templates/vc1xlib.mpt:6); other platforms stop at an #error.
patches = ["patches/0001-add-ace-config-h.patch"]

[package]
name = "cabin-ports/ace"
version = "8.0.8"
# ace/ACE.cpp:2289 credits J.P. Knight's mdump for ACE::format_hexdump; its
# copyright significance is uncertain.
# ace/ACE.cpp:2684-2685 and :2754-2756 credit W. Richard Stevens' APUE and
# Andrew Gierth's Unix Programming FAQ for ACE::daemonize and ACE::fork; their
# copyright significance is uncertain.
# ace/Barrier.h:89-91 credits Richard Marejka's SunOpsis article for
# ACE_Barrier; its copyright significance is uncertain.
# ace/If_Then_Else.h:7-9 credits Vandevoorde and Josuttis's "C++ Templates"
# for ACE::If_Then_Else; its copyright significance is uncertain.
# ace/Object_Manager.cpp:54-55 and :279-280 credit Jochen Kalmbach's blog for
# the Windows error-window fix; their copyright significance is uncertain.
# ace/Ping_Socket.cpp:41-45 credits MSDN's ping.c for the Windows ip and icmp
# structs; its copyright significance is uncertain.
# ace/Stack_Trace.cpp:7-16 credits glibc documentation examples and the
# VxWorks FAQ for its stack walking; its copyright significance is uncertain.
# ace/SV_Semaphore_Complex.h:29-31 credits W. Richard Stevens' "UNIX Network
# Programming" for ACE_SV_Semaphore_Complex; its copyright significance is
# uncertain.
# ace/Value_Ptr.h:7-8 credits Herb Sutter's "More Exceptional C++" for
# ACE::Value_Ptr; its copyright significance is uncertain.
# ace/OS_NS_unistd.inl:984-1001 carries Red Hat, Inc.'s notice granting the
# ACE_LACKS_SWAB swab() under "the BSD License"; its copyright significance is
# uncertain.
license = "DOC AND BSD-4-Clause-UC AND BSD-4-Clause AND LicenseRef-Unicode-ConvertUTF AND GPL-3.0-or-later WITH Bison-exception-2.2 AND GPL-2.0-or-later WITH Bison-exception-1.24"
include = ["AUTHORS", "COPYING", "README", "THANKS", "VERSION.txt", "ace", "patches"]

