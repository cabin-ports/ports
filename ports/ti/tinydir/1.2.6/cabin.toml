[package.upstream]
url = "https://github.com/cxong/tinydir/archive/refs/tags/1.2.6.tar.gz"
checksum = "sha256:1ecbdf8d04b079f8a9404662708d2333d6b72b956effb0d5296d063db3a02b4e"
format = "tar.gz"
strip-prefix = "tinydir-1.2.6"

[package]
name = "cabin-ports/tinydir"
version = "1.2.6"
license = "BSD-2-Clause"
include = ["COPYING", "README.md", "tinydir.h"]

# The single header at the archive root; consumers write `#include <tinydir.h>`.
# README.md:63 states ANSI C (C90).  Upstream states no C++ standard; the
# header wraps itself in extern "C", and C++98 is the measured floor.
# Under a strict -std on glibc, tinydir uses stat() instead of lstat(), so a
# dangling symlink makes tinydir_open_sorted fail with ENOENT for the whole
# directory (check-linux job 134602575224).
[target.tinydir]
type = "header-only"
include-dirs = ["."]
interface-c-standard = "c89"
interface-cxx-standard = "c++98"
