[package.upstream]
url = "https://github.com/boost-ext/di/archive/refs/tags/v1.3.2.tar.gz"
checksum = "sha256:2bcd01f1d555bdb59a277b932f9021701c5cd26d1d7411f024394db69c5c11cf"
format = "tar.gz"
strip-prefix = "di-1.3.2"
# The mocks_provider extension uses std::is_polymorphic without including
# <type_traits>, which LLVM 23's libc++ rejects; patch 0001 is upstream's
# 3f13955, after 1.3.2, which includes it.  The BSL patch adds
# LICENSE_1_0.txt, the Boost Software License text the sources cite, from
# boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = [
  "patches/0001-include-type-traits-in-mocks-provider.patch",
  "patches/0002-add-the-boost-software-license-text.patch",
]

[package]
name = "cabin-ports/bext-di"
version = "1.3.2"
license = "BSL-1.0"
include = ["LICENSE_1_0.txt", "extension/include", "include", "patches"]

# Like upstream's CMake package, which puts include and extension/include on
# its target and installs both (CMakeLists.txt:21-25, 54-62), the port ships
# <boost/di.hpp> and the <boost/di/extension/...> headers.  The v1.3.2
# headers still define BOOST_DI_VERSION as 1'3'0.
[target.bext-di]
type = "header-only"
include-dirs = ["include", "extension/include"]
interface-cxx-standard = "c++14"
