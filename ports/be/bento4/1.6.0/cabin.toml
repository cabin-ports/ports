[package.upstream]
url = "https://github.com/axiomatic-systems/Bento4/archive/refs/tags/v1.6.0-641.tar.gz"
checksum = "sha256:e6575877708526e399cff752b4ee23cb1e2ac32fb251e2ca0a1e8d691fd172a7"
format = "tar.gz"
strip-prefix = "Bento4-1.6.0-641"
# Tag v1.6.0-641 declares AP4_VERSION_STRING "1.6.0.0" (Ap4Version.h).
# Upstream installs the headers to include/bento4/ (CMakeLists.txt:131-134);
# 141 headers exceed Cabin's 16 copy steps, so the patch adds a forwarder for
# each there.
patches = ["patches/0001-add-bento4-include-forwarders.patch"]

[package]
name = "cabin-ports/bento4"
version = "1.6.0"
# Crypto/Ap4Hmac.cpp:30 and Crypto/Ap4KeyWrap.cpp:30 credit LibTomCrypt, which
# they state is public domain.  Crypto/Ap4AesBlockCipher.cpp:12-30 carries
# Brian Gladman's 2001 terms, which match no SPDX identifier.
license = "GPL-2.0-or-later AND LicenseRef-Gladman-AES-2001 AND LicenseRef-PublicDomain"
include = [
  "Documents/LICENSE.txt",
  "README.md",
  "Source/C++/Codecs",
  "Source/C++/Core",
  "Source/C++/Crypto",
  "Source/C++/MetaData",
  "Source/C++/System/Posix",
  "Source/C++/System/StdC",
  "Source/C++/System/Win32",
  "include",
  "patches",
]

