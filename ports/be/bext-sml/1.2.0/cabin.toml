[package.upstream]
url = "https://github.com/boost-ext/sml/archive/refs/tags/v1.2.0.tar.gz"
checksum = "sha256:d584375bc8b4b391f0d94d57bc126a7cbb0f8c2bf810f5602400206b62eaf280"
format = "tar.gz"
strip-prefix = "sml-1.2.0"

[package]
name = "cabin-ports/bext-sml"
version = "1.2.0"
include = ["LICENSE.md", "include"]

# boost-ext/sml is not part of Boost and needs none of it.  On MSVC
# upstream's CMake target also exports NOMINMAX and the CRT, SCL and C++17
# deprecation warning silencers; the headers need none of them, so like the
# vcpkg and Conan packages this port does not export them.  Licence:
# BSL-1.0 (LICENSE.md).
[target.bext-sml]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
