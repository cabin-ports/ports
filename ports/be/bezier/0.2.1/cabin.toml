[package.upstream]
url = "https://github.com/oysteinmyrmo/bezier/archive/refs/tags/v0.2.1.tar.gz"
checksum = "sha256:fce93c766f31ec445f6f48d0d1438c128640f0728d29745ca9e5424d9daf944f"
format = "tar.gz"
strip-prefix = "bezier-0.2.1"

[package]
name = "cabin-ports/bezier"
version = "0.2.1"
license = "MIT"
include = ["LICENSE.txt", "README.md", "CHANGELOG", "include"]

# Header-only, as upstream's CMake interface target (CMakeLists.txt:7-8).
# Evaluating a curve during static initialization can read Bezier<N>'s
# coefficient tables (bezier.h:951-954) before their unordered dynamic
# initialization, giving 0 (measured, GCC 16).
# Not ported: the tests.
[target.bezier]
type = "header-only"
include-dirs = ["include"]
# README.md:3: "single header only C++11 library".
interface-cxx-standard = "c++11"
