[package.upstream]
# Theora publishes its releases on downloads.xiph.org only (the GitHub
# repository has tags but no release assets); its SHA256SUMS lists this
# checksum.
url = "https://downloads.xiph.org/releases/theora/libtheora-1.2.0.tar.gz"
checksum = "sha256:279327339903b544c28a92aeada7d0dcfd0397b59c2f368cc698ac56f515906e"
format = "tar.gz"
strip-prefix = "libtheora-1.2.0"

[package]
name = "cabin-ports/libtheora"
version = "1.2.0"
license = "BSD-3-Clause AND FSFULLRWD"
# BSD-3-Clause (COPYING); LICENSE carries On2's patent grant for VP3.
include = ["COPYING", "LICENSE", "include", "lib"]
c-standard = "c11"
# The public headers include <ogg/ogg.h>, whose integer types are the
# C99 exact-width ones.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# configure.ac:417 requires libogg 1.3.4 or newer.
[dependencies]
"cabin-ports/libogg" = "^1.3.4"

# The three static libraries upstream's autotools build produces, with the
# sources lib/Makefile.am lists for each (lib/Makefile.am:40-275):
# theoradec, theoraenc, which carries its own copies of the code it shares
# with the decoder, and the legacy theora, the decoder plus the encoder's
# own sources, which also serves the pre-1.0 theora.h API.  Upstream has
# no CMake build; of what its config.h can carry, the library reads only
# the assembly switches set below and the --disable-encode, telemetry and
# fuzzing switches listed here.  Not ported: the shared libraries and their
# symbol lists; the 32-bit x86 (lib/x86, lib/x86_vc), ARM and C64x+
# assembly, for CPUs Cabin does not target here; --disable-encode
# (encoder_disabled.c); the cairo telemetry and fuzzing switches
# (configure.ac:517-541); the examples, tests and docs; and the flags
# configure adds for GCC (configure.ac:205: -O3, -fomit-frame-pointer,
# -finline-functions, -funroll-loops, warnings).
[target.theoradec]
type = "library"
sources = [
  "lib/apiwrapper.c",
  "lib/bitpack.c",
  "lib/decapiwrapper.c",
  "lib/decinfo.c",
  "lib/decode.c",
  "lib/dequant.c",
  "lib/fragment.c",
  "lib/huffdec.c",
  "lib/idct.c",
  "lib/info.c",
  "lib/internal.c",
  "lib/quant.c",
  "lib/state.c",
]
include-dirs = ["include"]
links = "theoradec"
# codec.h includes <ogg/ogg.h>.
deps = [{ name = "cabin-ports/libogg", public = true }]

[target.theoraenc]
type = "library"
sources = [
  "lib/apiwrapper.c",
  "lib/bitpack.c",
  "lib/dequant.c",
  "lib/fragment.c",
  "lib/idct.c",
  "lib/info.c",
  "lib/internal.c",
  "lib/state.c",
  "lib/quant.c",
  "lib/analyze.c",
  "lib/fdct.c",
  "lib/encfrag.c",
  "lib/encapiwrapper.c",
  "lib/encinfo.c",
  "lib/encode.c",
  "lib/enquant.c",
  "lib/huffenc.c",
  "lib/mathops.c",
  "lib/mcenc.c",
  "lib/rate.c",
  "lib/tokenize.c",
]
include-dirs = ["include"]
links = "theoraenc"
deps = [{ name = "cabin-ports/libogg", public = true }]

[target.theora]
type = "library"
sources = [
  "lib/apiwrapper.c",
  "lib/bitpack.c",
  "lib/decapiwrapper.c",
  "lib/decinfo.c",
  "lib/decode.c",
  "lib/dequant.c",
  "lib/fragment.c",
  "lib/huffdec.c",
  "lib/idct.c",
  "lib/info.c",
  "lib/internal.c",
  "lib/quant.c",
  "lib/state.c",
  "lib/analyze.c",
  "lib/fdct.c",
  "lib/encfrag.c",
  "lib/encapiwrapper.c",
  "lib/encinfo.c",
  "lib/encode.c",
  "lib/enquant.c",
  "lib/huffenc.c",
  "lib/mathops.c",
  "lib/mcenc.c",
  "lib/rate.c",
  "lib/tokenize.c",
]
include-dirs = ["include"]
links = "theora"
deps = [{ name = "cabin-ports/libogg", public = true }]

# x86-64 with GCC or Clang, as configure sets it up by default
# (configure.ac:242-246, lib/Makefile.am:49-119, 155-200): the MMX and
# SSE2 GNU inline assembly, called directly since x86-64 guarantees SSE2
# (lib/x86/x86int.h:24-48, lib/x86/x86enc.h:24-62).  MSVC has no
# x86-64 inline assembly; upstream's Visual Studio projects enable their
# lib/x86_vc code for 32-bit targets only, so it builds the C code there,
# as vcpkg's x64 builds do everywhere.
[target.'cfg(all(arch = "x86_64", not(env = "msvc")))'.sources]
theoradec = [
  "lib/x86/x86cpu.c",
  "lib/x86/mmxidct.c",
  "lib/x86/mmxfrag.c",
  "lib/x86/mmxstate.c",
  "lib/x86/sse2idct.c",
  "lib/x86/x86state.c",
]
theoraenc = [
  "lib/x86/x86cpu.c",
  "lib/x86/mmxfrag.c",
  "lib/x86/mmxidct.c",
  "lib/x86/mmxstate.c",
  "lib/x86/sse2idct.c",
  "lib/x86/x86state.c",
  "lib/x86/mmxencfrag.c",
  "lib/x86/mmxfdct.c",
  "lib/x86/sse2encfrag.c",
  "lib/x86/x86enquant.c",
  "lib/x86/x86enc.c",
  "lib/x86/sse2fdct.c",
]
theora = [
  "lib/x86/x86cpu.c",
  "lib/x86/mmxidct.c",
  "lib/x86/mmxfrag.c",
  "lib/x86/mmxstate.c",
  "lib/x86/sse2idct.c",
  "lib/x86/x86state.c",
  "lib/x86/mmxencfrag.c",
  "lib/x86/mmxfdct.c",
  "lib/x86/sse2encfrag.c",
  "lib/x86/x86enquant.c",
  "lib/x86/x86enc.c",
  "lib/x86/sse2fdct.c",
]

[target.'cfg(all(arch = "x86_64", not(env = "msvc")))'.profile]
defines = ["OC_X86_ASM", "OC_X86_64_ASM"]

# The defines upstream's Visual Studio projects set (win32/VS2008), which
# silence the MSVC runtime's deprecation warnings.
[target.'cfg(env = "msvc")'.profile]
defines = ["_CRT_SECURE_NO_DEPRECATE", "_CRT_NONSTDC_NO_DEPRECATE"]
