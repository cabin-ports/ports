c-standard = "c11"
# jpeglib.h, jmorecfg.h, jerror.h and jconfig.h are C89, and jpeglib.h
# declares the API extern "C" for C++.
interface-c-standard = "c89"

# README's terms (LEGAL ISSUES, conditions (1)-(3), README:125-138) require
# that README accompany any part of the source and that additions,
# deletions and changes be indicated: this package adds jconfig.h, a copy
# of jconfig.txt, and keeps only README and the files listed in `include`,
# unmodified; the rest of the jpegsrc.v9f distribution is omitted.  A
# program distributed only as executable code must state in its
# documentation that "this software is based in part on the work of the
# Independent JPEG Group".
#
# jcarith.c:213-215, jdarith.c:100-102 and jaricom.c:25-26 credit Markus
# Kuhn's JBIG implementation, JBIG-KIT (GPL-2.0-or-later), for how the
# probability estimation table is packed and accessed.  Compared with
# JBIG-KIT 0.9 to 2.1 (libjbig/jbig.c, jbig.h, jbig_ar.c, jbig_ar.h and
# jbig_tab.c), the shared material is that scheme, the encoder's procedures
# of ITU-T T.81 Annex D (encoding, renormalization, byte output and
# flushing) written with the standard's names, the values of its Table D.3,
# and short comment phrases: the coder registers' descriptions at
# jcarith.c:26-28 and 31-32 and jdarith.c:26-28, and jcarith.c:140-141,
# 146, 149, 179, 237, 239-242, 248, 250, 252-254, 266, 269, 283, 286, 288
# and 306; jdarith.c's decoding procedure is of a different design.  That
# is too slight to carry copyright, so the package carries IJG's terms
# only.
#
# The static library configure builds: Makefile.am's LIBSOURCES with
# configure's default memory manager, jmemnobs.c (configure.ac:315-317),
# which keeps every image in memory and never uses temporary files.  Not
# ported: the shared library and its libjpeg.map version script, the cjpeg,
# djpeg, jpegtran, rdjpgcom and wrjpgcom programs with their own sources,
# the other memory managers (jmemansi.c and jmemname.c, which configure
# --enable-maxmem selects, and jmemdos.c and jmemmac.c), and the canned
# makefiles and project files.
[target.jpeg]
type = "library"
sources = [
  "jaricom.c",
  "jcapimin.c",
  "jcapistd.c",
  "jcarith.c",
  "jccoefct.c",
  "jccolor.c",
  "jcdctmgr.c",
  "jchuff.c",
  "jcinit.c",
  "jcmainct.c",
  "jcmarker.c",
  "jcmaster.c",
  "jcomapi.c",
  "jcparam.c",
  "jcprepct.c",
  "jcsample.c",
  "jctrans.c",
  "jdapimin.c",
  "jdapistd.c",
  "jdarith.c",
  "jdatadst.c",
  "jdatasrc.c",
  "jdcoefct.c",
  "jdcolor.c",
  "jddctmgr.c",
  "jdhuff.c",
  "jdinput.c",
  "jdmainct.c",
  "jdmarker.c",
  "jdmaster.c",
  "jdmerge.c",
  "jdpostct.c",
  "jdsample.c",
  "jdtrans.c",
  "jerror.c",
  "jfdctflt.c",
  "jfdctfst.c",
  "jfdctint.c",
  "jidctflt.c",
  "jidctfst.c",
  "jidctint.c",
