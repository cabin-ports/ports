[package.upstream]
url = "https://github.com/cisco/libsrtp/archive/refs/tags/v2.8.2.tar.gz"
checksum = "sha256:02e8326e12381e27a205ded888a803c6ff55ec7be170cd5e5506251f731fee92"
format = "tar.gz"
strip-prefix = "libsrtp-2.8.2"
# The library's sources include config.h, which CMakeLists.txt generates
# from config_in_cmake.h.  Patch 0001 adds cabin/config.h in its place, with
# the template's constants and SSE block and the byte order that
# test_big_endian finds, which a cfg cannot tell on every arch; the
# profiles below define the HAVE_* macros that the library's sources read,
# as upstream's checks find them.
# BSD-3-Clause notice of config_in_cmake.h (LICENSE), whose lines 0001
# carries (the condition that redistributions of source code retain it):
