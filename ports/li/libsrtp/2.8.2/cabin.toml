# OF THE POSSIBILITY OF SUCH DAMAGE.
patches = ["patches/0001-add-a-config-h-for-the-cabin-profiles.patch"]

# The headers upstream installs to include/srtp2 (CMakeLists.txt and
# meson.build), so consumers include <srtp2/srtp.h>.
[[package.upstream.copy]]
from = "include/srtp.h"
to = "cabin/include/srtp2/srtp.h"

[[package.upstream.copy]]
from = "crypto/include/auth.h"
to = "cabin/include/srtp2/auth.h"

[[package.upstream.copy]]
from = "crypto/include/cipher.h"
to = "cabin/include/srtp2/cipher.h"

[[package.upstream.copy]]
from = "crypto/include/crypto_types.h"
to = "cabin/include/srtp2/crypto_types.h"

[package]
name = "cabin-ports/libsrtp"
version = "2.8.2"
license = "BSD-3-Clause"
include = [
  "LICENSE",
  "cabin",
  "crypto/cipher",
  "crypto/hash",
  "crypto/include",
  "crypto/kernel",
  "crypto/math",
  "crypto/replay",
  "include",
  "patches",
  "srtp",
]
# Upstream builds C99 with extensions on (CMakeLists.txt:5-7).  C11 is the
# oldest standard Cabin can request from MSVC, and Cabin rejects
# gnu-extensions there, so the build is strict C11.  Upstream states no C++
# standard: C++98 is measured.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++98"

[dependencies]
"cabin-ports/openssl" = { version = "=4.1.0", optional = true }

# Upstream's ENABLE_OPENSSL build is the srtp2_openssl target.
# vendored-openssl is not supported on Windows, as the openssl port's is not.
[features]
default = []
openssl = ["dep:cabin-ports/openssl"]
vendored-openssl = ["openssl", "cabin-ports/openssl/vendored"]

# The static library upstream's CMake builds by default, with its own AES
# and HMAC-SHA1 and so without the AES-GCM and AES-192 ciphers.  Not
# ported: the mbedTLS and NSS backends, the debug-logging and
# error-reporting options, the shared library, and the tests.
[target.srtp2]
type = "library"
sources = [
  "crypto/cipher/aes.c",
  "crypto/cipher/aes_icm.c",
  "crypto/cipher/cipher.c",
  "crypto/cipher/cipher_test_cases.c",
  "crypto/cipher/null_cipher.c",
  "crypto/hash/auth.c",
  "crypto/hash/auth_test_cases.c",
  "crypto/hash/hmac.c",
  "crypto/hash/null_auth.c",
  "crypto/hash/sha1.c",
  "crypto/kernel/alloc.c",
  "crypto/kernel/crypto_kernel.c",
  "crypto/kernel/err.c",
  "crypto/kernel/key.c",
  "crypto/math/datatypes.c",
  "crypto/replay/rdb.c",
  "crypto/replay/rdbx.c",
  "srtp/srtp.c",
]
include-dirs = ["cabin/include"]
links = "srtp2"

# Upstream's ENABLE_OPENSSL build: OpenSSL's AES-ICM, AES-GCM and HMAC-SHA1
# in place of the library's own.  Use this target in place of srtp2, never
# both.
[target.srtp2_openssl]
type = "library"
sources = [
  "crypto/cipher/aes_gcm_ossl.c",
  "crypto/cipher/aes_icm_ossl.c",
  "crypto/cipher/cipher.c",
  "crypto/cipher/cipher_test_cases.c",
  "crypto/cipher/null_cipher.c",
  "crypto/hash/auth.c",
  "crypto/hash/auth_test_cases.c",
  "crypto/hash/hmac_ossl.c",
  "crypto/hash/null_auth.c",
  "crypto/kernel/alloc.c",
  "crypto/kernel/crypto_kernel.c",
  "crypto/kernel/err.c",
  "crypto/kernel/key.c",
  "crypto/math/datatypes.c",
  "crypto/replay/rdb.c",
  "crypto/replay/rdbx.c",
  "srtp/srtp.c",
]
include-dirs = ["cabin/include"]
defines = ["GCM", "OPENSSL"]
required-features = ["openssl"]
deps = ["cabin-ports/openssl:crypto"]

[profile]
include-dirs = ["cabin", "crypto/include", "include"]
defines = [
  "HAVE_CONFIG_H",
  "HAVE_INT32_T",
  "HAVE_INTTYPES_H",
  "HAVE_STDINT_H",
  "HAVE_STDLIB_H",
  "HAVE_SYS_TYPES_H",
  "HAVE_UINT16_T",
  "HAVE_UINT32_T",
  "HAVE_UINT64_T",
  "HAVE_UINT8_T",
]

[target.'cfg(family = "unix")'.profile]
defines = ["HAVE_NETINET_IN_H"]

[target.'cfg(any(os = "linux", os = "android", os = "freebsd", os = "dragonfly"))'.profile]
defines = ["HAVE_BYTESWAP_H"]

[target.'cfg(any(os = "macos", os = "ios", os = "netbsd", os = "dragonfly"))'.profile]
defines = ["HAVE_MACHINE_TYPES_H"]

[target.'cfg(any(os = "solaris", os = "illumos"))'.profile]
defines = ["HAVE_SYS_INT_TYPES_H"]

# CMakeLists.txt's WIN32 block, whose _CRT_SECURE_NO_WARNINGS also reaches
# consumers there; Winsock supplies ntohl and htonl.
[target.'cfg(family = "windows")'.profile]
defines = ["HAVE_WINSOCK2_H", "_CRT_SECURE_NO_WARNINGS"]
link-libs = ["ws2_32"]
