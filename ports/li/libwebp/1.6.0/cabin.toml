[package.upstream]
url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz"
checksum = "sha256:e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564"
format = "tar.gz"
strip-prefix = "libwebp-1.6.0"

# The public headers, where upstream's install places them.  src/ and
# the archive root also hold the private dec/, dsp/, enc/, utils/ and
# sharpyuv/ trees, so neither is a consumer include root.
[[package.upstream.copy]]
from = "src/webp/decode.h"
to = "include/webp/decode.h"

[[package.upstream.copy]]
from = "src/webp/demux.h"
to = "include/webp/demux.h"

[[package.upstream.copy]]
from = "src/webp/encode.h"
to = "include/webp/encode.h"

[[package.upstream.copy]]
from = "src/webp/mux.h"
to = "include/webp/mux.h"

[[package.upstream.copy]]
from = "src/webp/mux_types.h"
to = "include/webp/mux_types.h"

[[package.upstream.copy]]
from = "src/webp/types.h"
to = "include/webp/types.h"

[[package.upstream.copy]]
from = "sharpyuv/sharpyuv.h"
to = "include/webp/sharpyuv/sharpyuv.h"

[[package.upstream.copy]]
from = "sharpyuv/sharpyuv_csp.h"
to = "include/webp/sharpyuv/sharpyuv_csp.h"

[package]
name = "cabin-ports/libwebp"
version = "1.6.0"
# COPYING is the BSD-3-Clause license; PATENTS grants the additional
# patent rights and AUTHORS lists the contributors both refer to.
include = ["AUTHORS", "COPYING", "PATENTS", "include", "sharpyuv", "src"]

# The five libraries upstream's CMake build installs by default: sharpyuv,
# webpdecoder (a decode-only subset of webp; link one or the other), webp,
# webpdemux and webpmux.  Several library targets make the bare package
# name ambiguous, so consumers name one, as in `cabin-ports/libwebp:webp`.
# Not ported: the tools, examples, extras and image I/O helpers.  Not
# reproduced, since Cabin drops a dependency's raw compiler flags:
# -fvisibility=hidden, so a shared object linking these archives also
# exports libwebp's internal symbols.
#
# Without the generated config.h, upstream's CMake defaults become private
# defines, so threading (WEBP_USE_THREAD) is on.  The sources include their
# headers as "src/..." and "sharpyuv/..." from the archive root.
[profile]
include-dirs = ["."]
defines = ["WEBP_USE_THREAD"]

# As cmake/cpu.cmake does on x86, each *_sse2, *_sse41 and *_avx2 source
# is compiled with its instruction set, and WEBP_HAVE_* let the portable
# code call those kernels after a runtime CPUID check (cl.exe needs
# neither).  Every SIMD source compiles to an empty stub off its
# architecture.
[target.'cfg(any(arch = "x86", arch = "x86_64"))'.profile]
defines = ["WEBP_HAVE_AVX2", "WEBP_HAVE_SSE2", "WEBP_HAVE_SSE41"]

# libm for sharpyuv's gamma tables and the encoder; pthread for
# WEBP_USE_THREAD.
[target.'cfg(os = "linux")'.profile]
link-libs = ["m", "pthread"]

[target.sharpyuv]
type = "library"
sources = [
  "sharpyuv/sharpyuv.c",
  "sharpyuv/sharpyuv_cpu.c",
  "sharpyuv/sharpyuv_csp.c",
  "sharpyuv/sharpyuv_dsp.c",
  "sharpyuv/sharpyuv_gamma.c",
  "sharpyuv/sharpyuv_neon.c",
  "sharpyuv/sharpyuv_sse2.c",
]
# Upstream installs these headers with both include/ and include/webp/
# as include directories: sharpyuv_csp.h includes "sharpyuv/sharpyuv.h".
# As there, include/webp/ also exposes webp's headers by bare name.
include-dirs = ["include", "include/webp"]
c-standard = "c11"
# The headers use // comments and include no other header.
interface-c-standard = "c99"
interface-cxx-standard = "c++98"
links = "sharpyuv"

[target.sharpyuv.instruction-sets]
"sharpyuv/sharpyuv_sse2.c" = ["sse2"]

