[package.upstream]
url = "https://github.com/Sigmyne/xchange/archive/refs/tags/v1.3.0.tar.gz"
checksum = "sha256:e59a9edbe37988d48d8098acb22eab517486e2b51120faf70df51c6566ce0ed3"
format = "tar.gz"
strip-prefix = "xchange-1.3.0"

[package]
name = "cabin-ports/libxchange"
version = "1.3.0"
# The Unlicense (LICENSE).
include = ["LICENSE", "include", "src"]
# Upstream sets no C standard, so each compiler's default applies; C11 is the
# oldest Cabin can lower for MSVC.  Under MSVC it makes include/xmutex.h use
# C11 <threads.h> instead of upstream's SRWLOCK, so the library needs Visual
# Studio 2022 17.8 or later and, with the DLL runtime,
# vcruntime140_threads.dll (vcruntime140_threadsd.dll in debug).
c-standard = "c11"
# The public headers use // comments and long long.  Consumers wrap them in
# extern "C" from C++, as they declare none, and include stddef.h or stdio.h
# first, as xchange.h uses size_t without declaring it.  Under MSVC,
# xchange.h includes <windows.h>, with its min and max macros.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# The static library CMake builds by default.  Not ported: the shared
# library, tests, examples, documentation, and CMake and pkg-config files.
# Not reproduced: MSVC's _CRT_SECURE_NO_WARNINGS, which only silences
# warnings.
[target.xchange]
type = "library"
sources = ["src/xchange.c", "src/xjson.c", "src/xlookup.c", "src/xstruct.c"]
include-dirs = ["include"]
links = "xchange"

# CMake links libm wherever it finds one; the Makefile also links pthread,
# which CMake does not.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]

# What glibc defines under GCC's and Clang's default GNU C, with which
# src/xchange.c:672 parses floats with strtof instead of through a double.
[target.'cfg(os = "linux")'.profile]
defines = ["_POSIX_C_SOURCE=200809L"]
