[package.upstream]
# The release asset on GitHub, byte-identical to the tarball on
# downloads.xiph.org/releases/vorbis (its SHA256SUMS lists this checksum).
url = "https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz"
checksum = "sha256:0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab"
format = "tar.gz"
strip-prefix = "libvorbis-1.3.7"

[package]
name = "cabin-ports/libvorbis"
version = "1.3.7"
# BSD-3-Clause (COPYING).
include = ["COPYING", "include", "lib"]
c-standard = "c11"
# The public headers include <ogg/ogg.h>, whose integer types are the
# C99 exact-width ones.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

[dependencies]
"cabin-ports/libogg" = "^1.3"

# The three static libraries upstream's CMake build produces
# (lib/CMakeLists.txt:29-113), with lib/ as their private include path:
# the sources include "os.h", "modes/setup_44.h" and the like.  On
# Windows upstream also compiles vorbisenc.c into vorbis (:60-62), static
# or shared, so that vorbis.dll can export the encoder through
# win32/vorbis.def (:64-68); here the encoder is only in vorbisenc, as on
# every other platform and in the autotools build (vcpkg drops those
# exports too).  Not ported: the shared libraries and their .def files;
# the macOS framework; the test/, examples/ and vq/ programs, lib/'s
# barkmel, tone and psytune tools, and the _V_SELFTEST test_sharedbook
# (lib/Makefile.am:29-50); and what configure adds for GCC
# (configure.ac:128-220: -O3, -ffast-math, -mno-ieee-fp, -fsigned-char,
# -D_REENTRANT, -D__NO_MATH_INLINES, warnings) and USE_MEMORY_H (:227),
# which CMake does not set.
[profile]
include-dirs = ["lib"]

[target.vorbis]
type = "library"
sources = [
  "lib/mdct.c",
  "lib/smallft.c",
  "lib/block.c",
  "lib/envelope.c",
  "lib/window.c",
  "lib/lsp.c",
  "lib/lpc.c",
  "lib/analysis.c",
  "lib/synthesis.c",
  "lib/psy.c",
  "lib/info.c",
  "lib/floor1.c",
  "lib/floor0.c",
  "lib/res0.c",
  "lib/mapping0.c",
  "lib/registry.c",
  "lib/codebook.c",
  "lib/sharedbook.c",
  "lib/lookup.c",
  "lib/bitrate.c",
]
include-dirs = ["include"]
links = "vorbis"
# codec.h includes <ogg/ogg.h>.
deps = [{ name = "cabin-ports/libogg", public = true }]

[target.vorbisenc]
type = "library"
sources = ["lib/vorbisenc.c"]
include-dirs = ["include"]
links = "vorbisenc"
deps = [{ name = "vorbis", public = true }]

[target.vorbisfile]
type = "library"
sources = ["lib/vorbisfile.c"]
include-dirs = ["include"]
links = "vorbisfile"
deps = [{ name = "vorbis", public = true }]

# libm, which upstream's CMake build links where it exists
# (CMakeLists.txt:62, lib/CMakeLists.txt:108-111).
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]

# Upstream's CMake build compiles in the compiler's default GNU dialect
# and defines nothing for os.h: it relies on <stdlib.h> declaring alloca()
# (<alloca.h> is included only under HAVE_ALLOCA_H, which only configure
# defines, configure.ac:263) and on <math.h> defining M_PI, for which
# os.h:43-45 would substitute a float constant.  Under Cabin's strict
# -std=c11 glibc declares neither; _DEFAULT_SOURCE restores the GNU
# dialect's view.  macOS declares both under -std=c11.  On Windows os.h
# takes alloca() from <malloc.h>, and MSVC's <math.h> defines no M_PI, as
# in upstream's MSVC build.
[target.'cfg(os = "linux")'.profile]
defines = ["_DEFAULT_SOURCE"]

# Upstream's CMake build silences the MSVC runtime's deprecation
# warnings (lib/CMakeLists.txt:70-74).
[target.'cfg(env = "msvc")'.profile]
defines = [
  "_CRT_SECURE_NO_WARNINGS",
  "_CRT_SECURE_NO_DEPRECATE",
  "_CRT_NONSTDC_NO_DEPRECATE",
]
