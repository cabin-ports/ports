include-dirs = ["src/headers"]
# LTC_SOURCE exposes the declarations internal to the library
# (makefile_include.mk:79).
defines = ["LTC_SOURCE", "LTM_DESC"]
interface-defines = ["LTM_DESC"]
# The sources compile as C11, the oldest standard Cabin can lower for
# MSVC; upstream sets none.  Strict C11 defines __STRICT_ANSI__, which
# turns off LTC_FAST (tomcrypt_cfg.h:238-241) and the x86 inline-asm
# rotates (tomcrypt_macros.h:254, 356): slower, same results.
c-standard = "c11"
# prng_state holds an anonymous union (tomcrypt_prng.h:58-79), a C11
# feature; ulong64 is unsigned long long outside MSVC
# (tomcrypt_cfg.h:196-202), a C++11 type.
interface-c-standard = "c11"
interface-cxx-standard = "c++11"
links = "tomcrypt"
deps = ["cabin-ports/libtommath"]

# rng_get_bytes reads CryptGenRandom on Windows
# (src/prngs/rng_get_bytes.c:86-120); upstream's MSVC makefile links
# advapi32.lib (makefile.msvc:24).
[target.'cfg(os = "windows")'.profile]
link-libs = ["advapi32"]

# As upstream's MSVC makefile defines them (makefile.msvc:23).
[target.'cfg(env = "msvc")'.profile]
defines = ["_CRT_SECURE_NO_WARNINGS", "_CRT_NONSTDC_NO_DEPRECATE"]
