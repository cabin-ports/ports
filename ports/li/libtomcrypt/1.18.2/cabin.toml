[package.upstream]
url = "https://github.com/libtom/libtomcrypt/archive/refs/tags/v1.18.2.tar.gz"
checksum = "sha256:d870fad1e31cb787c85161a8894abb9d7283c2a654a9d3d4c6d45a1eba59952c"
format = "tar.gz"
strip-prefix = "libtomcrypt-1.18.2"
# The makefiles compile src/ciphers/aes/aes.c twice, the second time
# with -DENCRYPT_ONLY into aes_enc.o, which holds the encrypt-only
# rijndael_enc_desc and aes_enc_desc (makefile.unix:222-223,
# makefile.msvc:205-206).  A Cabin target compiles each source once, so
# the patch adds src/ciphers/aes/aes_enc.c, which defines ENCRYPT_ONLY
# and includes aes.c.
patches = ["patches/0001-add-the-encrypt-only-aes-source.patch"]

[package]
name = "cabin-ports/libtomcrypt"
version = "1.18.2"
license = "WTFPL AND (CC0-1.0 OR OpenSSL OR Apache-2.0)"
include = ["LICENSE", "patches", "src"]

[dependencies]
"cabin-ports/libtommath" = "^1.3"

# The static library the makefiles build (libtomcrypt.a, tomcrypt.lib)
# from every object in OBJECTS (makefile_include.mk:206-360); the five
# *tab.c tables are #included by the sources that use them.  Math comes
# from LibTomMath: LTM_DESC compiles src/math/ltm_desc.c's ltm_desc and
# declares it in tomcrypt_math.h, the configuration makefile.unix,
# makefile.mingw and makefile.msvc select by default (:36, :24, :19) and
# vcpkg and ConanCenter build.  The public headers do not include
# tommath.h.  tomcrypt_custom.h's defaults stay as shipped.  Not ported:
# the shared library, the tests, demos and docs, the TomsFastMath and GMP
# math descriptors (TFM_DESC, GMP_DESC), LTC_PTHREAD, and the small-code
# build (LTC_SMALL).  Unsupported: cl.exe targeting ARM or ARM64, whose
# byte order tomcrypt_cfg.h does not detect (:79-191), so the library
# and every consumer stop at its #error; ConanCenter rejects Windows
# ARM64 and vcpkg patches the header.
[target.tomcrypt]
type = "library"
