[package.upstream]
url = "https://github.com/BrianGladman/aes/archive/6c53847f1259d4dff0b240dba3916d9b766624c7.tar.gz"
checksum = "sha256:b47f179935579e865d37361325e7897de7916b5d5cfce1a3eec2fa0c382c8731"
format = "tar.gz"
strip-prefix = "aes-6c53847f1259d4dff0b240dba3916d9b766624c7"

# Consumers see only the public headers (README.md, "aes.h", "aescpp.h"; aes.h
# includes brg_types.h), not the implementation headers beside the sources.
[[package.upstream.copy]]
from = "aes.h"
to = "include/aes.h"

[[package.upstream.copy]]
from = "aescpp.h"
to = "include/aescpp.h"

[[package.upstream.copy]]
from = "brg_types.h"
to = "include/brg_types.h"

# Version: no tag exists; 2025.11.24 is the date of commit 6c53847 on master.
[package]
name = "cabin-ports/libaesgm"
version = "2025.11.24"
# aestab.c:386-389 bases the startup initializer on code Joe Lowe placed in the public
# domain, so it adds no term.
license = "Brian-Gladman-2-Clause"
include = [
  "aes.h", "aes_ni.h", "aes_via_ace.h", "aescpp.h", "aesopt.h", "aestab.h", "brg_endian.h",
  "brg_types.h", "aes_modes.c", "aes_ni.c", "aescrypt.c", "aeskey.c", "aestab.c", "license.txt",
  "include",
]

# The five files of upstream's lib_generic_c project, in its default
# configuration (static tables, modes, AES-NI where the compiler targets it).
# Not ported: the assembler variants, the test programs and the Python binding.
[target.aes]
type = "library"
links = "aes"
sources = ["aes_modes.c", "aes_ni.c", "aescrypt.c", "aeskey.c", "aestab.c"]
include-dirs = ["include"]
# Upstream states no standard; the sources build as C11 because Cabin's MSVC dialect
# has no /std: spelling for C99.
c-standard = "c11"
# Upstream states no C standard; c89 is the measured floor of aes.h (clang
# -fsyntax-only -std=c89 -pedantic-errors passes).
interface-c-standard = "c89"
# Upstream states no C++ standard; c++98 is the measured floor of aescpp.h (clang++
# -fsyntax-only -std=c++98 -pedantic-errors passes).
interface-cxx-standard = "c++98"
