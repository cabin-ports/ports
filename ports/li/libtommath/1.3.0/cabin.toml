# The sources compile as C11, the oldest standard Cabin can lower for
# MSVC; upstream sets none.  tommath.h needs <stdint.h>.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# The static library upstream's CMake builds by default (OUTPUT_NAME
# tommath) from every source in sources.cmake, with the default digit
# size tommath.h selects per compiler and architecture.  Upstream sets
# no defines.  As in upstream's own build, mp_set_double exists only
# where __STDC_IEC_559__ or __GCC_IEC_559 is defined
# (bn_mp_set_double.c:6): GCC predefines the latter, Apple Clang and
# MSVC neither.  Not ported:
# the shared library, the tests and demos, the C89 variant
# (tommath_c89.h), and the LTO option.
[target.tommath]
type = "library"
sources = [
  "bn_cutoffs.c",
  "bn_deprecated.c",
  "bn_mp_2expt.c",
  "bn_mp_abs.c",
