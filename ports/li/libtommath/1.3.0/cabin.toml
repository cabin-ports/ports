[package.upstream]
url = "https://github.com/libtom/libtommath/archive/refs/tags/v1.3.0.tar.gz"
checksum = "sha256:6d099e93ff00fa9b18346f4bcd97dcc48c3e91286f7e16c4ac5515a7171c3149"
format = "tar.gz"
strip-prefix = "libtommath-1.3.0"
# The build relies on dead-code elimination ("Clang requires at least
# '-O1' for dead code elimination", CMakeLists.txt:80): s_mp_rand_platform
# calls each s_read_* entropy function under an MP_HAS(S_READ_*)
# condition, and on each platform some of those functions are never
# defined.  MP_HAS(X) is true only when BN_X_C is defined as empty
# (tommath_private.h:150), which it never is where the function is
# missing, so those calls are dead; an unoptimized Clang or MSVC build
# still emits them and fails to link.  Cabin builds a dependency at its
# consumer's optimization level, so the patch puts each call under
# #ifdef BN_X_C: it removes only statements whose MP_HAS condition is
# constant false, and changes nothing that runs.  vcpkg patches the same
# function for the same reason (ports/libtommath/msvc-dce.patch).
patches = ["patches/0001-guard-platform-rng-calls-with-preprocessor.patch"]

# tommath.h is the one header upstream installs (CMakeLists.txt:122,167).
# The archive root also holds the private headers, so it stays off the
# consumer include path.
[[package.upstream.copy]]
from = "tommath.h"
to = "include/tommath.h"

