[package.upstream]
url = "https://github.com/nonstd-lite/observer-ptr-lite/archive/refs/tags/v0.4.0.tar.gz"
checksum = "sha256:812eafbdaccfb44ffd2536692b668cd1f16228e8d7609de56b60320c8c57cc67"
format = "tar.gz"
strip-prefix = "observer-ptr-lite-0.4.0"

[package]
name = "cabin-ports/observer-ptr-lite"
version = "0.4.0"
license = "BSL-1.0"
include = ["LICENSE.txt", "include"]

[target.observer-ptr-lite]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
# The default selection fails at observer_ptr.hpp:98 on Apple clang at C++17+.
interface-defines = ["nsop_CONFIG_SELECT_OBSERVER_PTR=nsop_OBSERVER_PTR_NONSTD"]
