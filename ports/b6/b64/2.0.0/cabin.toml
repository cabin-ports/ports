[package.upstream]
# v2.0.0.1 only repackages v2.0.0 (docs renamed to .md); the sources
# declare version 2.0 (include/b64/ccommon.h:11-12).
url = "https://github.com/libb64/libb64/archive/refs/tags/v2.0.0.1.tar.gz"
checksum = "sha256:ce8e578a953a591bd4a6f157eec310b9a4c2e6f10ade2fdda6ae6bafaf798b98"
format = "tar.gz"
strip-prefix = "libb64-2.0.0.1"
# Patch 0001 drops ccommon.h's `#elseif` line and its `#include <stdlib.h>`,
# which cl rejects inside the taken _WIN32 group (measured: check-windows,
# "ccommon.h(17): fatal error C1021: invalid preprocessor command 'elseif'").
# GCC and Clang skip that line and its include inside the _WIN32 group, so
# they are unchanged; spelling it `#elif` instead breaks the C++ wrappers,
# which include cencode.h inside namespace base64 (measured: check-linux,
# "std_abs.h:52:11: error: 'abs' has not been declared in '::'").
patches = ["patches/0001-drop-elseif-branch-from-ccommon-h.patch"]

[package]
name = "cabin-ports/b64"
version = "2.0.0"
license = "CC-PDDC"
include = ["AUTHORS.md", "LICENSE.md", "include", "patches", "src"]
# Upstream states ANSI C (README.md:6); C11 is the oldest standard Cabin can
# request from MSVC.
c-standard = "c11"
interface-c-standard = "c89"
# c++98 (measured: clang++ -std=c++98 -fsyntax-only on encode.h and decode.h).
interface-cxx-standard = "c++98"

# src/Makefile's static libb64.a.  The header-only C++ wrappers ship in the
# include directory; upstream's base64 tool is not ported.  cencode.h and
# cdecode.h have no extern "C" guard, so C++ code must wrap them itself
# (measured: a direct include fails to link with an undefined
# base64_init_encodestate).  encode.h and decode.h use BUFFERSIZE as a default
# argument, so a C++ consumer defines it (upstream's tool passes 16777216,
# base64/Makefile:16).
[target.b64]
type = "library"
sources = ["src/cdecode.c", "src/cencode.c"]
include-dirs = ["include"]
links = "b64"
