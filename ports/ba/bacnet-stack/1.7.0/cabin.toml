# Not exported: the per-OS port header bacport.h, which upstream's CMake adds to the
# public include path; Cabin's profile include directories are private (measured on
# macOS: a consumer's #include <bacport.h> fails).
# CMake's BACNET_PORT selects the port directory; strict -std=c11 hides the POSIX
# declarations ports/linux needs, which _DEFAULT_SOURCE restores.
[target.'cfg(os = "linux")'.profile]
defines = ["BACNET_PORT=linux", "_DEFAULT_SOURCE"]
include-dirs = ["ports/linux", "ports/posix"]

[target.'cfg(os = "macos")'.profile]
defines = ["BACNET_PORT=bsd", "USE_MACH_TIME"]
include-dirs = ["ports/bsd", "ports/posix"]

[target.'cfg(os = "windows")'.profile]
defines = ["BACNET_PORT=win32"]
include-dirs = ["ports/win32", "ports/posix"]
link-libs = ["wsock32", "ws2_32", "iphlpapi", "winmm"]

# CMake links libm and Threads on Linux.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m", "pthread"]
