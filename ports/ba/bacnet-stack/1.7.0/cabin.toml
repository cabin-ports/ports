# src/bacnet/basic/object/device.c:2115 credits cryptosys.net/pki/Uuid.c.html for the
# UUID version bits; src/bacnet/basic/sys/bigend.c:4 credits Jan Wolter's byte-order notes
# for the endianness test; src/bacnet/basic/sys/color_rgb.c:564 credits T. Helland for the
# color-temperature approximation.  The copyright significance of all three is uncertain.
license = "GPL-2.0-or-later WITH GCC-exception-2.0 AND MIT AND BSD-3-Clause AND CC-PDDC"
# Not ported: upstream's apps and the options CMake leaves off by default (BACnet MS/TP,
# BACnet/SC, Ethernet, ARCNET, UCI, intrinsic reporting).  The server/, ubasic and ucix
# directories, which only those apps and options use, are left out of the package.
