# Patch 0001 makes the headers test _WIN32, which Windows compilers
# predefine, where they test WIN32: upstream's CMake build defines WIN32
# for its own compiles (cmake/re-config.cmake:183-187), and CMake's default
# MSVC flags give it to consumers, whose re_sock_t, among others, depends
# on it (include/re_types.h:269-277).  Cabin cannot give consumers a define
# on Windows only.
