include-dirs = ["include"]
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "re"
deps = ["cabin-ports/openssl:ssl", "cabin-ports/openssl:crypto", "cabin-ports/zlib"]
# CMakeLists.txt:110-116 and cmake/re-config.cmake's RE_DEFINITIONS that
# hold on every platform with these options.  HAVE_ARC4RANDOM, which
# re-config.cmake probes for, matters only without OpenSSL
# (src/sys/rand.c).  HAVE_THREADS is left undefined: re_thread.h picks the
# thread types consumers see by it (:19-54), so the library uses
# upstream's POSIX and Win32 backends everywhere, as upstream does where it
# finds no C11 threads (macOS), and not the C11 threads it finds in glibc
# 2.28 or later and in recent MSVC.
defines = [
  "_GNU_SOURCE",
  "HAVE_ATOMIC",
  "HAVE_SELECT",
  "HAVE_TLS1_3_POST_HANDSHAKE_AUTH",
  "HAVE_UNIXSOCK=1",
  'RE_VERSION="4.13.0"',
  "USE_DTLS",
  "USE_OPENSSL",
  "USE_OPENSSL_AES",
  "USE_OPENSSL_HMAC",
  "USE_TLS",
  "USE_ZLIB",
  "VER_MAJOR=4",
  "VER_MINOR=13",
  "VER_PATCH=0",
]

# The rest of RE_DEFINITIONS and RE_LIBS (re-config.cmake:33-292) per
# system, with what its probes find on Linux with glibc, on macOS, and on
# Windows with MSVC.  Other Unix systems get only what it sets for every
# one of them, without route listing (HAVE_ROUTE_LIST).
[target.'cfg(family = "unix")'.profile]
defines = [
  "HAVE_FORK",
  "HAVE_PTHREAD",
  "HAVE_PWD_H",
  "HAVE_SELECT_H",
  "HAVE_SETRLIMIT",
  "HAVE_SIGNAL",
  "HAVE_STRERROR_R",
  "HAVE_STRINGS_H",
  "HAVE_SYS_TIME_H",
  "HAVE_UNAME",
]
link-libs = ["pthread", "m"]

[target.'cfg(any(os = "linux", os = "macos"))'.profile]
defines = [
  "HAVE_EXECINFO",
  "HAVE_GETIFADDRS",
  "HAVE_GETOPT",
  "HAVE_RESOLV",
  "HAVE_ROUTE_LIST",
  "HAVE_SYSLOG",
  "HAVE_UNISTD_H",
]
link-libs = ["resolv"]

[target.'cfg(os = "linux")'.profile]
defines = [
  "LINUX",
  "HAVE_ACCEPT4",
  "HAVE_EPOLL",
  "HAVE_MEMRCHR",
  "HAVE_PRCTL",
  'OS="Linux"',
]
link-libs = ["dl"]

[target.'cfg(os = "macos")'.profile]
defines = ["DARWIN", "HAVE_KQUEUE", 'OS="Darwin"']
frameworks = ["SystemConfiguration", "CoreFoundation"]

[target.'cfg(os = "windows")'.profile]
defines = [
  "WIN32",
  "_WIN32_WINNT=0x0A00",
  "HAVE_QOS_FLOWID",
  "HAVE_PQOS_FLOWID",
  'OS="Windows"',
]
link-libs = ["qwave", "iphlpapi", "wsock32", "ws2_32", "dbghelp"]

[target.'cfg(any(cc = "msvc", cc = "clang-cl"))'.profile]
defines = ["HAVE_IO_H", "_CRT_SECURE_NO_WARNINGS"]

# ARCH is CMAKE_SYSTEM_PROCESSOR, as CMake reports it on each system.
[target.'cfg(all(any(os = "linux", os = "macos"), arch = "x86_64"))'.profile]
defines = ['ARCH="x86_64"']

[target.'cfg(all(os = "linux", arch = "aarch64"))'.profile]
defines = ['ARCH="aarch64"']

[target.'cfg(all(os = "macos", arch = "aarch64"))'.profile]
defines = ['ARCH="arm64"']

[target.'cfg(all(os = "windows", arch = "x86_64"))'.profile]
defines = ['ARCH="AMD64"']

[target.'cfg(all(os = "windows", arch = "aarch64"))'.profile]
defines = ['ARCH="ARM64"']

# Upstream defines RELEASE in every configuration but Debug
# (re-config.cmake:241), its default (:27-31).
[target.'cfg(any(family = "unix", family = "windows"))'.profile.release]
defines = ["RELEASE"]

[target.'cfg(family = "unix")'.sources]
re = ["src/mod/dl.c", "src/net/posix/pif.c", "src/thread/posix.c"]

[target.'cfg(any(os = "linux", os = "macos"))'.sources]
re = ["src/net/ifaddrs.c", "src/dns/res.c"]

[target.'cfg(os = "linux")'.sources]
re = ["src/net/linux/rt.c", "src/net/linux/addrs.c"]

[target.'cfg(os = "macos")'.sources]
re = ["src/dns/darwin/srv.c", "src/net/bsd/brt.c"]

[target.'cfg(os = "windows")'.sources]
re = [
  "src/dns/win32/srv.c",
  "src/mod/win32/dll.c",
  "src/mqueue/win32/pipe.c",
  "src/net/win32/wif.c",
  "src/thread/win32.c",
]
