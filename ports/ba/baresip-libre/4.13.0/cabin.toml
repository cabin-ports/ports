[package]
name = "cabin-ports/baresip-libre"
version = "4.13.0"
# LGPL-2.1-or-later covers FFmpeg's start-code scan copied in src/h264/nal.c:153-204.
license = "BSD-3-Clause AND LGPL-2.1-or-later"
include = ["LICENSE", "include", "patches", "rem", "src"]

[dependencies]
"cabin-ports/openssl" = "=4.1.0"
"cabin-ports/zlib" = "^1.3"

# Requests the openssl port's own build of OpenSSL in place of the system's.
[features]
vendored-openssl = ["cabin-ports/openssl/vendored"]

# The static library re as upstream's CMake build compiles it with its
# default options and with OpenSSL and zlib found: every module, librem
# (rem/), and OpenSSL's TLS, DTLS, AES and HMAC.  Consumers include <re.h>
# from include/, as libre.pc's -I gives it.  Like upstream's installed
# libre::re target and libre.pc, the library passes consumers none of its
# definitions: re_http.h declares its TLS functions only to a consumer that
# defines USE_TLS, and re_btrace.h's and re_mbuf.h's debug code follows the
# consumer's HAVE_EXECINFO and RELEASE.  Not ported: the shared library and
# the mbedTLS build (USE_MBEDTLS, off by default).  Not reproduced:
# position-independent code (CMakeLists.txt:627; Cabin drops a dependency's
# raw compiler flags), so the archive is not built for linking into a
# shared object.
# C99 and C11 are the standards README.md:102 names; upstream's strict-c.yml
# builds both without extensions, and its CMake build asks MSVC for C11
# (CMakeLists.txt:35-37).  Its C++ test builds as C++11
# (test/CMakeLists.txt:33).
