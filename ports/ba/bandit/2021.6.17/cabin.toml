# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN
# THE SOFTWARE.
patches = ["patches/0001-include-snowhouse-from-dependency.patch"]

[package]
name = "cabin-ports/bandit"
version = "2021.6.17"
license = "MIT"
# LICENSE.txt in the archive is a symlink to docs/LICENSE.txt, which Cabin's
# extractor skips, so the license is included at its real path.
include = ["docs/LICENSE.txt", "bandit", "patches"]

[dependencies]
"cabin-ports/snowhouse" = "^5.0"

# Version 2021.6.17 is the date of commit 77f50861 (bandit/version.h says
# 3.0.0-snapshot; the last release, v2.0.0, needs snowhouse 2.1).  Standard:
# C++11 per docs/index.md.  Not ported: the specs, cmake and CI files.
# The vendored bandit/external/optionparser.h is MIT (its header).
[target.bandit]
type = "header-only"
include-dirs = ["."]
deps = [{ name = "cabin-ports/snowhouse", public = true }]
interface-cxx-standard = "c++11"
