[package.upstream]
url = "https://github.com/CrowCpp/Crow/archive/refs/tags/v1.3.5.tar.gz"
checksum = "sha256:4783bb3522b1de2e6300efd337ac2e234fa8f7fe9853131ee53ee47bf90cf03f"
format = "tar.gz"
strip-prefix = "Crow-1.3.5"

[package]
name = "cabin-ports/crow"
version = "1.3.5"
# include/crow/utility.h:373 and :433 and http_response.h:8 credit Stack Overflow answers for gen_seq, a
# parameter-pack type test and an S_ISREG fallback; their copyright significance is uncertain.
license = "BSD-3-Clause AND MIT AND ISC AND BSD-2-Clause AND BSL-1.0"
# BSD-3-Clause (LICENSE).  Code from elsewhere:
# - http_parser_merged.h and query_string.h: http-parser (MIT) and qs_parse (MIT),
#   with the notices in README.md:110-205.
# - TinySHA1.hpp: ISC-style permission notice in the file header; its block
#   transform follows Boost.Uuid's sha1.hpp (BSL-1.0, Copyright 2007 Andy
#   Tompkins), credited at :23-24.
# - mime_types.h: generated from nginx's mime.types (BSD-2-Clause).
include = ["LICENSE", "README.md", "include"]
# Upstream's stated requirement (docs/getting_started/setup/linux.md:5).
# Not ported: HTTPS/WSS (CROW_ENABLE_SSL), compression (CROW_ENABLE_COMPRESSION),
# the Boost.Asio backend and the amalgamated crow_all.h; upstream's defaults are off.

[dependencies]
"cabin-ports/asio" = "^1.38"

[target.crow]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
# Upstream's exported Crow::Crow (CMakeLists.txt:143).
interface-defines = ["ASIO_NO_DEPRECATED"]
deps = [{ name = "cabin-ports/asio", public = true }]

# Crow serves from threads; upstream's cmake/Findasio.cmake links Threads::Threads.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
