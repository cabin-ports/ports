[package.upstream]
url = "https://github.com/Tinkoff/uconfig/archive/refs/tags/v2.1.0.tar.gz"
checksum = "sha256:1a7a8ab97b6de7fa039031caa83d8ab889d874822b06c920af3e8ddd794ab9c6"
format = "tar.gz"
strip-prefix = "uconfig-2.1.0"

[package]
name = "cabin-ports/tcsbank-uconfig"
version = "2.1.0"
license = "Apache-2.0"
include = ["LICENSE", "include"]

[dependencies]
"cabin-ports/rapidjson" = "=1.1.0"

# Needs rapidjson only for format/Rapidjson.h; EnvFormat works without it.
# Upstream's build defines RAPIDJSON_HAS_STDSTRING for consumers
# (CMakeLists.txt:58), which matters when rapidjson is included before
# uconfig/format/Rapidjson.h, whose own define (:6-8) comes too late then.
[target.tcsbank_uconfig]
type = "header-only"
include-dirs = ["include"]
# README.md:11 and CMakeLists.txt:24.
interface-cxx-standard = "c++17"
interface-defines = ["RAPIDJSON_HAS_STDSTRING=1"]
deps = [{ name = "cabin-ports/rapidjson", public = true }]
