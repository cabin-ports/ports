[package.upstream]
url = "https://github.com/KDAB/KDBindings/archive/refs/tags/v1.1.0.tar.gz"
checksum = "sha256:0ee07cb3e2ec4f5688b4b2971c42e5a4f4a41c7bf4aa130e6b118bea4b6340ab"
format = "tar.gz"
strip-prefix = "KDBindings-1.1.0"

[package]
name = "cabin-ports/kdbindings"
version = "1.1.0"
license = "MIT"
include = ["LICENSES/MIT.txt", "src/kdbindings"]

# Upstream's CMake target defines KDBINDINGS_ENABLE_WARN_UNUSED=1 for its
# consumers by default, marking the Signal connect functions [[nodiscard]];
# this port keeps it.  The headers test it with #ifdef, so a consumer's own
# `defines` entry changes only its value, never removes it;
# ConnectionHandle::release() discards a handle explicitly.
#
# Qt defines `emit` as a macro, which signal.h rejects with a
# static_assert: Qt consumers define QT_NO_EMIT (as upstream's
# off-by-default KDBindings_QT_NO_EMIT option would) or QT_NO_KEYWORDS
# themselves.
#
# The v1.1.0 tag still carries CMake's project version 1.0.95; the registry
# version follows the tag.
#
# Licence: the headers are MIT, KDAB's per SPDX header and
# genindex_array.h's Jeremy Burns notice in full; LICENSES/MIT.txt is the
# licence text.  The BSD-3-Clause licence covers only CMake modules and
# configuration files (.reuse/dep5), which this port does not ship.
[target.kdbindings]
type = "header-only"
include-dirs = ["src"]
interface-cxx-standard = "c++17"
interface-defines = ["KDBINDINGS_ENABLE_WARN_UNUSED=1"]
