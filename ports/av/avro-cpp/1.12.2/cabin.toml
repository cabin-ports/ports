[package.upstream]
url = "https://archive.apache.org/dist/avro/avro-1.12.2/avro-src-1.12.2.tar.gz"
checksum = "sha256:449722c442ec9514d8e6933f9c7ccf2e0544cb75c951c25b804ea1d8e73d12bb"
format = "tar.gz"
strip-prefix = "avro-src-1.12.2"
# Patch 0001 includes <fmt/format.h> in Exception.hh, which calls fmt::format
# but includes only <fmt/core.h>; fmt 12 declares it only in format.h (measured:
# macOS clang, "no member named 'format' in namespace 'fmt'").
patches = ["patches/0001-include-fmt-format-for-exception.patch"]

[package]
name = "cabin-ports/avro-cpp"
version = "1.12.2"
license = "Apache-2.0"
include = [
  "LICENSE.txt",
  "NOTICE.txt",
  "lang/c++/LICENSE",
  "lang/c++/NOTICE",
  "lang/c++/impl",
  "lang/c++/include",
  "patches",
]

[dependencies]
"cabin-ports/fmt" = "^12.2"
"cabin-ports/zlib" = "^1.3"

# The static library of lang/c++/CMakeLists.txt (AVRO_SOURCE_FILES).  Not
# ported: the Snappy and zstd codecs (SNAPPY_CODEC_AVAILABLE,
# ZSTD_CODEC_AVAILABLE) and the shared library.
# Upstream's CMakeLists.txt:23-29 requires C++17.
[target.avrocpp]
type = "library"
sources = [
  "lang/c++/impl/BinaryDecoder.cc",
  "lang/c++/impl/BinaryEncoder.cc",
  "lang/c++/impl/Compiler.cc",
  "lang/c++/impl/CustomAttributes.cc",
  "lang/c++/impl/DataFile.cc",
  "lang/c++/impl/FileStream.cc",
  "lang/c++/impl/Generic.cc",
  "lang/c++/impl/GenericDatum.cc",
  "lang/c++/impl/LogicalType.cc",
  "lang/c++/impl/Node.cc",
  "lang/c++/impl/NodeImpl.cc",
  "lang/c++/impl/Resolver.cc",
  "lang/c++/impl/ResolverSchema.cc",
  "lang/c++/impl/Schema.cc",
  "lang/c++/impl/Stream.cc",
  "lang/c++/impl/Types.cc",
  "lang/c++/impl/ValidSchema.cc",
  "lang/c++/impl/Validator.cc",
  "lang/c++/impl/Zigzag.cc",
  "lang/c++/impl/json/JsonDom.cc",
  "lang/c++/impl/json/JsonIO.cc",
  "lang/c++/impl/parsing/JsonCodec.cc",
  "lang/c++/impl/parsing/ResolvingDecoder.cc",
  "lang/c++/impl/parsing/Symbol.cc",
  "lang/c++/impl/parsing/ValidatingCodec.cc",
]
include-dirs = ["lang/c++/include"]
deps = [
  { name = "cabin-ports/fmt", public = true },
  "cabin-ports/zlib",
]
cxx-standard = "c++17"
links = "avrocpp"

# The schema-to-C++ generator upstream builds with AVRO_BUILD_EXECUTABLES; its
# sibling `precompile` test tool is not ported.
[target.avrogencpp]
type = "executable"
sources = ["lang/c++/impl/avrogencpp.cc"]
defines = ["AVRO_VERSION=\"1.12.2\""]
deps = ["avrocpp"]
cxx-standard = "c++17"

# The impl files include headers from include/avro by bare name, so that
# directory joins the package's own (private) include path, as upstream's CMake
# does.
[profile]
include-dirs = ["lang/c++/include/avro"]

# NOMINMAX as upstream's CMake defines it on Windows (FileStream.cc uses std::min).
[target.'cfg(os = "windows")'.profile]
defines = ["NOMINMAX"]
