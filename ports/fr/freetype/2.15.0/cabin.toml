[package.upstream]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.gz"
checksum = "sha256:9186627467a616d9a9e3e574748ac0c45fa77398e6364edef3041a8ba8d92f64"
format = "tar.gz"
strip-prefix = "freetype-2.15.0"
# The patch adds LICENSE.dlg, the BSL-1.0 text the dlg headers and source
# refer to ("See accompanying file LICENSE"): LICENSE at nyorain/dlg
# 395ccad2c1e0daae535c4d20bb0a3f2424648e17, upstream's dlg submodule
# commit, sha256
# c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566.
patches = ["patches/0001-add-the-dlg-boost-license.patch"]

[package]
name = "cabin-ports/freetype"
version = "2.15.0"
license = "(FTL OR GPL-2.0-or-later) AND BSD-3-Clause AND BSL-1.0 AND MIT AND MIT-Modern-Variant AND MIT-open-group AND Zlib AND bcrypt-Solar-Designer"
# LICENSE.TXT offers the FreeType License (docs/FTL.TXT) or the GPLv2
# (docs/GPLv2.TXT).
include = [
  "LICENSE.TXT",
  "LICENSE.dlg",
  "builds/unix/ftsystem.c",
  "builds/windows/ftdebug.c",
  "builds/windows/ftsystem.c",
  "docs/FTL.TXT",
  "docs/GPLv2.TXT",
  "include",
  "patches",
  "src",
]

# The optional backends upstream's CMake build enables when it finds the
# library, as vcpkg's and ConanCenter's default builds do: the system zlib
# instead of the bundled copy, bzip2, libpng for PNG color glyphs, and
# brotli for WOFF2.  Cabin cannot gate a target's dependency on a feature,
# so they are always on.  Run-time HarfBuzz loading is kept on Linux only
# (see the last profile table); Apple's HVF library is not ported, so HVF
# stays off.
[dependencies]
"cabin-ports/brotli" = "^1.2"
"cabin-ports/bzip2" = "^1.0.8"
"cabin-ports/libpng" = "^1.6"
"cabin-ports/zlib" = "^1.3"

# libfreetype as upstream's CMake build compiles it, plus the platform's
# ftsystem.c and ftdebug.c.  The backends above are selected with defines;
# only library sources test them, so consumers' ftoption.h keeps them
# unset, unlike the configured copy CMake installs.  -fvisibility=hidden is
# not reproduced (Cabin drops a dependency's raw compiler flags), so a
# shared object linking this archive also exports FreeType's internal
# symbols.  include/ also holds the private freetype/internal headers,
# which upstream does not install; their prefix keeps them from shadowing
# any other header.
[target.freetype]
type = "library"
sources = [
  "src/autofit/autofit.c",
  "src/base/ftbase.c",
  "src/base/ftbbox.c",
  "src/base/ftbdf.c",
  "src/base/ftbitmap.c",
  "src/base/ftcid.c",
  "src/base/ftfstype.c",
  "src/base/ftgasp.c",
  "src/base/ftglyph.c",
  "src/base/ftgxval.c",
  "src/base/ftinit.c",
  "src/base/ftmm.c",
  "src/base/ftotval.c",
  "src/base/ftpatent.c",
  "src/base/ftpfr.c",
  "src/base/ftstroke.c",
  "src/base/ftsynth.c",
  "src/base/fttype1.c",
  "src/base/ftwinfnt.c",
  "src/bdf/bdf.c",
  "src/bzip2/ftbzip2.c",
  "src/cache/ftcache.c",
  "src/cff/cff.c",
  "src/cid/type1cid.c",
  "src/gzip/ftgzip.c",
  "src/hvf/hvf.c",
  "src/lzw/ftlzw.c",
  "src/pcf/pcf.c",
  "src/pfr/pfr.c",
  "src/psaux/psaux.c",
  "src/pshinter/pshinter.c",
  "src/psnames/psnames.c",
  "src/raster/raster.c",
  "src/sdf/sdf.c",
  "src/sfnt/sfnt.c",
  "src/smooth/smooth.c",
  "src/svg/svg.c",
  "src/truetype/truetype.c",
  "src/type1/type1.c",
  "src/type42/type42.c",
  "src/winfonts/winfnt.c",
]
include-dirs = ["include"]
defines = [
  "FT2_BUILD_LIBRARY",
  "FT_CONFIG_OPTION_SYSTEM_ZLIB",
  "FT_CONFIG_OPTION_USE_BROTLI",
  "FT_CONFIG_OPTION_USE_BZIP2",
  "FT_CONFIG_OPTION_USE_PNG",
]
c-standard = "c11"
# integer-types.h tests an ULL literal, a C99 and C++11 token.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "freetype"
deps = [
  "cabin-ports/brotli:brotlidec",
  "cabin-ports/bzip2",
  "cabin-ports/libpng",
  "cabin-ports/zlib",
]

[target.'cfg(family = "unix")'.sources]
freetype = ["builds/unix/ftsystem.c", "src/base/ftdebug.c"]

[target.'cfg(os = "windows")'.sources]
freetype = ["builds/windows/ftsystem.c", "builds/windows/ftdebug.c"]

[target.'cfg(not(any(family = "unix", os = "windows")))'.sources]
freetype = ["src/base/ftsystem.c", "src/base/ftdebug.c"]

# CMake's configured ftconfig.h differs from the stock one only in defining
# these two for builds/unix/ftsystem.c and src/gzip.
[target.'cfg(family = "unix")'.profile]
defines = ["HAVE_FCNTL_H=1", "HAVE_UNISTD_H=1"]

# Run-time HarfBuzz loading improves auto-hinting when libharfbuzz is
# installed and falls back without it.  ft-hb.c loads it by bare file name:
# Linux's dlopen searches only the library path, but Windows' LoadLibraryA
# and macOS's dlopen also search the current directory, so a planted
# library would run there; vcpkg and ConanCenter disable HarfBuzz
# everywhere.  libdl is for glibc before 2.34.
[target.'cfg(os = "linux")'.profile]
defines = [
  "FT_CONFIG_OPTION_USE_HARFBUZZ",
  "FT_CONFIG_OPTION_USE_HARFBUZZ_DYNAMIC",
]
link-libs = ["dl"]
