[package.upstream]
url = "https://github.com/7bitCoder/7bitConf/archive/refs/tags/v1.2.0.tar.gz"
checksum = "sha256:c2cc19618dc6616e463dbd7cc72da1fdd5b6df1b4f5d4bf8317455658ac63f0e"
format = "tar.gz"
strip-prefix = "7bitConf-1.2.0"

# ConanCenter's name; upstream spells it 7bitConf, and vcpkg has no port.
[package]
name = "cabin-ports/7bitconf"
version = "1.2.0"
license = "MIT"
include = ["LICENSE", "README.md", "Include", "Source"]

[dependencies]
"cabin-ports/taocpp-json" = "=1.0.0-beta.14"

# C++17 is upstream's floor (README.md:66).  Not ported: upstream's Shared
# and HeaderOnly library types; this is its default Static build.
# Consumers include <SevenBit/Conf.hpp>.
[target.7bitconf]
type = "library"
sources = ["Source/Source.cpp"]
include-dirs = ["Include"]
# Upstream's Static build regenerates CmakeDef.hpp with _7BIT_CONF_STATIC_LIB
# (Cmake/Setup.cmake:77-80).  The shipped CmakeDef.hpp selects header-only
# mode, and LibraryConfig.hpp lets a predefined _7BIT_CONF_STATIC_LIB override
# it.  Consumers need the define too, or they compile inline copies of what
# Source.cpp defines.
defines = ["_7BIT_CONF_STATIC_LIB"]
interface-defines = ["_7BIT_CONF_STATIC_LIB"]
cxx-standard = "c++17"
interface-cxx-standard = "c++17"
links = "7bitConf"
deps = [{ name = "cabin-ports/taocpp-json:json", public = true }]
