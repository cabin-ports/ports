[package.upstream]
url = "https://github.com/j-jorge/tweenerspp/archive/refs/tags/v1.1.tar.gz"
checksum = "sha256:b3c111b05c5e480993238ed794cc524521bb2d4889e59c49a99b714fff566623"
format = "tar.gz"
strip-prefix = "tweenerspp-1.1"

[package]
name = "cabin-ports/tweenerspp"
version = "1.1.0"
license = "Apache-2.0"
include = ["LICENSE", "README.md", "include"]

# C++11 is the standard cmake/CMakeLists.txt:7 sets.
[target.tweenerspp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
# detail/easing.tpp uses M_PI, which MSVC declares only under
# _USE_MATH_DEFINES (measured: check-windows, "'M_PI': undeclared identifier").
interface-defines = ["_USE_MATH_DEFINES"]
