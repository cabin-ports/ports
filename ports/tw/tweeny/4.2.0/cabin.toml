[package.upstream]
url = "https://github.com/mobius3/tweeny/archive/refs/tags/v4.2.0.tar.gz"
checksum = "sha256:b3dd2133eb7900d5fa6067b92c2a5e6e4fe853d89d4386af2b3e19ad51b4c82e"
format = "tar.gz"
strip-prefix = "tweeny-4.2.0"
# Patch 0001 writes struct before event::keyframeEnter and event::keyframeLeave
# in tween.tcc, where same-named variables hide the types from MSVC
# (check-windows job 134638583019, error C3544).
patches = ["patches/0001-elaborate-keyframe-event-types.patch"]

[package]
name = "cabin-ports/tweeny"
# vcpkg and ConanCenter still pin the 3.x API; 4.x changes it, and 3.x code must
# migrate (src/doc/v3_to_v4.dox).
version = "4.2.0"
license = "MIT"
include = ["LICENSE", "README.md", "CHANGELOG.md", "include", "patches"]

# C++17 is upstream's floor (README.md).
# GCC with -fno-exceptions rejects every includer of tweeny.h, because
# easing::byName throws (measured with GCC 16; Apple clang accepts it).
[target.tweeny]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
