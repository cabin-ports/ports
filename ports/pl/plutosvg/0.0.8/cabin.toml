[package.upstream]
url = "https://github.com/sammycage/plutosvg/archive/refs/tags/v0.0.8.tar.gz"
checksum = "sha256:49d5cfe772d3aa10cd4879f2f6e189f5083c08e4c8ea01bf3d5b87c97dfca7d2"
format = "tar.gz"
strip-prefix = "plutosvg-0.0.8"

[package]
name = "cabin-ports/plutosvg"
version = "0.0.8"
license = "MIT"
include = ["LICENSE", "source"]
# Upstream's CMake and Meson builds use C99; C11 is the oldest standard
# Cabin can lower for MSVC.  plutosvg.h needs C99 (<stdbool.h>), and C++
# consumers need C++11, as for plutovg.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# Upstream asks for plutovg 1.0.0 or later (CMakeLists.txt:10,
# meson.build); the archive's plutovg/ submodule directory is empty.
[dependencies]
"cabin-ports/plutovg" = "^1.3"

# The static library form of upstream's CMake and Meson builds, from
# source/plutosvg.c, with source/ public (consumers include
# <plutosvg.h>) and plutovg a public dependency, as plutosvg.h includes
# plutovg.h.  Not ported: the PLUTOSVG_ENABLE_FREETYPE option (off by
# default in CMake and vcpkg), which would add the public
# PLUTOSVG_HAS_FREETYPE definition and a FreeType dependency for every
# consumer; without it plutosvg_ft_svg_hooks() returns NULL.
# plutosvg-ft.h still ships, as upstream installs it: it defines
# plutosvg_ft_hooks in the file that includes it (README, "Integrating
# with FreeType"), for a consumer that depends on FreeType itself.  Also
# not ported: the shared library, hidden symbol visibility
# (C_VISIBILITY_PRESET), the pkg-config file and the examples.
[profile]
defines = ["PLUTOSVG_BUILD"]

# PLUTOSVG_BUILD_STATIC is public, as in CMakeLists.txt:52-54 and
# Meson's dependency: without it plutosvg.h declares the API dllimport
# for a Windows consumer, which then fails to link against this static
# library.
[target.plutosvg]
type = "library"
sources = ["source/plutosvg.c"]
include-dirs = ["source"]
defines = ["PLUTOSVG_BUILD_STATIC"]
interface-defines = ["PLUTOSVG_BUILD_STATIC"]
links = "plutosvg"
deps = [{ name = "cabin-ports/plutovg", public = true }]

# plutosvg.c calls the C math library, which upstream links when it
# finds libm; on glibc that is a separate library.
[target.'cfg(os = "linux")'.profile]
link-libs = ["m"]
