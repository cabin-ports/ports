[package.upstream]
url = "https://github.com/gulrak/filesystem/archive/refs/tags/v1.5.16.tar.gz"
checksum = "sha256:f4a098ed48e3b25b87b2be84cde58c884177af6b4ce27666ed2dbfe907b24418"
format = "tar.gz"
strip-prefix = "filesystem-1.5.16"

[package]
name = "cabin-ports/ghc-filesystem"
version = "1.5.16"
license = "MIT"
include = ["LICENSE", "include"]

# The target's one interface option, /utf-8 for MSVC, is a flag Cabin
# already passes to every cl compile.  The fs_std*.hpp headers select
# std::filesystem when available; toolchains that keep it in a separate
# library (stdc++fs, c++fs) then need that linked, which this port does not
# do.  On Windows, used header-only, filesystem.hpp includes <windows.h>,
# <shellapi.h> and <winioctl.h> in every translation unit that includes it,
# without WIN32_LEAN_AND_MEAN or NOMINMAX.
[target.ghc_filesystem]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"

# u8arguments calls CommandLineToArgvW, which shell32 exports; upstream's
# CMake and MinGW builds get it from their default link libraries.
[target.'cfg(os = "windows")'.profile]
link-libs = ["shell32"]
