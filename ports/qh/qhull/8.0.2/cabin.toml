[package.upstream]
url = "https://github.com/qhull/qhull/archive/refs/tags/v8.0.2.tar.gz"
checksum = "sha256:8774e9a12c70b0180b95d6b0b563c5aa4bea8d5960c15e18ae3b6d2521d64f8b"
format = "tar.gz"
strip-prefix = "qhull-8.0.2"
# Modification notice, as COPYING.txt's conditions 3 and 4 require: on
# 2026-11-06 Ken Matsui (cabin-ports) modified Qhull 8.0.2 with patch
# 0001, which is upstream's own fix for compiling libqhullcpp's headers
# as C++20, applied unchanged: the diff of qhull commit
# ace32688cefca365b15d94d844106440a018c2ae, the merge of Jeremy Nimmer's
# "Fix build errors when in C++20 mode"
# (https://github.com/qhull/qhull/pull/122, 2022-12-03).  In
# src/libqhullcpp/QhullLinkedList.h and QhullSet.h it names the class
# templates by their injected class names in constructors, destructors
# and operator parameters, since C++20 forbids a template-id as a
# constructor or destructor name (CWG 2237).  Its QhullSet.h index line
# names that file after a later typo fix, which touches no line the
# hunks match.  The original Qhull source can be obtained from
# http://www.qhull.org and https://github.com/qhull/qhull.
patches = ["patches/0001-fix-build-errors-when-in-cxx20-mode.patch"]

[package]
name = "cabin-ports/qhull"
version = "8.0.2"
# COPYING.txt is Qhull's license, which every copy must carry.
include = [
  "COPYING.txt",
  "patches",
  "src/libqhull_r",
  "src/libqhullcpp",
]

# Upstream's default static build (CMakeLists.txt): qhullstatic_r, the
# reentrant C library (:233-251, 447-455), and qhullcpp, its C++
# interface (:301-323, 464-468), which upstream builds only as a static
# library.  Consumers include <libqhull_r/...> and <libqhullcpp/...>
# from src/, as upstream's own build does (include_directories, :336);
# its install tree has the same headers under include/.  Not ported: the
# deprecated non-reentrant libqhull (qhullstatic, and the qhull and
# qhull_p shared libraries; src/libqhull/DEPRECATED.txt), which defines
# the same C symbols as libqhull_r, so one program cannot link both; the
# shared qhull_r; the programs (qhull, rbox, qconvex, qdelaunay, qhalf,
# qvoronoi), the user_eg examples and the tests; and RoadTest.h, which
# upstream installs with the C++ headers but which needs Qt Test.  Not
# reproduced: qhullcpp's position-independent code (:464-468; Cabin
# drops a dependency's raw compiler flags), so its archive is not built
# for linking into a shared object.
[target.qhull_r]
type = "library"
sources = [
  "src/libqhull_r/global_r.c",
  "src/libqhull_r/stat_r.c",
  "src/libqhull_r/geom2_r.c",
  "src/libqhull_r/poly2_r.c",
  "src/libqhull_r/merge_r.c",
  "src/libqhull_r/libqhull_r.c",
  "src/libqhull_r/geom_r.c",
  "src/libqhull_r/poly_r.c",
  "src/libqhull_r/qset_r.c",
  "src/libqhull_r/mem_r.c",
  "src/libqhull_r/random_r.c",
  "src/libqhull_r/usermem_r.c",
  "src/libqhull_r/userprintf_r.c",
  "src/libqhull_r/io_r.c",
  "src/libqhull_r/user_r.c",
  "src/libqhull_r/rboxlib_r.c",
  "src/libqhull_r/userprintf_rbox_r.c",
]
include-dirs = ["src"]
links = "qhull_r"
# Upstream sets no standard; the code is C89 but for the long long
# below.  C11 is the oldest standard Cabin can lower for MSVC.
c-standard = "c11"
# The headers are C89 and declare their functions extern "C" for C++,
# except that on 64-bit Windows mem_r.h:91-95 makes ptr_intT a long
# long, which needs C99 and C++11.  They declare qh_version and
# qh_version2 outside that block (libqhull_r.h:53-54, 1107), so C++
# code built by MSVC, which decorates the names, cannot link them.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

[target.qhullcpp]
type = "library"
sources = [
  "src/libqhullcpp/Coordinates.cpp",
  "src/libqhullcpp/PointCoordinates.cpp",
  "src/libqhullcpp/Qhull.cpp",
  "src/libqhullcpp/QhullFacet.cpp",
  "src/libqhullcpp/QhullFacetList.cpp",
  "src/libqhullcpp/QhullFacetSet.cpp",
  "src/libqhullcpp/QhullHyperplane.cpp",
  "src/libqhullcpp/QhullPoint.cpp",
  "src/libqhullcpp/QhullPointSet.cpp",
  "src/libqhullcpp/QhullPoints.cpp",
  "src/libqhullcpp/QhullQh.cpp",
  "src/libqhullcpp/QhullRidge.cpp",
  "src/libqhullcpp/QhullSet.cpp",
  "src/libqhullcpp/QhullStat.cpp",
  "src/libqhullcpp/QhullUser.cpp",
  "src/libqhullcpp/QhullVertex.cpp",
  "src/libqhullcpp/QhullVertexSet.cpp",
  "src/libqhullcpp/RboxPoints.cpp",
  "src/libqhullcpp/RoadError.cpp",
  "src/libqhullcpp/RoadLogEvent.cpp",
]
include-dirs = ["src"]
links = "qhullcpp"
# The C++ headers include libqhull_r's (QhullQh.h:12).  QhullUser.cpp
# and RboxPoints.cpp also define qh_fprintf and qh_fprintf_rbox, which
# replace libqhull_r's userprintf_r.c and userprintf_rbox_r.c in a
# program that links them; that relies on qhullcpp linking before
# qhull_r (CMakeLists.txt:621-622), the order Cabin links a dependent
# and its dependency in.  Such a program runs qhull only through the
# C++ classes: that qh_fprintf stops any other qhT (QH10025,
# QhullUser.cpp:153-157).
deps = [{ name = "qhull_r", public = true }]
# Upstream sets no standard, leaving the compiler's default: C++17 for
# GCC 11 to 15 and Clang 16 and later.
cxx-standard = "c++17"
# The headers need C++11 for long long (RoadLogEvent.h:33,
# RoadError.h:57, QhullError.h:48) and, with patch 0001, compile up to
# C++26: GCC and Clang still accept their throw() specifications (e.g.
# Qhull.h:57), which C++20 removed.
interface-cxx-standard = "c++11"

# libm, which upstream links into the C library on Unix
# (CMakeLists.txt:452-455).
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
