patches = ["patches/0001-fill-in-config-hpp.patch"]

# CMake generates Config.hpp from Config.hpp.inl; patch 0001 fills the copy
# with the values CMakeLists.txt defaults its options to.
[[package.upstream.copy]]
from = "include/anax/Config.hpp.inl"
to = "include/anax/Config.hpp"

[package]
name = "cabin-ports/anax"
version = "2.1.0"
license = "MIT"
include = ["LICENSE", "include", "patches", "src"]

# Upstream's anax library, built static.  Not ported: the shared library that
# CMake's BUILD_SHARED_LIBS default builds, and the CMake options other than
# their defaults (Config.hpp takes those defaults, patch 0001).
[target.anax]
type = "library"
sources = [
  "src/anax/Entity.cpp",
  "src/anax/World.cpp",
  "src/anax/detail/BaseSystem.cpp",
  "src/anax/detail/EntityComponentStorage.cpp",
  "src/anax/detail/EntityIdPool.cpp",
  "src/anax/detail/Filter.cpp",
]
include-dirs = ["include"]
# Upstream compiles C++11 (CMakeLists.txt); C++14 is the oldest standard
# Cabin can request from MSVC.
# The maximum is C++17: include/anax/detail/Filter.hpp:51 names a parameter `requires`,
# a keyword in C++20, so a C++20 consumer fails (measured:
# clang 21 -std=c++20, "trailing requires clause can only be used when
# declaring a function").
cxx-standard = "c++14"
interface-cxx-standard = { min = "c++11", max = "c++17" }
links = "anax"
