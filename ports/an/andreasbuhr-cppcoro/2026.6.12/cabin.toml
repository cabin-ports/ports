[package.upstream]
url = "https://github.com/andreasbuhr/cppcoro/archive/8642e98596a92be30a2b061d3ed306d959d3214e.tar.gz"
checksum = "sha256:5c0454f39c5d7a3029dd383a2cc285d3002725d5028c7a044778bdf8b8c0c1f4"
format = "tar.gz"
strip-prefix = "cppcoro-8642e98596a92be30a2b061d3ed306d959d3214e"

# Upstream has no tags or releases; 2026.6.12 is the commit date of 8642e985.
[package]
name = "cabin-ports/andreasbuhr-cppcoro"
version = "2026.6.12"
# lib/spin_wait.cpp:48 credits .NET System.SpinWait for its spin strategy; its copyright significance is uncertain.
license = "MIT"
include = ["LICENSE.txt", "include", "lib"]

# C++20 is upstream's default (CMakeLists.txt:4-6).
[target.cppcoro]
type = "library"
sources = [
  "lib/async_auto_reset_event.cpp",
  "lib/async_manual_reset_event.cpp",
  "lib/async_mutex.cpp",
  "lib/auto_reset_event.cpp",
  "lib/cancellation_registration.cpp",
  "lib/cancellation_source.cpp",
  "lib/cancellation_state.cpp",
  "lib/cancellation_token.cpp",
  "lib/ip_address.cpp",
  "lib/ip_endpoint.cpp",
  "lib/ipv4_address.cpp",
  "lib/ipv4_endpoint.cpp",
  "lib/ipv6_address.cpp",
  "lib/ipv6_endpoint.cpp",
  "lib/lightweight_manual_reset_event.cpp",
  "lib/spin_mutex.cpp",
  "lib/spin_wait.cpp",
  "lib/static_thread_pool.cpp",
]
include-dirs = ["include"]
cxx-standard = "c++20"
interface-cxx-standard = "c++20"
links = "cppcoro"

# The I/O layer (io_service, files, sockets) is built on Windows and Linux
# only, as upstream's lib/CMakeLists.txt does; elsewhere, macOS included, the
# package has no I/O layer.
[target.'cfg(os = "windows")'.sources]
cppcoro = [
  "lib/file.cpp",
  "lib/file_read_operation.cpp",
  "lib/file_write_operation.cpp",
  "lib/io_service.cpp",
  "lib/read_only_file.cpp",
  "lib/read_write_file.cpp",
  "lib/readable_file.cpp",
  "lib/socket.cpp",
  "lib/socket_accept_operation.cpp",
  "lib/socket_connect_operation.cpp",
  "lib/socket_disconnect_operation.cpp",
  "lib/socket_helpers.cpp",
  "lib/socket_recv_from_operation.cpp",
  "lib/socket_recv_operation.cpp",
  "lib/socket_send_operation.cpp",
  "lib/socket_send_to_operation.cpp",
  "lib/win32.cpp",
  "lib/write_only_file.cpp",
  "lib/writable_file.cpp",
]

[target.'cfg(os = "linux")'.sources]
cppcoro = [
  "lib/file.cpp",
  "lib/file_read_operation.cpp",
  "lib/file_write_operation.cpp",
  "lib/io_service.cpp",
  "lib/linux.cpp",
  "lib/read_only_file.cpp",
  "lib/read_write_file.cpp",
  "lib/readable_file.cpp",
  "lib/socket.cpp",
  "lib/socket_accept_operation.cpp",
  "lib/socket_connect_operation.cpp",
  "lib/socket_disconnect_operation.cpp",
  "lib/socket_helpers.cpp",
  "lib/socket_recv_from_operation.cpp",
  "lib/socket_recv_operation.cpp",
  "lib/socket_send_operation.cpp",
  "lib/socket_send_to_operation.cpp",
  "lib/write_only_file.cpp",
  "lib/writable_file.cpp",
]

[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32", "mswsock", "synchronization"]

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
