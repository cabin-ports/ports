[package.upstream]
url = "https://github.com/jll63/yomm2/archive/refs/tags/v1.6.0.tar.gz"
checksum = "sha256:5d617704755637b863a90129d09b8c3a1d3a06e3be809693c07575e0289cb508"
format = "tar.gz"
strip-prefix = "yomm2-1.6.0"

[package]
name = "cabin-ports/yomm2"
version = "1.6.0"
license = "BSL-1.0"
include = ["LICENSE", "README.md", "include"]

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-dynamic-bitset" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"

# Upstream is archived and superseded by Boost.OpenMethod (cabin-ports/boost-openmethod),
# which has a different API.  The shared-library mode (YOMM2_SHARED, src/yomm2.cpp) is not
# ported; the package is upstream's default header-only build.
[target.yomm2]
type = "header-only"
include-dirs = ["include"]
# README.md:10 and src/CMakeLists.txt:40 (cxx_std_17).
interface-cxx-standard = "c++17"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-dynamic-bitset", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
]
