[package.upstream]
url = "https://github.com/Reputeless/EnumBitmask/archive/refs/tags/v1.0.tar.gz"
checksum = "sha256:233efdefa4d0cfc8d8664ab7326db29835cc874b0af4926a7d93a184b250013d"
format = "tar.gz"
strip-prefix = "EnumBitmask-1.0"

[package]
name = "cabin-ports/enumbitmask"
version = "1.0.0"
license = "CC0-1.0"
include = ["EnumBitmask.hpp", "LICENSE", "README.md"]

# Upstream states no standard; C++17 is the measured floor (c++14 fails: "use of class
# template EnumWrapper requires template arguments").
[target.enumbitmask]
type = "header-only"
include-dirs = ["."]
interface-cxx-standard = "c++17"
