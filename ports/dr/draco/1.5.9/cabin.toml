  "src/draco/io/file_writer_utils.cc",
  "src/draco/io/mesh_io.cc",
  "src/draco/io/obj_decoder.cc",
  "src/draco/io/obj_encoder.cc",
  "src/draco/io/parser_utils.cc",
  "src/draco/io/ply_decoder.cc",
  "src/draco/io/ply_encoder.cc",
  "src/draco/io/ply_reader.cc",
  "src/draco/io/point_cloud_io.cc",
  "src/draco/io/stdio_file_reader.cc",
  "src/draco/io/stdio_file_writer.cc",
  "src/draco/io/stl_decoder.cc",
  "src/draco/io/stl_encoder.cc",
  "src/draco/mesh/corner_table.cc",
  "src/draco/mesh/mesh.cc",
