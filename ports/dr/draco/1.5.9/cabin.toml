include-dirs = ["src"]
# Upstream requires C++11 (cxx_std_11, cmake/draco_targets.cmake:298-302);
# C++14 is the oldest standard Cabin can request from MSVC.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
links = "draco"

# cmake/draco_build_definitions.cmake:91-92: the CRT deprecation
# silencer, and NOMINMAX for core/cycle_timer.h's <windows.h>.
[target.'cfg(os = "windows")'.profile]
defines = ["_CRT_SECURE_NO_DEPRECATE=1", "NOMINMAX=1"]

# cmake/draco_build_definitions.cmake:99-104: large-file support on
# 64-bit targets except under MSVC, which io/stdio_file_reader.cc's file
# size query reads (ftello under _FILE_OFFSET_BITS == 64).
[target.'cfg(all(not(any(cxx = "msvc", cxx = "clang-cl")), any(arch = "x86_64", arch = "aarch64", arch = "powerpc64", arch = "riscv64", arch = "s390x", arch = "loongarch64", arch = "mips64", arch = "sparc64")))'.profile]
defines = ["_LARGEFILE_SOURCE", "_FILE_OFFSET_BITS=64"]
