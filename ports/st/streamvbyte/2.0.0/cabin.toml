[package.upstream]
url = "https://github.com/fast-pack/streamvbyte/archive/refs/tags/v2.0.0.tar.gz"
checksum = "sha256:51ca1c3b02648ea4b965d65b0e586891981f2e8184b056520e38ad70bcc43dd8"
format = "tar.gz"
strip-prefix = "streamvbyte-2.0.0"

[package]
name = "cabin-ports/streamvbyte"
version = "2.0.0"
license = "Apache-2.0 AND BSD-3-Clause"
# src/ ships whole: the encoders and decoders #include their x64 and ARM
# kernels (src/*_x64_*.c, src/streamvbyte_arm_*.c) and the shuffle
# tables from it.  AUTHORS is upstream's list of copyright holders.
include = ["AUTHORS", "LICENSE", "include", "src"]

# Upstream's static streamvbyte library.  src/streamvbytedelta.c is not one
# of upstream's sources and is not built.
#
# On x86-64 the library picks its SSE4.1 kernels at run time, so it needs no
# ISA flags.  The NEON kernels build only where the compiler itself defines
# __ARM_NEON__, as Apple Clang does on arm64; GCC and Clang on aarch64 Linux
# compile the scalar kernels (same output, slower), as upstream's CMake
# build effectively does.  Windows on arm64 does not build: under _MSC_VER
# the library includes x86-only intrinsics headers.  Big-endian targets are
# not supported upstream.
#
# Not reproduced: position-independent code (Cabin drops a dependency's raw
# compiler flags), so the archive is not built for linking into a shared
# object.
[target.streamvbyte]
type = "library"
sources = [
  "src/streamvbyte_encode.c",
  "src/streamvbyte_decode.c",
  "src/streamvbyte_zigzag.c",
  "src/streamvbytedelta_encode.c",
  "src/streamvbytedelta_decode.c",
  "src/streamvbyte_0124_encode.c",
  "src/streamvbyte_0124_decode.c",
]
include-dirs = ["include"]
# Upstream requires C99; Cabin rejects C99 and GNU dialects on MSVC, so the
# library builds as strict C11 everywhere.
c-standard = "c11"
# The public headers include <stdbool.h> and <stdint.h>: C99 / C++11.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "streamvbyte"

# As upstream's MSVC build.  Only the library's own sources spell
# __restrict__; the public headers do not.
[target.'cfg(any(cc = "msvc", cc = "clang-cl"))'.profile]
defines = ["__restrict__=__restrict"]
