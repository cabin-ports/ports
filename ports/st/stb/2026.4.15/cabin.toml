[package.upstream]
url = "https://github.com/nothings/stb/archive/31c1ad37456438565541f4919958214b6e762fb4.tar.gz"
checksum = "sha256:e4e3bba9c572a4a4148373a914d88ea0f0d11de8cc2c66739926e7eca0223319"
format = "tar.gz"
strip-prefix = "stb-31c1ad37456438565541f4919958214b6e762fb4"
# deprecated/stb.h's stb_hash_fast and stb_hash_number (:3511-3569) are Paul
# Hsieh's SuperFastHash, with his comments, and the release ships none of
# his terms.  Of those he offers for the code
# (http://www.azillionmonkeys.com/qed/hash.html), the package takes his
# old-style BSD license, which requires its notice with every source copy.
# The patch adds it as LICENSE.superfasthash, verbatim from Chromium's
# base/third_party/superfasthash/LICENSE at e30e2947 (SHA-256
# 90b2201c...7ae8), word for word the text at
# http://www.azillionmonkeys.com/qed/license-oldbsd.html.
patches = ["patches/0001-add-old-bsd-license-for-superfasthash-code.patch"]
[package]
name = "cabin-ports/stb"
version = "2026.4.15"
# The libraries are MIT or public domain (the Unlicense), at the user's
# choice (LICENSE).  stb_herringbone_wang_tile.h carries its own grant
# instead (:4-8), named LicenseRef-stbhw; LicenseRef-Paul-Hsieh-OLD-BSD is
# the SuperFastHash license above.
license = "(MIT OR Unlicense) AND LicenseRef-stbhw AND LicenseRef-Paul-Hsieh-OLD-BSD"
# The libraries, deprecated/ (still part of the API: stb_image_resize2.h
# points to its stb_image_resize.h) and the licenses.  tests/ and data/
# hold files that no grant covers (a packed Windows binary, renders of
# commercial fonts, an Atari font image); the docs, tools and CI files
# are not needed.
include = [
  "LICENSE",
  "LICENSE.superfasthash",
  "README.md",
  "deprecated",
  "patches",
  "stb_c_lexer.h",
  "stb_connected_components.h",
  "stb_divide.h",
  "stb_ds.h",
  "stb_dxt.h",
  "stb_easy_font.h",
  "stb_herringbone_wang_tile.h",
  "stb_hexwave.h",
  "stb_image.h",
  "stb_image_resize2.h",
  "stb_image_write.h",
  "stb_include.h",
  "stb_leakcheck.h",
  "stb_perlin.h",
  "stb_rect_pack.h",
  "stb_sprintf.h",
  "stb_textedit.h",
  "stb_tilemap_editor.h",
  "stb_truetype.h",
  "stb_vorbis.c",
  "stb_voxel_render.h",
]

# The stb libraries are single-file headers designed around the
# implementation-macro pattern: exactly one consumer translation
# unit defines STB_<NAME>_IMPLEMENTATION before the include and
# receives the function bodies; every other TU gets declarations
# only. A header-only target with the archive root on the include
# path is therefore the whole port - there is nothing to compile
# here, and which headers (and which implementation TUs) to use is
# entirely the consumer's choice.
[target.stb]
type = "header-only"
include-dirs = ["."]
# Header-only targets must declare an interface standard; upstream
# is portable ANSI C, so c89 is the floor and no consumer's own
# C standard can fall below it.
interface-c-standard = "c89"

# Several stb implementations call libm routines from the consumer
# TU that hosts them (stb_truetype's floor/ceil/sqrt/pow, stb_image's
# HDR pow/ldexp, stb_image_resize, stb_perlin, ...). On Unix that is
# a separate system library (required on glibc, a no-op on macOS
# where it lives in libSystem), so the port declares it as a
# propagating link-lib reaching every consumer's link line - the
# same policy as the libpng and sqlite3 ports. Windows has no libm.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
