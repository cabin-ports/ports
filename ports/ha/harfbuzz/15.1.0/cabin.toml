[package.upstream]
# GitHub's archive of the tag: Cabin takes tar.gz or zip, and the release
# asset is a tar.xz whose src/ and COPYING are byte-identical to this one's.
url = "https://github.com/harfbuzz/harfbuzz/archive/refs/tags/15.1.0.tar.gz"
checksum = "sha256:5c057929413b8664592fea67edea5c2c47b4ffb0bf5f4accb5164bc6acc69d94"
format = "tar.gz"
strip-prefix = "harfbuzz-15.1.0"
# meson configures and installs hb-features.h, which tells consumers the
# library's optional parts.  Patch 0001 adds it to src/ as meson writes it
# for this port: HB_HAS_FREETYPE is defined and every other HB_HAS_* is
# #undef, since this port does not build those parts.
# Patch 0002 adds LICENSE.unicode for src/hb-unicode-emoji-table.hh, whose
# quoted emoji-data.txt header points to unicode.org/terms_of_use.html;
# those terms put Unicode Data Files under the Unicode License V3:
# https://www.unicode.org/license.txt as fetched 2026-11-11 (sha256
# e7a93b009565cfce55919a381437ac4db883e9da2126fa28b91d12732bc53d96).
patches = [
  "patches/0001-add-the-generated-hb-features-h.patch",
  "patches/0002-add-the-unicode-license-for-the-emoji-table.patch",
]

[package]
name = "cabin-ports/harfbuzz"
version = "15.1.0"
license = "MIT-Modern-Variant AND MIT AND ISC AND Unicode-3.0"
# COPYING is the Old MIT license; src/ms-use/COPYING, hb-algs.hh's
# fasthash and hb-ucd.cc carry their own notices.  The list is src/
# without src/wasm/sample, whose test.ttf, a Roboto subset, states no
# licence; the samples are not built.
