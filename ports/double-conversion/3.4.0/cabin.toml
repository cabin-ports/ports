[package.upstream]
url = "https://github.com/google/double-conversion/archive/refs/tags/v3.4.0.tar.gz"
checksum = "sha256:42fd4d980ea86426e457b24bdfa835a6f5ad9517ddb01cdb42b99ab9c8dd5dc9"
format = "tar.gz"
strip-prefix = "double-conversion-3.4.0"

[package]
name = "cabin-ports/double-conversion"
version = "3.4.0"
include = ["LICENSE", "double-conversion"]

# The static library upstream's CMake builds by default: its eight
# sources, no defines, and the source root as the public include
# directory (consumers include <double-conversion/double-conversion.h>).
# Not ported: the shared library build.
[target.double-conversion]
type = "library"
sources = [
  "double-conversion/bignum.cc",
  "double-conversion/bignum-dtoa.cc",
  "double-conversion/cached-powers.cc",
  "double-conversion/double-to-string.cc",
  "double-conversion/fast-dtoa.cc",
  "double-conversion/fixed-dtoa.cc",
  "double-conversion/string-to-double.cc",
  "double-conversion/strtod.cc",
]
include-dirs = ["."]
# Upstream sets no standard and compiles with the compiler's default.
cxx-standard = "c++17"
# utils.h keeps nullptr and static_assert behind __cplusplus checks;
# the one other C++11 construct, a trailing enumerator comma
# (string-to-double.h), C++98 compilers accept as an extension.
interface-cxx-standard = "c++98"
links = "double-conversion"
