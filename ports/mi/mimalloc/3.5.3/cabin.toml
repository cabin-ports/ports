[package.upstream]
url = "https://github.com/microsoft/mimalloc/archive/refs/tags/v3.5.3.tar.gz"
checksum = "sha256:3b4a15153a59905995f7070296ed604bb5ccc00cabb8b93446931aff77224d47"
format = "tar.gz"
strip-prefix = "mimalloc-3.5.3"
# Built as C with GCC or Clang, src/alloc.c defines a weak
# std::get_new_handler() fallback that a static C++ runtime replaces.
# Upstream hides it with -fvisibility=hidden, a raw flag Cabin drops;
# without it an ELF executable exports the fallback to libstdc++, whose
# operator new then stops calling the program's new_handler.  The first
# patch gives the fallback hidden visibility in the source instead.  As with
# upstream's static library, the fallback still answers a program's own
# std::get_new_handler() calls with NULL when the C++ runtime is shared.
patches = [
  "patches/0001-hide-the-weak-get-new-handler-fallback.patch",
  "patches/0002-add-a-c++-translation-unit-for-msvc.patch",
]

[package]
name = "cabin-ports/mimalloc"
version = "3.5.3"
license = "MIT"
# bin/ holds prebuilt Windows redirection DLLs and minject, which only the
# shared library uses.
include = ["LICENSE", "include", "patches", "src"]
# Upstream compiles C11 and C++17; mimalloc.h needs C99, and its C++ part
# (mi_stl_allocator) C++11.
c-standard = "c11"
cxx-standard = "c++17"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# The static library of upstream's CMake build (mimalloc-static), from its
# mi_sources; several of them #include the others.
#
# With MSVC, upstream compiles those sources as C++ (MI_USE_CXX), so that
# atomic.h uses the C++ atomics rather than its deprecated MSVC C wrapper.
# Cabin picks a source's language by its extension, so the second patch adds
# src/static-cxx.cpp, which includes upstream's single-translation-unit
# src/static.c, and the MSVC environment (every compiler on a Windows host
# without --target; CMake does this for MSVC and clang-cl, not MinGW)
# compiles that instead of the C sources.
#
# Cabin's release profile defines NDEBUG, from which types.h derives the
# settings of CMake's Release build; the dev profile gets its debug
# defaults, and the dev overlay below adds the guarding and profiling of
# CMake's Debug build.
#
# Deviations from upstream's CMake defaults:
# - MI_OVERRIDE is off, as in vcpkg and Conan: on, the static library would
#   replace malloc, free, new and delete for every program that links it,
#   even through other packages, and only on some platforms.  A program
#   overrides explicitly, as readme.md ("Overriding Standard Malloc")
#   describes.
# - No compiler flags: MI_OPT_ARCH (on for arm64) would raise the CPU
#   baseline, and the others are raw flags, which Cabin drops for registry
#   packages.
# Also not ported: the shared library with its Windows redirection, the
# single-object mimalloc.o, and MI_SECURE and the other options that are
# off by default.
[target.mimalloc]
type = "library"
include-dirs = ["include"]
links = "mimalloc"

[target.'cfg(not(env = "msvc"))'.sources]
mimalloc = [
  "src/alloc.c",
  "src/alloc-aligned.c",
  "src/alloc-posix.c",
  "src/arena.c",
  "src/bitmap.c",
  "src/heap.c",
  "src/init.c",
  "src/libc.c",
  "src/options.c",
  "src/os.c",
  "src/page.c",
  "src/page-map.c",
  "src/prim/prim.c",
  "src/prim/prim-tls.c",
  "src/random.c",
  "src/sample-guarded.c",
  "src/sample-profile.c",
  "src/stats.c",
  "src/subproc.c",
  "src/theap.c",
  "src/threadlocal.c",
]

[target.'cfg(env = "msvc")'.sources]
mimalloc = ["src/static-cxx.cpp"]

[target.'cfg(any(family = "unix", family = "windows"))'.profile.dev]
defines = ["MI_GUARDED=2", "MI_PROFILE=2"]

# Upstream links pthread and, where it exists, rt (below); it also links
# libatomic where it exists, which mimalloc's word-sized atomics do not need
# on x86_64 or arm64.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

# Upstream compiles in CMake's default GNU dialect, under which glibc
# defines _DEFAULT_SOURCE; Cabin compiles strict -std=c11, so this keeps
# glibc's declarations the same as upstream's.
[target.'cfg(os = "linux")'.profile]
defines = ["_DEFAULT_SOURCE"]
link-libs = ["rt"]

[target.'cfg(os = "windows")'.profile]
link-libs = ["psapi", "shell32", "user32", "advapi32", "bcrypt"]
