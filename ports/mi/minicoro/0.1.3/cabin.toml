[package.upstream]
url = "https://github.com/edubart/minicoro/archive/refs/tags/v0.1.3.tar.gz"
checksum = "sha256:4f9d4c3b5f6473f8141ee45e9947a6e7e7ee6665b4d9a8c373c0602495c5f6c9"
format = "tar.gz"
strip-prefix = "minicoro-0.1.3"

[package]
name = "cabin-ports/minicoro"
version = "0.1.3"
# LICENSE and minicoro.h offer the Unlicense or MIT No Attribution; the
# assembly that minicoro.h:542-567 credits to LuaCoco by Mike Pall is MIT,
# with its notice in that comment.
license = "(Unlicense OR MIT-0) AND MIT"
include = ["LICENSE", "minicoro.h"]

# Header-only, as minicoro.h:94-101 describes: one translation unit defines
# MINICORO_IMPL before including <minicoro.h>.  Upstream builds it as C89
# (tests/Makefile), though the header goes beyond C89 and C++98 (a trailing
# enumerator comma in the API; in the implementation, mixed declarations and
# statements and casts between function and object pointers), which GCC and
# Clang accept in those modes without -pedantic; the API is extern "C" for C++.
# The context switch is chosen per platform (minicoro.h:329-356): assembly on
# x86-64 Windows, MSVC included, and with GCC or Clang on x86-64, i386, ARM
# EABI, AArch64 and RISC-V; Windows fibers on other Windows targets; Emscripten
# fibers or Binaryen Asyncify on WebAssembly; ucontext elsewhere, Cygwin
# included.  The implementing translation unit selects another backend
# (MCO_USE_ASM, MCO_USE_UCONTEXT, MCO_USE_FIBERS, MCO_USE_ASYNCIFY), allocator
# (MCO_MALLOC, MCO_FREE, MCO_NO_DEFAULT_ALLOCATORS), stack and storage sizes
# (MCO_DEFAULT_STACK_SIZE, MCO_MIN_STACK_SIZE, MCO_DEFAULT_STORAGE_SIZE) or
# MCO_NO_MULTITHREAD by defining those macros (minicoro.h:171-190).  Unless
# NDEBUG or MCO_NO_DEBUG is defined, the implementation asserts its invariants
# and prints each error it returns to stdout.
[target.minicoro]
type = "header-only"
include-dirs = ["."]
interface-c-standard = "c89"
interface-cxx-standard = "c++98"
