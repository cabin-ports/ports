[package]
name = "vendored"
version = "0.0.0"
cxx-standard = "c++14"

# A diamond: this package asks cpp-jwt for the openssl port's own build and
# requires the openssl port itself without that feature, so both sides get
# that one OpenSSL.  Windows refuses the port's own build (the openssl
# port's tests/vendored).
[target.'cfg(not(os = "windows"))'.dependencies]
"cabin-ports/cpp-jwt" = { version = "=1.5.1", features = ["vendored-openssl"] }
"cabin-ports/openssl" = "=4.1.0"

[target.vendored]
type = "executable"
sources = ["src/main.cc"]
deps = ["cabin-ports/cpp-jwt", "cabin-ports/openssl:crypto"]
