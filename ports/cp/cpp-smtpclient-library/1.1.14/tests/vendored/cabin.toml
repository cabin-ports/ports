[package]
name = "vendored"
version = "0.0.0"
cxx-standard = "c++14"

# A diamond: this package asks cpp-smtpclient-library for the openssl port's
# own build and requires the openssl port itself without that feature, so
# both sides get that one OpenSSL.  Windows refuses the port's own build (the
# openssl port's tests/vendored).
[target.'cfg(not(os = "windows"))'.dependencies]
"cabin-ports/cpp-smtpclient-library" = { version = "=1.1.14", features = ["vendored-openssl"] }
"cabin-ports/openssl" = "=4.1.0"

[target.vendored]
type = "executable"
sources = ["src/main.cc"]
deps = ["cabin-ports/cpp-smtpclient-library", "cabin-ports/openssl:crypto"]
