[package.upstream]
url = "https://github.com/Tencent/BqLog/archive/refs/tags/Release_2.8.3.tar.gz"
checksum = "sha256:63b2f801f417e4fd21abc891b0c8cb78542d3bb54b09dbeca812400e81f4cd32"
format = "tar.gz"
strip-prefix = "BqLog-Release_2.8.3"

# Upstream compiles src/bq_common/platform/mac_misc.mm on macOS; it is plain
# C++, and Cabin compiles no .mm source, so this places it under a .cpp name.
[[package.upstream.copy]]
from = "src/bq_common/platform/mac_misc.mm"
to = "src/bq_common/platform/mac_misc.cpp"

[package]
name = "cabin-ports/bqlog"
version = "2.8.3"
# src/bq_common/platform/no_lib_cpp_impl.cpp:118 credits Google's bionic for
# its __cxa_guard functions, and include/bq_common/types/type_traits.h:149
# credits MSVC's C++ library for is_function; their copyright significance is
# uncertain.
license = "Apache-2.0"
include = ["LICENSE.txt", "include", "src"]
# Upstream builds C++17 (src/CMakeLists.txt:68-74) and states C++11 and later
# for consumers (README.md:95); it states no C standard for its native C ABI,
# include/bq_log/misc/bq_log_c_api.h, which compiles as C89 when included as
# a system header, as Cabin includes it (measured).
cxx-standard = "c++17"
interface-cxx-standard = "c++11"
interface-c-standard = "c89"

# The sources reach their private headers by paths relative to src/, which
# upstream keeps off its consumers' include path.
[profile]
include-dirs = ["src"]

# Upstream's static library (BUILD_LIB_TYPE static_lib): every source under
# src/, each guarded by the platform or binding it serves.  Not reproduced,
# since Cabin drops a dependency's raw compiler flags: upstream's flags
# disabling exceptions and RTTI (src/CMakeLists.txt:80-85), and the hidden
# visibility and position-independent code (:76-79) it sets so that consumers
# can link the static library into a shared object.  Not ported: the shared
# library and Apple framework, the Java, Node-API, Python, Go and C# bindings,
# the C++20 module bq.log, the Unreal Engine adapter, the tools, and the iOS,
# HarmonyOS and console platform builds.
[target.BqLog]
type = "library"
sources = [
  "src/bq_common/encryption/chacha20.cpp",
  "src/bq_common/encryption/hkdf.cpp",
  "src/bq_common/encryption/random_bytes.cpp",
  "src/bq_common/encryption/rsa.cpp",
  "src/bq_common/encryption/sha256.cpp",
  "src/bq_common/global/common_vars.cpp",
  "src/bq_common/platform/android_misc.cpp",
  "src/bq_common/platform/console_misc.cpp",
  "src/bq_common/platform/io/memory_map_posix.cpp",
  "src/bq_common/platform/io/memory_map_win.cpp",
  "src/bq_common/platform/java_misc.cpp",
  "src/bq_common/platform/linux_misc.cpp",
  "src/bq_common/platform/napi_misc.cpp",
  "src/bq_common/platform/no_lib_cpp_impl.cpp",
  "src/bq_common/platform/ohos_misc.cpp",
  "src/bq_common/platform/platform_misc.cpp",
  "src/bq_common/platform/posix_misc.cpp",
  "src/bq_common/platform/python_misc.cpp",
  "src/bq_common/platform/simd.cpp",
  "src/bq_common/platform/thread/condition_variable_posix.cpp",
  "src/bq_common/platform/thread/condition_variable_win64.cpp",
  "src/bq_common/platform/thread/mutex_posix.cpp",
  "src/bq_common/platform/thread/mutex_win64.cpp",
  "src/bq_common/platform/thread/spin_lock.cpp",
  "src/bq_common/platform/thread/thread.cpp",
  "src/bq_common/platform/thread/thread_posix.cpp",
  "src/bq_common/platform/thread/thread_win64.cpp",
  "src/bq_common/platform/unix_misc.cpp",
  "src/bq_common/platform/win64_misc.cpp",
  "src/bq_common/utils/aligned_allocator.cpp",
  "src/bq_common/utils/file_manager.cpp",
  "src/bq_common/utils/property.cpp",
  "src/bq_common/utils/property_ex.cpp",
  "src/bq_common/utils/util.cpp",
  "src/bq_log/api/bq_log_api.cpp",
  "src/bq_log/api/bq_log_go.cpp",
  "src/bq_log/api/bq_log_jni_api.cpp",
  "src/bq_log/api/bq_log_napi.cpp",
  "src/bq_log/api/bq_log_python_api.cpp",
  "src/bq_log/global/log_vars.cpp",
  "src/bq_log/global/version.cpp",
  "src/bq_log/log/appender/appender_base.cpp",
  "src/bq_log/log/appender/appender_console.cpp",
  "src/bq_log/log/appender/appender_file_base.cpp",
  "src/bq_log/log/appender/appender_file_binary.cpp",
  "src/bq_log/log/appender/appender_file_compressed.cpp",
  "src/bq_log/log/appender/appender_file_text.cpp",
  "src/bq_log/log/decoder/appender_decoder_base.cpp",
  "src/bq_log/log/decoder/appender_decoder_compressed.cpp",
  "src/bq_log/log/decoder/appender_decoder_helper.cpp",
  "src/bq_log/log/decoder/appender_decoder_manager.cpp",
  "src/bq_log/log/layout.cpp",
  "src/bq_log/log/log_imp.cpp",
  "src/bq_log/log/log_level_bitmap.cpp",
  "src/bq_log/log/log_manager.cpp",
  "src/bq_log/log/log_record_reader.cpp",
  "src/bq_log/log/log_snapshot.cpp",
  "src/bq_log/log/log_types.cpp",
  "src/bq_log/log/log_worker.cpp",
  "src/bq_log/types/buffer/block_list.cpp",
  "src/bq_log/types/buffer/group_list.cpp",
  "src/bq_log/types/buffer/log_buffer.cpp",
  "src/bq_log/types/buffer/miso_ring_buffer.cpp",
  "src/bq_log/types/buffer/normal_buffer.cpp",
  "src/bq_log/types/buffer/oversize_buffer.cpp",
  "src/bq_log/types/buffer/siso_ring_buffer.cpp",
  "src/bq_log/types/meta/meta_registry.cpp",
  "src/bq_log/types/storage/instance_storage.cpp",
  "src/bq_log/types/storage/log_storage.cpp",
