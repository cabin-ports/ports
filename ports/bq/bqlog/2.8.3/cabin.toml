include-dirs = ["include"]
# Upstream's bq_require_large_file_support (CMake_utils.txt:154-156).
defines = ["_FILE_OFFSET_BITS=64"]
links = "BqLog"

[target.'cfg(os = "macos")'.sources]
BqLog = ["src/bq_common/platform/mac_misc.cpp"]

# Upstream's link libraries (src/CMakeLists.txt:335-348, 395-399): pthread,
# but log and android on Android; libexecinfo, for backtrace(), where it
# finds one on Unix systems other than Linux and Apple's; and dbghelp and
# bcrypt on Windows, which MSVC builds take from #pragma comment(lib) in
# src/bq_common/platform/win64_misc.cpp:24-25.
[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]

[target.'cfg(os = "android")'.profile]
link-libs = ["log", "android"]

[target.'cfg(any(os = "freebsd", os = "netbsd", os = "dragonfly"))'.profile]
link-libs = ["execinfo"]

[target.'cfg(os = "windows")'.profile]
link-libs = ["dbghelp", "bcrypt"]
