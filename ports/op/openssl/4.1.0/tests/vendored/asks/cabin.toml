[package]
name = "asks"
version = "0.0.0"
c-standard = "c99"

[dependencies]
"cabin-ports/openssl" = "=4.1.0"

# How a library lets those above it choose the port's own build.
[features]
vendored-openssl = ["cabin-ports/openssl/vendored"]

[target.asks]
type = "library"
sources = ["src/asks.c"]
include-dirs = ["include"]
deps = ["cabin-ports/openssl:crypto"]
