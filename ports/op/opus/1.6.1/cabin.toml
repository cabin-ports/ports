include-dirs = ["public", "public/opus"]
# config.h only defines PACKAGE_VERSION, so it is defined directly and
# HAVE_CONFIG_H is not.  The others are CMake's for its default options.
defines = [
  "OPUS_BUILD",
  "ENABLE_HARDENING",
  "DISABLE_DEBUG_FLOAT",
  "HAVE_LRINT",
  "HAVE_LRINTF",
  'PACKAGE_VERSION="1.6.1"',
]
# Upstream asks for C99; C11 is the oldest standard Cabin can request from
# MSVC.
c-standard = "c11"
# The public headers are C89: opus_types.h takes <stdint.h> only from C99
# on, and the API uses no 64-bit type.
interface-c-standard = "c89"
interface-cxx-standard = "c++98"
links = "opus"

# Sources include their siblings and "celt/x86/x86cpu.h"-style paths from
# the package root.
[profile]
include-dirs = ["include", ".", "celt", "silk", "silk/float"]

# Upstream's hardening flags (-fstack-protector-strong, _FORTIFY_SOURCE=2)
# are left to the toolchain's defaults: Cabin drops a registry package's raw
# compiler flags, so the stack protector cannot carry over, and a port does
# not impose a fortify level of its own over the toolchain's.

# Stack arrays: C99 variable-length arrays, or alloca() where the compiler
# has none.
[target.'cfg(not(env = "msvc"))'.profile]
defines = ["VAR_ARRAYS"]

[target.'cfg(env = "msvc")'.profile]
defines = ["USE_ALLOCA", "_CRT_SECURE_NO_WARNINGS"]

# Where <alloca.h> exists, and libm, which the codec's math calls.
[target.'cfg(family = "unix")'.profile]
defines = ["HAVE_ALLOCA_H"]
link-libs = ["m"]

# x86-64, as upstream's CMake build configures it: SSE and SSE2 are
# presumed, and the SSE4.1 kernels are chosen at run time by CPUID
# (CPU_INFO_BY_ASM; under MSVC, x86cpu.c uses __cpuid instead).  The AVX2
# kernels are not ported: they call FMA intrinsics, which Cabin cannot
# enable (vcpkg's default build leaves them out too), so AVX2 machines run
# the SSE4.1 kernels, except silk_NSQ_del_dec's, whose AVX2 entry is the C
# one.  32-bit x86 builds the portable C code, since Cabin cannot enable
# plain SSE for pitch_sse.c there.
[target.'cfg(arch = "x86_64")'.sources]
opus = [
  "celt/x86/x86cpu.c",
  "celt/x86/x86_celt_map.c",
  "silk/x86/x86_silk_map.c",
  "celt/x86/pitch_sse.c",
  "celt/x86/pitch_sse2.c",
  "celt/x86/vq_sse2.c",
  "celt/x86/celt_lpc_sse4_1.c",
  "celt/x86/pitch_sse4_1.c",
  "silk/x86/NSQ_sse4_1.c",
  "silk/x86/NSQ_del_dec_sse4_1.c",
  "silk/x86/VAD_sse4_1.c",
  "silk/x86/VQ_WMat_EC_sse4_1.c",
]

[target.opus.instruction-sets]
"celt/x86/pitch_sse2.c" = ["sse2"]
"celt/x86/vq_sse2.c" = ["sse2"]
"celt/x86/celt_lpc_sse4_1.c" = ["sse4.1"]
"celt/x86/pitch_sse4_1.c" = ["sse4.1"]
"silk/x86/NSQ_sse4_1.c" = ["sse4.1"]
"silk/x86/NSQ_del_dec_sse4_1.c" = ["sse4.1"]
"silk/x86/VAD_sse4_1.c" = ["sse4.1"]
"silk/x86/VQ_WMat_EC_sse4_1.c" = ["sse4.1"]

[target.'cfg(arch = "x86_64")'.profile]
defines = [
  "OPUS_HAVE_RTCD",
  "CPU_INFO_BY_ASM",
  "OPUS_X86_MAY_HAVE_SSE",
  "OPUS_X86_PRESUME_SSE",
  "OPUS_X86_MAY_HAVE_SSE2",
  "OPUS_X86_PRESUME_SSE2",
  "OPUS_X86_MAY_HAVE_SSE4_1",
]

# AArch64, where NEON is architectural: the NEON intrinsics kernels,
# presumed rather than detected, as upstream's CMake build does for aarch64
# and iOS and ConanCenter's recipe does for every armv8 target (on macOS
# arm64, upstream's CMake build presumes nothing and calls the C kernels).
# The kernels are called directly, so the run-time detection and the
# silk/fixed sources it needs are left out.  32-bit ARM builds the portable
# C code.
[target.'cfg(arch = "aarch64")'.sources]
opus = [
  "celt/arm/celt_neon_intr.c",
  "celt/arm/pitch_neon_intr.c",
  "silk/arm/biquad_alt_neon_intr.c",
  "silk/arm/LPC_inv_pred_gain_neon_intr.c",
  "silk/arm/NSQ_del_dec_neon_intr.c",
  "silk/arm/NSQ_neon.c",
]

[target.'cfg(arch = "aarch64")'.profile]
defines = [
  "OPUS_ARM_MAY_HAVE_NEON",
  "OPUS_ARM_MAY_HAVE_NEON_INTR",
  "OPUS_ARM_PRESUME_NEON",
  "OPUS_ARM_PRESUME_NEON_INTR",
]
