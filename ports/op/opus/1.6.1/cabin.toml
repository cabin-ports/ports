[package.upstream]
url = "https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz"
checksum = "sha256:6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1"
format = "tar.gz"
strip-prefix = "opus-1.6.1"

# The public headers in their installed layout, so consumers can write
# <opus.h> or <opus/opus.h>.  Upstream's include/ is not exported: it also
# holds opus_custom.h, whose API this build does not compile (CUSTOM_MODES).
[[package.upstream.copy]]
from = "include/opus.h"
to = "public/opus/opus.h"

[[package.upstream.copy]]
from = "include/opus_defines.h"
to = "public/opus/opus_defines.h"

[[package.upstream.copy]]
from = "include/opus_multistream.h"
to = "public/opus/opus_multistream.h"

[[package.upstream.copy]]
from = "include/opus_projection.h"
to = "public/opus/opus_projection.h"

[[package.upstream.copy]]
from = "include/opus_types.h"
to = "public/opus/opus_types.h"

[package]
name = "cabin-ports/opus"
version = "1.6.1"
license = "BSD-3-Clause AND BSD-2-Clause"
# BSD-3-Clause (COPYING).
include = ["COPYING", "celt", "include", "public", "silk", "src"]

# libopus as upstream's CMake build compiles it by default: the
# floating-point codec with the float API, without custom modes or the
# optional DNN features (deep PLC, DRED, OSCE), so dnn/ is not packaged.
# Not ported: the opus_demo, opus_compare and test programs.
