[package.upstream]
url = "https://github.com/TartanLlama/ranges/archive/b395fe32fec42c1f710e3c90a91b5bcab8d8b656.tar.gz"
checksum = "sha256:3e2fb61d704f16e7e9ea001a91034268b92738910688395dd6b4e48762e09b8e"
format = "tar.gz"
strip-prefix = "ranges-b395fe32fec42c1f710e3c90a91b5bcab8d8b656"
# Patch 0001 adds includes these headers lack (measured): predicates.hpp
# (<tuple>, <utility>), semiregular_box.hpp (<functional>), k_combinations.hpp
# (<cmath>) and chunk_by.hpp (<algorithm>) fail when included alone, and
# adjacent_transform.hpp lacks "functional/bind.hpp", so adjacent_transform<2>(f)
# fails at C++20.  Patch 0002 qualifies the eight unqualified bind_back calls:
# at C++23, ADL also finds std::bind_back for a std function object and the call
# is ambiguous (measured; CI builds at C++20, where it is not).
patches = [
  "patches/0001-include-missing-headers.patch",
  "patches/0002-qualify-bind-back.patch",
]

# CMake's, vcpkg's and ConanCenter's name.  Upstream has no tags or releases:
# b395fe32 (2024-12-09) is the newest commit, eight after 361dae81
# (2022-12-07), which vcpkg and ConanCenter pin.  0.1.0 is CMakeLists.txt's
# project VERSION, the same at both commits.
[package]
name = "cabin-ports/tl-ranges"
version = "0.1.0"
license = "CC0-1.0"
include = ["COPYING", "README.md", "include", "patches"]

# Consumers include <tl/enumerate.hpp>, <tl/chunk.hpp> and so on.
# Clang rejects tl/concat.hpp (prev_impl, concat.hpp:111-127); GCC accepts it,
# but decrementing a concat iterator does not compile.
# Subtracting two repeat_n iterators gives the wrong sign (cursor::distance_to,
# repeat_n.hpp:54); end - it and std::ranges::distance of the view are correct.
# k_combinations' distance_to (size_t i >= 0) indexes out of bounds; reached by
# std::ranges::size, distance and empty, empty(), it - it and nested tl::to.
# chunk_by_key does not compile with a key function that returns a reference,
# such as a data member pointer (key_type keeps the reference).
[target.tl-ranges]
type = "header-only"
include-dirs = ["include"]
# Inferred from the headers, which need C++20 concepts and <ranges> (at C++17,
# Clang: "tl/common.hpp:10:7: error: unknown type name 'concept'"); the
# interface target states no standard, and upstream builds its tests at C++20
# (C++23 with MSVC).
interface-cxx-standard = "c++20"
