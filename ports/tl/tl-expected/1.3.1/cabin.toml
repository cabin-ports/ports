[package.upstream]
url = "https://github.com/TartanLlama/expected/archive/refs/tags/v1.3.1.tar.gz"
checksum = "sha256:9a04f4f472fbb5c30bf60402f1ca626c4a76987f867978d0b8a35d7ab3fb8fe7"
format = "tar.gz"
strip-prefix = "expected-1.3.1"
# Stack Overflow code, listed under [package], ships without its terms;
# CC BY-SA 3.0's sections 4(a) and 4(b) require a copy of that licence or
# its URI with every copy.  The patch adds the licence text, verbatim from
# https://creativecommons.org/licenses/by-sa/3.0/legalcode.txt (SHA-256
# 3f941b3b...f72f), as LICENSE.CC-BY-SA-3.0.
patches = ["patches/0001-add-cc-by-sa-3.0-license-for-swappable-traits.patch"]

[package]
name = "cabin-ports/tl-expected"
version = "1.3.1"
# include/tl/expected.hpp:329-391 (namespace swap_adl_tests, is_swappable and
# is_nothrow_swappable) is modified from the answer to "What is a proper way
# to implement is_swappable to test for the Swappable concept?",
# https://stackoverflow.com/a/26852703 (revision 1, 2014), by orlp
# (https://stackoverflow.com/users/565635), CC BY-SA 3.0; that block is
# distributed under CC BY-SA 3.0 (LICENSE.CC-BY-SA-3.0), and the rest of the
# package stays under CC0-1.0 (COPYING).
license = "CC0-1.0 AND CC-BY-SA-3.0"
include = ["COPYING", "LICENSE.CC-BY-SA-3.0", "include", "patches"]

# TartanLlama's std::expected for C++11 and later, header-only, as
# upstream's CMake interface target tl::expected: include/ is the include
# root, so consumers write `#include <tl/expected.hpp>`.  The header
# supports C++11: CMakeLists.txt describes it as "C++11/14/17" and sets
# C++14 only as the default for its own tests, which upstream's CI also
# builds as C++11 (.github/workflows/cmake.yml).
# Not ported: expected.natvis, a Visual Studio debugger visualizer that
# upstream neither builds nor installs.
[target.tl-expected]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
