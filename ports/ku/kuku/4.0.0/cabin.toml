[package.upstream]
url = "https://github.com/microsoft/Kuku/archive/refs/tags/v4.0.0.tar.gz"
checksum = "sha256:1d108e821121f4584378f8b3a99394b51ccb9c0cfa4eac4f2bf79ac5bf174b21"
format = "tar.gz"
strip-prefix = "Kuku-4.0.0"

# The two vendored BLAKE2 headers upstream's CMake build copies to
# kuku/internal/ (src/kuku/CMakeLists.txt:11-14), where hash.h and the BLAKE2
# sources include them from.
[[package.upstream.copy]]
from = "third_party/blake2/blake2.h"
to = "src/kuku/internal/blake2.h"

[[package.upstream.copy]]
from = "third_party/blake2/blake2-impl.h"
to = "src/kuku/internal/blake2-impl.h"

[package]
name = "cabin-ports/kuku"
version = "4.0.0"
# MIT: LICENSE and the src/ headers.  third_party/blake2 is BLAKE2's reference
# code, offered under CC0, the OpenSSL license or Apache-2.0 at the user's
# option (its file headers); NOTICE records Microsoft's election of CC0.
license = "MIT AND (CC0-1.0 OR OpenSSL OR Apache-2.0)"
include = ["LICENSE", "NOTICE", "src/kuku/common.h", "src/kuku/kuku.h", "src/kuku/kuku.cpp", "src/kuku/locfunc.h", "src/kuku/internal", "third_party/blake2"]

# Not ported: the optional C export library (KUKU_BUILD_KUKU_C, off by
# default), the shared build, the tests, the examples and
# KUKU_ENABLE_HARDENING's compile and link flags.  The BLAKE2 sources are C99 and consumers reach blake2.h only
# through hash.h, so the C standard is c11 and the interface has none.  C++17
# is upstream's stated standard (CMakeLists.txt:247).
[target.kuku]
type = "library"
sources = ["src/kuku/kuku.cpp", "third_party/blake2/blake2b.c", "third_party/blake2/blake2xb.c"]
include-dirs = ["src"]
c-standard = "c11"
cxx-standard = "c++17"
interface-c-standard = "none"
interface-cxx-standard = "c++17"
links = "kuku"
