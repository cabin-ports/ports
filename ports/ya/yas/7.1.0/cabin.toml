[package.upstream]
url = "https://github.com/niXman/yas/archive/refs/tags/7.1.0.tar.gz"
checksum = "sha256:0317d4ec6fa507fe620d6281380822b6f0436d409a4e15be6add2e2e773b9d1f"
format = "tar.gz"
strip-prefix = "yas-7.1.0"
# include/yas/detail/io/binary_streams.hpp:94 calls std::abs without including
# <cstdlib>, which fails with "no member named 'abs' in namespace 'std'" on
# Clang 23's libc++ at every standard and on Apple Clang's at C++23; patch 0002
# includes it there.
patches = ["patches/0002-include-cstdlib.patch"]

# Upstream's, vcpkg's and ConanCenter's name.
[package]
name = "cabin-ports/yas"
version = "7.1.0"
# The headers carry the BSL-1.0 text, which also serves the Boost.Preprocessor
# code in include/yas/detail/preprocessor/.  MIT is for the RapidJSON and
# nlohmann/json code, BSD-3-Clause for the modp_b64 code.
# include/yas/detail/tools/utf8conv.hpp:50-52 credits two forum posts by
# Avanesov Tigran for its UTF-8 conversion; their copyright significance is
# uncertain.
license = "BSL-1.0 AND MIT AND BSD-3-Clause"
include = ["README.md", "include", "patches"]

# Consumers include <yas/serialize.hpp> and <yas/std_types.hpp>.  The Boost
# and Abseil type support stays opt-in through YAS_SERIALIZE_BOOST_TYPES and
# YAS_SERIALIZE_ABSL_TYPES, which need those libraries from the consumer.
# Below C++20, Clang's -Wpedantic flags each YAS_OBJECT and YAS_OBJECT_NVP
# use (-Wvariadic-macro-arguments-omitted).
[target.yas]
type = "header-only"
include-dirs = ["include"]
# README.md:11, "YAS require C++11 support".
interface-cxx-standard = "c++11"
