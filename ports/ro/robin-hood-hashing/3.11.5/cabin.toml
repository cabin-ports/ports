[package.upstream]
url = "https://github.com/martinus/robin-hood-hashing/archive/refs/tags/3.11.5.tar.gz"
checksum = "sha256:3693e44dda569e9a8b87ce8263f7477b23af448a3c3600c8ab9004fe79c20ad0"
format = "tar.gz"
strip-prefix = "robin-hood-hashing-3.11.5"
# robin_hood.h gets <cstdint> only transitively, which not every standard
# library provides; without it the bitness test picks the 32-bit branch,
# which then fails.  Patch 0001 adds just that include, as Conan Center and
# vcpkg do; upstream is archived and takes no fix.
# Third-party notices are in THIRD_PARTY_NOTICES (patch 0002).
patches = [
  "patches/0001-include-cstdint.patch",
  "patches/0002-add-third-party-notices.patch",
]

[package]
name = "cabin-ports/robin-hood-hashing"
version = "3.11.5"
license = "MIT AND CC-BY-SA-3.0"
# LICENSE carries robin_hood.h's MIT terms.  CC-BY-SA-3.0: the Stack
# Overflow code in ROBIN_HOOD_IS_TRIVIALLY_COPYABLE.  The header's other
# credits (:96, :866, :906 as released) name techniques, not copied code;
# hash_bytes() and hash_int() follow MurmurHash64A and MurmurHash3's
# finalizer, which their author placed in the public domain.
include = ["LICENSE", "THIRD_PARTY_NOTICES", "patches", "src/include/robin_hood.h"]

# Upstream is archived and unmaintained; its README names
# ankerl::unordered_dense as the successor.  Master's one unreleased header
# change since 3.11.5 (bd632059) is not taken.
[target.robin-hood-hashing]
type = "header-only"
include-dirs = ["src/include"]
interface-cxx-standard = "c++11"
