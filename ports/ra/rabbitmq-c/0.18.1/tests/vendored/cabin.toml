[package]
name = "vendored"
version = "0.0.0"
c-standard = "c11"

# A diamond: this package asks rabbitmq-c for the openssl port's own build and
# requires the openssl port itself without that feature, so both sides get that
# one OpenSSL.  Windows refuses the port's own build (the openssl port's
# tests/vendored).
[target.'cfg(not(os = "windows"))'.dependencies]
"cabin-ports/rabbitmq-c" = { version = "=0.18.1", features = ["vendored-openssl"] }
"cabin-ports/openssl" = "=4.1.0"

[target.vendored]
type = "executable"
sources = ["src/main.c"]
deps = ["cabin-ports/rabbitmq-c", "cabin-ports/openssl:crypto"]
