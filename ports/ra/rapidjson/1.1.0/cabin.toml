[package.upstream]
# The v1.1.0 tag archive, the bytes ConanCenter's rapidjson 1.1.0 pins
# (SHA-256); the release has no assets.  1.1.0 is the last release.
url = "https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz"
checksum = "sha256:bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e"
format = "tar.gz"
strip-prefix = "rapidjson-1.1.0"
# include/rapidjson/document.h:319 defines GenericStringRef's copy
# assignment by assigning to its const members, which GCC 16 and LLVM
# clang 23 reject even unused (Apple clang 21 accepts it), so nothing that
# includes document.h compiles there.  Patch 0001 is upstream commit
# 3b2441b ("Removed non-compiling assignment operator. Fixed #718"), whose
# parent is the v1.1.0 tag, verbatim: it deletes that operator, and
# GenericStringRef stays non-assignable, its members being const.
# ConanCenter ships 1.1.0 unpatched; vcpkg ships a 2025 master snapshot.
# Patches 0002-0008 add the terms of code the headers take from elsewhere,
# as new files:
# - 0002, LICENSE.utf8-dfa: the license of Bjoern Hoehrmann's UTF-8
#   decoder, verbatim from the "License" section of
#   http://bjoern.hoehrmann.de/utf-8/decoder/dfa/, one paragraph per line.
# - 0003, LICENSE.Boost: the Boost Software License 1.0, verbatim from
#   https://www.boost.org/LICENSE_1_0.txt.
# - 0004, NOTICE.Boost: the copyright notices, verbatim as of Boost 1.42.0
#   (the version include/rapidjson/rapidjson.h:207 cites), of the Boost
#   files that the headers follow.
# - 0005, LICENSE.grisu: the LICENSE of Florian Loitsch's Grisu reference
#   code as github.com/miloyip/dtoa-benchmark carries it (src/grisu, at
#   bf1fb58), the same notice the code's own files open with.
# - 0006, LICENSE.double-conversion: google/double-conversion v1.1.5's
#   LICENSE.  0008, NOTICE.double-conversion: the copyright notices that
#   the files the headers follow open with.
# - 0007, LICENSE.nfa: the copyright line (:11) and permission notice
#   (:398-418) of Russ Cox's https://swtch.com/~rsc/regexp/nfa.c.txt,
#   without comment markers.
patches = [
  "patches/0001-remove-non-compiling-assignment-operator.patch",
  "patches/0002-add-mit-license-for-utf-8-decoder-code.patch",
  "patches/0003-add-boost-software-license.patch",
  "patches/0004-add-copyright-notices-for-boost-code.patch",
  "patches/0005-add-mit-license-for-grisu-code.patch",
  "patches/0006-add-bsd-license-for-double-conversion-code.patch",
  "patches/0007-add-mit-license-for-thompson-nfa-code.patch",
  "patches/0008-add-copyright-notices-for-double-conversion-code.patch",
]

[package]
name = "cabin-ports/rapidjson"
version = "1.1.0"
# include/rapidjson is what upstream installs (CMakeLists.txt:144-146).
# license.txt carries RapidJSON's MIT terms and the BSD terms of the
# bundled msinttypes headers (include/rapidjson/msinttypes, which keep
# their notice inline); its JSON License covers only bin/jsonchecker, which
# is not shipped.  Code taken from elsewhere, at upstream's line numbers:
# - rapidjson/encodings.h:145-220 (UTF8::Decode, Validate and GetRange):
#   Bjoern Hoehrmann's UTF-8 decoder, its character-class table (classes
#   1, 7 and 9 renumbered) and its code point accumulation, Copyright (c)
#   2008-2009 Bjoern Hoehrmann, MIT (LICENSE.utf8-dfa).
# - rapidjson/internal/diyfp.h:43-162 (DiyFp, but for ToDouble, :139-148,
#   and kDpDenormalExponent, :155) and rapidjson/internal/dtoa.h
#   (GrisuRound, DigitGen, Grisu2, WriteExponent and Prettify, :35-214):
#   Florian Loitsch's Grisu2 reference code, Copyright (c) 2009 Florian
#   Loitsch, MIT (LICENSE.grisu); GrisuRound and DiyFp's multiplication
#   keep its comments.
# - rapidjson/internal/diyfp.h:139-148 and :155 (DiyFp::ToDouble and
#   kDpDenormalExponent, after Double::DiyFpToUint64 and kDenormalExponent),
#   :164-244 (the cached powers of ten, their 87 entries verbatim, and their
#   lookup), rapidjson/internal/strtod.h:129-264 (StrtodDiyFp, which
#   follows DiyFpStrtod's error bounds, and the trimming, 780-digit cut and
#   bignum comparison of StrtodBigInteger and StrtodFullPrecision),
#   rapidjson/internal/biginteger.h:40-53, :162-182, :224-232 and :239-246
#   (decimal-string parsing and MultiplyPow5's 5^27, 5^13 and 5^1-5^12
#   steps) and rapidjson/internal/ieee754.h:51-58
#   (EffectiveSignificandSize): google/double-conversion's
#   cached-powers.cc, strtod.cc, bignum.cc and ieee.h, Copyright 2006-2012
#   the V8 project authors, BSD-3-Clause (LICENSE.double-conversion, and
#   the files' notices in NOTICE.double-conversion).
# - rapidjson/internal/regex.h:146-158, :340-427 and :606-659 (State and
#   the fragments, Append, Patch, the Thompson construction of Eval, and
#   the simulation, SearchWithAnchoring and AddState): Russ Cox's nfa.c,
#   Copyright (c) 2007 Russ Cox, MIT (LICENSE.nfa).
# - rapidjson/rapidjson.h:219-238 (the endianness detection), :414-416 and
#   :437-440 (RAPIDJSON_STATIC_ASSERT) and :419-421 (RAPIDJSON_JOIN), and
#   rapidjson/internal/meta.h:104-126 (the pre-C++11 IsBaseOf): Boost's
#   detail/endian.hpp, static_assert.hpp, config/suffix.hpp and
#   type_traits/is_base_and_derived.hpp, Boost Software License 1.0
#   (LICENSE.Boost), with their notices, Silicon Graphics' 1997
#   permission notice in endian.hpp included, in NOTICE.Boost.
# The other credits name formulas, not code: rapidjson.h:481-483
# ("adopted from Boost") is BOOST_VERSION's numbering, schema.h:238 the
# FNV-1a hash, and internal/strtod.h:113 the decimal fast path.
include = [
  "LICENSE.Boost",
  "LICENSE.double-conversion",
  "LICENSE.grisu",
  "LICENSE.nfa",
  "LICENSE.utf8-dfa",
  "NOTICE.Boost",
  "NOTICE.double-conversion",
  "include",
  "license.txt",
  "patches",
]

# Header-only: upstream installs no library target (its only one,
# namespacetest, is a unit-test helper, test/unittest/CMakeLists.txt:69),
# and its RapidJSONConfig.cmake and RapidJSON.pc point only at the include
# directory.  The headers support C++98 and detect C++11 features
# themselves (RAPIDJSON_HAS_CXX11_*, rapidjson.h:528-577); the
# configuration macros (RAPIDJSON_HAS_STDSTRING, which upstream's build
# defines for its own examples and tests from an option that defaults to
# OFF, CMakeLists.txt:38-41, and always for the unit tests,
# test/unittest/CMakeLists.txt:67, RAPIDJSON_SSE2, RAPIDJSON_SSE42,
# RAPIDJSON_ASSERT and the rest) stay the consumer's to define.
#
# Upstream warnings, as shipped (line numbers after patch 0001):
# document.h:1937 and :1950 memcpy GenericValue and GenericMember objects
# (GCC's -Wclass-memaccess, Clang's -Wnontrivial-memcall); from C++17
# GenericMemberIterator's std::iterator base (document.h:102, :110) is
# deprecated (-Wdeprecated-declarations, MSVC's C4996); and with -Wextra
# GCC reports switch fallthroughs at internal/regex.h:301, :531 and :542
# (-Wimplicit-fallthrough).
#
# Known upstream issues, as shipped; no release after 1.1.0 carries a fix:
# - CVE-2024-38517 and CVE-2024-39684, an integer underflow and an integer
#   overflow in GenericReader::ParseNumber (reader.h), rated 7.8 High
#   (CVSS 3.1) by GitHub, the CNA.  Upstream fixed the exponent underflow
#   on master in 8269bc2 (#1261); NVD names no fix for CVE-2024-39684.
# - MSVC targeting ARM64 stops at rapidjson.h:244's endianness #error, as
#   :239 tests only _M_ARM (fixed on master in f914058); defining
#   RAPIDJSON_ENDIAN as RAPIDJSON_LITTLEENDIAN avoids it.
# - On ARM64EC, where MSVC also defines _M_AMD64, internal/diyfp.h and
#   internal/biginteger.h request _umul128 as an intrinsic, which MSVC
#   does not provide there (warning C4163), so linking fails unless the
#   consumer links softintrin.lib (#1960); master links it (#1961), keyed
#   on a macro only <windows.h> defines (PR #2399, open).
# - internal/stack.h:117 offsets the null stack pointer before the first
#   allocation, undefined behavior that UBSan reports (fixed on master in
#   16872af).
#
# Not ported: the tests, examples, documentation, bin/ data and the CMake
# and pkg-config files.
[target.rapidjson]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
