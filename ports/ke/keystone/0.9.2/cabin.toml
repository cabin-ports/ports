include-dirs = ["include"]
# Upstream sets no C standard; C11 is the oldest Cabin can lower for MSVC.
c-standard = "c11"
# HandleLLVMOptions.cmake:485-501 builds C++11; Cabin cannot lower C++11
# for MSVC, so the library builds as C++14 everywhere.
cxx-standard = "c++14"
# Measured with clang -pedantic-errors: C89 fails at keystone.h's //
# comments (:16) and C++98 at its trailing enumerator comma (:59); C99 and
# C++11 pass.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "keystone"

[profile]
include-dirs = [
  "llvm/include",
  "llvm/lib/Target/AArch64",
  "llvm/lib/Target/ARM",
  "llvm/lib/Target/Hexagon",
  "llvm/lib/Target/Mips",
  "llvm/lib/Target/PowerPC",
  "llvm/lib/Target/Sparc",
  "llvm/lib/Target/SystemZ",
  "llvm/lib/Target/X86",
]
defines = [
  "HAVE_FCNTL_H",
  "HAVE_INTTYPES_H",
  "HAVE_STDINT_H",
  "HAVE_SYS_STAT_H",
  "HAVE_UINT64_T",
  "LLVM_ENABLE_ARCH_AArch64",
  "LLVM_ENABLE_ARCH_ARM",
  "LLVM_ENABLE_ARCH_Hexagon",
  "LLVM_ENABLE_ARCH_Mips",
  "LLVM_ENABLE_ARCH_PowerPC",
  "LLVM_ENABLE_ARCH_Sparc",
  "LLVM_ENABLE_ARCH_SystemZ",
  "LLVM_ENABLE_ARCH_X86",
  "LLVM_ENABLE_THREADS",
  "__STDC_CONSTANT_MACROS",
  "__STDC_FORMAT_MACROS",
  "__STDC_LIMIT_MACROS",
]

[target.'cfg(family = "unix")'.profile]
defines = [
  "HAVE_DIRENT_H",
  "HAVE_DLFCN_H",
  "HAVE_PREAD",
  "HAVE_SYS_MMAN_H",
  "HAVE_SYS_PARAM_H",
  "HAVE_SYS_TIME_H",
  "HAVE_SYS_UIO_H",
  "HAVE_UNISTD_H",
  "HAVE_U_INT64_T",
  "HAVE_WRITEV",
  "LLVM_ON_UNIX",
]

[target.'cfg(all(os = "linux", env = "gnu"))'.profile]
defines = ["_GNU_SOURCE"]

[target.'cfg(os = "windows")'.profile]
defines = ["HAVE__CHSIZE_S", "LLVM_ON_WIN32"]
# Upstream gets these from CMake's default Windows libraries:
# lib/Support/Windows/Path.inc names advapi32 and ole32 for MSVC only
# (:39-42), calls shell32's SHGetKnownFolderPath (:739) and uses uuid's
# FOLDERID GUIDs (:748, :752).
link-libs = ["advapi32", "ole32", "shell32", "uuid"]

[target.'cfg(all(os = "windows", any(cc = "gcc", env = "gnu")))'.profile]
defines = ["HAVE_UNISTD_H"]
