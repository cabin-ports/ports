# eight targets built by default (LLVM_ALL_TARGETS, :171-181) and adds
# config.h and llvm-config.h without CMake's values: the profiles below
# define the ones the compiled sources read.
# NCSA notice of llvm/LICENSE.TXT, and the additional copyright that
