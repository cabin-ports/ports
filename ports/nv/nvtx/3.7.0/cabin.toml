[package.upstream]
url = "https://github.com/NVIDIA/NVTX/archive/refs/tags/v3.7.0.tar.gz"
checksum = "sha256:db1ae80615eeeb5c559bc3f55ca200c38a9e50a83fdc65e06b901d8861b1c07d"
format = "tar.gz"
strip-prefix = "NVTX-3.7.0"

[package]
name = "cabin-ports/nvtx"
version = "3.7.0"
license = "Apache-2.0 WITH LLVM-exception"
include = ["LICENSE.txt", "c/include"]

# Not ported: nvtxw3-loader (c/src/nvtxw3_loader.c, CMakeLists.txt:62-69), the
# optional reference loader for the NVTXW backend, which README.md:250 calls
# not required.  Its nvtxw3/ headers ship.
# Standards are those upstream's tests build with (tests/CMakeLists.txt:30,37);
# the C++ one is also the documented floor (docs/index.html:389).
[target.nvtx]
type = "header-only"
include-dirs = ["c/include"]
interface-c-standard = "c89"
interface-cxx-standard = "c++11"

# nvtx3-c links CMAKE_DL_LIBS (c/nvtxImportedTargets.cmake); dlopen lives in
# libdl before glibc 2.34.
[target.'cfg(os = "linux")'.profile]
link-libs = ["dl"]
