[package.upstream]
# libspng publishes no release assets for 0.7.4; this is the v0.7.4 tag
# archive, the bytes ConanCenter (SHA-256) and vcpkg (SHA-512) pin.
url = "https://github.com/randy408/libspng/archive/refs/tags/v0.7.4.tar.gz"
checksum = "sha256:47ec02be6c0a6323044600a9221b049f63e1953faf816903e7383d4dc4234487"
format = "tar.gz"
strip-prefix = "libspng-0.7.4"

# "BSD-2-Clause AND libpng-2.0" (spng/spng.c:1): LICENSE covers libspng,
# and spng.c carries the PNG Reference Library License of the SIMD filter
# code derived from libpng (:6146-6181).
[package]
name = "cabin-ports/libspng"
version = "0.7.4"
include = ["LICENSE", "spng"]

[dependencies]
"cabin-ports/zlib" = "^1.3"

# The static library of upstream's CMake build (spng_static,
# CMakeLists.txt:13-14, :45-57) under the name Meson gives it
# (meson.build:50): spng/spng.c against zlib, with SPNG_STATIC defined for
# it and its consumers (CMakeLists.txt:46; without it, spng.h:9-16
# declares the API dllimport to Windows consumers) and spng/ as the
# include root, so consumers include <spng.h>.  ENABLE_OPT is on by
# default (CMakeLists.txt:12): spng.c compiles its SSE2 filters on x86 and
# x86-64 and its NEON filters on AArch64 itself (spng.c:36-50,
# :6183-6198), without flags.
# Not ported: the scalar-only build, ENABLE_OPT=OFF (SPNG_DISABLE_OPT,
# CMakeLists.txt:26-28); the shared library; Meson's
# SPNG_ENABLE_TARGET_CLONES, which CMake never sets and which adds an AVX2
# clone of one function where GCC's target_clones links
# (meson.build:23-26, spng.c:52-57, :1438); the miniz backend
# (SPNG_USE_MINIZ); the experimental SPNG_MULTITHREADING; the CMake package
# and pkg-config files; examples, tests and docs.
[target.spng]
type = "library"
sources = ["spng/spng.c"]
include-dirs = ["spng"]
defines = ["SPNG_STATIC"]
interface-defines = ["SPNG_STATIC"]
# Upstream builds as C99 (CMakeLists.txt:5); C11 is the oldest standard
# Cabin can request from MSVC.
c-standard = "c11"
interface-c-standard = "c99"
links = "spng"
deps = ["cabin-ports/zlib"]

# Gamma correction calls pow(); upstream links libm on every non-Windows
# host (CMakeLists.txt:20-24, :57).
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
