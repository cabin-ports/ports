[package.upstream]
url = "https://github.com/ktprime/emhash/archive/refs/tags/v1.3.0.tar.gz"
checksum = "sha256:94327989a23eb6027d81b267c607a0a5c62d47deb0db3eb22cbdc580a165ba74"
format = "tar.gz"
strip-prefix = "emhash-1.3.0"
# Third-party notices are in THIRD_PARTY_NOTICES (patch 0001).
patches = ["patches/0001-add-third-party-notices.patch"]

[package]
name = "cabin-ports/emhash"
version = "1.3.0"
# BSL-1.0: the Boost.Unordered code in emilib/emihmap4.hpp.  Unlicense: the
# wyhash in emhash/config.hpp (config.hpp:128-129); it also covers
# emhash/lru_size.hpp and lru_time.hpp, which are Unlicense OR MIT-0.
license = "MIT AND BSL-1.0 AND Unlicense"
include = ["LICENSE", "README.md", "THIRD_PARTY_NOTICES", "include", "patches"]

# Consumers write <emhash/hash_table8.hpp> (README.md:94) or
# <emilib/emihmap1.hpp>; sse2neon.h stays at include/ because the emilib
# headers include it by that name on arm64.  C++17 is upstream's floor
# (CMakeLists.txt:13).  emhash/version.hpp reports 1.1.0 for this 1.3.0
# release.  Not ported: the CMake and Conan builds.
[target.emhash]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
