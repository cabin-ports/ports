# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
# SOFTWARE.
patches = ["patches/0001-use-_WIN32-for-the-windows-backend.patch"]

[package]
name = "cabin-ports/asock"
version = "1.0.7"
license = "MIT"
include = ["LICENSE", "README.md", "include", "patches"]

# C++11 is the standard README.md states.
[target.asock]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"

[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32"]

# Upstream's sample and test builds link pthread on Linux and macOS
# (sample/CMakeLists.txt, test/CMakeLists.txt); nothing mentions Android.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
