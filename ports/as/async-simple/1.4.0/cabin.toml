[package.upstream]
url = "https://github.com/alibaba/async_simple/archive/refs/tags/1.4.tar.gz"
checksum = "sha256:6188f7a5f4211754fee758dfebf73759b74ce78c208719b5cc37d5ab4775d550"
format = "tar.gz"
strip-prefix = "async_simple-1.4"
# Patch 0001 adds, verbatim, the terms of the code recorded below:
# COPYING3 and COPYING.RUNTIME from gcc-13.5.0.tar.xz (sha256
# ec3df0015ed01411f91f9a9cd5b4da3070eb1222b02fadf4133c30c090399855);
# LICENSE.LLVM, the LICENSE.TXT of llvm-project-23.1.5.src.tar.xz (sha256
# fb50b1eac93ddeb3aa8dab4cfe324dff74f4a9c2bdee6160c9e36188f8d06a6e); and
# LICENSE.cppcoro, the LICENSE.txt of lewissbaker/cppcoro at commit 3912152
# (archive sha256
# aa14f12bbe1b5a2f8d5ab63c0a9a3b270f585df87cab8ed2f93a440a7fec98be).
patches = ["patches/0001-add-third-party-license-texts.patch"]

# Upstream's tag is two-part (1.4); Cabin versions are SemVer.
[package]
name = "cabin-ports/async-simple"
version = "1.4.0"
# Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND MIT AND
# GPL-3.0-or-later WITH GCC-exception-3.1.  LICENSE and NOTICE cover
# Alibaba's code and the third-party headers NOTICE lists.
# async_simple/coro/SharedMutex.h:28-159 adapts GCC 13.5.0's
# libstdc++-v3/include/std/shared_mutex:264-406, and
# async_simple/util/move_only_function.h:36-409 adapts libstdc++'s
# type_traits and bits/std_function.h (Free Software
# Foundation, GPL-3.0-or-later WITH GCC-exception-3.1); Executor.h,
# FutureState.h and Signal.h include move_only_function.h, so every
# consumer takes on those terms for that code.
# async_simple/coro/Mutex.h follows folly's
# folly/experimental/coro/Mutex.h and Mutex.cpp (Facebook, Inc. and its
# affiliates, Apache-2.0), though its header names Lewis Baker and MIT.
# async_simple/coro/ConditionVariable.h:129-218 adapts cppcoro's
# async_manual_reset_event (Lewis Baker, MIT).
# async_simple/experimental/coroutine.h is libc++'s (LLVM Project,
# Apache-2.0 WITH LLVM-exception).
# async_simple/coro/PromiseAllocator.h:40-51 and 77-359 and
# coro/Generator.h:93-112 and 327-619 copy P2502R2's reference
# implementation (Casey Carter, Lewis Baker and Corentin Jabot,
# https://godbolt.org/z/5hcaPcfvP), Generator.h:131-323 and
# PromiseAllocator.h:60-65 the paper's prose and examples, and
# PromiseAllocator.h:67-73 the reference's allocator example; neither
# grants any rights, so publish-holds.txt holds this version until a grant
# is found or the maintainer rules.
# The files are upstream's installed headers (async_simple/CMakeLists.txt:
# 9-13, 79-83), without uthread/, the tests and the C++20 module units.
include = [
  "COPYING.RUNTIME",
  "COPYING3",
  "LICENSE",
  "LICENSE.LLVM",
  "LICENSE.cppcoro",
  "NOTICE",
  "async_simple/Collect.h",
  "async_simple/Common.h",
  "async_simple/CommonMacros.h",
  "async_simple/Executor.h",
  "async_simple/Future.h",
  "async_simple/FutureState.h",
  "async_simple/IOExecutor.h",
  "async_simple/LocalState.h",
  "async_simple/MoveWrapper.h",
  "async_simple/Promise.h",
  "async_simple/Signal.h",
  "async_simple/Traits.h",
  "async_simple/Try.h",
  "async_simple/Unit.h",
  "async_simple/coro/Collect.h",
  "async_simple/coro/ConditionVariable.h",
  "async_simple/coro/CountEvent.h",
  "async_simple/coro/DetachedCoroutine.h",
  "async_simple/coro/Dispatch.h",
  "async_simple/coro/FutureAwaiter.h",
  "async_simple/coro/Generator.h",
  "async_simple/coro/Latch.h",
  "async_simple/coro/Lazy.h",
  "async_simple/coro/LazyLocalBase.h",
  "async_simple/coro/Mutex.h",
  "async_simple/coro/PromiseAllocator.h",
  "async_simple/coro/ResumeBySchedule.h",
  "async_simple/coro/Semaphore.h",
  "async_simple/coro/SharedMutex.h",
  "async_simple/coro/Sleep.h",
  "async_simple/coro/SpinLock.h",
  "async_simple/coro/SyncAwait.h",
  "async_simple/coro/Traits.h",
  "async_simple/coro/ViaCoroutine.h",
  "async_simple/executors/SimpleExecutor.h",
  "async_simple/executors/SimpleIOExecutor.h",
  "async_simple/experimental/coroutine.h",
  "async_simple/util/Condition.h",
  "async_simple/util/Queue.h",
  "async_simple/util/ThreadPool.h",
  "async_simple/util/move_only_function.h",
  "patches",
]

# Upstream's async_simple_header_only target (CMakeLists.txt:13-24).
# Limitations: GCC 10 also needs -fcoroutines, which upstream adds to the
# interface for it (async_simple/CMakeLists.txt:27-31) and this port does
# not; README.md:81 suggests /EHa for MSVC error C4737.
# executors/SimpleIOExecutor.h, which executors/SimpleExecutor.h includes,
# uses libaio whenever <libaio.h> exists unless ASYNC_SIMPLE_HAS_NOT_AIO is
# defined; upstream's installed package exports neither that define nor
# -laio, so consumers on such hosts link aio or define it.
# Executor's default timer (async_simple/Executor.h:178-191), which
# SimpleExecutor uses for coro::sleep, destroys the promise it waits on when
# the sleeping coroutine has no cancellation slot, so such a sleep does not
# wait.
# Not ported: uthread/ (a compiled library upstream builds on Linux and
# macOS from Boost.Context assembly), the C++20 modules, the tests, the
# benchmarks and the demos.
[target.async_simple]
type = "header-only"
include-dirs = ["."]
interface-cxx-standard = "c++20"

# Threads::Threads (CMakeLists.txt:23-24).
[target.'cfg(os = "linux")'.profile]
link-libs = ["pthread"]
