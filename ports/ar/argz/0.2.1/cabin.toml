[package.upstream]
url = "https://github.com/stephenberry/argz/archive/refs/tags/v0.2.1.tar.gz"
checksum = "sha256:1a9d85ef7e4722f81ce426c2cf8ceaa0a10cc42e7762cdf2465ae6484ece9c7e"
format = "tar.gz"
strip-prefix = "argz-0.2.1"

[package]
name = "cabin-ports/argz"
version = "0.2.1"
license = "Apache-2.0"
include = ["LICENSE", "README.md", "include"]

# Consumers include <argz/argz.hpp>.
# Integer options parse through std::stol (argz.hpp:83): a value outside
# long's range throws std::out_of_range, and one inside it that the option's
# type cannot hold, such as a negative one for an unsigned option, wraps
# (measured).
[target.argz]
type = "header-only"
include-dirs = ["include"]
# README.md:7, "Requires C++20".
interface-cxx-standard = "c++20"
