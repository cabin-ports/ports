[package.upstream]
url = "https://github.com/adishavit/argh/archive/refs/tags/v1.3.2.tar.gz"
checksum = "sha256:4b76d8c55e97cc0752feee4f00b99dc58464dd030dea9ba257c0a7d24a84f9dd"
format = "tar.gz"
strip-prefix = "argh-1.3.2"

[package]
name = "cabin-ports/argh"
version = "1.3.2"
license = "BSD-3-Clause"
include = ["LICENSE", "argh.h"]

# Upstream's header-only argh target.  Not ported: its tests and the
# doctest.h they bundle, the example, and the build and packaging files.
[target.argh]
type = "header-only"
include-dirs = ["."]
# CMakeLists.txt sets CMAKE_CXX_STANDARD 11.
interface-cxx-standard = "c++11"
