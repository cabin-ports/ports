[package.upstream]
url = "https://github.com/odygrd/quill/archive/refs/tags/v13.1.0.tar.gz"
checksum = "sha256:a08b93bafc7e712b28eb47e4a1ed9b60fc01ac7fad3ce269f1f100560a506a85"
format = "tar.gz"
strip-prefix = "quill-13.1.0"

[package]
name = "cabin-ports/quill"
version = "13.1.0"
# MIT, and MIT with the {fmt} exception for the bundled fmt, whose notice is
# include/quill/bundled/fmt/format.h:1-30.
license = "MIT AND MIT WITH fmt-exception"
include = ["LICENSE", "include"]

# C++17 is upstream's floor (README.md:94).
[target.quill]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"

# Upstream links Threads::Threads for the backend worker thread.
[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]

# Upstream links ucrtbase on MinGW for strftime.
[target.'cfg(all(os = "windows", any(cc = "gcc", env = "gnu")))'.profile]
link-libs = ["ucrtbase"]
