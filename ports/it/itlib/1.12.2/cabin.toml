[package.upstream]
url = "https://github.com/iboB/itlib/archive/refs/tags/v1.12.2.tar.gz"
checksum = "sha256:3c29ae38f3d437f4eb0cd2660012edd5d0ebcca36ed5e96a3b4af9237bc68a0d"
format = "tar.gz"
strip-prefix = "itlib-1.12.2"

[package]
name = "cabin-ports/itlib"
version = "1.12.2"
include = ["LICENSE.txt", "include/itlib"]

# Ships every header in include/itlib, as vcpkg does, including
# opt_ref_buffer.hpp, rand_dist.hpp, and ref_ptr.hpp, which upstream's CMake
# target omits.  C++11 is the floor of most headers; a consumer that includes
# one of the C++17 or C++20 headers raises its own standard.  The headers
# pick their C++17 and C++20 branches by __cplusplus, which MSVC reports as
# 199711L without /Zc:__cplusplus (Cabin does not pass it), so with MSVC they
# always take the older branches; throw_ex.hpp then calls
# std::uncaught_exception, which MSVC's library removes from C++20 on.
#
# Licence: MIT, LICENSE.txt (Chobolabs Inc. 2016-2019, Borislav Stanimirov
# 2020-2026); each header repeats the notice.
[target.itlib]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
