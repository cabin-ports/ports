[package.upstream]
url = "https://github.com/intel/ittapi/archive/refs/tags/v3.28.4.tar.gz"
checksum = "sha256:70572732cdf41c2625fe18c8f3d4f71533b114cb6889fba18495422973560ca3"
format = "tar.gz"
strip-prefix = "ittapi-3.28.4"

[package]
name = "cabin-ports/ittapi"
version = "3.28.4"
license = "BSD-3-Clause OR GPL-2.0-only"
include = ["LICENSES", "README.md", "include", "src/ittnotify", "cpp/include"]

# Upstream's CMakeLists.txt globs src/ittnotify/*.c into one static library.
# Not ported: the x86-64 Processor Trace marks (ITT_API_IPT_SUPPORT), the
# Fortran modules, and the shared reference collector, all off by default
# upstream.
# Upstream sets no C standard; c11 is Cabin's lowest on MSVC.
[target.ittnotify]
type = "library"
links = "ittnotify"
sources = ["src/ittnotify/ittnotify_static.c", "src/ittnotify/jitprofiling.c"]
include-dirs = ["include"]
c-standard = "c11"
interface-c-standard = "c99"

# Upstream's C++ wrapper (ITT_API_CPP_SUPPORT, off by default); C++17 is
# stated in cpp/CMakeLists.txt.
[target.ittapi-cpp]
type = "header-only"
include-dirs = ["cpp/include"]
interface-cxx-standard = "c++17"
deps = [{ name = "ittnotify", public = true }]

# ittnotify_config.h defines _GNU_SOURCE for PTHREAD_MUTEX_RECURSIVE only after
# <stdint.h> has fixed glibc's feature macros; -std=c11 needs it up front.
[target.'cfg(os = "linux")'.profile]
defines = ["_GNU_SOURCE"]
link-libs = ["dl"]
