[package.upstream]
url = "https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.3.tar.gz"
checksum = "sha256:2b0d17a6e016f47b86f9c00e2cb82600041b1ea1f7d2a00c2d46ae542cbfed3c"
format = "tar.gz"
strip-prefix = "plutovg-1.3.3"

[package]
name = "cabin-ports/plutovg"
version = "1.3.3"
# source/ carries FTL.TXT, the FreeType License of the plutovg-ft-*
# rasterizer and stroker sources.
include = ["LICENSE", "include", "source"]
# Upstream's CMake requires C11; plutovg.h needs C99 (<stdbool.h>, //
# comments), and C++ has <stdbool.h> from C++11.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# The static library form of upstream's CMake and Meson builds, from the
# eleven source/ files (CMakeLists.txt:9-21), with include/ public and
# font face cache loading from files and directories on (its
# PLUTOVG_DISABLE_FONT_FACE_CACHE_LOAD option is off by default).  Not
# ported: the shared library, the examples, and hidden symbol visibility
# (C_VISIBILITY_PRESET; Cabin drops a dependency's raw compiler flags).
[profile]
defines = ["PLUTOVG_BUILD"]

# PLUTOVG_BUILD_STATIC is public, as in CMakeLists.txt:79-81 and Meson's
# dependency: without it plutovg.h:32-50 declares the API dllimport for a
# Windows consumer, which then fails to link against this static library.
[target.plutovg]
type = "library"
sources = [
  "source/plutovg-blend.c",
  "source/plutovg-canvas.c",
  "source/plutovg-font.c",
  "source/plutovg-matrix.c",
  "source/plutovg-paint.c",
  "source/plutovg-path.c",
  "source/plutovg-rasterize.c",
  "source/plutovg-surface.c",
  "source/plutovg-ft-math.c",
  "source/plutovg-ft-raster.c",
  "source/plutovg-ft-stroker.c",
]
include-dirs = ["include"]
defines = ["PLUTOVG_BUILD_STATIC"]
interface-defines = ["PLUTOVG_BUILD_STATIC"]
links = "plutovg"

# glibc provides <threads.h>, so upstream's probe defines HAVE_THREADS_H
# and the font face and glyph caches take a C11 mutex
# (source/plutovg-font.c:111-142); upstream links libm and the threads
# library.  macOS has no <threads.h> (upstream leaves the mutex a no-op
# there), and Windows uses a CRITICAL_SECTION.
[target.'cfg(os = "linux")'.profile]
defines = ["HAVE_THREADS_H"]
link-libs = ["m", "pthread"]
