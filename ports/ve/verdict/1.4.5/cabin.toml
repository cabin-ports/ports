# (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS
# SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.
patches = ["patches/0001-fill-in-verdict-config-header.patch"]

[[package.upstream.copy]]
from = "verdict_config.h.in"
to = "verdict_config.h"

[package]
name = "cabin-ports/verdict"
version = "1.4.5"
license = "BSD-3-Clause"
include = [
  "LICENSE",
  "README.md",
  "V_EdgeMetric.cpp",
  "V_GaussIntegration.cpp",
  "V_HexMetric.cpp",
  "V_KnifeMetric.cpp",
  "V_PyramidMetric.cpp",
  "V_QuadMetric.cpp",
  "V_TetMetric.cpp",
  "V_TriMetric.cpp",
  "V_WedgeMetric.cpp",
  "V_GaussIntegration.hpp",
  "V_HexMetric.hpp",
  "VerdictVector.cpp",
  "VerdictVector.hpp",
  "patches",
  "verdict.h",
  "verdict_config.h",
  "verdict_defines.hpp",
]

# Upstream's verdict library (CMakeLists.txt:55-82): its ten sources with the
# package root public.  Not ported: shared libraries, the namespace mangling option (VERDICT_MANGLE), CUDA and HIP
# builds, the tests, the manual and the CMake package files.
[target.verdict]
type = "library"
sources = [
  "V_EdgeMetric.cpp",
  "V_GaussIntegration.cpp",
  "V_HexMetric.cpp",
  "V_KnifeMetric.cpp",
  "V_PyramidMetric.cpp",
  "V_QuadMetric.cpp",
  "V_TetMetric.cpp",
  "V_TriMetric.cpp",
  "V_WedgeMetric.cpp",
  "VerdictVector.cpp",
]
include-dirs = ["."]
# C++11, stated by CMakeLists.txt:78; the sources need C++14 (constexpr void
# members, VerdictVector.hpp:60) and it is the oldest Cabin can lower for MSVC.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
interface-c-standard = "none"
links = "verdict"

# Upstream links libm privately on Unix (CMakeLists.txt:81-83).
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
