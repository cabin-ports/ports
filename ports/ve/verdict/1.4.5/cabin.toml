[package.upstream]
url = "https://github.com/sandialabs/verdict/archive/refs/tags/1.4.5.tar.gz"
checksum = "sha256:8c3ba194894a1b10b0700643363d02514cfdf88109a0c2710c0a32e857b2bde0"
format = "tar.gz"
strip-prefix = "verdict-1.4.5"
# Patch 0001 fills in the verdict_config.h that the copy step places from its
# template, as CMake's configure_file would for this static, unmangled build
# (CMakeLists.txt:35, :37, :39): version 145, BUILD_SHARED_LIBS and
# VERDICT_MANGLE unset.
# BSD-3-Clause notice of verdict_config.h.in, whose lines 0001 carries (the
# License's condition that copies retain it), from LICENSE:
# Copyright 2003,2006,2019 National Technology & Engineering Solutions of Sandia, LLC (NTESS).
# Under the terms of Contract DE-NA0003525 with NTESS, the U.S. Government retains certain rights in this software.
#
# All rights reserved.
#
# Redistribution and use in source and binary forms, with or without
# modification, are permitted provided that the following conditions are met:
#     * Redistributions of source code must retain the above copyright
#       notice, this list of conditions and the following disclaimer.
#     * Redistributions in binary form must reproduce the above copyright
#       notice, this list of conditions and the following disclaimer in the
#       documentation and/or other materials provided with the distribution.
#     * Neither the name of the <organization> nor the
#       names of its contributors may be used to endorse or promote products
#       derived from this software without specific prior written permission.
#
# THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS" AND
# ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED
# WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE
# DISCLAIMED. IN NO EVENT SHALL <COPYRIGHT HOLDER> BE LIABLE FOR ANY
