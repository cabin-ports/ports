[package.upstream]
url = "https://github.com/free-audio/clap/archive/refs/tags/1.2.10.tar.gz"
checksum = "sha256:58fdb977c6678859c15d57942378b651399178f49a3a8ecad1813b9f231dc096"
format = "tar.gz"
strip-prefix = "clap-1.2.10"

# Named after vcpkg's port: upstream's own name, clap, is too generic.
[package]
name = "cabin-ports/clap-cleveraudio"
version = "1.2.10"
license = "MIT"
include = ["LICENSE", "include"]

# The one directory upstream's CMake installs, include/ with clap/ (CMakeLists.txt:21-30).
# C11 and C++11 are the standards upstream's compile tests build with
# (CMakeLists.txt:77-78).
# Not ported: src/ (compile tests and a plugin template), the artwork and the docs.
[target.clap]
type = "header-only"
include-dirs = ["include"]
interface-c-standard = "c11"
interface-cxx-standard = "c++11"
