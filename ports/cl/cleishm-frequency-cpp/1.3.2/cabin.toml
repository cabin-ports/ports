[package.upstream]
url = "https://github.com/cleishm/frequency-cpp/archive/refs/tags/v1.3.2.tar.gz"
checksum = "sha256:d5c3448b2e06755f3cd8c45d94e08e988f1f7ed07905efc9c898d447ee684a02"
format = "tar.gz"
strip-prefix = "frequency-cpp-1.3.2"

[package]
name = "cabin-ports/cleishm-frequency-cpp"
version = "1.3.2"
license = "MIT"
include = ["LICENSE", "include"]

# Header-only, as upstream's INTERFACE target frequency: consumers write
# `#include <frequency/frequency.hpp>`.  C++20 is upstream's stated standard
# (README.md:22, CMakeLists.txt:46).  Not ported: upstream's MSVC /utf-8 option
# (CMakeLists.txt:39-40), which Cabin passes on every cl compile.
[target.cleishm-frequency-cpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++20"
