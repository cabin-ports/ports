[package]
name = "cabin-ports/cli"
version = "2.3.0"
license = "BSL-1.0"
include = ["LICENSE", "include", "patches"]

[dependencies]
"cabin-ports/asio" = "=1.38.2"
"cabin-ports/boost-asio" = { version = "=1.92.0", optional = true }

[features]
default = []
boost-asio = ["dep:cabin-ports/boost-asio"]
standalone-asio = []

# Upstream states C++14 (README.md, "A cross-platform header only C++14 library").
[target.cli]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"

[target.cli-boost-asio]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [{ name = "cabin-ports/boost-asio", public = true }]
required-features = ["boost-asio"]

[target.cli-standalone-asio]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [{ name = "cabin-ports/asio", public = true }]
required-features = ["standalone-asio"]

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
