strip-prefix = "cli-2.3.0"
# Patch 0001 backports upstream 8b602c845a (include/cli/cli.h only): v2.3.0
# defines the Cli constructors before menu.h is included, so a C++23 clang
# consumer fails "invalid application of 'sizeof' to an incomplete type
# 'cli::Menu'" (measured, clang 23 with libc++, -std=c++23).
