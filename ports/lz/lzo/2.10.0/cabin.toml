include-dirs = ["include", "include/lzo"]
defines = ["LZO_LIBC_ISOC90=1"]
# C11 is the oldest standard Cabin can lower for MSVC; the public headers
# are C89 and C++98 clean.
c-standard = "c11"
interface-c-standard = "c89"
interface-cxx-standard = "c++98"
links = "lzo2"
