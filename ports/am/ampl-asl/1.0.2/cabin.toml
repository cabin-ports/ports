# CMake defines No_Control87 for 64-bit pointers (CMakeLists.txt:303-306).
# Only Windows reads it (fpinitmt.c:186), whose 64-bit targets are these,
# to skip a _control87 precision change that x64 does not support.
[target.'cfg(any(arch = "x86_64", arch = "aarch64"))'.profile]
defines = ["No_Control87"]

# CMAKE_DL_LIBS (CMakeLists.txt:348), for funcadd1.c's dlopen, which lives
# in libdl before glibc 2.34.
[target.'cfg(os = "linux")'.profile]
link-libs = ["dl"]

# CMakeLists.txt:349-351.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
