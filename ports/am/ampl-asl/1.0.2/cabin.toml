[package.upstream]
url = "https://github.com/ampl/asl/archive/refs/tags/v1.0.2.tar.gz"
checksum = "sha256:cf907bcd14ed172d75e3d0fd34f11b3f8e42154d696cf0f8c73e217f5bf149c6"
format = "tar.gz"
strip-prefix = "asl-1.0.2"
# Patch 0001 fills in include/details.c, where CMake writes its build
# machine's system name and processor (CMakeLists.txt:107-111), with an
# empty sysdetails_ASL, which getstub.c leaves out of a solver's version
# line: one fixed string would misname every other platform.
# BSD 3-Clause License notice of LICENSE, which covers src/solvers/details.c0,
# whose lines 0001 carries (the License's condition that redistributions of
# source code retain it):
# Copyright (c) 2017-2023, AMPL Optimization, Inc.
# All rights reserved.
#
# Redistribution and use in source and binary forms, with or without
# modification, are permitted provided that the following conditions are met:
#
# * Redistributions of source code must retain the above copyright notice, this
#   list of conditions and the following disclaimer.
#
# * Redistributions in binary form must reproduce the above copyright notice,
#   this list of conditions and the following disclaimer in the documentation
#   and/or other materials provided with the distribution.
#
# * Neither the name of the copyright holder nor the names of its
#   contributors may be used to endorse or promote products derived from
#   this software without specific prior written permission.
#
# THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS "AS IS"
# AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE
# IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE
# DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT HOLDER OR CONTRIBUTORS BE LIABLE
# FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL
# DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR
# SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER
# CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY,
# OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE
# OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.
patches = ["patches/0001-fill-in-details-c.patch"]

# The files CMake generates in its build tree's include directory, which
# asl and asl2 share (CMakeLists.txt:107-114, 198-202).
[[package.upstream.copy]]
from = "src/solvers/arith.h1"
to = "include/arith.h"

[[package.upstream.copy]]
from = "src/solvers/stdio1.h0"
to = "include/stdio1.h"

[[package.upstream.copy]]
from = "src/solvers/details.c0"
to = "include/details.c"

[package]
name = "cabin-ports/ampl-asl"
version = "1.0.2"
# SMLNJ: LICENSE.2 and the Lucent file headers.  LicenseRef-AMPL-SMLNJ-variant:
# the AMPL Optimization and David M. Gay file headers (e.g. asl.h,
# avltree.c), SMLNJ's grant without its name clause.  dtoa: dtoa.c, which
# dtoa1.c includes.  Files without a header fall under LICENSE.
license = "BSD-3-Clause AND SMLNJ AND LicenseRef-AMPL-SMLNJ-variant AND dtoa"
include = [
  "LICENSE",
  "LICENSE.2",
  "README.md",
  "include",
  "patches",
  "src/solvers",
  "src/solvers2",
]
# Upstream states no C standard; C11 is the oldest Cabin can lower for
# MSVC.  The headers are C89 and C++98 (measured).
c-standard = "c11"
interface-c-standard = "c89"
interface-cxx-standard = "c++98"

# CMake builds asl and asl2 by default.  They define the same functions,
# and their headers have the same names, so a program uses one of them:
# asl2 needs the non-default `asl2` feature, and a consumer that enables it
# names cabin-ports/ampl-asl:asl2 in deps.  Not ported: what CMake's
# options add (the aslcpp C++ wrapper, the OpenMP asl-mt and asl2-mt, the
# dynamic-runtime, mcmodel=large and licence-check variants, f2c, the
# examples and GENERATE_ARITH's arithchk).
[features]
default = []
asl2 = []

# Upstream's CMake sets no C standard (no C_STANDARD, C_EXTENSIONS or -std),
# so it compiles in the compiler's default GNU dialect, where glibc exposes
# ssize_t, fdopen, fileno, popen and tempnam (asl.h, func_add.c, printf.c);
# Cabin's strict -std=c11 hides them without _DEFAULT_SOURCE.
# Consumers need it too, for asl.h's ssize_t (measured: check-linux, C probe
# at c89, "asl.h:108:9: error: unknown type name 'ssize_t'").
[target.asl]
type = "library"
sources = [
