[package.upstream]
# Upstream has no tags or releases.  This is master's head; the version is
# the one configure.ac:1-3 declares (farmhash_major.minor.patchlevel).
url = "https://github.com/google/farmhash/archive/9d99331eb762e9ee22fd97d15a594525ad98310a.tar.gz"
checksum = "sha256:d9ee5c25851403669f1f7b5bea5b05e0991bfcc7e5787d9d3bd3bb89b6fa4ea0"
format = "tar.gz"
strip-prefix = "farmhash-9d99331eb762e9ee22fd97d15a594525ad98310a"

[package]
name = "cabin-ports/farmhash"
version = "1.1.0"
# src/farmhash.cc:366-370 takes Murmur3's constants and fmix(), which their
# author placed in the public domain, so they add no term.
license = "MIT"
include = ["COPYING", "src/farmhash.cc", "src/farmhash.h"]

# Upstream states no C++ standard; the interface floor was measured (the
# header and farmhash.cc compile as c++98).  The SSE4.2 and AES fast paths are
# not enabled, as in upstream's default build, which passes no -m flags.
[target.farmhash]
type = "library"
sources = ["src/farmhash.cc"]
include-dirs = ["src"]
cxx-standard = "c++14"
interface-cxx-standard = "c++98"
links = "farmhash"

# cl has no __builtin_expect; README.md:38-39 says to define this then
# (farmhash.cc:76).
[target.'cfg(env = "msvc")'.profile]
defines = ["FARMHASH_NO_BUILTIN_EXPECT"]
