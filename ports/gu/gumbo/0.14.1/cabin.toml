[package.upstream]
url = "https://codeberg.org/gumbo-parser/gumbo-parser/archive/0.14.1.tar.gz"
checksum = "sha256:ba5d13b9b508ec693613b3b61518163aced38f8e885f7e28dc047348a4e61365"
format = "tar.gz"
strip-prefix = "gumbo-parser"

# The two headers upstream installs, gumbo.h and the tag_enum.h it includes.
# src/ also holds the private headers, among them an error.h that would
# shadow the C library's <error.h>, so it stays off the consumer include
# path.
[[package.upstream.copy]]
from = "src/gumbo.h"
to = "include/gumbo.h"

[[package.upstream.copy]]
from = "src/tag_enum.h"
to = "include/tag_enum.h"

[package]
name = "cabin-ports/gumbo"
version = "0.14.1"
include = ["doc/COPYING", "include", "src", "visualc"]
# Upstream builds C99; C11 is the oldest standard Cabin can request from
# MSVC.  gumbo.h needs <stdbool.h>, which C++ has from C++11.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# MSVC's C library has no <strings.h>, so the library's own MSVC compiles
# use upstream's replacement in visualc/include, as vcpkg's port does;
# consumers do not see it.  As upstream ships it, gumbo.h defines
# _CRT_SECURE_NO_WARNINGS and maps fileno to _fileno in every MSVC
# consumer.
#
# The generated tag tables and the character-reference table
# (src/char_ref_gperf.c, built from WHATWG's entities.json) are committed
# upstream; this port builds them as shipped.
#
# Not ported: the shared library and the Python bindings.
#
# Licence: Apache-2.0, doc/COPYING (Google Inc.).  src/utf8.c also embeds
# Bjoern Hoehrmann's MIT-licensed UTF-8 decoder, whose notice it carries
# (src/utf8.c:38-58), and src/parser.c:1488-1491 credits html5lib-python's
# structuring of the spec's "reconstruct the active formatting elements".
[target.gumbo]
type = "library"
sources = [
  "src/attribute.c",
  "src/char_ref.c",
  "src/char_ref_gperf.c",
  "src/error.c",
  "src/parser.c",
  "src/string_buffer.c",
  "src/string_piece.c",
  "src/tag.c",
  "src/tokenizer.c",
  "src/utf8.c",
  "src/util.c",
  "src/vector.c",
]
include-dirs = ["include"]
links = "gumbo"

[target.'cfg(env = "msvc")'.profile]
include-dirs = ["visualc/include"]
