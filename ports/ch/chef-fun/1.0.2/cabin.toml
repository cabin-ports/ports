[package.upstream]
url = "https://gitlab.com/libchef/chef-fun/-/archive/1.0.2/chef-fun-1.0.2.tar.gz"
checksum = "sha256:0954717543b569b98e85f17c785dd23c4aca3a8887abd10104a18be894e64e41"
format = "tar.gz"
strip-prefix = "chef-fun-1.0.2"
# Option.hh uses std::vector without including <vector>, so with LLVM 23's
# libc++ every public header fails to compile (measured: "no member named
# 'vector' in namespace 'std'"); patch 0001 includes it.
patches = ["patches/0001-include-vector.patch"]

[package]
name = "cabin-ports/chef-fun"
# The latest tag; ChangeLog.md's 1.1.0 to 1.3.0 headings were never tagged.
version = "1.0.2"
license = "Apache-2.0"
include = [
  "AUTHORS",
  "ChangeLog.md",
  "LICENSE",
  "README.md",
  "include",
  "patches",
]

# Built without exceptions, Option.hh includes <ChefDebug/assert.hh>, which
# this package does not ship, so it fails to compile (measured:
# "'ChefDebug/assert.hh' file not found").
# Not ported: the tests.
[target.chef-fun]
type = "header-only"
include-dirs = ["include"]
# README.md:15: "written in C++20".
interface-cxx-standard = "c++20"
