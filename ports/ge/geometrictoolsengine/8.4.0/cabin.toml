[package.upstream]
url = "https://github.com/davideberly/GeometricTools/archive/refs/tags/GTE-version-8.4.tar.gz"
checksum = "sha256:3995f59a05981c60024e8a22e2680c789c498ec07c2dbcc9155bda82b9ff6503"
format = "tar.gz"
strip-prefix = "GeometricTools-GTE-version-8.4"

[package]
name = "cabin-ports/geometrictoolsengine"
# GTE/CMakeLists.txt sets GTE_VERSION_MAJOR 8 and GTE_VERSION_MINOR 4.
version = "8.4.0"
# GTE/Mathematics/HashCombine.h:13-18 credits Josuttis's book for hash_combine,
# and BitHacks.h:10-15 credits Stack Overflow and dotnetperls for two bit-scan
# tables; their copyright significance is uncertain.
license = "BSL-1.0"
# Not ported: the Graphics, MathematicsGPU, Applications and Samples parts.
include = ["LICENSE-BOOST", "GTE/Mathematics"]

[target.geometrictoolsengine]
type = "header-only"
include-dirs = ["GTE"]
# README.md:5 "The engine is written in C++ 14".
interface-cxx-standard = "c++14"
