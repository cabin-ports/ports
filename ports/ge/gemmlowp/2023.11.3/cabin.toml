[package.upstream]
url = "https://github.com/google/gemmlowp/archive/16e8662c34917be0065110bfcd9cc27d30f52fdf.tar.gz"
checksum = "sha256:c3feb896a1b42595cf9a508ed64ed0dc3cd84fffdb8eed790d02d0534ab322ce"
format = "tar.gz"
strip-prefix = "gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf"

# Upstream has no tags or version; 2023.11.3 is the date of this commit
# (master's head, 2023-11-03).
[package]
name = "cabin-ports/gemmlowp"
version = "2023.11.3"
license = "Apache-2.0"
include = [
  "AUTHORS",
  "CONTRIBUTORS",
  "LICENSE",
  "eight_bit_int_gemm",
  "fixedpoint",
  "internal",
  "meta",
  "profiling",
  "public",
]

# The include root is the source root, as upstream installs the headers under
# include/gemmlowp (contrib/CMakeLists.txt).  The one compiled file is
# upstream's eight_bit_int_gemm library; everything else is headers.
[target.gemmlowp]
type = "library"
sources = ["eight_bit_int_gemm/eight_bit_int_gemm.cc"]
include-dirs = ["."]
# Upstream states C++11 (README.md, contrib/CMakeLists.txt); cl's floor is C++14.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"

# The library's own build defines these on Windows (contrib/CMakeLists.txt).
[target.'cfg(os = "windows")'.profile]
defines = ["NOMINMAX", "WIN32_LEAN_AND_MEAN", "NOGDI"]

# The worker pool uses pthreads; upstream links them except on Android and
# Windows (flags.bzl).
[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]
