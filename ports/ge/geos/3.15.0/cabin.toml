[package.upstream]
# The tag archive: OSGeo's release tarball is .tar.bz2, which Cabin does
# not extract.
url = "https://github.com/libgeos/geos/archive/refs/tags/3.15.0.tar.gz"
checksum = "sha256:134aaf78026f4311737e20ff1465cd31a48c4ca8858fb68e99d13ccd3d52753a"
format = "tar.gz"
strip-prefix = "geos-3.15.0"
# - 0001 fills in the two templates the copy steps place, as CMake's
#   configure_file would, with Version.txt's versions.
# - 0002 opens every C++ source of geos and geos_c with pragmas standing in
#   for upstream's -ffp-contract=off and, for 32-bit GCC, -ffloat-store,
#   which Cabin cannot pass (GCC lacks the STDC pragma, hence its optimize
#   form): fused multiply-adds break DD.cpp's double-double arithmetic.  The
#   pragmas precede every #include of each TU, not a shared header, to
#   match upstream's per-TU flags.  MSVC's default /fp:precise is upstream's
#   setting.  Unlike upstream, consumers' compiles do not get the setting,
#   including geos's header-inline floating-point code compiled there.
# - 0003 adds nlohmann/json 3.11.3's MIT license; see [package].
# Every file 0001 and 0002 change opens with a dated notice saying so, as
# LGPL-2.1 section 2(b) requires.
patches = [
  "patches/0001-add-the-generated-version-and-c-api-headers.patch",
  "patches/0002-reproduce-upstream-floating-point-flags.patch",
  "patches/0003-add-mit-license-for-nlohmann-json.patch",
]

[[package.upstream.copy]]
from = "include/geos/version.h.in"
to = "include/geos/version.h"

[[package.upstream.copy]]
from = "capi/geos_c.h.in"
to = "capi/geos_c.h"

[package]
name = "cabin-ports/geos"
version = "3.15.0"
# LGPL-2.1 (COPYING); distributing a binary that links geos statically
# carries the obligations of LGPL-2.1 section 6.  Code from elsewhere:
# - src/deps/ryu: Ulf Adams's Ryu, Apache-2.0 or BSL-1.0, both texts beside it.
# - include/geos/vend/json.hpp: Niels Lohmann's nlohmann/json 3.11.3, MIT
#   (LICENSE.nlohmann-json), which covers its Hoehrmann and Loitsch parts
#   too; :3100-3201 are The Abseil Authors', Apache-2.0 (its text is
#   src/deps/ryu/LICENSE-Apache2), and :330-2363 are Evan Nemerson's
#   Hedley, CC0-1.0, which needs no notice.
# - src/shape/fractal/HilbertCode.cpp:62-202: rawrunprotected's
#   hilbert_curves, public domain.
# - src/operation/valid/MakeValid.cpp and
#   src/operation/polygonize/BuildArea.cpp: ported from librttopo's
#   rtgeom_geos.c and relicensed to LGPL by its copyright holder (:24-27 of
#   each); src/algorithm/RobustDeterminant.cpp: Olivier Devillers's code,
#   allowed under the LGPL by its author (:26-37).
# - src/util/string.cpp:30-39: endsWith after Stack Overflow answer 874160 by
#   kdt, CC BY-SA 3.0; no terms ship, a length check and one compare call
#   being too slight for copyright.
# Line numbers are those of the patched files.
include = ["COPYING", "LICENSE.nlohmann-json", "capi", "include", "patches", "src"]
# Upstream builds Ryu as C99; C11 is the oldest Cabin can lower for MSVC.
c-standard = "c11"
cxx-standard = "c++17"

# Ryu's headers, private to geos's own build as upstream has them.
[profile]
include-dirs = ["src/deps"]

# Not ported: shared libraries, the tests, benchmarks and utilities, and
# the CMake and pkg-config files.  Upstream's -fno-fast-math for Intel's
# compiler is not reproduced; its OpenMP SIMD flags affect no source.
