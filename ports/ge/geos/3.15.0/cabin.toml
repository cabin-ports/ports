include-dirs = ["include"]
# Upstream defines this for geos and its consumers; without it,
# geos/geom/Geometry.h warns that the C++ API is unstable.
defines = ["USE_UNSTABLE_GEOS_CPP_API"]
interface-defines = ["USE_UNSTABLE_GEOS_CPP_API"]
interface-c-standard = "none"
interface-cxx-standard = "c++17"
links = "geos"

# Linked to geos privately, as upstream does, so C consumers get neither
# geos's define nor its C++ standard.  geos_c.h includes geos/export.h.
[target.geos_c]
type = "library"
sources = ["capi/geos_c.cpp", "capi/geos_ts_c.cpp"]
include-dirs = ["capi", "include"]
deps = ["geos"]
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "geos_c"
