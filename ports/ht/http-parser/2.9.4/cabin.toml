[package.upstream]
url = "https://github.com/nodejs/http-parser/archive/refs/tags/v2.9.4.tar.gz"
checksum = "sha256:467b9e30fd0979ee301065e70f637d525c28193449e1b13fbcb1b1fab3ad224f"
format = "tar.gz"
strip-prefix = "http-parser-2.9.4"

# http_parser.h sits at the archive root beside the sources and test
# programs, so it is copied out and the root stays off the include path.
[[package.upstream.copy]]
from = "http_parser.h"
to = "include/http_parser.h"

[package]
name = "cabin-ports/http-parser"
version = "2.9.4"
license = "MIT"
include = ["LICENSE-MIT", "http_parser.c", "http_parser.h", "include"]
# http_parser.c is C99; C11 is the oldest standard Cabin can request from
# MSVC.  http_parser.h includes <stdint.h>, which C++ has from C++11.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# Upstream archived the repository after this release; its successor is
# ported as cabin-ports/llhttp.
#
# Built non-strict (HTTP_PARSER_STRICT=0), as upstream's Makefile and GYP
# builds do; the GYP build also passes the define to dependents, so
# consumers see the mode the library was built in.  Not ported: the
# strict-mode http_parser_strict library the GYP build also defines.
#
# Licence: MIT, LICENSE-MIT (Joyent, Inc. and other Node contributors).
# Until 2017 upstream credited NGINX's src/http/ngx_http_parse.c; it removed
# that attribution because, "to the best of everyone's knowledge, no actual
# NGINX code remains" (commit 89279ab), and no NGINX notice ships in this
# release.
[target.http_parser]
type = "library"
sources = ["http_parser.c"]
include-dirs = ["include"]
defines = ["HTTP_PARSER_STRICT=0"]
interface-defines = ["HTTP_PARSER_STRICT=0"]
links = "http_parser"
