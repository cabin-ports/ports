include-dirs = ["include"]
defines = [
  "CAPSTONE_USE_SYS_DYN_MEM",
  "CAPSTONE_HAS_ARM",
  "CAPSTONE_HAS_ARM64",
  "CAPSTONE_HAS_MIPS",
  "CAPSTONE_HAS_POWERPC",
  "CAPSTONE_HAS_X86",
  "CAPSTONE_HAS_SPARC",
  "CAPSTONE_HAS_SYSZ",
  "CAPSTONE_HAS_XCORE",
  "CAPSTONE_HAS_M68K",
  "CAPSTONE_HAS_TMS320C64X",
  "CAPSTONE_HAS_M680X",
  "CAPSTONE_HAS_EVM",
  "CAPSTONE_HAS_WASM",
  "CAPSTONE_HAS_MOS65XX",
  "CAPSTONE_HAS_BPF",
  "CAPSTONE_HAS_RISCV",
  "CAPSTONE_HAS_SH",
  "CAPSTONE_HAS_TRICORE",
]
# Upstream's C_STANDARD 99 (:654), which CMake compiles as gnu99 on GCC
# and Clang.  C11 is the oldest standard Cabin can lower for MSVC, and
# Cabin's gnu-extensions cannot be limited to GCC and Clang, so the build
# is strict C11.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "capstone"

[profile]
include-dirs = ["private-include"]
