[package.upstream]
# The 5.0.9 tag archive (commit 0225758487), the bytes vcpkg pins
# (SHA-512); the release asset is a .tar.xz of the same tree less the
# dotfiles.
url = "https://github.com/capstone-engine/capstone/archive/refs/tags/5.0.9.tar.gz"
checksum = "sha256:0619da31af08152600af95c481527ef6d756c0a8404fca7544a4fdf6dfc2c0f9"
format = "tar.gz"
strip-prefix = "capstone-5.0.9"

# arch/TriCore/TriCoreInstPrinter.c includes <platform.h>, which
# upstream's CMake finds as include/platform.h, an older copy of
# include/capstone/platform.h that it does not install.  It is placed on
# the package's private include path, so the public include root holds
# only include/capstone, the headers CMake installs (CMakeLists.txt:748).
[[package.upstream.copy]]
from = "include/platform.h"
to = "private-include/platform.h"

[package]
name = "cabin-ports/capstone"
version = "5.0.9"
include = [
  "LICENSE.TXT",
  "LICENSE_LLVM.TXT",
  "arch",
  "include/capstone",
  "private-include",
  "cs.c",
  "cs_priv.h",
  "cs_simple_types.h",
  "LEB128.h",
  "Mapping.c",
  "Mapping.h",
  "MathExtras.h",
  "MCDisassembler.h",
  "MCFixedLenDisassembler.h",
  "MCInst.c",
  "MCInst.h",
  "MCInstrDesc.c",
  "MCInstrDesc.h",
  "MCRegisterInfo.c",
  "MCRegisterInfo.h",
  "SStream.c",
  "SStream.h",
  "utils.c",
  "utils.h",
]

# The static library upstream's CMake builds by default (capstone_static,
# libcapstone.a / capstone.lib) with every one of its 18 architectures,
# which CAPSTONE_ARCHITECTURE_DEFAULT turns on (CMakeLists.txt:60, :68, :94):
# SOURCES_ENGINE plus each SOURCES_<ARCH>, X86ATTInstPrinter.c included
# outside the diet build (:136-597), with each architecture's
# CAPSTONE_HAS_* and CAPSTONE_USE_SYS_DYN_MEM, which
# CAPSTONE_USE_DEFAULT_ALLOC turns on (:115) so the library allocates
# with malloc and friends unless a caller installs CS_OPT_MEM.  Consumers
# include <capstone/capstone.h>, as with CMake's exported target.  Off, as
# by default: the diet build, CAPSTONE_X86_REDUCE,
# CAPSTONE_X86_ATT_DISABLE, CAPSTONE_DEBUG and the OS X kernel build.
# Not ported: the shared library (CAPSTONE_SHARED); the universal2
# (x86_64 and arm64) library CMake builds on macOS by default (:72-86),
# where Cabin builds for the one target architecture; cstool, cstest,
# the tests and bindings; pkg-config's extra -I.../capstone include root;
# and the Windows CE headers (include/windowsce, windowsce/) and Windows
# kernel-mode allocator (windows/, cs.c:22-24) that only those targets
# use.
[target.capstone]
type = "library"
sources = [
  "cs.c",
  "Mapping.c",
  "MCInst.c",
  "MCInstrDesc.c",
  "MCRegisterInfo.c",
  "SStream.c",
  "utils.c",
  "arch/ARM/ARMDisassembler.c",
  "arch/ARM/ARMInstPrinter.c",
  "arch/ARM/ARMMapping.c",
  "arch/ARM/ARMModule.c",
  "arch/AArch64/AArch64BaseInfo.c",
  "arch/AArch64/AArch64Disassembler.c",
  "arch/AArch64/AArch64InstPrinter.c",
  "arch/AArch64/AArch64Mapping.c",
  "arch/AArch64/AArch64Module.c",
  "arch/Mips/MipsDisassembler.c",
  "arch/Mips/MipsInstPrinter.c",
  "arch/Mips/MipsMapping.c",
  "arch/Mips/MipsModule.c",
  "arch/PowerPC/PPCDisassembler.c",
  "arch/PowerPC/PPCInstPrinter.c",
  "arch/PowerPC/PPCMapping.c",
  "arch/PowerPC/PPCModule.c",
  "arch/X86/X86Disassembler.c",
  "arch/X86/X86DisassemblerDecoder.c",
  "arch/X86/X86IntelInstPrinter.c",
  "arch/X86/X86InstPrinterCommon.c",
  "arch/X86/X86Mapping.c",
  "arch/X86/X86Module.c",
  "arch/X86/X86ATTInstPrinter.c",
  "arch/Sparc/SparcDisassembler.c",
  "arch/Sparc/SparcInstPrinter.c",
  "arch/Sparc/SparcMapping.c",
  "arch/Sparc/SparcModule.c",
  "arch/SystemZ/SystemZDisassembler.c",
  "arch/SystemZ/SystemZInstPrinter.c",
  "arch/SystemZ/SystemZMapping.c",
  "arch/SystemZ/SystemZModule.c",
  "arch/SystemZ/SystemZMCTargetDesc.c",
  "arch/XCore/XCoreDisassembler.c",
  "arch/XCore/XCoreInstPrinter.c",
  "arch/XCore/XCoreMapping.c",
  "arch/XCore/XCoreModule.c",
  "arch/M68K/M68KDisassembler.c",
  "arch/M68K/M68KInstPrinter.c",
  "arch/M68K/M68KModule.c",
  "arch/TMS320C64x/TMS320C64xDisassembler.c",
  "arch/TMS320C64x/TMS320C64xInstPrinter.c",
  "arch/TMS320C64x/TMS320C64xMapping.c",
  "arch/TMS320C64x/TMS320C64xModule.c",
  "arch/M680X/M680XDisassembler.c",
  "arch/M680X/M680XInstPrinter.c",
  "arch/M680X/M680XModule.c",
  "arch/EVM/EVMDisassembler.c",
  "arch/EVM/EVMInstPrinter.c",
  "arch/EVM/EVMMapping.c",
  "arch/EVM/EVMModule.c",
  "arch/WASM/WASMDisassembler.c",
  "arch/WASM/WASMInstPrinter.c",
  "arch/WASM/WASMMapping.c",
  "arch/WASM/WASMModule.c",
  "arch/MOS65XX/MOS65XXModule.c",
  "arch/MOS65XX/MOS65XXDisassembler.c",
  "arch/BPF/BPFDisassembler.c",
  "arch/BPF/BPFInstPrinter.c",
  "arch/BPF/BPFMapping.c",
  "arch/BPF/BPFModule.c",
  "arch/RISCV/RISCVDisassembler.c",
  "arch/RISCV/RISCVInstPrinter.c",
  "arch/RISCV/RISCVMapping.c",
  "arch/RISCV/RISCVModule.c",
  "arch/SH/SHDisassembler.c",
  "arch/SH/SHInstPrinter.c",
  "arch/SH/SHModule.c",
  "arch/TriCore/TriCoreDisassembler.c",
  "arch/TriCore/TriCoreInstPrinter.c",
