[package.upstream]
url = "https://github.com/machinezone/IXWebSocket/archive/refs/tags/v13.0.0.tar.gz"
checksum = "sha256:39620f5b7f85f806e8189cffde9c3ffbb37f8374fccf57d3e5aaced929690ea3"
format = "tar.gz"
strip-prefix = "IXWebSocket-13.0.0"
# Patch 0001 adds ixwebsocket/IXWebSocketCodecConfig.h, which CMake
# configures from IXWebSocketCodecConfig.h.in (CMakeLists.txt:316-321),
# with the value the default USE_ZLIB gives it.
patches = ["patches/0001-add-the-generated-codec-config-header.patch"]

[package]
name = "cabin-ports/ixwebsocket"
version = "13.0.0"
# IXNetSystem.cpp:557 credits the ASIO library for network_to_host_short;
# its copyright significance is uncertain.
# IXSocketMbedTLS.cpp:6-8 credits rottor12/WsClientLib and mbedtls's
# mini_client.c for some of its code; its copyright significance is
# uncertain.
license = "BSD-3-Clause AND MIT AND Zlib"
include = ["LICENSE.txt", "ixwebsocket", "patches"]

[dependencies]
"cabin-ports/zlib" = "^1.3"

# The static library upstream's CMake builds by default (CMakeLists.txt:52-90,
# :227-231): zlib on, asynchronous DNS, and no TLS.  Not ported: TLS
# (USE_TLS, off by default) and its OpenSSL, LibreSSL, mbedtls,
# SecureTransport and Network.framework backends.  Not reproduced: the
# position-independent code CMake enables on Linux (CMakeLists.txt:32-34;
# Cabin drops a dependency's raw compiler flags), so the archive is not built
# for linking into a shared object there; and the libatomic link
# CMake/CheckAtomic.cmake adds on targets whose 64-bit std::atomic needs it,
# which consumers on such targets add themselves.  IXWebSocketSendInfo.h uses
# size_t without including a header that declares it, so it compiles only
# after one that does (measured).
[target.ixwebsocket]
type = "library"
sources = [
  "ixwebsocket/IXBench.cpp",
  "ixwebsocket/IXCancellationRequest.cpp",
  "ixwebsocket/IXConnectionState.cpp",
  "ixwebsocket/IXDNSLookup.cpp",
  "ixwebsocket/IXExponentialBackoff.cpp",
  "ixwebsocket/IXGetFreePort.cpp",
  "ixwebsocket/IXGzipCodec.cpp",
  "ixwebsocket/IXHttp.cpp",
  "ixwebsocket/IXHttpClient.cpp",
  "ixwebsocket/IXHttpServer.cpp",
  "ixwebsocket/IXNetSystem.cpp",
  "ixwebsocket/IXSelectInterrupt.cpp",
  "ixwebsocket/IXSelectInterruptEvent.cpp",
  "ixwebsocket/IXSelectInterruptFactory.cpp",
  "ixwebsocket/IXSelectInterruptPipe.cpp",
  "ixwebsocket/IXSetThreadName.cpp",
  "ixwebsocket/IXSocket.cpp",
  "ixwebsocket/IXSocketConnect.cpp",
  "ixwebsocket/IXSocketFactory.cpp",
  "ixwebsocket/IXSocketServer.cpp",
  "ixwebsocket/IXSocketTLSOptions.cpp",
  "ixwebsocket/IXSocks5.cpp",
  "ixwebsocket/IXStrCaseCompare.cpp",
  "ixwebsocket/IXUdpSocket.cpp",
  "ixwebsocket/IXUrlParser.cpp",
  "ixwebsocket/IXUserAgent.cpp",
  "ixwebsocket/IXUuid.cpp",
  "ixwebsocket/IXWebSocket.cpp",
  "ixwebsocket/IXWebSocketCloseConstants.cpp",
  "ixwebsocket/IXWebSocketHandshake.cpp",
  "ixwebsocket/IXWebSocketHttpHeaders.cpp",
  "ixwebsocket/IXWebSocketPerMessageDeflate.cpp",
  "ixwebsocket/IXWebSocketPerMessageDeflateCodec.cpp",
  "ixwebsocket/IXWebSocketPerMessageDeflateOptions.cpp",
  "ixwebsocket/IXWebSocketProxyServer.cpp",
  "ixwebsocket/IXWebSocketServer.cpp",
  "ixwebsocket/IXWebSocketTransport.cpp",
]
include-dirs = ["."]
# Upstream requires C++11 (CMakeLists.txt:17-22); C++14 is the oldest
# standard Cabin can request from MSVC.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
defines = ["IXWEBSOCKET_USE_ZLIB"]
interface-defines = ["IXWEBSOCKET_USE_ZLIB"]
links = "ixwebsocket"
deps = [{ name = "cabin-ports/zlib", public = true }]

# CMakeLists.txt:333-336.
[target.'cfg(os = "windows")'.profile]
defines = ["_CRT_SECURE_NO_WARNINGS"]
link-libs = ["wsock32", "ws2_32", "shlwapi"]

# Threads::Threads (CMakeLists.txt:342-348, skipped on Apple, where libSystem
# provides pthreads).
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
