[package.upstream]
url = "https://github.com/dropbox/json11/archive/refs/tags/v1.0.0.tar.gz"
checksum = "sha256:bab960eebc084d26aaf117b8b8809aecec1e86e371a173655b7dffb49383b0bf"
format = "tar.gz"
strip-prefix = "json11-1.0.0"

[package]
name = "cabin-ports/json11"
version = "1.0.0"
license = "MIT"
include = ["LICENSE.txt", "json11.hpp", "json11.cpp"]

# interface-cxx-standard follows CMakeLists.txt (CMAKE_CXX_STANDARD 11) and
# README.md ("a tiny JSON library for C++11").
[target.json11]
type = "library"
sources = ["json11.cpp"]
include-dirs = ["."]
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
links = "json11"
