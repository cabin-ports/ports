[package.upstream]
# The tag archive ConanCenter pins; the release has no assets.
url = "https://github.com/pboettch/json-schema-validator/archive/refs/tags/2.4.1.tar.gz"
checksum = "sha256:0c8bf7ba59bd50e312d82da4bab1d49cf3e2211cfbd659472f9c90505d2a4e4c"
format = "tar.gz"
strip-prefix = "json-schema-validator-2.4.1"
# src/json-patch.cpp:10-68 embeds Mads Kristensen's Apache-2.0 JSON Patch
# schema as of SchemaStore commit f7a0789 (2020), with upstream's author's
# fixes; 0001 adds the license text the archive lacks.
# src/string-format-check.cpp:120-140 and :209-288 quote ABNF (and a note)
# from RFC 3339 and RFC 3986, copyright The Internet Society; 0002 adds
# both RFCs' copyright statements as NOTICE.RFC.  RFC 3339 permits such use
# with its notice and permission paragraph, but RFC 3986's BCP 78 grants
# rights only to the ISOC and the IETF, and it predates the IETF Trust
# Legal Provisions, so no grant to redistribute that quotation has been
# found.
patches = [
  "patches/0001-add-apache-2.0-license-for-json-patch-schema.patch",
  "patches/0002-add-rfc-copyright-statements-for-abnf-comments.patch",
]

# The one public header, where the sources include it as
# <nlohmann/json-schema.hpp>; src/ and its private headers stay off
# consumers' include path.
[[package.upstream.copy]]
from = "src/nlohmann/json-schema.hpp"
to = "include/nlohmann/json-schema.hpp"

[package]
name = "cabin-ports/json-schema-validator"
version = "2.4.1"
# LICENSE is MIT, and src/smtp-address-validator.cpp carries its own MIT
# notice; the draft-07 meta-schema in src/json-schema-draft7.json.cpp has
# no notice of its own.
#
# src/string-format-check.cpp:193 (hostname) is copied from
# https://stackoverflow.com/a/3824105 by Sakari A. Maaranen
# (https://stackoverflow.com/users/462036), modified from revisions 1-3 of
# https://stackoverflow.com/a/106223 by Jorge Ferreira
# (https://stackoverflow.com/users/6508, then "smink"), both answering
# "Regular expression to match DNS hostname or IP Address?" under CC BY-SA
# 2.5 (https://creativecommons.org/licenses/by-sa/2.5/legalcode).  That
# line is distributed under CC BY-SA 2.5, the rest under the licenses
# above.
#
# The regular expressions src/string-format-check.cpp credits to Jeff
# Roberson's article
# http://jmrware.com/articles/2009/uri_regexp/URI_regex.html and to
# jhermsmeier/uri.regex (:25, :291), the host rules (:156-188) and the URI
# check (:296-330), transcribe RFC 3986's ABNF rule by rule, with the
# article's ls32 factoring and, in the URI check, Jeffrey Friedl's
# dec-octet and capture groups.  Neither source grants a license, but
# these are too slight to carry copyright, so no terms apply.
include = [
  "LICENSE",
  "LICENSE.Apache-2.0",
  "NOTICE.RFC",
  "include",
  "patches",
  "src",
]

[dependencies]
"cabin-ports/nlohmann_json" = "^3.12"

# The static library upstream builds by default, so json-schema.hpp's
# export macro stays empty.  Upstream needs only C++11; C++14 is the oldest
# standard Cabin can request from MSVC.  A C++11 consumer then sees
# nlohmann_json's key comparator as std::less<std::string> rather than
# std::less<>, which is empty and orders alike; upstream's own build mixes
# standards the same way.  std::regex is used, as upstream does with every
# compiler but GCC before 4.9.
#
# Not ported: the shared library, examples, tests, CMake package files,
# and warning flags.
[target.nlohmann_json_schema_validator]
type = "library"
sources = [
  "src/json-patch.cpp",
  "src/json-schema-draft7.json.cpp",
  "src/json-uri.cpp",
  "src/json-validator.cpp",
  "src/smtp-address-validator.cpp",
  "src/string-format-check.cpp",
]
include-dirs = ["include"]
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
links = "nlohmann_json_schema_validator"
deps = [{ name = "cabin-ports/nlohmann_json", public = true }]
