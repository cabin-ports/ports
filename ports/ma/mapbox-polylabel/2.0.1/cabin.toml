[package.upstream]
url = "https://github.com/mapbox/polylabel/archive/refs/tags/v2.0.1.tar.gz"
checksum = "sha256:d51ec39f9f1bc46c551dfdf642f72057a8c2cde2c5e89bc70e0bd712fad63a75"
format = "tar.gz"
strip-prefix = "polylabel-2.0.1"

[package]
name = "cabin-ports/mapbox-polylabel"
version = "2.0.1"
license = "ISC"
include = ["LICENSE", "include"]

[dependencies]
# ConanCenter pairs polylabel with geometry.hpp 2.0.3; upstream's Makefile
# tests against mason's geometry 0.9.2.
"cabin-ports/mapbox-geometry" = "^2.0"

# Upstream's v2.1.0 removed this C++ header; 2.0.1 is its last C++ release.
# Only point<double> compiles: polylabel.hpp:61 and :141 mix double with
# the coordinate type.
[target.mapbox-polylabel]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [{ name = "cabin-ports/mapbox-geometry", public = true }]
