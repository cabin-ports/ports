[package.upstream]
url = "https://github.com/progsource/maddy/archive/refs/tags/1.6.0.tar.gz"
checksum = "sha256:811b19efbc2fbf1957486ed78aabaf5d164d15f84464f7b4a7033b44591845c5"
format = "tar.gz"
strip-prefix = "maddy-1.6.0"

[package]
name = "cabin-ports/maddy"
version = "1.6.0"
# LICENSE names AUTHORS for the contributors.
include = ["AUTHORS", "LICENSE", "include"]

# Do not feed maddy untrusted input: it escapes no HTML, its table parser
# does not validate table structure, and its inline parsers take time
# quadratic in line length.
[target.maddy]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
