[package.upstream]
url = "https://github.com/akheron/jansson/releases/download/v2.15.1/jansson-2.15.1.tar.gz"
checksum = "sha256:0c7114dc0b2d22a670724a1f95922029d7077c19dbf79a584cb8084d2f267f2f"
format = "tar.gz"
strip-prefix = "jansson-2.15.1"
# The patch adds include/jansson_config.h, which CMake configures, as a
# macOS configure writes it, with the two values that differ elsewhere left
# to the preprocessor: JSON_INTEGER_FORMAT ("I64d" on Windows) and the
# atomic and sync builtins (found with GCC and Clang, not cl).
# jansson.h counts references inline, so the library and its consumers must
# agree on how; the header asks __GNUC__, which clang-cl and Clang targeting
# MSVC do not define, so they count without atomics, as cl must.  A C and a
# C++ compiler that target two Windows environments, such as MinGW-w64 GCC
# and Clang targeting MSVC, disagree and are not supported.
patches = ["patches/0001-add-the-generated-jansson-config-h.patch"]

# jansson.h beside jansson_config.h, as CMake's build copies it, so that
# src/ and its private headers stay off consumers' include path.
[[package.upstream.copy]]
from = "src/jansson.h"
to = "include/jansson.h"

[package]
name = "cabin-ports/jansson"
version = "2.15.1"
# LICENSE carries the MIT terms and, as its exception, the notice
# src/dtoa.c is distributed under.
include = ["LICENSE", "include", "patches", "src"]
# Upstream sets no standard; the code is C99.  C11 is the oldest
# standard Cabin can lower for MSVC.
c-standard = "c11"
# jansson_config.h's json_int_t is long long, and jansson.h's reference
# counting is in static inline functions.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# The static library CMake builds by default, from every source in src/
# (dtoa.c included, as USE_DTOA is on by default).  JANSSON_USING_CMAKE is
# public, as in CMake's build.  Instead of HAVE_CONFIG_H and
# jansson_private_config.h, this port passes the values the sources read as
# defines; those below hold on every platform, each random source being
# read only on its own platform.  The CryptoAPI is resolved at run time, so
# no library is linked for it.
#
# Big-endian targets are not supported: WORDS_BIGENDIAN is never set, so
# dtoa.c would misformat reals.  Not ported: the shared library and
# JANSSON_STATIC_CRT.  Not reproduced: position-independent code (Cabin
# drops a dependency's raw compiler flags), so the archive is not built
# for linking into a shared object.
[target.jansson]
type = "library"
sources = [
  "src/dtoa.c",
  "src/dump.c",
  "src/error.c",
  "src/hashtable.c",
  "src/hashtable_seed.c",
  "src/load.c",
  "src/memory.c",
  "src/pack_unpack.c",
  "src/strbuffer.c",
  "src/strconv.c",
  "src/utf.c",
  "src/value.c",
  "src/version.c",
]
include-dirs = ["include"]
defines = [
  "DTOA_ENABLED=1",
  "HAVE_FCNTL_H=1",
  "HAVE_STDINT_H=1",
  "HAVE_SYS_STAT_H=1",
  "HAVE_SYS_TYPES_H=1",
  "JANSSON_USING_CMAKE",
  "USE_URANDOM=1",
  "USE_WINDOWS_CRYPTOAPI=1",
]
interface-defines = ["JANSSON_USING_CMAKE"]
links = "jansson"

# What CMake's checks find on Linux and macOS but not with MSVC: the POSIX
# headers, the /dev/urandom reads and fallback seed, and sched_yield.
# MSVC's CRT has open, read, close and getpid too, but the sources read
# those results only off Windows.
[target.'cfg(family = "unix")'.profile]
defines = [
  "HAVE_CLOSE=1",
  "HAVE_GETPID=1",
  "HAVE_GETTIMEOFDAY=1",
  "HAVE_OPEN=1",
  "HAVE_READ=1",
  "HAVE_SCHED_H=1",
  "HAVE_SCHED_YIELD=1",
  "HAVE_SYS_PARAM_H=1",
  "HAVE_SYS_TIME_H=1",
  "HAVE_UNISTD_H=1",
]

# glibc's <endian.h>, which lookup3.h reads for its hash's byte order.
[target.'cfg(os = "linux")'.profile]
defines = ["HAVE_ENDIAN_H=1"]

# MinGW-w64, where CMake's checks also find these, so json_dumpfd and
# json_loadfd work as upstream builds them; with cl they fail by design.
# Every GCC that builds on Windows has them, and env reads "gnu" under a
# MinGW --target.  Without --target, env reads "msvc" on any Windows build
# machine, so Clang targeting MinGW gets cl's values there.
[target.'cfg(all(os = "windows", any(cc = "gcc", env = "gnu")))'.profile]
defines = [
  "HAVE_GETTIMEOFDAY=1",
  "HAVE_SYS_PARAM_H=1",
  "HAVE_SYS_TIME_H=1",
  "HAVE_UNISTD_H=1",
]

# The builtins CMake's compile checks find, for hashtable_seed.c's one-time
# seeding.  Clang targeting MSVC gets them too but seeds as cl does:
# Windows uses its own interlocked path either way.
[target.'cfg(any(cc = "gcc", cc = "clang", cc = "apple-clang"))'.profile]
defines = ["HAVE_ATOMIC_BUILTINS=1", "HAVE_SYNC_BUILTINS=1"]
