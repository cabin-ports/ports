[package.upstream]
url = "https://github.com/boostorg/bimap/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:b7ef51a7d5d58317ffb9a96444b3f1ae30b4d22ee9b628bd7478bfaf828f45db"
format = "tar.gz"
strip-prefix = "bimap-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-bimap"
version = "1.92.0"
license = "BSL-1.0"
# `include` lists the tree without doc/, the documentation nothing here
# builds: doc/html/images/extern/googlesoc.png is Google's Summer of Code
# logo, with no grant.
include = [
  ".gitattributes",
  ".github",
  ".travis.yml",
  "CMakeLists.txt",
  "LICENSE_1_0.txt",
  "build.jam",
  "example",
  "include",
  "index.html",
  "meta",
  "patches",
  "test",
]

[dependencies]
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container-hash" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-iterator" = "=1.92.0"
"cabin-ports/boost-lambda" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-multi-index" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

[target.boost_bimap]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container-hash", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-iterator", public = true },
  { name = "cabin-ports/boost-lambda", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-multi-index", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]
