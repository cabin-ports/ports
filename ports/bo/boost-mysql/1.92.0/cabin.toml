[package.upstream]
url = "https://github.com/boostorg/mysql/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:ea58389ec77ae13de88bfe5abc99df8e89f51589b84b1dbfaff6b079215175b0"
format = "tar.gz"
strip-prefix = "mysql-boost-1.92.0"

[package]
name = "cabin-ports/boost-mysql"
version = "1.92.0"
license = "BSL-1.0"

[dependencies]
"cabin-ports/boost-asio" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-charconv" = "=1.92.0"
"cabin-ports/boost-compat" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-describe" = "=1.92.0"
"cabin-ports/boost-endian" = "=1.92.0"
"cabin-ports/boost-intrusive" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-pfr" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-variant2" = "=1.92.0"
"cabin-ports/openssl" = "=4.1.0"

# Requests the openssl port's own build of OpenSSL in place of the system's.
[features]
vendored-openssl = ["cabin-ports/openssl/vendored"]

# Upstream's CMake boost_mysql: header-only, linking OpenSSL's ssl and crypto
# libraries and Threads, which boost-asio links where it needs a library.  A
# consumer that defines BOOST_MYSQL_SEPARATE_COMPILATION compiles
# <boost/mysql/src.hpp> in one of its own sources.  Upstream asks for C++11;
# Boost.Asio, Charconv, Container and PFR set the C++14 floor.
[target.boost_mysql]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-asio", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-charconv", public = true },
  { name = "cabin-ports/boost-compat", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-describe", public = true },
  { name = "cabin-ports/boost-endian", public = true },
  { name = "cabin-ports/boost-intrusive", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-pfr", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-variant2", public = true },
  { name = "cabin-ports/openssl:ssl", public = true },
  { name = "cabin-ports/openssl:crypto", public = true },
]
