[package.upstream]
url = "https://github.com/boostorg/iterator/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:5f07301876b74af4387b4e7d8f3d01172978c9c321ca403791307de24a5b775d"
format = "tar.gz"
strip-prefix = "iterator-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-iterator"
version = "1.92.0"
license = "BSL-1.0 AND LicenseRef-Boost-pre-BSL"
# include/boost/iterator/shared_container_iterator.hpp:1-4 is under Ronald
# Garcia's 2002 Boost permission notice.  `include` leaves out doc/, which
# nothing here builds: doc/docutils.sty (Alexander Schmolck, 2002) has an
# empty licence field.
include = [
  ".gitattributes",
  ".github",
  "CMakeLists.txt",
  "LICENSE_1_0.txt",
  "README.md",
  "appveyor.yml",
  "build.jam",
  "example",
  "include",
  "index.html",
  "meta",
  "patches",
  "test",
]

[dependencies]
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-detail" = "=1.92.0"
"cabin-ports/boost-fusion" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

[target.boost_iterator]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-detail", public = true },
  { name = "cabin-ports/boost-fusion", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]
