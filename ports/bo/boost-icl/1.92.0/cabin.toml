[package.upstream]
url = "https://github.com/boostorg/icl/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:cc6a692c52933a6f6927cbf62ad33da3e8901103598da8177c6921ce4c02f826"
format = "tar.gz"
strip-prefix = "icl-boost-1.92.0"

[package]
name = "cabin-ports/boost-icl"
version = "1.92.0"
license = "BSL-1.0"
# `include` leaves out doc/, which nothing here builds: the doc/boostcon09
# slides embed a painting reproduction ("klee06") with no stated source or
# terms.
include = [
  ".drone",
  ".drone.star",
  ".gitattributes",
  ".github",
  ".travis.yml",
  "CMakeLists.txt",
  "build.jam",
  "example",
  "include",
  "index.html",
  "meta",
  "test",
]

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-date-time" = "=1.92.0"
"cabin-ports/boost-detail" = "=1.92.0"
"cabin-ports/boost-iterator" = "=1.92.0"
"cabin-ports/boost-move" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-range" = "=1.92.0"
"cabin-ports/boost-rational" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

[target.boost_icl]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-date-time", public = true },
  { name = "cabin-ports/boost-detail", public = true },
  { name = "cabin-ports/boost-iterator", public = true },
  { name = "cabin-ports/boost-move", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-range", public = true },
  { name = "cabin-ports/boost-rational", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]
