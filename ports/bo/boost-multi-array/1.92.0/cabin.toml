[package.upstream]
url = "https://github.com/boostorg/multi_array/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:94db0d8475d9f5a7645519a9bac1988e9fa0f7c46b5c54bc512ee543893520f1"
format = "tar.gz"
strip-prefix = "multi_array-boost-1.92.0"

[package]
name = "cabin-ports/boost-multi-array"
version = "1.92.0"
license = "BSL-1.0 AND HPND-sell-variant AND LicenseRef-Boost-pre-BSL"
# include/boost/multi_array/algorithm.hpp:6-27 carries the HP and SGI STL
# notice.  test/Jamfile.v2:1-5 carries David Abrahams' 2003 Boost permission
# notice.  `include` leaves out doc/, which nothing here builds:
# doc/iterator_categories.html is WG21 paper N1297, with no stated terms.
include = [
  ".gitattributes",
  ".travis.yml",
  "CMakeLists.txt",
  "appveyor.yml",
  "build.jam",
  "example",
  "include",
  "index.html",
  "meta",
  "test",
]

[dependencies]
"cabin-ports/boost-array" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-functional" = "=1.92.0"
"cabin-ports/boost-iterator" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"

[target.boost_multi_array]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-array", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-functional", public = true },
  { name = "cabin-ports/boost-iterator", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
]
