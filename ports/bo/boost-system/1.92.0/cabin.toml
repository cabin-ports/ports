[package.upstream]
url = "https://github.com/boostorg/system/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:7eead7ca317453ae546fb6444212c0429e909f102654b69847f8d8904d18735a"
format = "tar.gz"
strip-prefix = "system-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-system"
version = "1.92.0"
license = "BSL-1.0"

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-compat" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-variant2" = "=1.92.0"
"cabin-ports/boost-winapi" = "=1.92.0"

[target.boost_system]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-compat", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-variant2", public = true },
  { name = "cabin-ports/boost-winapi", public = true },
]
