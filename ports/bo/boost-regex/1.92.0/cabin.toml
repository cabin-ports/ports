[package.upstream]
url = "https://github.com/boostorg/regex/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:dbf86a09bc840aea69333f6b1f0bef870de6ac7b78a5e3a4c8eb4dbc6310bbae"
format = "tar.gz"
strip-prefix = "regex-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-regex"
version = "1.92.0"
license = "BSL-1.0"
# `include` leaves out test/, which nothing here builds:
# test/regress/test_perl_ex.cpp takes its cases from PCRE's test data, whose
# licence does not ship.
include = [
  ".gitattributes",
  ".github",
  "CMakeLists.txt",
  "LICENSE_1_0.txt",
  "README.md",
  "build.jam",
  "doc",
  "example",
  "include",
  "index.html",
  "meta",
  "module",
  "patches",
  "performance",
  "readme.txt",
  "src",
  "tools",
]

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-predef" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"

[target.boost_regex]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-predef", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
]
