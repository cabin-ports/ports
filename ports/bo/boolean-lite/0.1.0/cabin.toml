[package.upstream]
url = "https://github.com/nonstd-lite/boolean-lite/archive/refs/tags/v0.1.0.tar.gz"
checksum = "sha256:30687455c55877464b61b87b66798af8bce45b6f90f1709c030f263fdcb5d97d"
format = "tar.gz"
strip-prefix = "boolean-lite-0.1.0"

[package]
name = "cabin-ports/boolean-lite"
version = "0.1.0"
license = "BSL-1.0"
include = ["LICENSE.txt", "include"]

# Header-only, as upstream's CMake interface target nonstd::boolean-lite,
# with include/ as the include root.  The type is nonstd::boolean_, with a
# trailing underscore to avoid the Windows SDK's boolean, and its interface
# depends on the standard.  From C++11 on, and on cl.exe since Visual Studio
# 2013, it converts implicitly only from and to bool and explicitly from and
# to other types, and it is constexpr and noexcept (on cl.exe since Visual
# Studio 2015).  Before C++11 its constructor is explicit even from bool and
# it converts to bool through the safe-bool idiom, so `b == true` does not
# compile, while == and != with false or 0 do, as null pointer comparisons
# that yield a plain bool rather than the boolean_ its own operators return.
[target.boolean-lite]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
