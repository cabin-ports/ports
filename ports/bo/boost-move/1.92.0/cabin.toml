[package.upstream]
url = "https://github.com/boostorg/move/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:7e50df59f1e5ba7614a762255a58142a7c2eccb8fa23c59a8a27789f25cad762"
format = "tar.gz"
strip-prefix = "move-boost-1.92.0"

[package]
name = "cabin-ports/boost-move"
version = "1.92.0"
license = "BSL-1.0"
# `include` leaves out doc/, which nothing here builds: doc/move.qbk adapts
# several pages of Hinnant, Stroustrup and Kozicki's article "A Brief
# Introduction to Rvalue References", which has no stated terms.
include = [
  ".drone",
  ".drone.star",
  ".gitattributes",
  ".github",
  ".gitignore",
  "CMakeLists.txt",
  "LICENSE",
  "README.md",
  "build.jam",
  "example",
  "include",
  "index.html",
  "meta",
  "test",
]

[dependencies]
"cabin-ports/boost-config" = "=1.92.0"

[target.boost_move]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
deps = [{ name = "cabin-ports/boost-config", public = true }]
