[package.upstream]
url = "https://github.com/boostorg/qvm/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:4e7c96b0c7a4a44a3f41fa92e2c7a8fd663d1eb331b26d0cec810a3185ad5dc7"
format = "tar.gz"
strip-prefix = "qvm-boost-1.92.0"

[package]
name = "cabin-ports/boost-qvm"
version = "1.92.0"
license = "BSL-1.0"
# `include` leaves out doc/, which nothing here builds: its Asciidoctor and
# Rouge stylesheets are MIT-licensed but ship no licence text.
include = [
  ".drone",
  ".drone.jsonnet",
  ".gitattributes",
  ".github",
  ".gitignore",
  ".vscode",
  "CMakeLists.txt",
  "LICENSE_1_0.txt",
  "README.md",
  "build.jam",
  "gen",
  "include",
  "index.html",
  "meson.build",
  "meson_options.txt",
  "meta",
  "test",
]

[target.boost_qvm]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
