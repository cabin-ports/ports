[package.upstream]
url = "https://github.com/boostorg/multi_index/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:a27909a28d2ef1b2f2bbefabdd58eaa555065d3ef1fc9cfc1634226b5af2f0aa"
format = "tar.gz"
strip-prefix = "multi_index-boost-1.92.0"

[package]
name = "cabin-ports/boost-multi-index"
version = "1.92.0"
license = "BSL-1.0 AND HPND-sell-variant"
# include/boost/multi_index/detail/ord_index_{impl,node,ops}.hpp:11-32 carry
# the HP and SGI STL notice.  `include` leaves out perf/, which nothing here
# builds: perf/test_perf.cpp:32-140 is Andrew Koenig's measurement harness
# from Stroustrup's companion code, with no stated terms.
include = [
  ".drone",
  ".drone.jsonnet",
  ".gitattributes",
  ".github",
  ".travis.yml",
  "CMakeLists.txt",
  "README.md",
  "appveyor.yml",
  "build.jam",
  "doc",
  "example",
  "include",
  "index.html",
  "meta",
  "test",
  "test_results.svg",
]

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-bind" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container-hash" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-integer" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-tuple" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"

[target.boost_multi_index]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-bind", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container-hash", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-integer", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-tuple", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
]
