[package.upstream]
url = "https://github.com/boostorg/redis/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:567726d8fa9cb8538d6e83caf1cfc37ab783a60aec8c9ac50c46853509865804"
format = "tar.gz"
strip-prefix = "redis-boost-1.92.0"

[package]
name = "cabin-ports/boost-redis"
version = "1.92.0"
license = "BSL-1.0"

[dependencies]
"cabin-ports/boost-asio" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-mp11" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/openssl" = "=4.1.0"

# Requests the openssl port's own build of OpenSSL in place of the system's.
[features]
vendored-openssl = ["cabin-ports/openssl/vendored"]

# Upstream's CMake boost_redis: header-only, C++17, linking OpenSSL's ssl and
# crypto libraries and Threads, which boost-asio links where it needs a
# library.  A consumer compiles <boost/redis/src.hpp> in one of its own
# sources, as upstream's documentation says.  Under LLVM 23's libc++ a
# source that includes <boost/redis/connection.hpp> compiles only after
# <cmath>: adapter/detail/adapters.hpp, which it includes, uses HUGE_VAL
# without including <cmath>, which libc++ 22, Apple's among them, still
# brings in through other headers.
[target.boost_redis]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [
  { name = "cabin-ports/boost-asio", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-mp11", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/openssl:ssl", public = true },
  { name = "cabin-ports/openssl:crypto", public = true },
]
