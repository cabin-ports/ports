[package.upstream]
url = "https://github.com/boostorg/thread/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:b7c6aa98627af2e0e1e5dde53f2e028c91dce802349222756c0f63b5d1684e73"
format = "tar.gz"
strip-prefix = "thread-boost-1.92.0"
# include/boost/thread/detail/{invoke,invoker,make_tuple_indices}.hpp and 260
# tests adapt libc++ code under its MIT and University of Illinois/NCSA dual
# licence, whose text the release does not ship.  Patch 0001 adds libc++'s
# LICENSE.TXT, verbatim from llvm-project llvmorg-8.0.1 libcxx/LICENSE.TXT
# (sha256:c3b21ee90de785b9e45590253fd08fb22b269abccaadb175c4d96d7f420340cd), as
# LICENSE.libcxx.txt.
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = [
  "patches/0001-add-mit-and-ncsa-licenses-for-libcxx-code.patch",
  "patches/0002-add-the-boost-software-license-text.patch",
]

[package]
name = "cabin-ports/boost-thread"
version = "1.92.0"
license = "BSL-1.0 AND (MIT OR NCSA)"
# `include` leaves out doc/, which nothing here builds: doc/async_executors.qbk
# and doc/parallel.qbk adapt the text of WG21 papers N3785 and N4088, whose
# terms do not ship.
include = [
  ".gitattributes",
  ".github",
  ".gitignore",
  ".travis.yml",
  "CMakeLists.txt",
  "LICENSE.libcxx.txt",
  "LICENSE_1_0.txt",
  "README.md",
  "appveyor.yml",
  "build.jam",
  "circle.yml",
  "example",
  "include",
  "index.html",
  "meta",
  "patches",
  "src",
  "test",
  "tutorial",
]

[dependencies]
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-atomic" = "=1.92.0"
"cabin-ports/boost-bind" = "=1.92.0"
"cabin-ports/boost-chrono" = "=1.92.0"
"cabin-ports/boost-concept-check" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container" = "=1.92.0"
"cabin-ports/boost-container-hash" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-date-time" = "=1.92.0"
"cabin-ports/boost-exception" = "=1.92.0"
"cabin-ports/boost-function" = "=1.92.0"
"cabin-ports/boost-io" = "=1.92.0"
"cabin-ports/boost-move" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-predef" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-throw-exception" = "=1.92.0"
"cabin-ports/boost-tuple" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"
"cabin-ports/boost-winapi" = "=1.92.0"

# The threading API follows upstream's CMake: win32 on Windows, pthread
# elsewhere; the headers detect the same split themselves.  A static
# build defines BOOST_THREAD_BUILD_LIB, as upstream's CMake does:
# without it src/win32/tss_pe.cpp, the TLS callbacks that clean up
# thread_specific_ptr on threads Boost did not start, compiles to
# nothing.  Consumers need no define: the headers already default to
# BOOST_THREAD_USE_LIB.
[target.boost_thread]
type = "library"
sources = ["src/future.cpp"]
include-dirs = ["include"]
defines = ["BOOST_THREAD_BUILD_LIB"]
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "boost_thread"
deps = [
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-atomic", public = true },
  { name = "cabin-ports/boost-bind", public = true },
  { name = "cabin-ports/boost-chrono", public = true },
  { name = "cabin-ports/boost-concept-check", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container", public = true },
  { name = "cabin-ports/boost-container-hash", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-date-time", public = true },
  { name = "cabin-ports/boost-exception", public = true },
  { name = "cabin-ports/boost-function", public = true },
  { name = "cabin-ports/boost-io", public = true },
  { name = "cabin-ports/boost-move", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-predef", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-throw-exception", public = true },
  { name = "cabin-ports/boost-tuple", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
  { name = "cabin-ports/boost-winapi", public = true },
]

[target.'cfg(family = "unix")'.sources]
boost_thread = ["src/pthread/once.cpp", "src/pthread/thread.cpp"]

[target.'cfg(os = "windows")'.sources]
boost_thread = [
  "src/win32/thread.cpp",
  "src/win32/thread_primitives.cpp",
  "src/win32/tss_dll.cpp",
  "src/win32/tss_pe.cpp",
]

[target.'cfg(os = "linux")'.profile]
link-libs = ["pthread"]
