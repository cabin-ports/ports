[package.upstream]
url = "https://github.com/boostorg/polygon/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:a87bd8a6390fd03800cdb38dd25610054f7703f4713b409f09bd369b5916f002"
format = "tar.gz"
strip-prefix = "polygon-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-polygon"
version = "1.92.0"
license = "BSL-1.0"
# `include` leaves out doc/, which nothing here builds: doc/GTL_boostcon2009.pdf
# carries ACM's copying restrictions, and doc/images holds the Intel logo and
# photographs with no stated terms.
include = [
  ".gitattributes",
  ".travis.yml",
  "CMakeLists.txt",
  "Jamfile.v2",
  "LICENSE_1_0.txt",
  "appveyor.yml",
  "benchmark",
  "example",
  "include",
  "index.html",
  "meta",
  "patches",
  "test",
]

[dependencies]
"cabin-ports/boost-config" = "=1.92.0"

[target.boost_polygon]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
deps = [{ name = "cabin-ports/boost-config", public = true }]
