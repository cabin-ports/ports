# FOR ANY DAMAGES OR OTHER LIABILITY, WHETHER IN CONTRACT, TORT OR OTHERWISE,
# ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER
# DEALINGS IN THE SOFTWARE.
patches = ["patches/0001-set-the-type-with-py-set-type.patch"]

[package]
name = "cabin-ports/boost-parameter-python"
version = "1.92.0"
license = "BSL-1.0"

[dependencies]
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-parameter" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-python" = "=1.92.0"

[target.boost_parameter_python]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-parameter", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-python:boost_python", public = true },
]
