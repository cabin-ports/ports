[package.upstream]
url = "https://github.com/boostorg/date_time/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:15be4f5bc8e0c7d601214168d03fc865a843ef624bf33bdc49802cd5679c6e04"
format = "tar.gz"
strip-prefix = "date_time-boost-1.92.0"

[package]
name = "cabin-ports/boost-date-time"
version = "1.92.0"
license = "BSL-1.0 AND HPND-sell-variant"
# `include` lists the tree without xmldoc/date_time_fo_stylesheet.xsl, a
# docs stylesheet nothing here builds whose screen template is copied from
# the DocBook XSL stylesheets, whose licence the release does not ship.
