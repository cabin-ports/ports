[package.upstream]
url = "https://github.com/boostorg/static_assert/archive/refs/tags/boost-1.92.0.tar.gz"
checksum = "sha256:c528438060c45a4b17ca84ebdce0f3cbcc1cd275f3ad2752b1b0d0ff0b220805"
format = "tar.gz"
strip-prefix = "static_assert-boost-1.92.0"
# The BSL patch adds LICENSE_1_0.txt, the Boost Software License text the
# sources cite, from boostorg/boost at tag boost-1.92.0
# (sha256:c9bff75738922193e67fa726fa225535870d2aa1059f91452c411736284ad566).
patches = ["patches/0001-add-the-boost-software-license-text.patch"]

[package]
name = "cabin-ports/boost-static-assert"
version = "1.92.0"
license = "BSL-1.0"

[dependencies]
"cabin-ports/boost-config" = "=1.92.0"

[target.boost_static_assert]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++98"
deps = [{ name = "cabin-ports/boost-config", public = true }]
