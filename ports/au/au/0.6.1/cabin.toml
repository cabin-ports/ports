# Consumers write "au/au.hh" or "au/units/meters.hh", as with upstream's CMake
# target.  C++14 is upstream's stated and measured floor; au/std_format.hh
# needs C++20 <format>.  The au/constants/ headers lack include guards, so a
# translation unit can include each only once.
[target.au]
type = "header-only"
include-dirs = ["."]
interface-cxx-standard = "c++14"
