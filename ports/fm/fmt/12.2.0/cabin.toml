[package.upstream]
url = "https://github.com/fmtlib/fmt/archive/refs/tags/12.2.0.tar.gz"
checksum = "sha256:8b852bb5aa6e7d8564f9e81394055395dd1d1936d38dfd3a17792a02bebd7af0"
format = "tar.gz"
strip-prefix = "fmt-12.2.0"
[package]
name = "cabin-ports/fmt"
version = "12.2.0"
# The sources follow format.h's MIT notice with its optional exception;
# LICENSE carries the MIT text without it.
license = "MIT WITH fmt-exception AND MIT"
# Leaves out support/: its Sublime syntax file carries no notice, and its
# docopt and Rust-derived scripts point to MIT texts upstream does not ship.
include = ["LICENSE", "README.md", "doc/LICENSE-exception", "include", "src"]

# {fmt}'s compiled library is exactly two translation units:
# format.cc (the non-inline formatting engine) and os.cc (the
# OS-facing helpers such as fmt::ostream). The two other sources
# under src/ are intentionally not built: fmt.cc is the C++20
# module interface unit and fmt-c.cc is the optional C API, both
# separate opt-in surfaces. The library compiles with a strict
# C++ compiler and needs no defines or extra link libraries.
[target.fmt]
type = "library"
sources = ["src/format.cc", "src/os.cc"]
include-dirs = ["include"]
# The two implementation TUs compile as c++17; upstream publishes
# a C++11 interface requirement
# (target_compile_features(fmt PUBLIC cxx_std_11)), so declare it -
# otherwise Cabin's interface fallback would impose the c++17
# implementation standard on every consumer and reject valid
# c++11 / c++14 projects.
cxx-standard = "c++17"
interface-cxx-standard = "c++11"
links = "fmt"
