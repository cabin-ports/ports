[package.upstream]
# The release zip ConanCenter pins; it has no top directory.
url = "https://github.com/modelica/fmi-standard/releases/download/v3.0.2/FMI-Standard-3.0.2.zip"
checksum = "sha256:454a12f40069db7efc38faee1c8899fabe74086c0b052f88133b16f256c444bd"
format = "zip"

# The zip also holds the specification (HTML and images, CC-BY-SA-4.0)
# and the XML schemas of an FMU's modelDescription.xml and its other XML
# files, which no C or C++ build reads; only the C headers are packaged.
[package]
name = "cabin-ports/fmi3"
version = "3.0.2"
license = "BSD-2-Clause"
include = ["LICENSE.txt", "headers"]

[target.fmi3]
type = "header-only"
include-dirs = ["headers"]
# fmi3PlatformTypes.h includes <stdbool.h> and <stdint.h>, and
# fmi3FunctionTypes.h's fmi3Status ends with a comma: C99 / C++11.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
