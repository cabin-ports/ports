[package.upstream]
url = "https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz"
checksum = "sha256:98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f"
format = "tar.gz"
strip-prefix = "brotli-1.2.1"

[package]
name = "cabin-ports/brotli"
version = "1.2.1"
include = ["LICENSE", "c/common", "c/dec", "c/enc", "c/include"]

# The three libraries upstream's CMake build produces, each from every
# .c file of its directory, sharing c/include as their public include
# root.  The brotli CLI (c/tools) and the python/ and go/ bindings are
# not ported.  The build options in c/common/platform.h and
# c/include/brotli/port.h (BROTLI_BUILD_*, BROTLI_EXTERNAL_DICTIONARY_DATA)
# and the static initialization mode keep upstream's defaults, and
# BROTLI_SHARED_COMPILATION is only for shared builds.
[target.brotlicommon]
type = "library"
sources = [
  "c/common/constants.c",
  "c/common/context.c",
  "c/common/dictionary.c",
  "c/common/platform.c",
  "c/common/shared_dictionary.c",
  "c/common/transform.c",
]
include-dirs = ["c/include"]
c-standard = "c11"
# The public headers include <stdint.h>, which needs C99 / C++11.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "brotlicommon"

[target.brotlidec]
type = "library"
sources = [
  "c/dec/bit_reader.c",
  "c/dec/decode.c",
  "c/dec/huffman.c",
  "c/dec/prefix.c",
  "c/dec/state.c",
  "c/dec/static_init.c",
]
include-dirs = ["c/include"]
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "brotlidec"
# decode.h and encode.h include <brotli/shared_dictionary.h>.
deps = [{ name = "brotlicommon", public = true }]

[target.brotlienc]
type = "library"
sources = [
  "c/enc/backward_references.c",
  "c/enc/backward_references_hq.c",
  "c/enc/bit_cost.c",
  "c/enc/block_splitter.c",
  "c/enc/brotli_bit_stream.c",
  "c/enc/cluster.c",
  "c/enc/command.c",
  "c/enc/compound_dictionary.c",
  "c/enc/compress_fragment.c",
  "c/enc/compress_fragment_two_pass.c",
  "c/enc/dictionary_hash.c",
  "c/enc/encode.c",
  "c/enc/encoder_dict.c",
  "c/enc/entropy_encode.c",
  "c/enc/fast_log.c",
  "c/enc/histogram.c",
  "c/enc/literal_cost.c",
  "c/enc/memory.c",
  "c/enc/metablock.c",
  "c/enc/static_dict.c",
  "c/enc/static_dict_lut.c",
  "c/enc/static_init.c",
  "c/enc/utf8_util.c",
]
include-dirs = ["c/include"]
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "brotlienc"
# decode.h and encode.h include <brotli/shared_dictionary.h>.
deps = [{ name = "brotlicommon", public = true }]

# The encoder calls log2() from libm; upstream's CMake build links libm
# into each library wherever one exists.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
