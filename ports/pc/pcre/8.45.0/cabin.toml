# The POSIX wrapper links the 8-bit library, as CMake's pcreposix does
# (:675-677).  pcreposix.h declares the unprefixed regcomp, regexec,
# regerror and regfree, so a program linking this library gets PCRE's
# versions in place of the C library's (PCRE2 renamed them).
[target.pcreposix]
type = "library"
sources = ["pcreposix.c"]
include-dirs = ["include"]
deps = [{ name = "pcre", public = true }]
links = "pcreposix"
