[package.upstream]
url = "https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.gz"
checksum = "sha256:4e6ce03e0336e8b4a3d6c2b70b1c5e18590a5673a98186da90d4f33c23defc09"
format = "tar.gz"
strip-prefix = "pcre-8.45"

# The hand-build steps of NON-AUTOTOOLS-BUILD: the generic config.h,
# pcre.h, and default character tables.  The two public headers go to
# include/, so the archive root, which also holds the private
# pcre_internal.h and ucp.h, stays off consumers' include path.
[[package.upstream.copy]]
from = "config.h.generic"
to = "config.h"

[[package.upstream.copy]]
from = "pcre.h.generic"
to = "include/pcre.h"

[[package.upstream.copy]]
from = "pcreposix.h"
to = "include/pcreposix.h"

[[package.upstream.copy]]
from = "pcre_chartables.c.dist"
to = "pcre_chartables.c"

[package]
name = "cabin-ports/pcre"
# Upstream 8.45, the final PCRE1 release; Cabin versions have three
# components.
version = "8.45.0"
license = "BSD-3-Clause"
include = [
  "COPYING",
  "LICENCE",
  "config.h",
  "include",
  "pcre_internal.h",
  "ucp.h",
  "pcre_byte_order.c",
  "pcre_chartables.c",
  "pcre_compile.c",
  "pcre_config.c",
  "pcre_dfa_exec.c",
  "pcre_exec.c",
  "pcre_fullinfo.c",
  "pcre_get.c",
  "pcre_globals.c",
  "pcre_jit_compile.c",
  "pcre_maketables.c",
  "pcre_newline.c",
  "pcre_ord2utf8.c",
  "pcre_refcount.c",
  "pcre_string_utils.c",
  "pcre_study.c",
  "pcre_tables.c",
  "pcre_ucd.c",
  "pcre_valid_utf8.c",
  "pcre_version.c",
  "pcre_xclass.c",
  "pcre16_byte_order.c",
  "pcre16_chartables.c",
  "pcre16_compile.c",
  "pcre16_config.c",
  "pcre16_dfa_exec.c",
  "pcre16_exec.c",
  "pcre16_fullinfo.c",
  "pcre16_get.c",
  "pcre16_globals.c",
  "pcre16_jit_compile.c",
  "pcre16_maketables.c",
  "pcre16_newline.c",
  "pcre16_ord2utf16.c",
  "pcre16_refcount.c",
  "pcre16_string_utils.c",
  "pcre16_study.c",
  "pcre16_tables.c",
  "pcre16_ucd.c",
  "pcre16_utf16_utils.c",
  "pcre16_valid_utf16.c",
  "pcre16_version.c",
  "pcre16_xclass.c",
  "pcre32_byte_order.c",
  "pcre32_chartables.c",
  "pcre32_compile.c",
  "pcre32_config.c",
  "pcre32_dfa_exec.c",
  "pcre32_exec.c",
  "pcre32_fullinfo.c",
  "pcre32_get.c",
  "pcre32_globals.c",
  "pcre32_jit_compile.c",
  "pcre32_maketables.c",
  "pcre32_newline.c",
  "pcre32_ord2utf32.c",
  "pcre32_refcount.c",
  "pcre32_string_utils.c",
  "pcre32_study.c",
  "pcre32_tables.c",
  "pcre32_ucd.c",
  "pcre32_utf32_utils.c",
  "pcre32_valid_utf32.c",
  "pcre32_version.c",
  "pcre32_xclass.c",
  "pcreposix.c",
]
# Upstream's sources are C89; C11 is the oldest standard Cabin can lower
# for MSVC.
c-standard = "c11"
interface-c-standard = "c89"
interface-cxx-standard = "c++98"

# The four libraries ConanCenter builds by default (vcpkg also builds
# pcrecpp): the 8-, 16- and 32-bit code-unit libraries and the POSIX
# wrapper over the 8-bit one, with UTF and Unicode property support, as
# both enable (upstream's own CMake default builds only the 8-bit library,
# the wrapper, and pcrecpp, without either).
# config.h.generic supplies the rest of upstream's default configuration
# (LF newline, link size 2, match and nesting limits, recursion on the
# stack).  HAVE_STDINT_H, HAVE_INTTYPES_H and HAVE_MEMMOVE are what
# upstream's CMake probes find on every target; C11 guarantees all three.
# Not ported: the JIT compiler (SUPPORT_JIT, off by default upstream and
# in ConanCenter; vcpkg turns it on), pcrecpp (its pcrecpparg.h and
# pcre_stringpiece.h are configured from .in templates, and ConanCenter's
# default leaves it out), pcregrep, pcretest, and MSVC's
# _CRT_SECURE_NO_DEPRECATE and _CRT_SECURE_NO_WARNINGS, which only
# silence deprecation warnings.
[profile]
defines = [
  "HAVE_CONFIG_H",
  "HAVE_INTTYPES_H",
  "HAVE_MEMMOVE",
  "HAVE_STDINT_H",
  "SUPPORT_PCRE16",
  "SUPPORT_PCRE32",
  "SUPPORT_PCRE8",
  "SUPPORT_UCP",
  "SUPPORT_UTF",
]

# Each width library compiles its own sources (CMakeLists.txt:508-589);
# most 16- and 32-bit ones #include the shared pcre_*.c files.  A static
# build compiles with PCRE_STATIC (:266-268) and hands it to consumers
# (:445-447, the pkg-config Cflags), as NON-AUTOTOOLS-BUILD requires: on
# Windows it keeps pcre.h from declaring the API dllimport.
[target.pcre]
type = "library"
sources = [
  "pcre_byte_order.c",
  "pcre_chartables.c",
  "pcre_compile.c",
  "pcre_config.c",
  "pcre_dfa_exec.c",
  "pcre_exec.c",
  "pcre_fullinfo.c",
  "pcre_get.c",
  "pcre_globals.c",
  "pcre_jit_compile.c",
  "pcre_maketables.c",
  "pcre_newline.c",
  "pcre_ord2utf8.c",
  "pcre_refcount.c",
  "pcre_string_utils.c",
  "pcre_study.c",
  "pcre_tables.c",
  "pcre_ucd.c",
  "pcre_valid_utf8.c",
  "pcre_version.c",
  "pcre_xclass.c",
]
include-dirs = ["include"]
defines = ["PCRE_STATIC"]
interface-defines = ["PCRE_STATIC"]
links = "pcre"

