# The POSIX wrapper links the 8-bit library publicly, as CMake's
# pcre2-posix-static does (:947).
[target.pcre2-posix]
type = "library"
sources = ["src/pcre2posix.c"]
include-dirs = ["include"]
defines = ["PCRE2_CODE_UNIT_WIDTH=8"]
deps = [{ name = "pcre2-8", public = true }]
links = "pcre2-posix"
