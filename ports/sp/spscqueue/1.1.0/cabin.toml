[package.upstream]
# Tag v1.1, whose CMakeLists.txt declares VERSION 1.1, hence 1.1.0.
url = "https://github.com/rigtorp/SPSCQueue/archive/refs/tags/v1.1.tar.gz"
checksum = "sha256:10f290c72e60ba0d7999c65926f96fab0b1c2f360ce5bbcfe0cf69448d067af5"
format = "tar.gz"
strip-prefix = "SPSCQueue-1.1"

[package]
name = "cabin-ports/spscqueue"
version = "1.1.0"
license = "MIT"
include = ["LICENSE", "include"]

# The queue aligns its indices to std::hardware_destructive_interference_size
# where <new> defines it and to 64 bytes otherwise, so its layout can differ
# between translation units that see different values.
[target.spscqueue]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
