[package.upstream]
url = "https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz"
checksum = "sha256:4b44d4f2b38a370a2d98a78329fefc56a0cf93d1c1be70029217baae6628feea"
format = "tar.gz"
strip-prefix = "speex-1.2.1"
# configure generates the public speex_config_types.h from its template
# (configure.ac:260-323, 346).  The copy step below copies the template to
# that name, and patch 0001 fills it in as configure does wherever
# <stdint.h> provides the exact-width types (measured on macOS arm64 and
# x86-64).  speex_types.h includes it outside Windows and Apple, which
# typedef the types themselves.
# BSD-3-Clause notice of speex_config_types.h.in (COPYING), whose lines
# 0001 carries (the condition that redistributions of source code retain
# it):
