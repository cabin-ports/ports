[package.upstream]
# The v0.2.28 tag archive, the bytes vcpkg's functionalplus port pins
# (SHA-512, REF v${VERSION}); the release has no assets.  CMakeLists.txt:3
# declares project(FunctionalPlus VERSION 0.2.28).
url = "https://github.com/Dobiasd/FunctionalPlus/archive/refs/tags/v0.2.28.tar.gz"
checksum = "sha256:8864a3e9bebde6ebed71b49ac2a036cedf9ae0f02ce758bc28c21e6a2ae15803"
format = "tar.gz"
strip-prefix = "FunctionalPlus-0.2.28"

[package]
name = "cabin-ports/functionalplus"
version = "0.2.28"
# LICENSE is the Boost Software License 1.0.  include/fplus/function_traits.hpp
# is kennytm's utils/traits.hpp, under the same licence with its own notice
# kept in the file (:1-8, :32).  Held in publish-holds.txt: include/fplus also
# ships code it credits only by URL, without the CC BY-SA 3.0 terms of its
# sources.  Copied near-verbatim: shared_ref.hpp:22-53 from Stack Overflow
# answer 41976419 (shared_reference), variant.hpp:137-160 from answer 42493805
# (type_set_eq), and container_traits.hpp:161-200 from answer 44549820
# (can_self_assign).  Adapted, with the sources' names and
# structure: internal/composition.hpp:16-53 from Code Review answer 63893
# (compose_impl), show.hpp:268-312 from cppreference's std::tuple_cat example
# (TuplePrinter), and variant.hpp:19-52, :96-113 and :162-175 from Stack
# Overflow answers 18987405 (is_one_of, is_unique), 27588263 (get_index) and
# 42581257 (ContainsTypes).
include = ["LICENSE", "include"]

# Header-only, as upstream's INTERFACE target fplus (FunctionalPlus::fplus,
# CMakeLists.txt:15-16): include/ is the include root (:17-22), installed as
# include/fplus (cmake/install-rules.cmake:17-21), so consumers write
# `#include <fplus/fplus.hpp>` (README.md:82, test/readme_examples_test.cpp:8).
# The umbrella header pulls in every module, including fwd.hpp and curry.hpp,
# which include the shipped fwd_instances/curry_instances.autogenerated_defines
# (fwd.hpp:113, curry.hpp:71).  Upstream's build-time auto_generate target
# (:31-46) reruns generate/auto_generate.py over those files and the
# include_all_in_one/ amalgamation when Python is found; the archive's copies
# are already its output for this tag, so the port ships them as they are.
# Not ported: the include_all_in_one/ single header, the CMake package files
# (cmake/install-rules.cmake), api_search/, examples/, the tests, and the
# FunctionalPlus_INCLUDE_WITHOUT_SYSTEM switch (:7-11), with which a CMake
# consumer drops the SYSTEM warning guard; Cabin consumers always see include/
# as a system include directory, upstream's default.
[target.functionalplus]
type = "header-only"
include-dirs = ["include"]
# cxx_std_14 (:24, README.md:349).
interface-cxx-standard = "c++14"

# Upstream links Threads::Threads (:26-27): transform_parallelly and the other
# *_parallelly functions use std::async and std::thread (transform.hpp:286-378),
# as do side_effects.hpp's ticker and execute_fire_and_forget (:78, :363).
# pthreads on Unix, which Conan Center's recipe links on Linux and FreeBSD;
# folded into libc since glibc 2.34, where the extra -lpthread is a harmless
# no-op.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
