[package.upstream]
url = "https://github.com/Dobiasd/FunctionalPlus/archive/refs/tags/v0.2.28.tar.gz"
checksum = "sha256:8864a3e9bebde6ebed71b49ac2a036cedf9ae0f02ce758bc28c21e6a2ae15803"
format = "tar.gz"
strip-prefix = "FunctionalPlus-0.2.28"

[package]
name = "cabin-ports/functionalplus"
version = "0.2.28"
license = "BSL-1.0 AND CC-BY-SA-3.0"
# CC-BY-SA-3.0: the Stack Exchange and cppreference.com code in include/fplus.
# include/fplus/function_traits.hpp is kennytm's utils/traits.hpp, also under
# the Boost Software License 1.0, with its own notice kept in the file (:1-8,
# :32).  Credited code too slight to carry copyright: the one-line or
# few-line idioms at variant.hpp:83
# (https://stackoverflow.com/a/3273571) and :177
# (https://stackoverflow.com/a/36934374), internal/meta.hpp:13 (cppreference's
# void_t) and :60 (https://stackoverflow.com/a/27221517), and
# internal/invoke.hpp:15 (libc++'s invoke return macro) and :214 (libstdc++
# 7.1.0's is_invocable traits); internal/apply.hpp:17 is std::apply as C++17
# [tuple.apply] specifies it.  container_traits.hpp:68 credits
# https://stackoverflow.com/a/33828321, a six-line generic rebinding
# template that same_cont_new_t's per-container specializations do not copy.
include = ["LICENSE", "include"]

# fwd.hpp and curry.hpp include the committed *_instances.autogenerated_defines,
# which upstream's auto_generate target can regenerate; the archive's copies
# are already its output for this tag, so they ship as they are.
#
# Not ported: the include_all_in_one/ single header and the
# FunctionalPlus_INCLUDE_WITHOUT_SYSTEM switch.
[target.functionalplus]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"

# Upstream links Threads::Threads: the *_parallelly functions and
# side_effects.hpp use std::async and std::thread.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
