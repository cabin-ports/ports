[package.upstream]
url = "https://github.com/bloomberg/bde/archive/refs/tags/4.39.0.0.tar.gz"
checksum = "sha256:032ecb934810137bb889d036c0bf038dc7e70a01bf72b6ea39b72d0b1583c6b3"
format = "tar.gz"
strip-prefix = "bde-4.39.0.0"
patches = [
  # cabin-ports/pcre2 puts pcre2.h at its include root.
  "patches/0001-include-pcre2-h-from-the-include-root.patch",
  # bsls_compilerfeatures.cpp reads Apple clang's version as an LLVM one and
  # so requires sized deallocation, which Apple clang leaves off by default.
  # Upstream main (e263b11, 2026-11-11) still has the check.
  "patches/0002-skip-the-sized-deallocation-check-on-apple-clang.patch",
  "patches/0003-add-third-party-notices.patch",
]

[package]
name = "cabin-ports/bde"
# Upstream tags 4.39.0.0; the version drops the tag's fourth component,
# which is 0.
version = "4.39.0"
# Apache-2.0: LICENSE, for BDE, its Abseil-derived bdlc_flathashtable, and
#   Ryu, which offers Apache-2.0 OR BSL-1.0.
# Apache-2.0 WITH LLVM-exception: the Microsoft STL code in bslalg, bslfmt
#   and bslmf (thirdparty/Microsoft-STL-*).
# MIT WITH fmt-exception: libfmt's notice in bslfmt_formatterstring.cpp.
# Boehm-GC-without-fee: STLport's notice in bslstp, bdlde's
#   utf8checkinginstreambufwrapper and bdls_fdstreambuf.
# HPND-sell-variant: SGI's STL notice in bslstp_hash.h and bslstp_slist.h.
# RSA-MD: bdlde_md5.cpp.
# Unicode-3.0: bslfmt_formatterunicodedata's tables.
# Unicode-DFS-2016: baltzo_windowstimezoneutil's CLDR 32 time-zone table.
# BSD-3-Clause: PCRE's notice in bdlpcre_regex.h and the Intel decimal
#   library (thirdparty/inteldfp/eula.txt).
# CC0-1.0: SipHash.  Unlicense: wyhash.  SpookyHash is public domain.
# balxml_minireader.cpp credits its UTF-8 encoder to libxml2; it is the
#   RFC 2044 table written out, so it adds no term.
# Notices that upstream's files lack are in THIRD_PARTY_NOTICES (patch 0003).
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND MIT WITH fmt-exception AND Boehm-GC-without-fee AND HPND-sell-variant AND RSA-MD AND Unicode-3.0 AND Unicode-DFS-2016 AND BSD-3-Clause AND CC0-1.0 AND Unlicense"
# The components' headers and sources, the bundled Intel decimal and Ryu
# libraries, and the license texts; the test drivers (*.t.cpp), package
# documentation and build metadata stay out.
