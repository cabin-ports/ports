cxx-standard = "c++17"
# bsls_libraryfeatures.h makes every translation unit reference a symbol
# named after the standard library level it compiles against
# (bsls_libraryfeatures_CPP17_ABI), and the library defines only its own,
# so consumers must use the library's standard.  C++17 is vcpkg's choice.
interface-cxx-standard = { min = "c++17", max = "c++17" }

[dependencies]
# vcpkg's BDE_USE_EXTERNAL_PCRE2 build: bdlpcre uses cabin-ports/pcre2
# instead of the copy of PCRE2 10.45 in thirdparty/pcre2.  That port has
# no JIT, so bdlpcre::RegEx::isJitAvailable() is false and k_FLAG_JIT
# patterns run on the interpreter.
"cabin-ports/pcre2" = "=10.49.0"

# BdeBuildSystem's per-configuration flags (BdeInternalTargets.cmake:
# bbs_add_target_bde_flags): they select the bsls_assert and bsls_review
# levels and a few optimized code paths.
[target.'cfg(any(family = "unix", family = "windows"))'.profile.release]
defines = ["BDE_BUILD_TARGET_OPT"]

[target.'cfg(any(family = "unix", family = "windows"))'.profile.dev]
defines = ["BDE_BUILD_TARGET_DBG"]

# The same function's MSVC defines, here on every Windows toolchain:
# clang-cl and MinGW read the same windows.h, whose min and max macros
# break bsls_outputredirector.cpp and bdls without NOMINMAX.  They also
# reach the Intel decimal library's C sources, which include no Windows
# headers.
[target.'cfg(family = "windows")'.profile]
defines = [
  "NOGDI",
  "NOMINMAX",
  "VC_EXTRALEAN",
  "WIN32_LEAN_AND_MEAN",
  "_CRT_SECURE_NO_WARNINGS",
  "_SCL_SECURE_NO_DEPRECATE",
]

# The Intel decimal library's per-compiler configuration
# (thirdparty/inteldfp/LIBRARY/CMakeLists.txt).  Cabin has no
# target-scoped conditional defines, so these also reach the BDE C++
# sources, where only bdldfp_intelimpwrapper.h reads them; it configures
# the Intel headers it includes the same way itself.
[target.'cfg(cc = "apple-clang")'.profile]
defines = ["LINUX", "efi2"]

[target.'cfg(any(cc = "clang", cc = "clang-cl", cc = "gcc"))'.profile]
defines = ["LINUX", "USE_REAL_MALLOC", "efi2"]

[target.'cfg(cc = "msvc")'.profile]
defines = ["WINDOWS", "WINNT", "WNT"]

[target.'cfg(all(cc = "msvc", any(arch = "x86_64", arch = "aarch64")))'.profile]
defines = ["ia32"]

# BdeBuildSystem's thread and runtime flags, and the Windows libraries
# bdlb (bcrypt) and baltzo (advapi32) use.
[target.'cfg(os = "linux")'.profile]
defines = ["_POSIX_PTHREAD_SEMANTICS", "_REENTRANT"]
link-libs = ["pthread", "rt"]

[target.'cfg(os = "windows")'.profile]
link-libs = ["advapi32", "bcrypt", "ws2_32"]

# thirdparty/bbryu/CMakeLists.txt.  BDE includes its headers as <bbryu/...>,
# so thirdparty/ is the include directory, as in upstream's build tree.
[target.bbryu]
type = "library"
sources = [
  "thirdparty/bbryu/blp_d2cpp.c",
  "thirdparty/bbryu/blp_f2cpp.c",
  "thirdparty/bbryu/blp_d2fixed_cpp.c",
  "thirdparty/bbryu/d2fixed.c",
  "thirdparty/bbryu/d2s.c",
  "thirdparty/bbryu/f2s.c",
]
include-dirs = ["thirdparty"]
c-standard = "c11"
links = "bbryu"

