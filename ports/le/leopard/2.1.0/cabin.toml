[package.upstream]
url = "https://github.com/hosseinmoein/Leopard/archive/refs/tags/2.1.0.tar.gz"
checksum = "sha256:26b57fdea4cd94ddbc34a478e978632637cde2fc263bdf2d6bdfd3e9ddd0b1d5"
format = "tar.gz"
strip-prefix = "Leopard-2.1.0"

[package]
name = "cabin-ports/leopard"
version = "2.1.0"
license = "BSD-3-Clause"
include = ["License", "include"]

# interface-cxx-standard: src/Makefile.Linux.GCC64 builds with -std=c++20.
# ThreadPool.tcc defines the non-template ThreadPool members without
# `inline`: a program with two translation units that include ThreadPool.h
# fails to link with duplicate symbols (measured on macOS).
# parallel_sort pivots on the first element, so sorted input recurses once per
# element on a worker thread; 1000 sorted ints overflowed macOS's 512 KiB
# secondary-thread stack in a debug build (measured, 25-43 of 500 runs).
[target.leopard]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++20"

# upstream's CMakeLists.txt requires Threads.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
