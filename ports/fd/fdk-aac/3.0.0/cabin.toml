[package.upstream]
url = "https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v3.0.0.tar.gz"
checksum = "sha256:8538ea8f0f9915e460c106a13e1866a9e13c7ee48c1b67d0b2cf7b4e8159bd1a"
format = "tar.gz"
strip-prefix = "fdk-aac-3.0.0"

# Upstream installs its public headers into include/fdk-aac and
# include/fdk-xhe-aac (CMakeLists.txt:438-444, 747-748, 886-896).
[[package.upstream.copy]]
from = "cpp/libSYS/include/machine_type.h"
to = "include/fdk-aac/machine_type.h"

[[package.upstream.copy]]
from = "cpp/libSYS/include/genericStds.h"
to = "include/fdk-aac/genericStds.h"

[[package.upstream.copy]]
from = "cpp/libSYS/include/FDK_audio.h"
to = "include/fdk-aac/FDK_audio.h"

[[package.upstream.copy]]
from = "cpp/libSYS/include/syslib_channelMapDescr.h"
to = "include/fdk-aac/syslib_channelMapDescr.h"

[[package.upstream.copy]]
from = "cpp/libAACenc/include/aacenc_lib.h"
to = "include/fdk-aac/aacenc_lib.h"

[[package.upstream.copy]]
from = "cpp/libAACdec/include/aacdecoder_lib.h"
to = "include/fdk-aac/aacdecoder_lib.h"

[[package.upstream.copy]]
from = "xhe-aac/xHEAACEnc/include/xHEAACEnc.h"
to = "include/fdk-xhe-aac/xHEAACEnc.h"

[package]
name = "cabin-ports/fdk-aac"
version = "3.0.0"
# cpp/ is under NOTICE (FDK-AAC); xhe-aac/ is under xhe-aac/NOTICE, whose
# text no SPDX licence matches.
# Neither NOTICE grants a patent licence; AAC patent licensing is the user's responsibility (section 3).
license = "FDK-AAC AND LicenseRef-FDK-xHE-AAC"
# cpp/fuzzer (Apache-2.0) and cpp/documentation stay out.
include = [
  "NOTICE",
  "cpp/libAACdec",
  "cpp/libAACenc",
  "cpp/libArithCoding",
  "cpp/libDRCdec",
  "cpp/libFDK",
  "cpp/libMpegTPDec",
  "cpp/libMpegTPEnc",
  "cpp/libPCMutils",
  "cpp/libSACdec",
  "cpp/libSACenc",
  "cpp/libSBRdec",
  "cpp/libSBRenc",
  "cpp/libSYS",
  "include",
  "xhe-aac",
]
# Upstream sets no standard.  C11 and C++14 are the oldest Cabin can
# request from MSVC.
c-standard = "c11"
cxx-standard = "c++14"
# machine_type.h uses long long, which C has from C99 and C++ from C++11.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# Upstream's two libraries, fdk-aac and fdk-xhe-aac, with the sources and
# include directories of its CMake build (CMakeLists.txt:446-453, 750-770,
# 780-848).  Not ported: the shared libraries and their .def and .sym export
# lists, the pkg-config and CMake package files, and the programs.  Not
# reproduced: -fno-exceptions and -fno-rtti on the fdk-aac sources
# (:869-874), since Cabin drops a dependency's raw compiler flags; and the
# WIN32 define CMake sets on MSVC, to which xHEAACEnc.h ties __stdcall and
# 1-byte structure packing (:113-118): Cabin cannot define it for Windows
# consumers alone, so the library and its consumers build without it, and a
# consumer must not define it.
[profile]
include-dirs = [
  "cpp/libArithCoding/include",
  "cpp/libDRCdec/include",
  "cpp/libSACdec/include",
  "cpp/libSACenc/include",
  "cpp/libSBRdec/include",
  "cpp/libSBRenc/include",
  "cpp/libMpegTPDec/include",
  "cpp/libMpegTPEnc/include",
  "cpp/libFDK/include",
  "cpp/libPCMutils/include",
  "xhe-aac/aacfastenc/include",
  "xhe-aac/applauseDetectionlib/include",
  "xhe-aac/iisArithEncLib/include",
  "xhe-aac/iisAudioPrerollLib/include",
  "xhe-aac/iisBitFrame/include",
  "xhe-aac/iisDRCGainEncLib/include",
  "xhe-aac/iisDRCGainGenLib/include",
