[package.upstream]
url = "https://github.com/LunarECL/LunarLog/archive/refs/tags/v1.29.2.tar.gz"
checksum = "sha256:c1d9b321b30677bc38f9fb450b07a9d605c0abe6067425a26458212c02866168"
format = "tar.gz"
strip-prefix = "LunarLog-1.29.2"

[package]
name = "cabin-ports/lunarlog"
license = "MIT"
version = "1.29.2"
include = ["LICENSE", "include"]

# Upstream's CMake, vcpkg.json and conanfile still declare 1.29.0 and 1.29.1; the v1.29.2 tag
# is the release.
[target.lunarlog]
type = "header-only"
include-dirs = ["include"]
# README.md:44 and cxx_std_11 in CMakeLists.txt.
interface-cxx-standard = "c++11"

[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]
