[package.upstream]
url = "https://github.com/martinmoene/ring-span-lite/archive/refs/tags/v0.7.0.tar.gz"
checksum = "sha256:7650bb1bcf76cb0f7ac75240c5346203cbe7eb7027c0843c60253f6db08a93c1"
format = "tar.gz"
strip-prefix = "ring-span-lite-0.7.0"
# Third-party notices are in THIRD_PARTY_NOTICES (patch 0001).
patches = ["patches/0001-add-third-party-notices.patch"]

[package]
name = "cabin-ports/ring-span-lite"
version = "0.7.0"
# MIT covers the ring_view code in include/nonstd/ring_span.hpp.
license = "BSL-1.0 AND MIT"
include = [
  "LICENSE.txt",
  "README.md",
  "THIRD_PARTY_NOTICES",
  "include",
  "patches",
]

# Consumers include <nonstd/ring_span.hpp> and <nonstd/ring.hpp>.
# The nsrs_CONFIG_* switches stay consumer opt-ins.
# In ring.hpp, swap() recurses until the stack overflows at C++98 and does
# not compile at C++11 and later, and moving a ring<T[N]> leaves the new ring
# reading the source's array (measured).
[target.ring-span-lite]
type = "header-only"
include-dirs = ["include"]
# README.md:73, "for use with C++98 and later".
interface-cxx-standard = "c++98"
