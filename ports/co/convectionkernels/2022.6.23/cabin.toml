# The nine code-bearing sources of ConvectionKernels.vcxproj; ConvectionKernels_SingleFile.cpp
# is an empty translation unit unless CVTT_SINGLE_FILE is defined.  The SSE2 kernels are
# selected by compiler-predefined macros (ConvectionKernels_Config.h).  Upstream states no
# standard; c++14 is the oldest cl accepts.  The interface floor measured with clang
# -pedantic-errors is C++11 (c++98 fails at ConvectionKernels.h:184, "long long").
# Not ported: etc2packer and MakeTables.
[target.convectionkernels]
type = "library"
links = "ConvectionKernels"
sources = [
  "ConvectionKernels_API.cpp",
  "ConvectionKernels_BC67.cpp",
  "ConvectionKernels_BC6H_IO.cpp",
  "ConvectionKernels_BC7_PrioData.cpp",
  "ConvectionKernels_BCCommon.cpp",
  "ConvectionKernels_ETC.cpp",
  "ConvectionKernels_IndexSelector.cpp",
  "ConvectionKernels_S3TC.cpp",
  "ConvectionKernels_Util.cpp",
]
include-dirs = ["include"]
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
interface-c-standard = "none"
