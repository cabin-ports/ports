[package.upstream]
url = "https://github.com/MitchellThompkins/consteig/archive/refs/tags/1.2.0.tar.gz"
checksum = "sha256:724ac0237d025d9f0e6813bae423d9a77ac431a2dea5dfb2f749ed34eb36002b"
format = "tar.gz"
strip-prefix = "consteig-1.2.0"
# Patch 0001 divides two non-constant zeros under MSVC, which rejects the
# constant 0.0 / 0.0 (measured, check-windows: C2124 at utilities.hpp:130).
patches = ["patches/0001-msvc-constant-division-by-zero.patch"]

[package]
name = "cabin-ports/consteig"
version = "1.2.0"
# The vendored gcem's gcem_limits.hpp and gcem_type_traits.hpp credit libstdc++
# (GPL-3.0-or-later with the GCC Runtime Library Exception) for short
# numeric-limits and trait definitions; their copyright significance is uncertain.
license = "Apache-2.0"
include = ["LICENSE", "NOTICE", "include", "patches"]

# C++17 is the standard upstream states (README.md, CMakeLists.txt).
# With CONSTEIG_USE_GCEM the vendored gcem fork shares the include guard
# _gcem_HPP with cabin-ports/gcem, so only the first gcem.hpp a translation
# unit includes is used: after cabin-ports/gcem's, consteig's freestanding
# setting is ignored and <limits> and <type_traits> are included (measured,
# clang++ -std=c++17; both include orders compile).
[target.consteig]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
