[package.upstream]
url = "https://lemon.cs.elte.hu/pub/sources/lemon-1.3.1.tar.gz"
checksum = "sha256:71b7c725f4c0b4a8ccb92eb87b208701586cf7a96156ebd821ca3ed855bad3c8"
format = "tar.gz"
strip-prefix = "lemon-1.3.1"
# lemon/core.h, lp.h, bits/default_map.h and bits/lock.h include
# <lemon/config.h>, which CMake generates from lemon/config.h.in.  Patch
# 0001 adds one with the values of a build with every LP and MIP backend off,
# as conan-center-index builds it; for threading it tests _WIN32, since
# bits/lock.h's Lock is a member of AlterationNotifier, which consumers'
# graphs instantiate, so a profile define reaching only the library's own
# compiles would give the two different Lock layouts.  Like CMake's Threads
# check that is Win32 locking with MSVC and pthreads on Unix, but MinGW,
# where CMake would find winpthreads, also gets Win32 locking.  Patches 0002
# and 0003 are conan-center-index's portability fixes: random.h's register
# keyword, which C++17 removes, and array_map.h and path.h's
# std::allocator construct and destroy calls, which C++20 removes, kept for
# older standards.  Patch 0004 tests _WIN32 where upstream tests WIN32,
# which compilers predefine only in GNU dialects and upstream's MSVC build
# gets from CMake's default flags (bits/windows.cc:24, 43, 58, 97, 123, 135,
# 145, 153 and 160; graph_to_eps.h:28 and 677; random.h:74, 608, 628 and
# 650; time_measure.h:26 and 105).
patches = [
  "patches/0001-add-a-config-h-for-a-build-without-lp-solvers.patch",
  "patches/0002-remove-the-register-keyword-for-cxx17.patch",
  "patches/0003-use-allocator-traits-for-cxx20.patch",
  "patches/0004-test-the-predefined-win32-macro.patch",
]

[package]
name = "cabin-ports/coin-lemon"
version = "1.3.1"
# LICENSE gives the Boost Software License to code without its own notice.
# random.h's Mersenne Twister carries Makoto Matsumoto and Takuji
# Nishimura's BSD-3-Clause notice inline (:19-60).  bits/enable_if.h is a
# modified copy of Boost's enable_if, Copyright 2003 The Trustees of Indiana
# University, also under the Boost Software License (:19-32).
# concept_check.h, which says it was inspired by Boost's concept checking,
# shares only the ignore_unused_variable_warning and function_requires idiom.
license = "BSL-1.0 AND BSD-3-Clause"
include = ["AUTHORS", "LICENSE", "lemon", "patches"]

# The library lemon/CMakeLists.txt builds with no LP or MIP solver: the
# GLPK, CPLEX, CLP, CBC and SoPlex backends (glpk.cc and the like) are not
# built, so lp.h has no default LP or MIP solver.  Not ported: the demos,
# tools and tests.
[target.lemon]
type = "library"
sources = [
  "lemon/arg_parser.cc",
  "lemon/base.cc",
  "lemon/bits/windows.cc",
  "lemon/color.cc",
  "lemon/lp_base.cc",
  "lemon/lp_skeleton.cc",
  "lemon/random.cc",
]
include-dirs = ["."]
cxx-standard = "c++17"
interface-cxx-standard = "c++98"
# conan-center-index's LEMON_ONLY_TEMPLATES export is not followed: consumers'
# private INVALID would differ from base.cc's in inline code the library also
# compiles (lp_base.h:175).
# Upstream names the library emon on Unix, so that -lemon links it.
links = "emon"

# For LEMON_USE_PTHREAD (patch 0001).  Android's libc holds pthreads and the
# NDK has no libpthread.
[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]
