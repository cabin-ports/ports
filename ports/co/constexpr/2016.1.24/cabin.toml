[package.upstream]
url = "https://github.com/elbeno/constexpr/archive/a98b1db39c909e0130d21d3910d4faf97035a625.tar.gz"
checksum = "sha256:c8de3858896761b0511a10da707e1ee22cde93cc6aeb73e4728942bd9c2a0c8f"
format = "tar.gz"
strip-prefix = "constexpr-a98b1db39c909e0130d21d3910d4faf97035a625"
# Patch 0001 declares the inserter, sorter and merger specializations of cx_array.h under
# the access of their primary templates (measured, check-linux, GCC: "redeclared with
# different access").  Patch 0002 leaves out the unnamed namespace around the undefined
# error sentinels in every header that declares them, under cl only (measured,
# check-windows: C7631 "variable with internal linkage declared but not defined").
# MIT License notice of the headers whose lines the patches carry (the License's
# condition that copies include it):
# Copyright (c) 2015, 2016 Ben Deane
#
# Permission is hereby granted, free of charge, to any person obtaining a copy
# of this software and associated documentation files (the "Software"), to deal
# in the Software without restriction, including without limitation the rights
# to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
# copies of the Software, and to permit persons to whom the Software is
