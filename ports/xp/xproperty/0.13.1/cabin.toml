[package.upstream]
url = "https://github.com/jupyter-xeus/xproperty/archive/refs/tags/0.13.1.tar.gz"
checksum = "sha256:b41300838d0ca500d755f909377ba85b560da695809df20556d243c0f7023b23"
format = "tar.gz"
strip-prefix = "xproperty-0.13.1"

[package]
name = "cabin-ports/xproperty"
version = "0.13.1"
license = "BSD-3-Clause"
include = ["LICENSE", "include"]

[dependencies]
"cabin-ports/nlohmann_json" = "=3.12.0"

# C++17 is upstream's stated requirement (README.md:24).  xjson.hpp includes
# <nlohmann/json.hpp> and its to_json/from_json take nlohmann::json, so the
# dependency is public.
[target.xproperty]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [{ name = "cabin-ports/nlohmann_json", public = true }]
