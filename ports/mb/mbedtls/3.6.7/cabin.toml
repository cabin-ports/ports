[package.upstream]
# The v3.6.7 tag, Mbed TLS 3.6.7 of the 3.6 long-term-support branch.  Its
# GitHub archive lacks the framework submodule that the release tarball
# mbedtls-3.6.7.tar.bz2 carries, which is the only difference between the
# two trees; Cabin does not take tar.bz2.  The library build uses the
# framework only to regenerate sources the tag already carries, which the
# default GEN_FILES=OFF never does (CMakeLists.txt:70-77,
# library/Makefile:11-22), and for upstream's tests; upstream's CMake build
# still refuses to configure without it (CMakeLists.txt:318-325).
url = "https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.6.7.tar.gz"
checksum = "sha256:7312b70b067b6a271961c8d36c3b8f9ba3e86fe6b26f18af13cd70430ee52ed1"
format = "tar.gz"
strip-prefix = "mbedtls-3.6.7"

[package]
name = "cabin-ports/mbedtls"
version = "3.6.7"
include = ["LICENSE", "include", "library"]
# Upstream compiles C99 (CMakeLists.txt:201); Cabin has no C99 flag for
# MSVC, so the sources compile as C11, and the headers stay C99.  C++
# consumers need C++11, for the variadic macro of
# include/mbedtls/debug.h:23.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++11"

# LICENSE offers Apache-2.0 OR GPL-2.0-or-later and carries both texts;
# every shipped source file carries that SPDX identifier and "Copyright The
# Mbed TLS Contributors".
#
# The only advisory upstream lists as affecting 3.6.7 is CVE-2025-66442,
# which affects every version and has no fix: timing side channels that
# some compiler optimizations introduce into padding checks, not known to
# occur with default optimization flags, nor with GCC or Clang on Arm or
# x86 with MBEDTLS_HAVE_ASM, which the default configuration enables.
#
# The three static libraries of library/CMakeLists.txt (src_crypto,
# src_x509 and src_tls, lines 13-128), built with upstream's default
# configuration, include/mbedtls/mbedtls_config.h.  zlib support was
# removed in 3.0 (include/mbedtls/check_config.h:1113-1114), so there is no
# zlib dependency.  library/ecp_curves_new.c, an empty placeholder kept for
# custom build systems (its lines 2-3), ships with library/ but is not
# compiled, as in upstream's CMake and make builds.  Not ported:
# 3rdparty/everest and 3rdparty/p256-m, which upstream compiles into or
# links with mbedcrypto (library/CMakeLists.txt:289-295,
# library/Makefile:191) but whose code is wholly inside
# MBEDTLS_ECDH_VARIANT_EVEREST_ENABLED and
# MBEDTLS_PSA_P256M_DRIVER_ENABLED, which the default configuration leaves
# undefined (mbedtls_config.h:749, 1487); the shared libraries; the
# programs, tests and documentation.
#
# include/mbedtls/constant_time.h and include/mbedtls/psa_util.h declare
# their functions without extern "C", unlike the other public headers, so a
# C++ consumer that calls those functions includes the two headers inside
# an extern "C" block.
[target.mbedcrypto]
type = "library"
sources = [
  "library/aes.c",
  "library/aesni.c",
  "library/aesce.c",
  "library/aria.c",
  "library/asn1parse.c",
  "library/asn1write.c",
  "library/base64.c",
  "library/bignum.c",
  "library/bignum_core.c",
  "library/bignum_mod.c",
  "library/bignum_mod_raw.c",
  "library/block_cipher.c",
  "library/camellia.c",
  "library/ccm.c",
  "library/chacha20.c",
  "library/chachapoly.c",
  "library/cipher.c",
  "library/cipher_wrap.c",
  "library/constant_time.c",
  "library/cmac.c",
  "library/ctr_drbg.c",
  "library/des.c",
  "library/dhm.c",
  "library/ecdh.c",
  "library/ecdsa.c",
  "library/ecjpake.c",
  "library/ecp.c",
  "library/ecp_curves.c",
  "library/entropy.c",
  "library/entropy_poll.c",
  "library/error.c",
  "library/gcm.c",
  "library/hkdf.c",
  "library/hmac_drbg.c",
  "library/lmots.c",
  "library/lms.c",
  "library/md.c",
  "library/md5.c",
  "library/memory_buffer_alloc.c",
  "library/nist_kw.c",
  "library/oid.c",
  "library/padlock.c",
  "library/pem.c",
  "library/pk.c",
  "library/pk_ecc.c",
  "library/pk_wrap.c",
  "library/pkcs12.c",
  "library/pkcs5.c",
  "library/pkparse.c",
  "library/pkwrite.c",
  "library/platform.c",
  "library/platform_util.c",
  "library/poly1305.c",
  "library/psa_crypto.c",
  "library/psa_crypto_aead.c",
  "library/psa_crypto_cipher.c",
  "library/psa_crypto_client.c",
  "library/psa_crypto_driver_wrappers_no_static.c",
  "library/psa_crypto_ecp.c",
  "library/psa_crypto_ffdh.c",
  "library/psa_crypto_hash.c",
  "library/psa_crypto_mac.c",
  "library/psa_crypto_pake.c",
  "library/psa_crypto_rsa.c",
  "library/psa_crypto_random.c",
  "library/psa_crypto_se.c",
  "library/psa_crypto_slot_management.c",
  "library/psa_crypto_storage.c",
  "library/psa_its_file.c",
  "library/psa_util.c",
  "library/ripemd160.c",
  "library/rsa.c",
  "library/rsa_alt_helpers.c",
  "library/sha1.c",
  "library/sha256.c",
  "library/sha512.c",
  "library/sha3.c",
  "library/threading.c",
  "library/timing.c",
  "library/version.c",
  "library/version_features.c",
]
include-dirs = ["include"]
links = "mbedcrypto"

[target.mbedx509]
type = "library"
sources = [
  "library/pkcs7.c",
  "library/x509.c",
  "library/x509_create.c",
  "library/x509_crl.c",
  "library/x509_crt.c",
  "library/x509_csr.c",
  "library/x509write.c",
  "library/x509write_crt.c",
  "library/x509write_csr.c",
]
include-dirs = ["include"]
links = "mbedx509"
deps = [{ name = "mbedcrypto", public = true }]

[target.mbedtls]
type = "library"
sources = [
  "library/debug.c",
  "library/mps_reader.c",
  "library/mps_trace.c",
  "library/net_sockets.c",
  "library/ssl_cache.c",
  "library/ssl_ciphersuites.c",
  "library/ssl_client.c",
  "library/ssl_cookie.c",
  "library/ssl_debug_helpers_generated.c",
  "library/ssl_msg.c",
  "library/ssl_ticket.c",
  "library/ssl_tls.c",
  "library/ssl_tls12_client.c",
  "library/ssl_tls12_server.c",
  "library/ssl_tls13_keys.c",
  "library/ssl_tls13_server.c",
  "library/ssl_tls13_client.c",
  "library/ssl_tls13_generic.c",
]
include-dirs = ["include"]
links = "mbedtls"
deps = [{ name = "mbedx509", public = true }]

# net_sockets.c and x509_crt.c (inet_pton) use Winsock and entropy_poll.c
# BCryptGenRandom; upstream links ws2_32 and bcrypt on Windows, and the
# network library on Haiku (library/CMakeLists.txt:225-227, 238-240).
[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32", "bcrypt"]

[target.'cfg(os = "haiku")'.profile]
link-libs = ["network"]
