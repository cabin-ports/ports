[package.upstream]
url = "https://github.com/phmkopp/vtu11/archive/refs/tags/v1.3.tar.gz"
checksum = "sha256:ab86f2fcb633146e9245a2e36d918c53767c5edfee008f83aece5d551241558b"
format = "tar.gz"
strip-prefix = "vtu11-1.3"

# Upstream declares no version; v1.3 maps to 1.3.0.
# BSD-3-Clause: vtu11's LICENSE.
# MIT: the bundled ghc::filesystem (vtu11/inc/filesystem.hpp).
[package]
name = "cabin-ports/vtu11"
version = "1.3.0"
# vtu11/impl/utilities_impl.hpp:139 credits cplusplus.com for encodedNumberOfBytes;
# its copyright significance is uncertain.
license = "BSD-3-Clause AND MIT"
include = ["LICENSE", "README.md", "vtu11"]

[dependencies]
"cabin-ports/zlib" = "=1.3.1"

# Standard: CMakeLists.txt:20 (cxx_std_11) and README.md "compile using (at
# least) the C++ 11 standard".  VTU11_ENABLE_ZLIB, which upstream's CMakeLists.txt
# defines when find_package(ZLIB) succeeds, turns on RawBinaryCompressed; without
# it that mode writes uncompressed data.
[target.vtu11]
type = "header-only"
include-dirs = ["."]
interface-defines = ["VTU11_ENABLE_ZLIB"]
deps = [{ name = "cabin-ports/zlib", public = true }]
interface-cxx-standard = "c++11"
