[package.upstream]
url = "https://github.com/jnk0le/Ring-Buffer/archive/160190e0c985e0181e728a0b9f321f25ac549f20.tar.gz"
checksum = "sha256:9984f0f9c9bc453c3e835a9954e0b1914472e3657086accd5d1345a7c7c28e88"
format = "tar.gz"
strip-prefix = "Ring-Buffer-160190e0c985e0181e728a0b9f321f25ac549f20"

[package]
name = "cabin-ports/jnk0le-ringbuffer"
version = "2.0.5"
license = "MIT"
include = ["LICENSE", "ringbuffer.hpp"]

# Upstream has no tags; this is the commit ConanCenter packages, and ringbuffer.hpp declares
# `\version 2.0.5`.  The master head differs only by one added comment.
# Header-only SPSC ring buffer at the archive root, so consumers write
# `#include <ringbuffer.hpp>`.  README.md states "pure C++11".
[target.jnk0le-ringbuffer]
type = "header-only"
include-dirs = ["."]
interface-cxx-standard = "c++11"
