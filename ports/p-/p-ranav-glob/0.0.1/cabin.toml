[package.upstream]
url = "https://github.com/p-ranav/glob/archive/refs/tags/v0.0.1.tar.gz"
checksum = "sha256:f0b74df0417d04a0116bceeca2f2401a77a1d44e7ea75b369b98b87b791853ae"
format = "tar.gz"
strip-prefix = "glob-0.0.1"

# vcpkg's and ConanCenter's name; a bare glob would read as POSIX glob(3).
[package]
name = "cabin-ports/p-ranav-glob"
version = "0.0.1"
license = "MIT"
include = ["LICENSE", "README.md", "include", "source"]

# Upstream's two-file flavor, as its CMake and vcpkg build it; the
# single_include/ header is left out.  C++17 is upstream's floor (README.md:33).
# Limitations (measured):
# - rglob's ** never matches zero directories, so rglob("d/**/*.txt") misses
#   d's own files.
# - glob("d/*.txt") returns d/.h.txt, yet relative wildcard patterns whose
#   matches lie outside the working directory or in one of its
#   dot-directories, such as glob("../*.txt") or glob(".hid/*.txt"), match
#   nothing.
# - A relative pattern's wildcard matches and reports a symlink by its
#   target's filename, so glob("d/*.txt") returns d/real.txt for
#   d/link.dat -> ../e/real.txt.
# - "[a--c]" throws std::regex_error, and "[a--c]*.txt" also reads out of
#   bounds in translate (glob.cpp:60) (measured with ASan).
# - With libstdc++, a class that starts with "]", such as "[]x]", matches
#   nothing.
# - A file named only "\n" matches every pattern whose last component has a
#   wildcard, and a literal path to a broken symlink matches nothing, though
#   glob.h:14 says broken symlinks are included.
# - Concurrent first calls race on translate's static map (measured with TSan).
[target.glob]
type = "library"
sources = ["source/glob.cpp"]
include-dirs = ["include"]
cxx-standard = "c++17"
interface-cxx-standard = "c++17"
# Upstream's library name (CMakeLists.txt:47).
links = "glob"
