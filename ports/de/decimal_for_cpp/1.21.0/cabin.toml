[package.upstream]
# Upstream has no tags or releases.  This is master's head (2024-09-18,
# "#67: updated version info"), which sets README.md's "Version: 1.21", the
# version here; decimal.h's "Version: 1.18" comment predates it.
url = "https://github.com/vpiotr/decimal_for_cpp/archive/599372ee214ab37b5c0fc68148352321978f20ed.tar.gz"
checksum = "sha256:b64d4f4f07686da39ab0701d39dd74e8099b0b3cf0b541cdde873e04938bed3a"
format = "tar.gz"
strip-prefix = "decimal_for_cpp-599372ee214ab37b5c0fc68148352321978f20ed"

[package]
name = "cabin-ports/decimal_for_cpp"
version = "1.21.0"
license = "BSD-3-Clause"
include = ["doc/license.txt", "include"]

# C++11 is upstream's stated default (README.md, CMakeLists.txt:9).
# half_even_round_policy misrounds some products and quotients: 1.25 * 1.10
# gives 1.37 and 0.01 / 0.03 gives 0.34, not 1.38 and 0.33.
[target.decimal_for_cpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
