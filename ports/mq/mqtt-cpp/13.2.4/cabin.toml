[dependencies]
"cabin-ports/boost-any" = "=1.92.0"
"cabin-ports/boost-asio" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-container" = "=1.92.0"
"cabin-ports/boost-container-hash" = "=1.92.0"
"cabin-ports/boost-lexical-cast" = "=1.92.0"
"cabin-ports/boost-multi-index" = "=1.92.0"
"cabin-ports/boost-numeric-conversion" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-system" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"
"cabin-ports/boost-variant" = "=1.92.0"
"cabin-ports/boost-beast" = { version = "=1.92.0", optional = true }
"cabin-ports/openssl" = { version = "=4.1.0", optional = true }

# Upstream's CMakeLists.txt defines MQTT_USE_TLS and MQTT_USE_WS where its
# options are on, both off by default.  The mqtt_cpp target is the default
# build; mqtt_cpp_tls, mqtt_cpp_ws and mqtt_cpp_tls_ws are the builds with the
# options on.  Use one of them in place of mqtt_cpp, never several.
[features]
default = []
tls = ["dep:cabin-ports/openssl"]
ws = ["dep:cabin-ports/boost-beast"]
# Requests the openssl port's own build of OpenSSL in place of the system's;
# Windows refuses it (the openssl port's tests/vendored).
vendored-openssl = ["tls", "cabin-ports/openssl/vendored"]

# C++14 is the standard CMakeLists.txt sets (CMAKE_CXX_STANDARD 14).
# The defines are upstream's defaults for MQTT_USE_STR_CHECK and
# MQTT_ALWAYS_SEND_REASON_CODE.  Upstream's MQTT_USE_LOG build, which needs
# Boost.Log, is not provided.
[target.mqtt_cpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
interface-defines = ["MQTT_USE_STR_CHECK", "MQTT_ALWAYS_SEND_REASON_CODE=1"]
deps = [
  { name = "cabin-ports/boost-any", public = true },
  { name = "cabin-ports/boost-asio", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-container", public = true },
  { name = "cabin-ports/boost-container-hash", public = true },
  { name = "cabin-ports/boost-lexical-cast", public = true },
  { name = "cabin-ports/boost-multi-index", public = true },
  { name = "cabin-ports/boost-numeric-conversion", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-system", public = true },
  { name = "cabin-ports/boost-utility", public = true },
  { name = "cabin-ports/boost-variant", public = true },
]

# Upstream's interface library links Threads::Threads (include/CMakeLists.txt);
# nothing in its build mentions Android.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

[target.mqtt_cpp_tls]
type = "header-only"
interface-cxx-standard = "c++14"
interface-defines = ["MQTT_USE_TLS"]
required-features = ["tls"]
deps = [
  { name = "mqtt_cpp", public = true },
  { name = "cabin-ports/openssl:ssl", public = true },
  { name = "cabin-ports/openssl:crypto", public = true },
]

[target.mqtt_cpp_ws]
type = "header-only"
interface-cxx-standard = "c++14"
interface-defines = ["MQTT_USE_WS"]
required-features = ["ws"]
deps = [
  { name = "mqtt_cpp", public = true },
  { name = "cabin-ports/boost-beast", public = true },
]

[target.mqtt_cpp_tls_ws]
type = "header-only"
interface-cxx-standard = "c++14"
interface-defines = ["MQTT_USE_TLS", "MQTT_USE_WS"]
required-features = ["tls", "ws"]
deps = [
  { name = "mqtt_cpp", public = true },
  { name = "cabin-ports/openssl:ssl", public = true },
  { name = "cabin-ports/openssl:crypto", public = true },
  { name = "cabin-ports/boost-beast", public = true },
]
