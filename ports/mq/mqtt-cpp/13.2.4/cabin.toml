[package.upstream]
url = "https://github.com/redboltz/mqtt_cpp/archive/refs/tags/v13.2.4.tar.gz"
checksum = "sha256:98c680151e27fb2435a343cf46789df195f5ca37cfb0f4df1b970649a1edc0e9"
format = "tar.gz"
strip-prefix = "mqtt_cpp-13.2.4"

[package]
name = "cabin-ports/mqtt-cpp"
version = "13.2.4"
# include/mqtt/utf8encoded_strings.hpp:48 credits Markus Kuhn's utf8_check.c for
# the UTF-8 validator; its copyright significance is uncertain.
license = "BSL-1.0"
include = [
