  "include/mqtt/topic_alias_send.hpp",
  "include/mqtt/two_byte_util.hpp",
  "include/mqtt/two_or_four_byte_util.hpp",
  "include/mqtt/type.hpp",
  "include/mqtt/type_erased_socket.hpp",
  "include/mqtt/unique_scope_guard.hpp",
