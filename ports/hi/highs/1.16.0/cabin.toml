include-dirs = ["highs", "extern"]
# Upstream requires C++11 (CMakeLists.txt:31-33); C++14 is the oldest standard
# Cabin can request from MSVC, as C11 is for basiclu and cuPDLP-C, whose
# build states no C standard.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
c-standard = "c11"
# Upstream states no C standard; c99 is the measured floor of highs_c_api.h
# (c89 fails on "// comments are not allowed in this language").
interface-c-standard = "c99"
links = "highs"
deps = ["cabin-ports/zlib"]

# highs/CMakeLists.txt:290-298: the definitions upstream adds for MSVC.
[target.'cfg(any(cxx = "msvc", cxx = "clang-cl"))'.profile]
defines = [
  "NOMINMAX",
  "WIN32_LEAN_AND_MEAN=1",
  "_CRT_SECURE_NO_DEPRECATE",
  "_CRT_SECURE_NO_WARNINGS",
]

# CMake's MSVC defaults and MinGW's GNU modes define WIN32, which
# highs/pdlp/cupdlp/cupdlp_utils.c:1145 tests to time PDLP with clock().
[target.'cfg(os = "windows")'.profile]
defines = ["WIN32"]

# Threads::Threads (highs/CMakeLists.txt:504).
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

# CMAKE_DL_LIBS (highs/CMakeLists.txt:505), for the dlopen of the extras.
[target.'cfg(os = "linux")'.profile]
link-libs = ["dl"]
