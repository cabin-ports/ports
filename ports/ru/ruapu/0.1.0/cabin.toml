# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
# SOFTWARE.
patches =["patches/0001-use-__asm__-for-strict-c-standards.patch"]

[package]
name = "cabin-ports/ruapu"
version = "0.1.0"
license = "MIT"
include = ["LICENSE", "patches", "ruapu.h"]

# Define RUAPU_IMPLEMENTATION before including ruapu.h in exactly one source
# file (README.md).  Upstream states no C standard; C99 is measured.
# Not ported: main.c (a sample) and the Python binding.
[target.ruapu]
type = "header-only"
include-dirs = ["."]
interface-c-standard = "c99"
# In strict C, glibc declares sigjmp_buf, siginfo_t and SA_ONSTACK only under
# _DEFAULT_SOURCE (measured: check-linux, "unknown type name 'sigjmp_buf'").
interface-defines = ["_DEFAULT_SOURCE"]
