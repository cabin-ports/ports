[package.upstream]
url = "https://github.com/nihui/ruapu/archive/refs/tags/0.1.0.tar.gz"
checksum = "sha256:65fd826ed1772717d4cee70b6620277df0328408612f7643658a0064f1a163ff"
format = "tar.gz"
strip-prefix = "ruapu-0.1.0"
# Patch 0001 spells the inline-assembly keyword __asm__: the header writes asm,
# which a strict -std=c99 compile rejects (measured on macOS arm64: use of
# undeclared identifier 'asm').
# Patch 0002 defines _POSIX_C_SOURCE on Linux ahead of the header's libc includes
# (measured: check-linux, "unknown type name 'sigjmp_buf'" under -std=c99); a
# consumer must include ruapu.h in the implementation file before any libc header.
patches = [
  "patches/0001-use-__asm__-for-strict-c-standards.patch",
  "patches/0002-expose-posix-signal-api-under-strict-c.patch",
]

[package]
name = "cabin-ports/ruapu"
version = "0.1.0"
license = "MIT"
include = ["LICENSE", "patches", "ruapu.h"]

# Define RUAPU_IMPLEMENTATION before including ruapu.h in exactly one source
# file (README.md).  Upstream states no C standard; C99 is measured.
# Not ported: main.c (a sample) and the Python binding.
[target.ruapu]
type = "header-only"
include-dirs = ["."]
interface-c-standard = "c99"
