[package.upstream]
url = "https://github.com/approvals/ApprovalTests.cpp/archive/refs/tags/v.10.14.0.tar.gz"
format = "tar.gz"
checksum = "sha256:a0dc6350b5b0e812878c0438c0d90fa603110653175253ebcca4b5df642bd399"
strip-prefix = "ApprovalTests.cpp-v.10.14.0"

[package]
name = "cabin-ports/approval-tests-cpp"
version = "10.14.0"
# utilities/CartesianProduct.h:49 credits cppreference for apply(); its
# copyright significance is uncertain.
license = "Apache-2.0"
# The test-framework integrations are headers the consumer selects with a
# macro (APPROVALS_CATCH2_V3, APPROVALS_GOOGLETEST, ...) and builds against
# its own framework; third_party/ is left out.
include = ["ApprovalTests", "LICENSE", "README.md"]

# The static library ApprovalTests/CMakeLists.txt builds from these 70
# sources; its include paths are the package root and ApprovalTests/.
# README.md:39 states C++11 (or above); C++14 is the oldest standard Cabin
# can request from MSVC.
[target.ApprovalTests]
type = "library"
sources = [
  "ApprovalTests/ApprovalUtils.cpp",
  "ApprovalTests/comparators/ComparatorDisposer.cpp",
  "ApprovalTests/comparators/ComparatorFactory.cpp",
  "ApprovalTests/comparators/TextFileComparator.cpp",
  "ApprovalTests/core/ApprovalException.cpp",
  "ApprovalTests/core/FileApprover.cpp",
  "ApprovalTests/core/Options.cpp",
  "ApprovalTests/integrations/FrameworkIntegrations.cpp",
  "ApprovalTests/integrations/google/GoogleConfiguration.cpp",
  "ApprovalTests/integrations/google/GoogleCustomizationsFactory.cpp",
  "ApprovalTests/launchers/SystemLauncher.cpp",
