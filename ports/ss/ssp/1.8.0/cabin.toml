[package.upstream]
url = "https://github.com/red0124/ssp/archive/refs/tags/v1.8.0.tar.gz"
checksum = "sha256:a4416746023c8a60f6808200193dd207f1044b6e37e6c5bc0462e85452307d1d"
format = "tar.gz"
strip-prefix = "ssp-1.8.0"
# Patch 0001 qualifies the option types in setup.hpp: MSVC resolves the names
# at instantiation and finds the static bool members of the same name (measured:
# check-windows, "setup.hpp(204): error C2275: 'ss::string_error': expected an
# expression instead of a type").
# MIT License notice of include/ss/setup.hpp, whose lines 0001 carries (the
# License's condition that copies include it):
# MIT License
#
