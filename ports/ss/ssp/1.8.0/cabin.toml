# OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
# SOFTWARE.
patches = ["patches/0001-qualify-option-types-in-setup.patch"]

[package]
name = "cabin-ports/ssp"
version = "1.8.0"
# README.md:25 credits qt-creator for the function traits
# (include/ss/function_traits.hpp); its copyright significance is uncertain.
license = "MIT"
# The root ssp.hpp single header disables fast_float, so it stays out.
include = ["LICENSE", "README.md", "include", "patches"]

[dependencies]
"cabin-ports/fast_float" = "=8.3.3"

[target.ssp]
type = "header-only"
include-dirs = ["include"]
# README.md:22 and CMakeLists.txt:45 (cxx_std_17).
interface-cxx-standard = "c++17"
deps = [{ name = "cabin-ports/fast_float", public = true }]
