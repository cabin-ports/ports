[package.upstream]
url = "https://github.com/svgpp/svgpp/archive/refs/tags/v1.3.1.tar.gz"
checksum = "sha256:be8a89df72d01cf062cc9815dd64c9576b4d20910d6d7aee7f0ea26484dc5e76"
format = "tar.gz"
strip-prefix = "svgpp-1.3.1"

[package]
name = "cabin-ports/svgpp"
version = "1.3.1"
license = "BSL-1.0"
# `include` leaves out src/ and third_party/ (agg, googletest, rapidxml_ns, stb
# under their own terms), which nothing here builds.
include = ["LICENSE_1_0.txt", "README.md", "include"]

[dependencies]
"cabin-ports/boost-algorithm" = "=1.92.0"
"cabin-ports/boost-array" = "=1.92.0"
"cabin-ports/boost-assert" = "=1.92.0"
"cabin-ports/boost-config" = "=1.92.0"
"cabin-ports/boost-core" = "=1.92.0"
"cabin-ports/boost-detail" = "=1.92.0"
"cabin-ports/boost-exception" = "=1.92.0"
"cabin-ports/boost-format" = "=1.92.0"
"cabin-ports/boost-fusion" = "=1.92.0"
"cabin-ports/boost-gil" = "=1.92.0"
"cabin-ports/boost-integer" = "=1.92.0"
"cabin-ports/boost-iterator" = "=1.92.0"
"cabin-ports/boost-math" = "=1.92.0"
"cabin-ports/boost-move" = "=1.92.0"
"cabin-ports/boost-mpl" = "=1.92.0"
"cabin-ports/boost-multi-array" = "=1.92.0"
"cabin-ports/boost-optional" = "=1.92.0"
"cabin-ports/boost-phoenix" = "=1.92.0"
"cabin-ports/boost-preprocessor" = "=1.92.0"
"cabin-ports/boost-range" = "=1.92.0"
"cabin-ports/boost-ratio" = "=1.92.0"
"cabin-ports/boost-smart-ptr" = "=1.92.0"
"cabin-ports/boost-spirit" = "=1.92.0"
"cabin-ports/boost-static-assert" = "=1.92.0"
"cabin-ports/boost-tti" = "=1.92.0"
"cabin-ports/boost-tuple" = "=1.92.0"
"cabin-ports/boost-type-traits" = "=1.92.0"
"cabin-ports/boost-utility" = "=1.92.0"
"cabin-ports/boost-variant" = "=1.92.0"

# exboost/ is upstream's copy of Boost.Parameter 1.70.0 in namespace exboost,
# used instead of Boost's own from Boost 1.71 on, so boost-parameter is not
# needed.  boost-gil and boost-multi-array serve svgpp/utility/gil/, boost-smart-ptr
# policy/xml/msxml.hpp.  The XML parsers behind policy/xml/ are the consumer's.
# README.md:25 states C++11; the floor is C++14, that of the boost-spirit and
# boost-gil dependencies.
[target.svgpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++14"
deps = [
  { name = "cabin-ports/boost-algorithm", public = true },
  { name = "cabin-ports/boost-array", public = true },
  { name = "cabin-ports/boost-assert", public = true },
  { name = "cabin-ports/boost-config", public = true },
  { name = "cabin-ports/boost-core", public = true },
  { name = "cabin-ports/boost-detail", public = true },
  { name = "cabin-ports/boost-exception", public = true },
  { name = "cabin-ports/boost-format", public = true },
  { name = "cabin-ports/boost-fusion", public = true },
  { name = "cabin-ports/boost-gil", public = true },
  { name = "cabin-ports/boost-integer", public = true },
  { name = "cabin-ports/boost-iterator", public = true },
  { name = "cabin-ports/boost-math", public = true },
  { name = "cabin-ports/boost-move", public = true },
  { name = "cabin-ports/boost-mpl", public = true },
  { name = "cabin-ports/boost-multi-array", public = true },
  { name = "cabin-ports/boost-optional", public = true },
  { name = "cabin-ports/boost-phoenix", public = true },
  { name = "cabin-ports/boost-preprocessor", public = true },
  { name = "cabin-ports/boost-range", public = true },
  { name = "cabin-ports/boost-ratio", public = true },
  { name = "cabin-ports/boost-smart-ptr", public = true },
  { name = "cabin-ports/boost-spirit", public = true },
  { name = "cabin-ports/boost-static-assert", public = true },
  { name = "cabin-ports/boost-tti", public = true },
  { name = "cabin-ports/boost-tuple", public = true },
  { name = "cabin-ports/boost-type-traits", public = true },
  { name = "cabin-ports/boost-utility", public = true },
  { name = "cabin-ports/boost-variant", public = true },
]
