[package.upstream]
url = "https://github.com/mapbox/gzip-hpp/archive/refs/tags/v0.1.0.tar.gz"
checksum = "sha256:7ce3908cd13f186987820be97083fc5e62a7c6df0877af44b334a92e868eff06"
format = "tar.gz"
strip-prefix = "gzip-hpp-0.1.0"

[package]
name = "cabin-ports/gzip-hpp"
version = "0.1.0"
include = ["LICENSE.md", "include"]

[dependencies]
"cabin-ports/zlib" = "^1.3"

# compress.hpp, decompress.hpp and utils.hpp lack include guards; utils.hpp,
# and decompress.hpp under DEBUG, use <cstdint> types without including it;
# and a zlib.h included before them needs ZLIB_CONST, which config.hpp
# defines.  decompress() returns a truncated stream's partial output without
# an error, and on a zlib stream that asks for a preset dictionary builds
# its exception message from a null pointer.
[target.gzip-hpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++11"
deps = [{ name = "cabin-ports/zlib", public = true }]
