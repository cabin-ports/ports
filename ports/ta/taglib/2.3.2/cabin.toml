  "taglib/ape/apetag.h",
  "taglib/asf",
  "taglib/audioproperties.cpp",
  "taglib/audioproperties.h",
  "taglib/dsdiff",
  "taglib/dsf",
  "taglib/fileref.cpp",
  "taglib/fileref.h",
  "taglib/flac",
  "taglib/it",
