# C++17 for the library and its C++ consumers, per CMakeLists.txt:5
# (CMAKE_CXX_STANDARD 17) and CHANGELOG.md:124.
cxx-standard = "c++17"

# Upstream links zlib when CMake finds it (WITH_ZLIB, on by default) to read
# compressed ID3v2 frames; Cabin cannot gate a target's dependency on a
# feature, so it is always on.  utfcpp stands in for the copy upstream
# bundles in 3rdparty/utfcpp, which CMake uses only when it finds none
# installed.
[dependencies]
"cabin-ports/utfcpp" = "^4.2"
"cabin-ports/zlib" = "^1.3"

# The source directories upstream's build compiles with
# (taglib/CMakeLists.txt:1-73), for the package's own compiles only.
[profile]
include-dirs = [
  "taglib",
  "taglib/ape",
  "taglib/asf",
  "taglib/dsdiff",
  "taglib/dsf",
  "taglib/flac",
  "taglib/it",
  "taglib/matroska",
  "taglib/matroska/ebml",
  "taglib/mod",
  "taglib/mp4",
  "taglib/mpc",
  "taglib/mpeg",
  "taglib/mpeg/id3v1",
  "taglib/mpeg/id3v2",
  "taglib/mpeg/id3v2/frames",
  "taglib/ogg",
  "taglib/ogg/flac",
  "taglib/ogg/opus",
  "taglib/ogg/speex",
  "taglib/ogg/vorbis",
  "taglib/riff",
  "taglib/riff/aiff",
  "taglib/riff/wav",
  "taglib/s3m",
  "taglib/shorten",
  "taglib/toolkit",
  "taglib/trueaudio",
  "taglib/wavpack",
  "taglib/xm",
]

# config.h's values as ConfigureChecks.cmake finds them, passed as defines:
# the sources read config.h only under HAVE_CONFIG_H, which stays undefined.
[target.'cfg(cxx = "msvc")'.profile]
defines = ["HAVE_MSC_BYTESWAP=1"]

[target.'cfg(not(cxx = "msvc"))'.profile]
defines = ["HAVE_GCC_BYTESWAP=1"]

[target.'cfg(os = "windows")'.profile]
defines = ["HAVE_ISO_STRDUP=1"]

