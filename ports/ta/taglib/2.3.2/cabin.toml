[package.upstream]
url = "https://github.com/taglib/taglib/releases/download/v2.3.2/taglib-2.3.2.tar.gz"
checksum = "sha256:3ca2d8afaa7f1cf7f6ed10e511ebc368bfacd6dcaa3dbfa690b89e502e8963dc"
format = "tar.gz"
strip-prefix = "taglib-2.3.2"
# Upstream installs its headers flat in include/taglib
# (taglib/CMakeLists.txt:588, bindings/c/CMakeLists.txt:140), with the
# taglib_config.h CMake writes from taglib/taglib_config.h.cmake, which the
# sources read to know which formats are built.  Patch 0001 adds
# taglib_config.h there as CMake writes it with upstream's default options:
# every format on.  The other 132 headers exceed Cabin's 16 copy steps, so
# patch 0002 adds a forwarder for each there.
patches = [
  "patches/0001-add-taglib-config-h.patch",
  "patches/0002-add-include-taglib-forwarders.patch",
]

[package]
name = "cabin-ports/taglib"
version = "2.3.2"
# Most files are LGPL-2.1 or, alternatively, MPL-1.1; taglib/it/itfile.h,
# taglib/mod/modfileprivate.h and bindings/c/tag_c.* offer only LGPL-2.1.
license = "LGPL-2.1-only"
# The ID3v2 and APE specifications beside the sources are left out: they are
# not built, and they carry their own terms or none.
include = [
  "AUTHORS",
  "COPYING.LGPL",
  "COPYING.MPL",
  "bindings/c",
  "include",
  "patches",
  "taglib/ape/apefile.cpp",
