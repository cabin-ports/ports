# Upstream defines TAGLIB_STATIC for its static libraries and their
# consumers.
defines = ["HAVE_ZLIB=1", "TAGLIB_STATIC"]
interface-defines = ["TAGLIB_STATIC"]
interface-c-standard = "none"
interface-cxx-standard = "c++17"
links = "tag"
deps = ["cabin-ports/utfcpp", "cabin-ports/zlib"]

# Linked to tag privately, as upstream does: tag_c.h includes no TagLib
# header.  Upstream states no standard for it; C99 and C++11 are measured.
[target.tag_c]
type = "library"
sources = ["bindings/c/tag_c.cpp"]
include-dirs = ["include/taglib"]
interface-defines = ["TAGLIB_STATIC"]
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "tag_c"
deps = ["tag"]
