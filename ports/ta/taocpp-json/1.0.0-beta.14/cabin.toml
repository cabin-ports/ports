[package.upstream]
url = "https://github.com/taocpp/json/archive/refs/tags/1.0.0-beta.14.tar.gz"
checksum = "sha256:f9e44a1d6a70a6d39b9e45df76eac928e69f5318e5a957fd5c0efdf45dacaf5e"
format = "tar.gz"
strip-prefix = "json-1.0.0-beta.14"

[package]
name = "cabin-ports/taocpp-json"
# Upstream's tag verbatim: it has published no final release.
version = "1.0.0-beta.14"
# MIT: LICENSE.  BSD-3-Clause: external/double.hpp (double-conversion,
# LICENSE.double-conversion).  MIT: external/itoa.hpp (LICENSE.itoa).
# Apache-2.0 OR BSL-1.0: external/ryu.hpp (LICENSE.ryu).
license = "MIT AND BSD-3-Clause AND (Apache-2.0 OR BSL-1.0)"
include = ["LICENSE", "LICENSE.double-conversion", "LICENSE.itoa", "LICENSE.ryu", "README.md", "include"]

[dependencies]
"cabin-ports/pegtl" = "=3.2.8"

# C++17 is stated in README.md:18 and CMakeLists.txt:25.
[target.json]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [{ name = "cabin-ports/pegtl:pegtl", public = true }]
