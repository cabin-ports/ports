[package.upstream]
url = "https://github.com/tristanpenman/valijson/archive/refs/tags/v1.1.3.tar.gz"
checksum = "sha256:887b53b1a924f6fe0b35fa3bbc9bbbe5ae8c72097b7f0f7c17b45f4cfa646029"
format = "tar.gz"
strip-prefix = "valijson-1.1.3"

[package]
name = "cabin-ports/valijson"
version = "1.1.3"
license = "BSD-2-Clause"
include = ["LICENSE", "include"]

# Upstream's valijson INTERFACE target: include/ (CMakeLists.txt:40-42),
# C++17 (:37), and VALIJSON_USE_EXCEPTIONS=1 from the
# valijson_USE_EXCEPTIONS option, on by default (:19, :52-54), so fatal
# errors (invalid schemas, unresolved references, API misuse) throw
# std::runtime_error or std::logic_error instead of printing and calling
# abort() (exceptions.hpp:13-33).  Upstream's exceptions-off build is not
# offered, so consumers compiled with -fno-exceptions are unsupported.  The
# fast_float and Boost.Regex options stay at their off defaults, as in
# vcpkg.  The adapters for nlohmann_json, jsoncpp, RapidJSON and the other
# JSON libraries ship as upstream installs them; each includes its own
# library, which a consumer depends on itself.  The consumer test drives
# the core through StdStringAdapter, since the probe carries only this
# port's dependencies and none of the adapters' libraries.  Not ported: the
# tests, examples, inspector, docs, bundle.sh, thirdparty/ (the bundled
# JSON libraries, and the fast_float headers upstream installs only with
# valijson_USE_FAST_FLOAT, :60-63) and the CMake package files.
[target.valijson]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
interface-defines = ["VALIJSON_USE_EXCEPTIONS=1"]
