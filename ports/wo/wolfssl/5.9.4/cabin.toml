# libwolfssl as a default ./configure builds it, with the configuration it
# generates in user_settings.h; settings.h includes that file, beside it, for
# the library and for consumers, which interface-defines below reach.  The
# defaults leave off DTLS, QUIC, ASIO, X25519 and Ed25519, session tickets,
# the TLS secret callback, OCSP, CRL, ALPN, PSK, MD5, DES3, TLS 1.0 and 1.1,
# and the OpenSSL compatibility layer, whose headers install nonetheless;
# they turn on TLS 1.2 and 1.3, ECC, RSA and DH, AES-GCM, ChaCha20-Poly1305,
# SHA-3, ML-KEM key shares, and loading the system's CA certificates.  No
# assembly source is compiled by default; the SP math code uses GCC-style
# inline assembly on x86_64 and aarch64.  MSVC, which has no 128-bit
# integer, takes its 32-bit C path on x64 (sp_int.h:217-219) and builds it in
# C on Arm64.
#
# Not reproduced: the shared library and its hidden visibility, which a static
# library does not need; -fwrapv, which configure's hardening adds but a
# registry package's cflags cannot carry, as upstream's CMake build also
# omits it; and the configure arguments and flags wolfSSL_configure_args()
# and wolfSSL_global_cflags() report, which return NULL here.  Not ported:
# the examples, tests, benchmark and sniffer.
[target.wolfssl]
type = "library"
sources = [
  "src/internal.c",
  "src/keys.c",
  "src/ssl.c",
  "src/tls.c",
  "src/tls13.c",
  "src/wolfio.c",
  "wolfcrypt/src/aes.c",
  "wolfcrypt/src/asn.c",
  "wolfcrypt/src/chacha.c",
  "wolfcrypt/src/chacha20_poly1305.c",
  "wolfcrypt/src/coding.c",
  "wolfcrypt/src/cpuid.c",
  "wolfcrypt/src/dh.c",
  "wolfcrypt/src/ecc.c",
  "wolfcrypt/src/error.c",
  "wolfcrypt/src/hash.c",
  "wolfcrypt/src/hmac.c",
  "wolfcrypt/src/kdf.c",
  "wolfcrypt/src/logging.c",
  "wolfcrypt/src/memory.c",
  "wolfcrypt/src/pkcs12.c",
  "wolfcrypt/src/poly1305.c",
  "wolfcrypt/src/pwdbased.c",
  "wolfcrypt/src/random.c",
  "wolfcrypt/src/rsa.c",
  "wolfcrypt/src/sha.c",
  "wolfcrypt/src/sha256.c",
  "wolfcrypt/src/sha3.c",
  "wolfcrypt/src/sha512.c",
  "wolfcrypt/src/signature.c",
  "wolfcrypt/src/sp_int.c",
  "wolfcrypt/src/wc_encrypt.c",
  "wolfcrypt/src/wc_mlkem.c",
  "wolfcrypt/src/wc_mlkem_poly.c",
  "wolfcrypt/src/wc_port.c",
  "wolfcrypt/src/wolfmath.c",
]
include-dirs = ["."]
defines = ["WOLFSSL_USER_SETTINGS"]
interface-defines = ["WOLFSSL_USER_SETTINGS"]
# configure compiles with the compiler's default C dialect, a GNU one on GCC
# and Clang.  Cabin's gnu-extensions cannot be limited to those compilers,
# so the build is strict C11, and the Unix profile below defines
# _DEFAULT_SOURCE, which glibc implies outside strict modes.
c-standard = "c11"
# The headers declare anonymous unions and structs, which change the layout
# of structures such as WC_RNG, only from C11 and C++11 (types.h:128-132), so
# a C99 consumer would disagree with the C11 library.  C++ also needs C++11
# for long long and trailing enum commas (types.h:212-221 and 384-389).
interface-c-standard = "c11"
interface-cxx-standard = "c++11"
links = "wolfssl"

# configure links libm and pthreads; on Linux the RNG's fork handlers also
# need dladdr, from libdl before glibc 2.34.
[target.'cfg(family = "unix")'.profile]
defines = ["_DEFAULT_SOURCE"]
link-libs = ["m"]

[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]

[target.'cfg(os = "linux")'.profile]
link-libs = ["dl"]

# The Security framework API that loads the system's CA certificates.
[target.'cfg(any(os = "macos", os = "ios"))'.profile]
frameworks = ["CoreFoundation", "Security"]

# configure targets MinGW, not MSVC: user_settings.h follows its MinGW
# results, except that SP math avoids the variable-length arrays MSVC lacks.
# Winsock for wolfio.c, CryptAcquireContext in random.c, and
# CertOpenSystemStore in ssl_load.c.
[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32", "advapi32", "crypt32"]
