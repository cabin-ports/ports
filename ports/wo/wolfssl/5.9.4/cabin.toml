[package.upstream]
# The tag's GitHub archive; the release assets are only its signature and
# SBOM.  Patch 0001 adds wolfssl/wolfcrypt/user_settings.h, the macros a
# default ./configure writes to options.h and config.h (package below), and
# patch 0002 adds a wolfssl/options.h that selects it.
url = "https://github.com/wolfssl/wolfssl/archive/refs/tags/v5.9.4-stable.tar.gz"
checksum = "sha256:7256bfc89b183a75183806c7debfa203443873b0b4a562e1b80d68e01b45ac57"
format = "tar.gz"
strip-prefix = "wolfssl-5.9.4-stable"
patches = [
  "patches/0001-add-a-user-settings-h-with-the-configure-defaults.patch",
  "patches/0002-add-an-options-h-that-selects-the-user-settings.patch",
]

[package]
name = "cabin-ports/wolfssl"
version = "5.9.4"
# LICENSING:1-6 grants the GPL version 3, which COPYING carries, and the
# source headers say "or any later version".  Its exception, declared as
# AdditionRef-wolfSSL-GPL-2.0-election, lets a licensee combining wolfSSL
# with the software LICENSING:8-26 lists (MariaDB, OpenVPN, U-Boot and
# others) elect version 2 instead.  Of the headers `make install` installs,
# wolfcrypt/wc_she.h is under the GPL version 2 or later,
# wolfcrypt/camellia.h keeps NTT's BSD-2-Clause-first-lines notice, and
# wolfcrypt/blake2-int.h and blake2-impl.h the BLAKE2 authors' CC0
# dedication; none is compiled by default.  The public-domain code wolfSSL
# credits (Bernstein's ChaCha and ref10, Andrew Moon's Poly1305, Daniel
# Beer's curve code, TomsFastMath, LibTomMath) adds no term.  certs_test.h
# and certs_test_sm.h, generated from wolfSSL's test certificates, and four
# OpenSSL shim headers of at most nine lines carry no notice.
# src/pk_rsa.c:2683-2707 quotes RFC 3447's EMSA-PSS figure and
# wolfcrypt/src/pwdbased.c:856-898 takes the Salsa20/8 core from RFC 7914;
# each is short, attributed and shaped by the algorithm, too slight to add a
# term.  wolfcrypt/src/aes.c:2996-3149 and 4072-4243, compiled only under
# WC_AES_BITSLICED (off by default), transcribe the AES S-box circuits
# SLP_AES_113.txt ("an improvement, by Cagdas Calik") and Sinv.txt from
# https://www.cs.yale.edu/homes/peralta/CircuitStuff/CMT.html, gate lists
# published without a notice; a minimized circuit is a computational result
# and adds no term.
license = "GPL-3.0-or-later WITH AdditionRef-wolfSSL-GPL-2.0-election AND GPL-2.0-or-later AND BSD-2-Clause-first-lines AND CC0-1.0"
