[package.upstream]
# xtensor-stack/xtl publishes no release assets; this is the 0.8.2 tag
# archive, the bytes ConanCenter (SHA-256) and vcpkg (SHA-512) pin.
url = "https://github.com/xtensor-stack/xtl/archive/refs/tags/0.8.2.tar.gz"
checksum = "sha256:8fb38d6a5856aab5740d2ccb3d791d289f648d4cc506b94a1338fe5fce100c11"
format = "tar.gz"
strip-prefix = "xtl-0.8.2"
# include/xtl/xspan_impl.hpp embeds tcb/span, "Distributed under the
# Boost Software License, Version 1.0" with a pointer to an accompanying
# LICENSE_1_0.txt (:9-12) that the archive does not ship, and that
# license requires source copies to include it.  Patch 0001 adds the
# license text, verbatim from https://www.boost.org/LICENSE_1_0.txt, as
# LICENSE_1_0.txt.  Code from the Loki library and from a Stack Overflow
# answer, listed under [package], ships without its terms: Loki's MIT
# License requires its copyright and permission notice in all copies or
# substantial portions, and CC BY-SA 3.0's sections 4(a) and 4(b) a copy of
# that licence or its URI with every copy.  Patch 0002 adds Loki's notice,
# verbatim from the header comment of Loki's include/loki/Visitor.h (:2-25,
# without the comment markers), as LICENSE.Loki; patch 0003 adds the
# CC BY-SA 3.0 text, verbatim from
# https://creativecommons.org/licenses/by-sa/3.0/legalcode.txt, as
# LICENSE.CC-BY-SA-3.0.
patches = [
  "patches/0001-add-boost-software-license-for-tcb-span.patch",
  "patches/0002-add-mit-license-for-loki-code.patch",
  "patches/0003-add-cc-by-sa-3.0-license-for-base64-code.patch",
]

[package]
name = "cabin-ports/xtl"
version = "0.8.2"
# LICENSE is xtl's BSD-3-Clause license; LICENSE_1_0.txt, LICENSE.Loki and
# LICENSE.CC-BY-SA-3.0 come from the patches above.  These blocks are
# modified from the Loki library, Copyright (c) 2001 by Andrei Alexandrescu,
# and its MIT License (LICENSE.Loki) applies to them:
# - include/xtl/xvisitor.hpp:18-191 (base_visitor, visitor, the catch_all
#   policies, base_visitable, cyclic_visitor and the XTL_DEFINE_*VISITABLE
#   macros), ported to C++14 from Loki's Visitor.h,
#   https://github.com/snaewe/loki-lib/blob/7c29d87ecdecd60e39db969125753f6a4f549131/include/loki/Visitor.h.
# - include/xtl/xmultimethods.hpp:25-190 and :342-419 (static_dispatcher,
#   basic_dispatcher, the casters and functor_dispatcher), ported and
#   generalized to N arguments from Loki's MultiMethods.h,
#   https://github.com/snaewe/loki-lib/blob/7c29d87ecdecd60e39db969125753f6a4f549131/include/loki/MultiMethods.h.
#   basic_fast_dispatcher (:191-341) has no Loki counterpart; it is xtl's
#   own N-argument form of the BasicFastDispatcher listing in Andrei
#   Alexandrescu's book Modern C++ Design (2001), multimethods chapter.
#   What follows that listing, the static per-class index of
#   XTL_IMPLEMENT_INDEXABLE_CLASS (:195-204), the callback storage and
#   next-index counter (:260-261, :321-324), and the lazy index assignment
#   in resize_container (:263-276), is a few lines of a functional indexing
#   pattern, too slight to carry copyright; this was compared against two
#   third-party transcriptions of the listing, not the book itself.
# include/xtl/xbase64.hpp:21-75 (base64decode, base64encode) is modified
# from the answer to "Base64 decode snippet in C++",
# https://stackoverflow.com/a/34571089 (revision 1, 2016), by Manuel
# Martinez (https://stackoverflow.com/users/5739045), CC BY-SA 3.0; that
# block is distributed under CC BY-SA 3.0 (LICENSE.CC-BY-SA-3.0), and the
# rest of the package stays under the licenses above.
# include/xtl/xhash.hpp's dummy hash (:33-44), load_bytes (:96-105), and the
# 64-bit murmur_hash's constant spelling and aligned-tail split (:107-140)
# follow libstdc++'s libsupc++/hash_bytes.cc (gcc-7.1.0,
# GPL-3.0-or-later WITH GCC-exception-3.1): a one-line comment and a few
# lines of functional hashing code, too slight to carry copyright.  The
# 64-bit hash is Austin Appleby's public-domain MurmurHash64A algorithm, and
# :47-88 and :141-186 are his public-domain MurmurHash2 and MurmurHash2A
# from SMHasher, credited at :46.
include = [
  "LICENSE",
  "LICENSE_1_0.txt",
  "LICENSE.Loki",
  "LICENSE.CC-BY-SA-3.0",
  "include",
  "patches",
]

[dependencies]
"cabin-ports/nlohmann_json" = "^3.12"

# The 30 headers under include/xtl (CMakeLists.txt:39-70), used as
# <xtl/xoptional.hpp> and so on, with upstream's C++17 interface
# requirement (:82).  xjson.hpp, the to_json and from_json overloads for
# xoptional and xbasic_fixed_string, includes <nlohmann/json.hpp>;
# upstream's CMake only looks for nlohmann_json (:32-34) and leaves it to
# consumers, and vcpkg makes it a dependency, as here.  The other headers
# include it only under __CLING__, for xeus-cling's mime_bundle_repr.
# XTL_DISABLE_EXCEPTIONS only changes the tests' flags
# (test/CMakeLists.txt:48-79); xtl_config.hpp detects a build without
# exceptions itself.  Not ported: the tests, docs, and the CMake package
# and pkg-config files.
[target.xtl]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
deps = [{ name = "cabin-ports/nlohmann_json", public = true }]
