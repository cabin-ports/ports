[package.upstream]
url = "https://github.com/flexible-collision-library/fcl/archive/refs/tags/0.7.0.tar.gz"
checksum = "sha256:90409e940b24045987506a6b239424a4222e2daf648c86dd146cbcb692ebdcbc"
format = "tar.gz"
strip-prefix = "fcl-0.7.0"
# Patch 0001 adds include/fcl/config.h, export.h and fcl.h as CMake 4.4.5
# writes them for the static library with OctoMap 1.10.1, with the
# deprecation attribute CMake writes for Windows (export.h) left to the
# preprocessor.  Notices that upstream's files lack are in
# THIRD_PARTY_NOTICES (patch 0002).
patches = [
  "patches/0001-add-the-generated-config-export-and-fcl-headers.patch",
  "patches/0002-add-third-party-notices.patch",
]

[package]
name = "cabin-ports/fcl"
version = "0.7.0"
# BSD-3-Clause: fcl's LICENSE, and libccd's for the code copied from it.
# Zlib: Bullet's, for the GJK and EPA fcl rewrote from its btGjkEpa2.cpp.
# convexity_based_algorithm/list.h:35-82, five list macros and their
# comments from libccd, follow the Linux kernel's list.h (GPL-2.0-only)
# uncredited, of uncertain copyright significance; no term is declared.
# math/motion/taylor_model/ is "based on code developed by Stephane Redon
# at UNC and Inria for the CATCH library", whose terms upstream does not
# give; no term is declared.
license = "BSD-3-Clause AND Zlib"
include = ["LICENSE", "THIRD_PARTY_NOTICES", "include", "patches", "src"]

# libccd, Eigen 3.0.5 or later (CMakeLists.txt:160-170) and OctoMap, which
# FCL_WITH_OCTOMAP turns on by default (:237).  The catalog's ccd is
# single precision, libccd's default, which upstream builds with
# (CHANGELOG.md:61); queries through libccd's GJK, MPR and EPA then
# compute in float.
[dependencies]
"cabin-ports/ccd" = "^2.1"
"cabin-ports/eigen3" = "^5.0"
"cabin-ports/octomap" = "^1.10"

# The library upstream's CMake builds from every src/**/*.cpp, static, as
# FCL_STATIC_LIBRARY makes it by default with MSVC (CMakeLists.txt:76-80).
# Not ported: the tests and the docs.  Not reproduced, since Cabin drops a
# dependency's raw compiler flags: the public -mfpmath=sse -msse through
# -mssse3 of FCL_USE_X64_SSE on x86 GCC and Clang (:84, :110;
# src/CMakeLists.txt:51), which only let the compiler emit those
# instructions (FCL_HAVE_SSE stays 0), and MSVC's /bigobj
# (CMakeModules/CompilerSettings.cmake:67), so an MSVC consumer whose
# translation unit exceeds the object file's section limit (C1128) adds
# /bigobj itself.
[target.fcl]
type = "library"
