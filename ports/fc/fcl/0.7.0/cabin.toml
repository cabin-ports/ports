include-dirs = ["include"]
# Upstream compiles C++11 (CompilerSettings.cmake:36-56); Eigen 5, whose
# headers fcl's include, requires C++14.
cxx-standard = "c++14"
interface-cxx-standard = "c++14"
links = "fcl"
# fcl's public headers include <ccd/ccd.h>, Eigen and octomap/octomap.h.
deps = [
  { name = "cabin-ports/ccd", public = true },
  { name = "cabin-ports/eigen3", public = true },
  { name = "cabin-ports/octomap:octomap", public = true },
]
