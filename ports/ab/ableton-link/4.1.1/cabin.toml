[package.upstream]
url = "https://github.com/Ableton/link/archive/refs/tags/Link-4.1.1.tar.gz"
checksum = "sha256:23983a87eecc550be849598acb5219fbf1a16a5b4266a50ba4471b4f6c34f4a4"
format = "tar.gz"
strip-prefix = "link-Link-4.1.1"
# The headers compile only with a LINK_PLATFORM_* macro, which upstream's
# CMake defines per OS for consumers; Cabin's cfg tables carry no interface
# defines.  The patch derives it from the compiler's predefined macros unless
# the build defines one.
patches = ["patches/0001-derive-link-platform-macros.patch"]

[package]
name = "cabin-ports/ableton-link"
version = "4.1.1"
license = "GPL-2.0-or-later"
include = [
  "GNU-GPL-v2.0.md",
  "LICENSE.md",
  "extensions/abl_link/include",
  "extensions/abl_link/src",
  "include",
  "patches",
]

# Upstream's Ableton::Link (cmake_include/ConfigureAbletonLink.cmake), with
# the defines of its README.md "Other Build Systems" and C++17 from
# AbletonLinkConfig.cmake:3.  Consumers write <ableton/Link.hpp> or
# <ableton/LinkAudio.hpp>.  Not ported: upstream's examples and tests, the
# LINK_WINDOWS_SETTHREADDESCRIPTION option (off by default) and
# ASIO_VERSION_NAMESPACE, which its bundled Asio sets.
[target.ableton-link]
type = "header-only"
include-dirs = ["include"]
interface-defines = ["ASIO_STANDALONE=1", "ASIO_NO_TYPEID=1", "INCL_EXTRA_HTON_FUNCTIONS=1"]
interface-cxx-standard = "c++17"
deps = [{ name = "cabin-ports/asio", public = true }]

# Upstream's C wrapper (extensions/abl_link/abl_link.cmake); C11 is its
# C_STANDARD.  Consumers write <abl_link.h>.
[target.abl_link]
type = "library"
sources = ["extensions/abl_link/src/abl_link.cpp"]
include-dirs = ["extensions/abl_link/include"]
cxx-standard = "c++17"
interface-cxx-standard = "c++11"
interface-c-standard = "c11"
links = "abl_link"
deps = ["ableton-link"]

[dependencies]
"cabin-ports/asio" = "^1.38.2"

# Upstream pins _WIN32_WINNT for abl_link only (link_pin_win32_winnt).
# avrt: windows/ThreadFactory.hpp calls AvSetMmThreadPriority; upstream's
# examples link Avrt (examples/CMakeLists.txt:139), its library target does not.
[target.'cfg(os = "windows")'.profile]
defines = ["_WIN32_WINNT=0x0601"]
link-libs = ["iphlpapi", "avrt"]

# Upstream's CMake links atomic and, except on Android, pthread
# (ConfigureAbletonLink.cmake:44-55).
[target.'cfg(any(os = "linux", os = "android"))'.profile]
link-libs = ["atomic"]

[target.'cfg(all(family = "unix", not(os = "android")))'.profile]
link-libs = ["pthread"]
