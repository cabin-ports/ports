[package.upstream]
url = "https://github.com/Neargye/semver/archive/refs/tags/v1.0.1.tar.gz"
checksum = "sha256:3fc9c17e993e1dc1c5de95a253c632807d4c2b1cf4862b61aa9a55680ed15ac1"
format = "tar.gz"
strip-prefix = "semver-1.0.1"

# vcpkg's and ConanCenter's name for Neargye/semver; a bare "semver" would be
# ambiguous beside mbits-semver.
[package]
name = "cabin-ports/neargye-semver"
version = "1.0.1"
license = "MIT"
include = ["LICENSE", "include"]

# The single header, included as <semver.hpp>.
[target.neargye-semver]
type = "header-only"
include-dirs = ["include"]
# C++17 is upstream's stated requirement (README.md:6, CMakeLists.txt:55).
interface-cxx-standard = "c++17"
