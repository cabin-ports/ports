[package.upstream]
url = "https://github.com/jart/jtckdint/archive/refs/tags/1.0.tar.gz"
checksum = "sha256:a117f12bfe41f17d947c8ccc122d18b162d634c5ae9059391a6d36cee83a000f"
format = "tar.gz"
strip-prefix = "jtckdint-1.0"
patches = ["patches/0001-msvc-long-long.patch"]

# Upstream calls this release 1.0 (jtckdint.h:54), so the version gets a patch
# component.
[package]
name = "cabin-ports/jtckdint"
version = "1.0.0"
license = "ISC"
include = ["LICENSE.txt", "jtckdint.h", "patches"]

# The header sits at the archive root, where upstream's README includes it.  It
# is a pure C11 and C++11 implementation of C23 <stdckdint.h> (jtckdint.h:51),
# which a C23 toolchain's own <stdckdint.h> replaces in C.  Not ported:
# upstream's test, demo and Makefile.
#
# Patch 0001 carries context lines of jtckdint.h (ISC):
#   Copyright 2023 Justine Alexandra Roberts Tunney
#   Permission to use, copy, modify, and/or distribute this software for any
#   purpose with or without fee is hereby granted, provided that the above
#   copyright notice and this permission notice appear in all copies.
# Patch 0001: MSVC reports __cplusplus as 199711 unless /Zc:__cplusplus is
# given, and Cabin does not pass it, so the header picked a 32-bit `long` as
# its widest type and mishandled 64-bit operands.  It now also accepts
# _MSVC_LANG for `long long` (read from the source; check-windows is the test).
[target.jtckdint]
type = "header-only"
include-dirs = ["."]
interface-c-standard = "c11"
interface-cxx-standard = "c++11"
