[package.upstream]
url = "https://download.savannah.nongnu.org/releases/pngpp/png++-0.2.10.tar.gz"
checksum = "sha256:998af216ab16ebb88543fbaa2dbb9175855e944775b66f2996fc945c8444eee1"
format = "tar.gz"
strip-prefix = "png++-0.2.10"
# Upstream installs the 29 headers to include/png++/ and documents
# #include <png++/png.hpp> (Makefile:56-58, png.hpp:159); 29 headers exceed
# Cabin's 16 copy steps, so the patch adds a forwarder for each there.
# Patch 0002 takes strerror_s on Windows, where error.hpp otherwise calls
# strerror_r, which the MSVC CRT lacks (measured: check-windows,
# "'strerror_r': identifier not found").
# BSD-3-Clause notice of error.hpp, whose lines 0002 carries (condition 1:
# source redistributions retain it):
# Copyright (C) 2007,2008   Alex Shulgin
#
# This file is part of png++ the C++ wrapper for libpng.  PNG++ is free
# software; the exact copying conditions are as follows:
#
# Redistribution and use in source and binary forms, with or without
# modification, are permitted provided that the following conditions are met:
#
# 1. Redistributions of source code must retain the above copyright notice,
# this list of conditions and the following disclaimer.
#
# 2. Redistributions in binary form must reproduce the above copyright
# notice, this list of conditions and the following disclaimer in the
# documentation and/or other materials provided with the distribution.
#
# 3. The name of the author may not be used to endorse or promote products
# derived from this software without specific prior written permission.
#
# THIS SOFTWARE IS PROVIDED BY THE AUTHOR ``AS IS'' AND ANY EXPRESS OR
# IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES
# OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN
# NO EVENT SHALL THE AUTHOR BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,
# SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED
# TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR
# PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF
# LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING
# NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS
# SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.
patches = [
  "patches/0001-add-png-include-forwarders.patch",
  "patches/0002-use-strerror_s-on-windows.patch",
]

[package]
name = "cabin-ports/pngpp"
version = "0.2.10"
license = "BSD-3-Clause"
include = [
  "AUTHORS",
  "COPYING",
  "ChangeLog",
  "NEWS",
  "README",
  "color.hpp",
  "config.hpp",
  "consumer.hpp",
  "convert_color_space.hpp",
  "end_info.hpp",
  "error.hpp",
  "ga_pixel.hpp",
  "generator.hpp",
  "gray_pixel.hpp",
  "image.hpp",
  "image_info.hpp",
  "index_pixel.hpp",
  "info.hpp",
  "info_base.hpp",
  "io_base.hpp",
  "packed_pixel.hpp",
  "palette.hpp",
  "pixel_buffer.hpp",
  "pixel_traits.hpp",
  "png.hpp",
  "reader.hpp",
  "require_color_space.hpp",
  "rgb_pixel.hpp",
  "rgba_pixel.hpp",
  "solid_pixel_buffer.hpp",
  "streaming_base.hpp",
  "tRNS.hpp",
  "types.hpp",
  "writer.hpp",
  "include",
  "patches",
]

[dependencies]
"cabin-ports/libpng" = "^1.6"

[target.pngpp]
type = "header-only"
include-dirs = ["include"]
# Upstream states no C++ standard; the floor is measured.
interface-cxx-standard = "c++98"
deps = [{ name = "cabin-ports/libpng", public = true }]
