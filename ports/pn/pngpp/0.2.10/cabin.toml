[package.upstream]
url = "https://download.savannah.nongnu.org/releases/pngpp/png++-0.2.10.tar.gz"
checksum = "sha256:998af216ab16ebb88543fbaa2dbb9175855e944775b66f2996fc945c8444eee1"
format = "tar.gz"
strip-prefix = "png++-0.2.10"
# Upstream installs the 29 headers to include/png++/ and documents
# #include <png++/png.hpp> (Makefile:56-58, png.hpp:159); 29 headers exceed
# Cabin's 16 copy steps, so the patch adds a forwarder for each there.
patches = ["patches/0001-add-png-include-forwarders.patch"]

[package]
name = "cabin-ports/pngpp"
version = "0.2.10"
license = "BSD-3-Clause"
include = [
  "AUTHORS",
  "COPYING",
  "ChangeLog",
  "NEWS",
  "README",
  "color.hpp",
  "config.hpp",
  "consumer.hpp",
  "convert_color_space.hpp",
  "end_info.hpp",
  "error.hpp",
  "ga_pixel.hpp",
  "generator.hpp",
  "gray_pixel.hpp",
  "image.hpp",
  "image_info.hpp",
  "index_pixel.hpp",
  "info.hpp",
  "info_base.hpp",
  "io_base.hpp",
  "packed_pixel.hpp",
  "palette.hpp",
  "pixel_buffer.hpp",
  "pixel_traits.hpp",
  "png.hpp",
  "reader.hpp",
  "require_color_space.hpp",
  "rgb_pixel.hpp",
  "rgba_pixel.hpp",
  "solid_pixel_buffer.hpp",
  "streaming_base.hpp",
  "tRNS.hpp",
  "types.hpp",
  "writer.hpp",
  "include",
  "patches",
]

[dependencies]
"cabin-ports/libpng" = "^1.6"

[target.pngpp]
type = "header-only"
include-dirs = ["include"]
# Upstream states no C++ standard; the floor is measured.
interface-cxx-standard = "c++98"
deps = [{ name = "cabin-ports/libpng", public = true }]
