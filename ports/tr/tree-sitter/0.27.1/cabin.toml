[package.upstream]
url = "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.27.1.tar.gz"
checksum = "sha256:982cd3d4d9eb7be18c243240a622423fd2e4ecb4bec2cd98832c2f3fa1f0f333"
format = "tar.gz"
strip-prefix = "tree-sitter-0.27.1"

[package]
name = "cabin-ports/tree-sitter"
version = "0.27.1"
# lib/src/unicode carries the Unicode license of the ICU headers the
# library bundles.
include = ["LICENSE", "lib/include", "lib/src"]

# The C runtime library upstream's CMake builds (CMakeLists.txt): every
# lib/src/*.c except lib.c, the amalgamation used only when AMALGAMATED
# is on.  Consumers include <tree_sitter/api.h>, the one header CMake
# installs; generated grammars are separate packages.  Not ported: the
# TREE_SITTER_FEATURE_WASM option (off by default), which needs
# wasmtime; the shared library; the hidden symbol visibility and
# position-independent code upstream compiles every build with; CMake's
# warnings promoted to errors; the CLI and the Rust and web bindings.
[target.tree-sitter]
type = "library"
sources = [
  "lib/src/alloc.c",
  "lib/src/get_changed_ranges.c",
  "lib/src/language.c",
  "lib/src/lexer.c",
  "lib/src/node.c",
  "lib/src/parser.c",
  "lib/src/point.c",
  "lib/src/query.c",
  "lib/src/stack.c",
  "lib/src/subtree.c",
  "lib/src/tree.c",
  "lib/src/tree_cursor.c",
  "lib/src/wasm_store.c",
]
include-dirs = ["lib/include"]
# CMake's private feature-test macros, on every platform.
defines = [
  "_POSIX_C_SOURCE=200112L",
  "_DEFAULT_SOURCE",
  "_BSD_SOURCE",
  "_DARWIN_C_SOURCE",
]
# Upstream's C_STANDARD 11, which CMake compiles as gnu11 on GCC and
# Clang.  Cabin's gnu-extensions cannot be limited to those compilers
# (MSVC rejects it), so the build is strict C11, and the macros above
# expose the POSIX and BSD declarations the sources use.
c-standard = "c11"
# tree_sitter/api.h includes <stdint.h> and <stdbool.h>.
interface-c-standard = "c99"
interface-cxx-standard = "c++11"
links = "tree-sitter"

# The bundled ICU headers include one another as "unicode/umachine.h",
# which resolves only with lib/src on the include path (without it, a
# host's ICU headers would stand in), so lib/src joins the package's own
# (private) include path, as upstream's CMake does.
[profile]
include-dirs = ["lib/src"]
