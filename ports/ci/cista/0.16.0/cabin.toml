[package.upstream]
url = "https://github.com/felixguendling/cista/archive/refs/tags/v0.16.tar.gz"
checksum = "sha256:55832c0e723568bd3abdfd70e7ba4dca777dfaada63f4da74f325f868f95694e"
format = "tar.gz"
strip-prefix = "cista-0.16"
# Notices that upstream's files lack are in THIRD_PARTY_NOTICES (patch 0001).
patches = ["patches/0001-add-third-party-notices.patch"]

# Upstream's tag v0.16 is 0.16.0.
[package]
name = "cabin-ports/cista"
version = "0.16.0"
license = "MIT AND Apache-2.0"
# Apache-2.0 is for the Abseil code in include/cista/containers/hash_storage.h.
# reflection/arity.h:7-15, endian/detection.h:3-5, endian/conversion.h:6-7
# and type_hash/type_name.h:3-4 credit Stack Overflow posts, a gist,
# flatbuffers and ctti for short idioms; their copyright significance is
# uncertain.
# Not ported: tools/ (the XXH3 and wyhash backends that CISTA_HASH selects,
# the to_tuple.h generator, the single-header uniter, doctest and debugger
# printers), the tests, fuzzers and CMake files.
include = ["LICENSE", "README.md", "THIRD_PARTY_NOTICES", "include", "patches"]

# No defines: FNV-1a is the headers' default hash, and CISTA_FMT's fmt
# formatters stay off, as upstream's CI builds them although its CMake
# option defaults on; a consumer that wants them defines CISTA_FMT and
# depends on fmt itself.
[target.cista]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
