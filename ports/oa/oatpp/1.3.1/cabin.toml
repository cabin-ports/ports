include-dirs = ["src"]
# Upstream requires C++11 (CXX_STANDARD 11 without extensions); C++14 is
# the oldest standard Cabin can request from MSVC.
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
links = "oatpp"

# oatpp-test: the UnitTest and ClientServerTestRunner helpers that oatpp's
# own tests and its add-on modules' tests build on.
[target.oatpp-test]
type = "library"
sources = ["src/oatpp-test/Checker.cpp", "src/oatpp-test/UnitTest.cpp"]
cxx-standard = "c++14"
interface-cxx-standard = "c++11"
links = "oatpp-test"
deps = [{ name = "oatpp", public = true }]

# Upstream links Threads publicly, Winsock on Windows, and libatomic on
# every other system except Apple and FreeBSD (src/CMakeLists.txt:309-330);
# this port links libatomic on Linux only.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

[target.'cfg(os = "linux")'.profile]
link-libs = ["atomic"]

[target.'cfg(os = "windows")'.profile]
link-libs = ["ws2_32", "wsock32"]
