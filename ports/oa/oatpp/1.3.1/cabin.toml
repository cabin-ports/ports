[package.upstream]
url = "https://github.com/oatpp/oatpp/archive/refs/tags/1.3.1.tar.gz"
checksum = "sha256:9dd31f005ab0b3e8895a478d750d7dbce99e42750a147a3c42a9daecbddedd64"
format = "tar.gz"
strip-prefix = "oatpp-1.3.1"

# Upstream's 1.3.1 tag leaves OATPP_VERSION at "1.3.0"
# (src/oatpp/core/base/Environment.hpp:42), so the macro and the default
# Server / User-Agent headers built from it read 1.3.0; this port keeps
# the tag as released.
[package]
name = "cabin-ports/oatpp"
version = "1.3.1"
include = ["LICENSE", "src/oatpp", "src/oatpp-test"]

# The two static libraries upstream's CMake builds and installs by
# default (src/CMakeLists.txt; OATPP_LINK_TEST_LIBRARY is ON), with
# upstream's default options (CMakeLists.txt:17-50): object counters and
# every log level on, thread_local and CPU affinity enabled.  Like upstream,
# this lists every IOEventWorker backend; IOEventWorker.hpp enables one
# per platform and the others compile empty.  Not reproduced: the
# warning and GCC-only hardening flags cmake/compiler-flags.cmake adds to
# CMAKE_CXX_FLAGS; the /permissive- MSVC builds pass
# (src/CMakeLists.txt:305-307), which Cabin cannot pass, so MSVC compiles
# oatpp in its default permissive mode; and upstream's default dynamic
# MSVC runtime (/MD, OATPP_MSVC_LINK_STATIC_RUNTIME OFF,
# cmake/msvc-runtime.cmake): Cabin passes no runtime flag, so cl uses its
# static default (/MT).
[target.oatpp]
type = "library"
sources = [
  "src/oatpp/algorithm/CRC.cpp",
  "src/oatpp/core/IODefinitions.cpp",
  "src/oatpp/core/async/ConditionVariable.cpp",
  "src/oatpp/core/async/Coroutine.cpp",
  "src/oatpp/core/async/CoroutineWaitList.cpp",
  "src/oatpp/core/async/Error.cpp",
  "src/oatpp/core/async/Executor.cpp",
  "src/oatpp/core/async/Lock.cpp",
  "src/oatpp/core/async/Processor.cpp",
  "src/oatpp/core/async/worker/IOEventWorker_common.cpp",
  "src/oatpp/core/async/worker/IOEventWorker_epoll.cpp",
  "src/oatpp/core/async/worker/IOEventWorker_kqueue.cpp",
