[package.upstream]
url = "https://github.com/danfis/libccd/archive/refs/tags/v2.1.tar.gz"
checksum = "sha256:542b6c47f522d581fbf39e51df32c7d1256ac0c626e7c2b41f1040d4b9d50d1e"
format = "tar.gz"
strip-prefix = "libccd-2.1"
# The patch adds ccd/config.h at its installed path, as CMake's
# configure_file writes it by default: single precision, so CCD_SINGLE is
# defined and CCD_DOUBLE is not.
patches = ["patches/0001-add-the-generated-ccd-config-h.patch"]

# The public headers in their installed layout, which keeps the private
# headers in src/ off consumers' include path.
[[package.upstream.copy]]
from = "src/ccd/ccd.h"
to = "include/ccd/ccd.h"

[[package.upstream.copy]]
from = "src/ccd/ccd_export.h"
to = "include/ccd/ccd_export.h"

[[package.upstream.copy]]
from = "src/ccd/compiler.h"
to = "include/ccd/compiler.h"

[[package.upstream.copy]]
from = "src/ccd/quat.h"
to = "include/ccd/quat.h"

[[package.upstream.copy]]
from = "src/ccd/vec3.h"
to = "include/ccd/vec3.h"

[package]
name = "cabin-ports/ccd"
# Upstream tags this release v2.1 (its build files still say 2.0); Cabin
# versions have three components.
version = "2.1.0"
# BSD-3-Clause, from upstream's BSD-LICENSE.  src/list.h:35-82, five list
# macros and their comments, follow the Linux kernel's list.h (GPL-2.0-only)
# uncredited, of uncertain copyright significance; no term is declared.
license = "BSD-3-Clause"
include = [
  "BSD-LICENSE",
  "include",
  "patches",
  "src/alloc.h",
  "src/ccd.c",
  "src/dbg.h",
  "src/list.h",
  "src/mpr.c",
  "src/polytope.c",
  "src/polytope.h",
  "src/simplex.h",
  "src/support.c",
  "src/support.h",
  "src/vec3.c",
]
# Upstream's CMake build sets no C standard; C11 is the oldest Cabin can
# lower for MSVC.  The public headers need C99 and are valid C++98.
c-standard = "c11"
interface-c-standard = "c99"
interface-cxx-standard = "c++98"

# The static form of upstream's ccd library, in its default single
# precision.  Not ported: the double-precision build
# (ENABLE_DOUBLE_PRECISION, which vcpkg offers as a feature) and the shared
# library CMake builds by default.
[target.ccd]
type = "library"
sources = ["src/ccd.c", "src/mpr.c", "src/polytope.c", "src/support.c", "src/vec3.c"]
include-dirs = ["include"]
links = "ccd"
# Without CCD_STATIC_DEFINE, ccd_export.h marks the API dllimport on MSVC,
# which a static library and its consumers cannot use.  Upstream defines it
# only for CCD_HIDE_ALL_SYMBOLS; vcpkg's static build forces it on too.
defines = ["CCD_STATIC_DEFINE"]
interface-defines = ["CCD_STATIC_DEFINE"]

# Upstream links libm everywhere but Windows; the public headers' inline
# functions call libm too.
[target.'cfg(family = "unix")'.profile]
link-libs = ["m"]
