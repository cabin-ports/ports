[package.upstream]
# qoi has no tags or releases and qoi.h declares no version, so the version
# is the date of this commit (2026-09-27), which is master's head and
# vcpkg's pin.
url = "https://github.com/phoboslab/qoi/archive/ffb2d2cb74a1de60819b21b939f7209aa53e91c1.tar.gz"
checksum = "sha256:3f1b2df41d4fecdc25a18c2f6a2add3182601a2182245d67da6aeb575e3a7724"
format = "tar.gz"
strip-prefix = "qoi-ffb2d2cb74a1de60819b21b939f7209aa53e91c1"

[package]
name = "cabin-ports/qoi"
version = "2026.9.27"
license = "MIT"
include = ["LICENSE", "qoi.h"]

# Header-only in the stb style: one C or C++ translation unit defines
# QOI_IMPLEMENTATION before including "qoi.h".  Not ported: the qoibench,
# qoiconv and qoifuzz programs and the Makefile.
[target.qoi]
type = "header-only"
include-dirs = ["."]
# qoi.h is C89 and C++98.
interface-c-standard = "c89"
interface-cxx-standard = "c++98"
