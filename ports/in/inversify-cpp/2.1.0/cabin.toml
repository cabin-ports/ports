[package.upstream]
url = "https://github.com/mosure/inversify-cpp/archive/refs/tags/2.1.0.tar.gz"
checksum = "sha256:6829b45a558c7eb4e15fdc08cb0dfe3c76f708c00bbdcc06d1fcdbd0a3ef55d1"
format = "tar.gz"
strip-prefix = "inversify-cpp-2.1.0"

[package]
name = "cabin-ports/inversify-cpp"
version = "2.1.0"
license = "MIT"
include = ["LICENSE", "include"]

# C++17 is the standard upstream states in README.md and BUILD (-std=c++17).
[target.inversify-cpp]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++17"
