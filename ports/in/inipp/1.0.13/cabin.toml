[package.upstream]
url = "https://github.com/mcmtroffaes/inipp/archive/refs/tags/1.0.13.tar.gz"
checksum = "sha256:656c5d82db48f4da8ed70482839ad0da95ea1d576a3c890c272e9b9e0fb89571"
format = "tar.gz"
strip-prefix = "inipp-1.0.13"

[package]
name = "cabin-ports/inipp"
version = "1.0.13"
license = "MIT"
include = ["LICENSE.txt", "inipp/inipp.h"]

# Upstream's header-only inipp::inipp target exposes inipp/, so consumers
# write #include "inipp.h".  Not ported: its example, tests, NuGet packaging,
# and CI files.  The Stack Overflow credits in inipp.h cover a few lines of
# common idiom and carry no separate notice.
[target.inipp]
type = "header-only"
include-dirs = ["inipp"]
# target_compile_features(inipp INTERFACE cxx_std_11).
interface-cxx-standard = "c++11"
