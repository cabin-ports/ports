[package.upstream]
url = "https://github.com/PragmaTwice/protopuf/archive/refs/tags/v3.1.0.tar.gz"
checksum = "sha256:094ead00fe10c52725ae8c6871da907215e0ae752ed017d98907a9b410e52318"
format = "tar.gz"
strip-prefix = "protopuf-3.1.0"
# Upstream's d6a65bab, after the tag: array.h uses std::string without
# including <string>.  check-windows fails without it ("array.h(134): error
# C2039: 'basic_string': is not a member of 'std'").
patches = ["patches/0001-include-string-in-array-h.patch"]

[package]
name = "cabin-ports/protopuf"
version = "3.1.0"
license = "Apache-2.0"
include = ["LICENSE", "README.md", "include", "patches"]

# C++20 is upstream's floor (README.md:14).
[target.protopuf]
type = "header-only"
include-dirs = ["include"]
interface-cxx-standard = "c++20"
