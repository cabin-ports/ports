# CommonDefs.h:237 defines _GNU_SOURCE only after <stdint.h>, too late
# under the strict -std=c11 Cabin passes.  CMakeLists.txt links
# ${CMAKE_DL_LIBS}, Threads::Threads, and rt where UNIX AND NOT APPLE
# (:127-131); it names nothing for Android.
[target.'cfg(family = "unix")'.profile]
link-libs = ["pthread"]

[target.'cfg(os = "linux")'.profile]
defines = ["_GNU_SOURCE"]
link-libs = ["dl", "rt"]

[target.'cfg(any(os = "freebsd", os = "netbsd"))'.profile]
link-libs = ["rt"]
