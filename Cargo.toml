[package]
name = "cabin-ports"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cabin-ports/ports"
rust-version = "1.95"
description = "Publishes the curated foundation ports as cabin-ports registry packages"
# The tool reads this repository's `ports/` tree, so a published copy
# would have nothing to operate on.
publish = false

[[bin]]
name = "port-publish"
path = "src/main.rs"

# Every Cabin crate comes from one pinned commit of cabinpkg/cabin, and
# the `cabin` binary the tool drives is installed from the same commit
# (README.md, "Cabin revision").
[dependencies]
anyhow = "1"
cabin-core = { package = "cabinpkg-core", git = "https://github.com/cabinpkg/cabin", rev = "8bd98f51aa6619dfb3360a17d5f0c53f62e88035" }
cabin-env = { package = "cabinpkg-env", git = "https://github.com/cabinpkg/cabin", rev = "8bd98f51aa6619dfb3360a17d5f0c53f62e88035" }
cabin-manifest = { package = "cabinpkg-manifest", git = "https://github.com/cabinpkg/cabin", rev = "8bd98f51aa6619dfb3360a17d5f0c53f62e88035" }
cabin-publish = { package = "cabinpkg-publish", git = "https://github.com/cabinpkg/cabin", rev = "8bd98f51aa6619dfb3360a17d5f0c53f62e88035" }
clap = { version = "4", features = ["derive", "env"] }
etcetera = "0.11"
semver = "1"
tempfile = "3"

[dev-dependencies]
assert_fs = "1"
flate2 = "1"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tiny_http = "0.12"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
must_use_candidate = "allow"
assert_is_empty = "allow"
