name: Publish

# Publishes ports/ as `cabin-ports/*` registry packages (docs/publishing.md,
# "Publishing"). Only main publishes: a manual dispatch, or the
# schedule once the PORTS_AUTO_PUBLISH repository variable is exactly
# `true`.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all: every port, changed bytes as packaging revisions. new: only versions without an upload receipt, never a revision. plan: preview new, uploading nothing"
        type: choice
        options:
          - all
          - new
          - plan
        default: all
      retry-failed:
        description: "new and plan: also retry versions whose upload failed and may have landed; check the registry's admin listings first"
        type: boolean
        default: false
      exchange-check:
        description: "Exchange and immediately revoke a trusted-publishing token; publish nothing"
        type: boolean
        default: false
  # Automatic first publication (docs/publishing.md, "Automatic publishing"),
  # off the hour, when GitHub's scheduler is least loaded.
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

# Explicit bash for pipefail: a failed read must fail its step, never
# feed an empty value downstream.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  REGISTRY: https://registry.cabinpkg.com
  # The registry's receipts log is `receipts.jsonl` on this branch.
  RECEIPTS_BRANCH: publish-receipts

jobs:
  # Resolves the mode, requires CI for `new`, and finds the receipts log
  # before anything is built. A scheduled run starts no job at all
  # unless the variable is `true`; expressions compare
  # case-insensitively, so the step insists on the exact bytes.
  gate:
    if: >-
      github.repository == 'cabin-ports/ports' && github.ref == 'refs/heads/main' &&
      !inputs.exchange-check && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.PORTS_AUTO_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      receipts: ${{ steps.probe.outputs.receipts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: mode
        name: Resolve the mode
        env:
          ENABLED: ${{ vars.PORTS_AUTO_PUBLISH }}
          INPUT: ${{ inputs.mode }}
        run: scripts/actions/publish-mode.sh

      - name: Require this commit's passing CI
        if: steps.mode.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/actions/require-ci.sh

      # A missing or unreadable log fails the run; it never reads as
      # "nothing uploaded".
      - id: probe
        name: Find the receipts log
        if: steps.mode.outputs.mode != 'off'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: scripts/actions/receipts.sh probe

  # Builds both binaries in a job without the OIDC permission, so no
  # Rust build script runs beside the publish job's token. A `new` or
  # `plan` run then asks port-publish what `new` would upload, and with
  # nothing to upload stops here, before taking the lock.
  build:
    needs: gate
    if: needs.gate.outputs.mode != 'off'
    runs-on: ubuntu-latest
    outputs:
      cabin-rev: ${{ steps.rev.outputs.cabin-rev }}
      work: ${{ steps.pending.outputs.work }}
      tools: ${{ steps.tools.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: rev
        name: Read the pinned Cabin commit
        run: scripts/actions/cabin-rev.sh
      # No cache: these binaries run beside the publish job's token.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Install the pinned cabin
        env:
          CABIN_REV: ${{ steps.rev.outputs.cabin-rev }}
        run: cargo install --locked --debug --git https://github.com/cabinpkg/cabin --rev "$CABIN_REV" cabinpkg --root "$RUNNER_TEMP/tools"
      - name: Build the publisher
        run: |
          cargo build --locked --bin port-publish
          cp target/debug/port-publish "$RUNNER_TEMP/tools/bin/"
      - name: Read the receipts log
        if: needs.gate.outputs.mode == 'new' || needs.gate.outputs.mode == 'plan'
        run: scripts/actions/receipts.sh read "$RUNNER_TEMP/receipts.jsonl"
      - id: pending
        name: List the versions to upload
        if: needs.gate.outputs.mode == 'new' || needs.gate.outputs.mode == 'plan'
        env:
          PORT_PUBLISH_RETRY_FAILED: ${{ inputs.retry-failed }}
        run: scripts/actions/pending-new.sh "$RUNNER_TEMP/tools/bin" "$RUNNER_TEMP/receipts.jsonl"
      - id: tools
        uses: actions/upload-artifact@v7.0.2
        with:
          name: publish-tools
          path: ${{ runner.temp }}/tools/bin/
          retention-days: 1

  # Every run that may upload, with a receipts log to add to, holds the
  # log's lock (docs/publishing.md, "The lock"). It runs only
  # scripts/actions/ from its own commit (git and gh), so it may push that
  # branch.
  lock:
    needs: [gate, build]
    if: >-
      needs.gate.outputs.mode == 'all' ||
      (needs.gate.outputs.mode == 'new' && needs.build.outputs.work == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      go: ${{ steps.lock.outputs.go }}
      locked: ${{ steps.lock.outputs.locked }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/actions/
          sparse-checkout-cone-mode: false
      - id: lock
        name: Take the receipts log's lock
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPTS: ${{ needs.gate.outputs.receipts }}
        run: scripts/actions/receipts.sh acquire

  # The only job that builds ports, so it holds no OIDC token and may
  # push nothing. It records what it built for `publish`. Under the
  # lock, like `publish`, so both read the same receipts log; a `plan`
  # run takes no lock.
  prepare:
    needs: [gate, build, lock]
    if: >-
      !failure() && !cancelled() && (needs.lock.outputs.go == 'true' ||
      (needs.gate.outputs.mode == 'plan' && needs.build.outputs.work == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: publish-tools
          path: ${{ runner.temp }}/tools
      - run: chmod +x "$RUNNER_TEMP/tools/cabin" "$RUNNER_TEMP/tools/port-publish"
      - name: Stage and build every port
        if: needs.gate.outputs.mode == 'all'
        run: |
          "$RUNNER_TEMP/tools/port-publish" --plan \
            --prepared "$RUNNER_TEMP/prepared.json" \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache"
      - name: Read the receipts log
        if: needs.gate.outputs.mode != 'all'
        run: scripts/actions/receipts.sh read "$RUNNER_TEMP/receipts.jsonl"
      - name: Stage and build the new versions
        if: needs.gate.outputs.mode != 'all'
        env:
          PORT_PUBLISH_RETRY_FAILED: ${{ inputs.retry-failed }}
        run: |
          "$RUNNER_TEMP/tools/port-publish" --plan-new \
            --prepared "$RUNNER_TEMP/prepared.json" \
            --index-url "$REGISTRY" \
            --receipts "$RUNNER_TEMP/receipts.jsonl" \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared.json
          if-no-files-found: error
          retention-days: 1
      # The archives it downloaded, so `publish` downloads none again.
      - if: needs.gate.outputs.mode != 'plan'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The pinned client can send metadata only a Worker built from a
  # Cabin commit containing it accepts, and cabinpkg/cabin deploys the
  # registry independently: wait for such a deploy with Cabin's own
  # guard, from the pinned commit.
  await-deploy:
    needs: [build, lock]
    if: needs.lock.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: cabinpkg/cabin
          ref: ${{ needs.build.outputs.cabin-rev }}
          # The guard walks main's history for a deploy containing the
          # pinned commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Wait for a registry deploy containing the pinned Cabin commit
        env:
          CABIN_REV: ${{ needs.build.outputs.cabin-rev }}
          GH_TOKEN: ${{ github.token }}
        run: cargo workflow-await-deploy --repository cabinpkg/cabin --sha "$CABIN_REV"

  # Builds nothing and runs no port code: it stages its own commit and
  # uploads a version only as `prepare` built it in this run.
  publish:
    needs: [gate, lock, build, prepare, await-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `cabin publish` exchanges the run's OIDC token for its
      # short-lived registry token; no stored secret exists.
      id-token: write
    outputs:
      attempt: ${{ steps.attempt.outputs.attempt }}
      receipts: ${{ steps.receipts.outputs.artifact-id }}
    # Serializes every upload of this repository - manual or
    # scheduled, either mode - queueing rather than cancelling pending
    # ones. The registry's trusted-publishing binding admits exactly one
    # repository, so no other repository publishes.
    concurrency:
      group: publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Nothing `prepare` could have written runs here. No cache. Its
      # record and archives are only read, by fixed names into directories
      # of their own: an id would be `prepare`'s to give, and the tool
      # hashes each archive against its port's pin. The tools come by id:
      # another artifact can take a name, never an id.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/cabin-cache/ports/archives
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.tools }}
          path: ${{ runner.temp }}/tools
      # One receipts file per attempt, existing even when nothing
      # uploads: `record` releases the lock only on this job's success
      # in the lock's attempt and on finding that attempt's file.
      - id: attempt
        run: |
          chmod +x "$RUNNER_TEMP/tools/cabin" "$RUNNER_TEMP/tools/port-publish"
          : > "$RUNNER_TEMP/receipts-$GITHUB_RUN_ATTEMPT.jsonl"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # A rerun of this job reuses the lock job's outputs, so the lock
      # itself must name this very attempt: a rerun never uploads under
      # an earlier attempt's lock, which may already be released. Only
      # an `all` run that found no receipts log, and still finds none,
      # uploads without it.
      - name: Check that this attempt holds the receipts log's lock
        env:
          RECEIPTS: ${{ needs.gate.outputs.receipts }}
        run: scripts/actions/receipts.sh held "$RUNNER_TEMP/receipts.jsonl"

      # A stale run would publish an intermediate state of a version as
      # an otherwise unnecessary packaging revision, so --main uploads
      # nothing, with a warning, unless this commit is still main's head;
      # a newer main commit's own dispatch publishes instead. The
      # checkout left origin/main at this commit, hence the fetch. A
      # commit landing during the upload's own preflight is not
      # detected; the next dispatch's upload supersedes what it
      # published.
      - name: Publish to registry.cabinpkg.com
        if: needs.gate.outputs.mode == 'all'
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          "$RUNNER_TEMP/tools/port-publish" --publish \
            --prepared "$RUNNER_TEMP/prepared/prepared.json" \
            --index-url "$REGISTRY" \
            --receipts-out "$RUNNER_TEMP/receipts-$GITHUB_RUN_ATTEMPT.jsonl" \
            --main origin/main \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache"

      # A scheduled run rechecks the switch: turning it off stops queued
      # runs here.
      - id: mode
        name: Recheck the mode
        if: needs.gate.outputs.mode == 'new'
        env:
          ENABLED: ${{ vars.PORTS_AUTO_PUBLISH }}
          INPUT: ${{ inputs.mode }}
        run: scripts/actions/publish-mode.sh

      # Under the lock, so the log `held` wrote holds every earlier run's
      # receipts. A moved main does not stop the run: --publish-new
      # defers only what main changed.
      - name: Publish new versions to registry.cabinpkg.com
        if: steps.mode.outputs.mode == 'new'
        env:
          PORT_PUBLISH_RETRY_FAILED: ${{ inputs.retry-failed }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          "$RUNNER_TEMP/tools/port-publish" --publish-new \
            --prepared "$RUNNER_TEMP/prepared/prepared.json" \
            --index-url "$REGISTRY" \
            --receipts "$RUNNER_TEMP/receipts.jsonl" \
            --receipts-out "$RUNNER_TEMP/receipts-$GITHUB_RUN_ATTEMPT.jsonl" \
            --main origin/main \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache"

      # Whatever happened above: the receipts of uploads before a
      # failure or a cancellation must reach the log too.
      - id: receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: receipts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts-${{ github.run_attempt }}.jsonl
          if-no-files-found: error
          retention-days: 30

  # Appends the receipts of the attempt holding the lock to the log and
  # releases it under the rules of docs/publishing.md, "The lock". No OIDC
  # and no port code - only scripts/actions/ from its own commit (git and
  # jq) - so it may push the receipts branch. After a failed push, rerun
  # this job alone; the artifacts last 30 days.
  record:
    needs: [lock, build, publish]
    if: always() && needs.lock.outputs.locked == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/actions/
          sparse-checkout-cone-mode: false
      # By id, so only what the `publish` job itself uploaded is recorded.
      # A rerun `publish` job replaces the id: rerun this job alone.
      - id: download
        if: needs.publish.outputs.receipts != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.publish.outputs.receipts }}
          path: ${{ runner.temp }}/receipts
      - name: Record the receipts and release the lock
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISHED_IN: ${{ needs.publish.outputs.attempt }}
          DOWNLOAD: ${{ steps.download.outcome }}
          CABIN_REV: ${{ needs.build.outputs.cabin-rev }}
        run: scripts/actions/receipts.sh record "$RUNNER_TEMP/receipts"

  exchange-check:
    # Dispatch-only probe of the registered binding end to end (config
    # row, claimed scope, mint, revocation); publishes nothing. curl,
    # because the cabin client exchanges only inside a real publish.
    # The registered binding pins refs/heads/main, so any other ref gets
    # the registry's uniform 401. No checkout: the probe needs only the
    # run's OIDC identity.
    if: inputs.exchange-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Exchange and immediately revoke a trusted-publishing token
        # Explicit bash for pipefail, so a failed fetch cannot feed an
        # empty value downstream; `jq -e` fails on a missing field for
        # the same reason. The DELETE must answer the revocation's 204.
        shell: bash
        run: |
          # inline: this id-token job has no checkout, so a script would add one
          jwt="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cabinpkg.com" | jq -er .value)"
          echo "::add-mask::$jwt"
          token="$(curl -sSf -X PUT https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Content-Type: application/json" -d "{\"jwt\":\"$jwt\"}" | jq -er .token)"
          echo "::add-mask::$token"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE https://cabinpkg.com/api/v1/trusted_publishing/tokens -H "Authorization: Bearer $token")"
          echo "revocation answered $status"
          test "$status" = 204
