name: probe-m8

# A temporary probe, never merged: dry-runs the draft OpenCL, Python and
# MPI ports with what each needs installed on the runner.
on: pull_request

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CABIN_REV: e41d5ddd53d1ddd6618aafb4fe81f55a621f4aed

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps: &probe
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Install the pinned cabin
        shell: bash
        run: cargo install --locked --debug --git https://github.com/cabinpkg/cabin --rev "$CABIN_REV" cabinpkg --root "$RUNNER_TEMP/cabin"
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Install an OpenCL implementation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pocl-opencl-icd ocl-icd-opencl-dev
      - name: Name the image's Python for build scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # inline: one expression; only the runner knows where its Python is
          Add-Content $env:GITHUB_ENV ("CABIN_SDK_PYTHON_DIR=" + (Split-Path (Get-Command python).Source))
      - name: Install MPI
        uses: mpi4py/setup-mpi@v1.4.4
        with:
          mpi: ${{ runner.os == 'Windows' && 'msmpi' || 'openmpi' }}

      - name: boost-compute
        if: ${{ !cancelled() }}
        env:
          CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo run --locked -- --dry-run --port boost-compute --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: boost-python
        if: ${{ !cancelled() }}
        env:
          CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo run --locked -- --dry-run --port boost-python --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: boost-mpi
        if: ${{ !cancelled() }}
        env:
          CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo run --locked -- --dry-run --port boost-mpi --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"
      # Its dependencies include boost-property-map-parallel.
      - name: boost-graph-parallel
        if: ${{ !cancelled() }}
        env:
          CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: cargo run --locked -- --dry-run --port boost-graph-parallel --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"

  macos:
    runs-on: macos-26
    steps: *probe

  windows:
    runs-on: windows-2025-vs2026
    env:
      CABIN_SDK_MPI_DIR: C:\Program Files (x86)\Microsoft SDKs\MPI
    steps: *probe

  # The same ports on machines without their SDK: each step is expected
  # to fail with the diagnostic that names what is missing.
  missing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      CABIN_CACHE_DIR: ${{ runner.temp }}/cabin-cache
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
      - name: Install the pinned cabin
        shell: bash
        run: cargo install --locked --debug --git https://github.com/cabinpkg/cabin --rev "$CABIN_REV" cabinpkg --root "$RUNNER_TEMP/cabin"
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: boost-mpi without MPI
        continue-on-error: true
        run: cargo run --locked -- --dry-run --port boost-mpi --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: boost-python without a named Python
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo run --locked -- --dry-run --port boost-python --cabin "${{ runner.temp }}/cabin/bin/cabin${{ runner.os == 'Windows' && '.exe' || '' }}"
