name: Probe

# Temporary: runs publish.yml's prepare and publish steps on this pull
# request, with no credential and an index URL nothing listens on, so
# it can upload nothing. Removed before the merge.
on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.tools.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: rev
        run: scripts/actions/cabin-rev.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
          rustflags: ""
      - env:
          CABIN_REV: ${{ steps.rev.outputs.cabin-rev }}
        run: cargo install --locked --debug --git https://github.com/cabinpkg/cabin --rev "$CABIN_REV" cabinpkg --root "$RUNNER_TEMP/tools"
      - run: |
          cargo build --locked --bin port-publish
          cp target/debug/port-publish "$RUNNER_TEMP/tools/bin/"
      - id: tools
        uses: actions/upload-artifact@v7.0.2
        with:
          name: publish-tools
          path: ${{ runner.temp }}/tools/bin/
          retention-days: 1

  # Takes the lock, like publish.yml's `lock` in an uploading run. With
  # it skipped, as in a `plan` run, `prepare` ran and `publish` was
  # skipped (run 43165403343).
  lock:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.lock.outputs.go }}
    steps:
      - id: lock
        run: echo "go=true" >>"$GITHUB_OUTPUT"

  # publish.yml's `prepare`, with an empty receipts log: every version
  # that is not held is new.
  prepare:
    needs: [build, lock]
    if: "!failure() && !cancelled() && needs.lock.outputs.go == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: publish-tools
          path: ${{ runner.temp }}/tools
      - run: chmod +x "$RUNNER_TEMP/tools/cabin" "$RUNNER_TEMP/tools/port-publish"
      - run: |
          : > "$RUNNER_TEMP/receipts.jsonl"
          "$RUNNER_TEMP/tools/port-publish" --plan-new \
            --prepared "$RUNNER_TEMP/prepared.json" \
            --index-url http://127.0.0.1:9 \
            --receipts "$RUNNER_TEMP/receipts.jsonl" \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/cabin-cache/ports/archives
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # publish.yml's `publish` downloads and its upload command, on another
  # machine than `prepare`.
  publish:
    needs: [build, lock, prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: prepared
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@v8.0.2
        with:
          name: archives
          path: ${{ runner.temp }}/cabin-cache/ports/archives
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.tools }}
          path: ${{ runner.temp }}/tools
      - run: chmod +x "$RUNNER_TEMP/tools/cabin" "$RUNNER_TEMP/tools/port-publish"
      - name: Another run's record uploads nothing
        run: |
          # inline: temporary probe; the command must fail, so its status is read by hand
          : > "$RUNNER_TEMP/receipts.jsonl"
          set +e
          "$RUNNER_TEMP/tools/port-publish" --publish-new --run-id 0 \
            --prepared "$RUNNER_TEMP/prepared/prepared.json" \
            --index-url http://127.0.0.1:9 \
            --receipts "$RUNNER_TEMP/receipts.jsonl" \
            --receipts-out "$RUNNER_TEMP/out-a.jsonl" \
            --main HEAD \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache" >"$RUNNER_TEMP/a.log" 2>&1
          echo "exit $?" >>"$RUNNER_TEMP/a.log"
          set -e
          tail -n 8 "$RUNNER_TEMP/a.log"
          grep -F "not this run 0; uploaded nothing" "$RUNNER_TEMP/a.log"
          grep -Fx "exit 1" "$RUNNER_TEMP/a.log"
          test ! -s "$RUNNER_TEMP/out-a.jsonl"
          if grep "^fetched " "$RUNNER_TEMP/a.log"; then exit 1; fi
      - name: This run's record reaches the upload
        run: |
          # inline: temporary probe; the upload must fail at the dead index URL, so its status is read by hand
          set +e
          "$RUNNER_TEMP/tools/port-publish" --publish-new \
            --prepared "$RUNNER_TEMP/prepared/prepared.json" \
            --index-url http://127.0.0.1:9 \
            --receipts "$RUNNER_TEMP/receipts.jsonl" \
            --receipts-out "$RUNNER_TEMP/out-b.jsonl" \
            --main HEAD \
            --ports-dir ports \
            --cabin "$RUNNER_TEMP/tools/cabin" \
            --cache-dir "$RUNNER_TEMP/cabin-cache" >"$RUNNER_TEMP/b.log" 2>&1
          echo "exit $?" >>"$RUNNER_TEMP/b.log"
          set -e
          tail -n 30 "$RUNNER_TEMP/b.log"
          grep -F "publishing batch 1/" "$RUNNER_TEMP/b.log"
          grep -Fx "exit 1" "$RUNNER_TEMP/b.log"
          if grep -F "uploaded nothing" "$RUNNER_TEMP/b.log"; then exit 1; fi
          if grep -F "preflight: built " "$RUNNER_TEMP/b.log"; then exit 1; fi
          if grep "^fetched " "$RUNNER_TEMP/b.log"; then exit 1; fi

  # publish.yml's receipts upload after a failed upload step, beside an
  # artifact that only looks like receipts.
  failed-upload:
    runs-on: ubuntu-latest
    outputs:
      receipts: ${{ steps.receipts.outputs.artifact-id }}
    steps:
      - run: |
          mkdir "$RUNNER_TEMP/forged"
          echo forged >"$RUNNER_TEMP/forged/receipts-$GITHUB_RUN_ATTEMPT.jsonl"
          echo real >"$RUNNER_TEMP/receipts-$GITHUB_RUN_ATTEMPT.jsonl"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: receipts-x
          path: ${{ runner.temp }}/forged/receipts-${{ github.run_attempt }}.jsonl
          retention-days: 1
      - name: Fail on purpose
        run: exit 1
      - id: receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: receipts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts-${{ github.run_attempt }}.jsonl
          if-no-files-found: error
          retention-days: 1

  # publish.yml's `record` download: the failed job's own receipts, and
  # nothing else.
  record:
    needs: failed-upload
    if: always()
    runs-on: ubuntu-latest
    steps:
      - id: download
        if: needs.failed-upload.outputs.receipts != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.failed-upload.outputs.receipts }}
          path: ${{ runner.temp }}/receipts
      - env:
          PUBLISH: ${{ needs.failed-upload.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          test "$PUBLISH" = failure
          test "$DOWNLOAD" = success
          grep -Fx real "$RUNNER_TEMP/receipts/receipts-$GITHUB_RUN_ATTEMPT.jsonl"
