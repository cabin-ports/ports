name: probe-old-matrix

# Temporary probe of the `required` gate. Never merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pin:
    runs-on: ubuntu-slim
    steps:
      - run: echo ok
  lint:
    runs-on: ubuntu-slim
    steps:
      - run: echo ok
  check:
    needs: pin
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ matrix.os == 'macos-26' && format('probe-old-{0}', github.run_id) || format('probe-old-{0}-{1}', github.run_id, matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025-vs2026
    steps:
      - run: echo ok
  hold:
    runs-on: ubuntu-slim
    concurrency:
      group: probe-old-${{ github.run_id }}
    steps:
      - run: sleep 240
  kick-delay:
    needs: pin
    runs-on: ubuntu-slim
    steps:
      - run: sleep 30
  kick:
    needs: kick-delay
    runs-on: ubuntu-slim
    concurrency:
      group: probe-old-${{ github.run_id }}
    steps:
      - run: echo kicked
  # The required check: fails unless every job above succeeded, so a
  # failed, cancelled, or skipped job never reads as green.
  required:
    needs: [pin, lint, check]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Print what needs held
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
